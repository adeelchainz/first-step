<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Architecture &amp; System Design Handbook</title>
<meta name="description" content="An interactive handbook: understand a problem, establish architecture, make decisions, design systems, document them, review them through lenses, and evolve them safely.">
<style>
/* ============================================================
   DESIGN TOKENS
   Neutral base. Colour carries meaning, never decoration.
   blue = structure   green = validated   amber = assumption
   red  = risk        purple = decision
   ============================================================ */
:root{
  --bg:#fbfaf7; --bg-sunk:#f3f2ed; --panel:#ffffff; --panel-2:#faf9f6;
  --ink:#14171c; --ink-2:#4c535c; --ink-3:#767d87; --ink-4:#a2a8b1;
  --line:#e0dfd6; --line-2:#ecebe4; --line-3:#c9c7ba;
  --blue:#2a53c4; --blue-bg:#eaeffb; --blue-line:#b9c8ee;
  --green:#14704a; --green-bg:#e7f3ec; --green-line:#a8d2be;
  --amber:#8a5b00; --amber-bg:#faf1de; --amber-line:#e2c88f;
  --red:#ad2a20; --red-bg:#fbeceb; --red-line:#eeb9b4;
  --purple:#6337b0; --purple-bg:#f1ecfb; --purple-line:#cdbcee;
  --grid:rgba(20,23,28,.045);
  --focus:#2a53c4;
  --font-sans:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  --font-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --hdr-h:54px; --side-w:286px; --read:74ch;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --bg-sunk:#0a0c10; --panel:#141820; --panel-2:#171c25;
    --ink:#e9ecf1; --ink-2:#aab3c0; --ink-3:#818b9a; --ink-4:#626b7b;
    --line:#252b36; --line-2:#1c212b; --line-3:#39414f;
    --blue:#8aa8fb; --blue-bg:#141c33; --blue-line:#2d3f70;
    --green:#5fc797; --green-bg:#0f2620; --green-line:#215844;
    --amber:#e0b153; --amber-bg:#2a2010; --amber-line:#5d4820;
    --red:#f08a80; --red-bg:#2c1614; --red-line:#63302b;
    --purple:#b79bf2; --purple-bg:#1e1733; --purple-line:#42346e;
    --grid:rgba(233,236,241,.045);
    --focus:#8aa8fb;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --bg-sunk:#0a0c10; --panel:#141820; --panel-2:#171c25;
  --ink:#e9ecf1; --ink-2:#aab3c0; --ink-3:#818b9a; --ink-4:#626b7b;
  --line:#252b36; --line-2:#1c212b; --line-3:#39414f;
  --blue:#8aa8fb; --blue-bg:#141c33; --blue-line:#2d3f70;
  --green:#5fc797; --green-bg:#0f2620; --green-line:#215844;
  --amber:#e0b153; --amber-bg:#2a2010; --amber-line:#5d4820;
  --red:#f08a80; --red-bg:#2c1614; --red-line:#63302b;
  --purple:#b79bf2; --purple-bg:#1e1733; --purple-line:#42346e;
  --grid:rgba(233,236,241,.045);
  --focus:#8aa8fb;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-sans); font-size:16px; line-height:1.62;
  font-feature-settings:"kern","liga"; -webkit-font-smoothing:antialiased}
::selection{background:var(--blue-bg); color:var(--ink)}
a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline; text-underline-offset:2px}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:2px}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
hr{border:0; border-top:1px solid var(--line); margin:36px 0}
kbd{font-family:var(--font-mono); font-size:11px; border:1px solid var(--line);
  border-bottom-width:2px; border-radius:4px; padding:1px 5px; color:var(--ink-3); background:var(--panel)}

/* ---------- App frame ---------- */
.hdr{position:fixed; inset:0 0 auto 0; height:var(--hdr-h); z-index:60;
  display:flex; align-items:center; gap:14px; padding:0 14px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.2) blur(10px); border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:baseline; gap:8px; min-width:0}
.brand-mark{width:14px; height:14px; flex:none; border:1.5px solid var(--blue);
  position:relative; align-self:center; border-radius:2px}
.brand-mark::after{content:""; position:absolute; inset:3px;
  border-left:1.5px solid var(--blue); border-bottom:1.5px solid var(--blue)}
.brand-t{font-weight:640; letter-spacing:-.01em; font-size:14px; white-space:nowrap}
.brand-sub{font-family:var(--font-mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3)}
.crumb{font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); border-left:1px solid var(--line); padding-left:14px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0}
.hdr-right{display:flex; align-items:center; gap:6px; margin-left:auto}
.ghost-btn{display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 10px;
  border:1px solid var(--line); border-radius:6px; font-size:12.5px; color:var(--ink-2);
  background:var(--panel); white-space:nowrap}
.ghost-btn:hover{border-color:var(--line-3); color:var(--ink)}
.icon-btn{width:30px; height:30px; display:inline-grid; place-items:center;
  border:1px solid var(--line); border-radius:6px; color:var(--ink-2); background:var(--panel); font-size:13px}
.icon-btn:hover{border-color:var(--line-3); color:var(--ink)}
#navToggle{display:none}
.prog{display:flex; align-items:center; gap:7px; padding:0 8px; height:30px;
  border:1px solid var(--line); border-radius:6px; background:var(--panel)}
.prog-bar{width:52px; height:3px; background:var(--line-2); border-radius:2px; overflow:hidden}
.prog-fill{display:block; height:100%; width:0; background:var(--green); transition:width .35s ease}
.prog-n{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3)}

/* ---------- Sidebar ---------- */
.side{position:fixed; top:var(--hdr-h); bottom:0; left:0; width:var(--side-w); z-index:50;
  overflow-y:auto; overscroll-behavior:contain; padding:14px 10px 60px 16px;
  border-right:1px solid var(--line); background:var(--bg)}
.side::-webkit-scrollbar{width:9px}
.side::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px; border:3px solid var(--bg)}
.side-h{font-family:var(--font-mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-4); padding:14px 8px 6px}
.nav-part{margin-bottom:2px}
.nav-part-b{display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  padding:6px 8px; border-radius:6px; font-size:13px; font-weight:580; color:var(--ink-2); letter-spacing:-.005em}
.nav-part-b:hover{background:var(--bg-sunk); color:var(--ink)}
.nav-part-b .tw{font-family:var(--font-mono); font-size:9px; color:var(--ink-4); width:9px; transition:transform .18s ease}
.nav-part.open .tw{transform:rotate(90deg)}
.nav-part-b .pn{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-4); margin-left:auto}
.nav-list{display:none; margin:1px 0 8px; padding-left:9px; border-left:1px solid var(--line-2)}
.nav-part.open .nav-list{display:block}
.nav-a{display:flex; gap:9px; align-items:baseline; padding:5px 8px; border-radius:5px;
  font-size:12.7px; color:var(--ink-2); line-height:1.4}
.nav-a:hover{background:var(--bg-sunk); color:var(--ink); text-decoration:none}
.nav-a .cn{font-family:var(--font-mono); font-size:10px; color:var(--ink-4); flex:none; width:22px}
.nav-a.on{background:var(--blue-bg); color:var(--ink); font-weight:560}
.nav-a.on .cn{color:var(--blue)}
.nav-a.done .cn::after{content:"✓"; color:var(--green); margin-left:2px; font-size:9px}
.side-links{margin-top:10px; padding-top:10px; border-top:1px solid var(--line-2)}

/* ---------- Main ---------- */
.main{margin:var(--hdr-h) 0 0 var(--side-w); min-height:calc(100vh - var(--hdr-h)); position:relative}
.main::before{content:""; position:fixed; inset:var(--hdr-h) 0 0 var(--side-w); pointer-events:none; z-index:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 420px);
  mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 420px)}
.wrap{position:relative; z-index:1; max-width:var(--read); margin:0 auto; padding:0 28px 80px}
.wrap.wide{max-width:1060px}

/* ---------- Lifecycle rail ---------- */
.rail{position:sticky; top:var(--hdr-h); z-index:40;
  background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-2); padding:8px 20px;
  display:flex; gap:2px; align-items:center; overflow-x:auto; scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-s{font-family:var(--font-mono); font-size:9.6px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-4); padding:4px 7px; border-radius:4px; white-space:nowrap; position:relative}
.rail-s:hover{color:var(--ink-2); background:var(--bg-sunk); text-decoration:none}
.rail-s.on{color:var(--blue); background:var(--blue-bg)}
.rail-s.on::after{content:"●"; position:absolute; left:50%; transform:translateX(-50%);
  bottom:-10px; font-size:6px; color:var(--blue)}
.rail-sep{color:var(--ink-4); opacity:.45; font-size:9px}

/* ---------- Chapter typography ---------- */
.ch-open{padding:48px 0 28px; border-bottom:1px solid var(--line); margin-bottom:32px}
.eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.17em; text-transform:uppercase; color:var(--ink-3)}
.ch-num{font-family:var(--font-mono); font-size:42px; line-height:1; color:var(--line-3);
  letter-spacing:-.03em; display:block; margin:16px 0 6px}
h1.ch-t{font-family:var(--font-serif); font-size:clamp(30px,4.4vw,43px); line-height:1.12;
  letter-spacing:-.022em; margin:0 0 16px; font-weight:600}
.ch-sum{font-size:18.5px; line-height:1.55; color:var(--ink-2); max-width:60ch; margin:0}
.ch-meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:22px}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px;
  letter-spacing:.09em; text-transform:uppercase; padding:4px 9px; border-radius:20px;
  border:1px solid var(--line); color:var(--ink-3); background:var(--panel)}
.pill.blue{border-color:var(--blue-line); color:var(--blue); background:var(--blue-bg)}
.pill.purple{border-color:var(--purple-line); color:var(--purple); background:var(--purple-bg)}
.pill.green{border-color:var(--green-line); color:var(--green); background:var(--green-bg)}
.pill.amber{border-color:var(--amber-line); color:var(--amber); background:var(--amber-bg)}
h2.sec{font-size:12.5px; font-family:var(--font-mono); letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-3); margin:50px 0 16px; padding-bottom:8px; border-bottom:1px solid var(--line-2); font-weight:500}
h3.sub{font-size:19px; letter-spacing:-.012em; margin:32px 0 10px; font-weight:620}
p{margin:0 0 16px}
.lead{font-size:17.5px; color:var(--ink-2)}
strong{font-weight:640}
em{font-style:italic; color:var(--ink-2)}
code.i{font-family:var(--font-mono); font-size:.87em; background:var(--bg-sunk);
  border:1px solid var(--line-2); padding:1px 5px; border-radius:4px; color:var(--ink)}
ul.bl{list-style:none; margin:0 0 18px; padding-left:2px}
ul.bl>li{position:relative; padding-left:20px; margin-bottom:7px}
ul.bl>li::before{content:""; position:absolute; left:2px; top:.72em; width:7px; height:1px; background:var(--line-3)}
ol.nl{margin:0 0 18px; padding-left:22px}
ol.nl>li{margin-bottom:7px; padding-left:4px}
ol.nl>li::marker{font-family:var(--font-mono); font-size:12px; color:var(--ink-4)}
ul.ck{list-style:none; margin:0 0 18px; padding:0}
ul.ck>li{position:relative; padding-left:26px; margin-bottom:9px}
ul.ck>li::before{content:"✓"; position:absolute; left:2px; top:0; color:var(--green); font-size:13px}
blockquote.pull{margin:28px 0; padding:2px 0 2px 22px; border-left:2px solid var(--blue);
  font-family:var(--font-serif); font-size:20px; line-height:1.45; color:var(--ink); letter-spacing:-.01em}
blockquote.pull p{margin:0}
.block>*:last-child{margin-bottom:0}

/* ---------- ASCII diagram ---------- */
.ascii{font-family:var(--font-mono); font-size:12.4px; line-height:1.5; white-space:pre; overflow-x:auto;
  color:var(--ink-2); padding:18px 16px; background:var(--panel-2); border:1px solid var(--line);
  border-radius:9px; margin:24px 0}
.ascii-cap{font-family:var(--font-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-4); margin-bottom:10px}

/* ---------- Callouts ---------- */
.callout{border:1px solid var(--line); border-left-width:3px; border-radius:7px;
  padding:14px 16px; margin:24px 0; background:var(--panel)}
.callout-h{font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  margin-bottom:7px; display:flex; gap:8px; align-items:center}
.callout p:last-child{margin-bottom:0}
.callout.why{border-left-color:var(--blue); background:var(--blue-bg)} .callout.why .callout-h{color:var(--blue)}
.callout.rule{border-left-color:var(--purple); background:var(--purple-bg)} .callout.rule .callout-h{color:var(--purple)}
.callout.warn{border-left-color:var(--amber); background:var(--amber-bg)} .callout.warn .callout-h{color:var(--amber)}
.callout.fail{border-left-color:var(--red); background:var(--red-bg)} .callout.fail .callout-h{color:var(--red)}
.callout.ok{border-left-color:var(--green); background:var(--green-bg)} .callout.ok .callout-h{color:var(--green)}
.callout.note{border-left-color:var(--line-3); background:var(--panel-2)} .callout.note .callout-h{color:var(--ink-3)}

/* ---------- Good / weak ---------- */
.gw{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:24px 0}
.gw-col{border:1px solid var(--line); border-radius:8px; padding:14px 16px; background:var(--panel)}
.gw-col.g{border-color:var(--green-line); background:var(--green-bg)}
.gw-col.w{border-color:var(--amber-line); background:var(--amber-bg)}
.gw-h{font-family:var(--font-mono); font-size:10px; letter-spacing:.15em; text-transform:uppercase; margin-bottom:10px}
.gw-col.g .gw-h{color:var(--green)} .gw-col.w .gw-h{color:var(--amber)}
.gw ul{list-style:none; margin:0; padding:0; font-size:14.4px}
.gw li{padding:5px 0 5px 18px; position:relative; color:var(--ink-2); line-height:1.45}
.gw-col.g li::before{content:"✓"; position:absolute; left:0; color:var(--green)}
.gw-col.w li::before{content:"×"; position:absolute; left:1px; color:var(--amber)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:9px; background:var(--panel); margin:24px 0}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{text-align:left; padding:10px 14px; border-bottom:1px solid var(--line-2); vertical-align:top}
th{font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3);
  background:var(--panel-2); cursor:pointer; white-space:nowrap}
th:hover{color:var(--ink)}
th .ar{opacity:.45; font-size:9px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg-sunk)}
.tbl-f{display:flex; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.tbl-f input{flex:1; background:var(--bg); border:1px solid var(--line); border-radius:6px;
  padding:5px 9px; font:inherit; font-size:13px; color:var(--ink)}
.mono-cell{font-family:var(--font-mono); font-size:12px; color:var(--ink-3)}

/* ---------- Gate / checklist ---------- */
.gate{border:1px solid var(--line); border-radius:9px; background:var(--panel); margin:24px 0; overflow:hidden}
.gate-h{padding:12px 16px; border-bottom:1px solid var(--line-2); display:flex; align-items:center; gap:10px;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.gate-count{margin-left:auto; font-size:11px; color:var(--ink-2)}
.gate-item{border-bottom:1px solid var(--line-2)}
.gate-row{display:flex; gap:11px; align-items:flex-start; padding:10px 16px; width:100%; text-align:left; font-size:14.4px}
.gate-row:hover{background:var(--bg-sunk)}
.gate-box{width:15px; height:15px; border:1.5px solid var(--line-3); border-radius:3px; flex:none;
  margin-top:3px; display:grid; place-items:center; font-size:10px; color:transparent}
.gate-item.on .gate-box{background:var(--green); border-color:var(--green); color:#fff}
:root[data-theme="dark"] .gate-item.on .gate-box{color:#0e1116}
.gate-item.on .gate-lbl{color:var(--ink-3)}
.gate-ev{display:none; padding:10px 16px 14px 43px; font-size:13.4px; color:var(--ink-2);
  border-top:1px dashed var(--line-2); background:var(--panel-2)}
.gate-item.show .gate-ev{display:block}
.gate-ev b{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-4); display:block; margin-bottom:3px}
.gate-f{padding:11px 16px; display:flex; align-items:center; gap:12px; background:var(--panel-2)}
.gate-prog{flex:1; height:3px; background:var(--line-2); border-radius:2px; overflow:hidden}
.gate-prog span{display:block; height:100%; background:var(--green); width:0; transition:width .3s ease}
.sim-note{font-size:11.5px; color:var(--ink-4); font-style:italic}

/* ---------- Checkpoint ---------- */
.cp{border:1px solid var(--green-line); background:var(--green-bg); border-radius:9px; padding:18px 20px; margin:34px 0}
.cp-h{font-family:var(--font-mono); font-size:10px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--green); margin-bottom:12px}
.cp ul{list-style:none; margin:0; padding:0}
.cp li{position:relative; padding:5px 0 5px 24px; font-size:14.8px; color:var(--ink-2)}
.cp li::before{content:"✓"; position:absolute; left:2px; color:var(--green)}
.cp-f{margin-top:14px}

/* ---------- Artifact card ---------- */
.artc{border:1px solid var(--line); border-radius:9px; background:var(--panel); margin:24px 0; overflow:hidden}
.artc-h{padding:13px 16px; border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.artc-k{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-4)}
.artc-t{font-size:16.5px; font-weight:620; margin-top:3px; letter-spacing:-.01em}
.artc-g{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:1px; background:var(--line-2)}
.artc-c{background:var(--panel); padding:13px 16px}
.artc-c dt{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-4); margin-bottom:4px}
.artc-c dd{margin:0; font-size:13.8px; color:var(--ink-2); line-height:1.45}
.artc-f{display:flex; gap:8px; padding:11px 16px; border-top:1px solid var(--line-2);
  background:var(--panel-2); flex-wrap:wrap}
.artc-body{display:none; border-top:1px solid var(--line-2)}
.artc-body.show{display:block}
.tab-btn{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  padding:5px 10px; border:1px solid var(--line); border-radius:6px; color:var(--ink-3); background:var(--panel)}
.tab-btn:hover{color:var(--ink); border-color:var(--line-3)}
.tab-btn.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}

/* ---------- Code ---------- */
.codeb{border:1px solid var(--line); border-radius:9px; overflow:hidden; margin:24px 0; background:var(--panel)}
.codeb-h{display:flex; align-items:center; gap:10px; padding:8px 12px;
  border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.codeb-f{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-2)}
.codeb-l{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-4)}
.codeb-body{overflow-x:auto}
.cl{display:flex; font-family:var(--font-mono); font-size:12.6px; line-height:1.72}
.cl-n{flex:none; width:40px; text-align:right; padding-right:11px; color:var(--ink-4);
  user-select:none; border-right:1px solid var(--line-2)}
.cl-c{padding:0 14px; white-space:pre; color:var(--ink-2)}
.cl.note{cursor:pointer}
.cl.note .cl-c{border-left:2px solid var(--blue); margin-left:-2px; background:var(--blue-bg)}
.cl-exp{display:none; font-size:12.8px; font-family:var(--font-sans); color:var(--ink-2);
  padding:8px 14px 10px 54px; background:var(--panel-2); border-top:1px dashed var(--line-2); line-height:1.5}
.cl-exp.show{display:block}

/* ---------- Disclosure / depth ---------- */
.disc{border:1px solid var(--line); border-radius:9px; overflow:hidden; margin:24px 0; background:var(--panel)}
.disc-i{border-bottom:1px solid var(--line-2)}
.disc-i:last-child{border-bottom:none}
.disc-b{display:flex; align-items:center; gap:11px; width:100%; padding:11px 15px;
  text-align:left; font-size:14.6px; font-weight:560}
.disc-b:hover{background:var(--bg-sunk)}
.disc-k{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-4); border:1px solid var(--line); border-radius:4px; padding:2px 6px; flex:none}
.disc-i.on .disc-k{color:var(--blue); border-color:var(--blue-line); background:var(--blue-bg)}
.disc-b .tw{margin-left:auto; font-size:10px; color:var(--ink-4); transition:transform .2s ease}
.disc-i.on .tw{transform:rotate(90deg)}
.disc-c{display:none; padding:2px 15px 16px; font-size:14.8px; color:var(--ink-2); line-height:1.6}
.disc-i.on .disc-c{display:block}
.disc-c>*:last-child{margin-bottom:0}

/* ---------- Interactive diagram ---------- */
.dgm{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:26px 0; overflow:hidden}
.dgm-h{display:flex; align-items:center; gap:10px; padding:9px 13px;
  border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.dgm-t{font-family:var(--font-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.dgm-ctl{margin-left:auto; display:flex; gap:5px; align-items:center}
.mini{width:25px; height:25px; border:1px solid var(--line); border-radius:5px; display:grid; place-items:center;
  font-size:12px; color:var(--ink-3); background:var(--panel); line-height:1}
.mini:hover{color:var(--ink); border-color:var(--line-3)}
.mini[disabled]{opacity:.32; cursor:default}
.dgm-stage{position:relative; touch-action:pan-y;
  background:radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0) 0 0/20px 20px}
.dgm svg{display:block; width:100%; height:auto; user-select:none}
.nd{cursor:pointer}
.nd-shape{fill:var(--panel); stroke:var(--line-3); stroke-width:1.5; transition:fill .18s,stroke .18s}
.nd-l{font-family:var(--font-mono); font-size:11px; fill:var(--ink); letter-spacing:.03em; pointer-events:none}
.nd-s{font-family:var(--font-sans); font-size:9.5px; fill:var(--ink-3); pointer-events:none}
.nd:hover .nd-shape{stroke:var(--blue)}
.nd.on .nd-shape{stroke:var(--blue); stroke-width:2.2; fill:var(--blue-bg)}
.nd.k-human .nd-shape{stroke:var(--ink-3)}
.nd.k-ext .nd-shape{stroke-dasharray:5 3; stroke:var(--ink-3)}
.nd.k-store .nd-shape{stroke:var(--green)}
.nd.k-new .nd-shape{stroke:var(--purple); stroke-dasharray:4 3}
.nd.k-risk .nd-shape{stroke:var(--red); fill:var(--red-bg)}
.nd.dim{opacity:.3}
.eg{stroke:var(--line-3); stroke-width:1.4; fill:none}
.eg.dim{opacity:.18}
.eg.hot{stroke:var(--blue); stroke-width:2}
.eg.async{stroke-dasharray:5 4}
.eg-l{font-family:var(--font-mono); font-size:9.5px; fill:var(--ink-3);
  paint-order:stroke; stroke:var(--panel); stroke-width:3.5px; stroke-linejoin:round}
.bnd{fill:none; stroke:var(--line-3); stroke-dasharray:6 4}
.bnd-l{font-family:var(--font-mono); font-size:9px; fill:var(--ink-4); letter-spacing:.1em}
.dgm-info{border-top:1px solid var(--line-2); padding:14px 16px; background:var(--panel-2); font-size:14px; display:none}
.dgm-info.show{display:block}
.dgm-info h4{margin:0 0 3px; font-size:15.5px; font-weight:620}
.dgm-info .k{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-4)}
.dgm-info dl{display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:12px; margin:12px 0 0}
.dgm-info dt{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-4); margin-bottom:3px}
.dgm-info dd{margin:0; font-size:13.4px; color:var(--ink-2)}
.dgm-hint{padding:9px 14px; font-size:12px; color:var(--ink-4); border-top:1px solid var(--line-2); font-style:italic}
.legend{display:flex; flex-wrap:wrap; gap:14px; padding:10px 14px; border-top:1px solid var(--line-2); background:var(--panel-2)}
.lg{display:flex; align-items:center; gap:7px; font-family:var(--font-mono); font-size:9.5px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-4)}
.lg i{width:20px; height:12px; border:1.4px solid var(--line-3); display:block}
.lg i.human{border-radius:20px}
.lg i.sys{border-radius:3px}
.lg i.ext{border-style:dashed}
.lg i.store{border-color:var(--green); border-radius:3px/6px}
.lg i.bnd{border-style:dashed}
.steps-bar{display:flex; align-items:center; gap:10px; padding:9px 13px;
  border-top:1px solid var(--line-2); background:var(--panel-2)}
.step-dots{display:flex; gap:5px; margin-left:auto}
.step-dot{width:6px; height:6px; border-radius:50%; background:var(--line-3)}
.step-dot.on{background:var(--blue)}
.step-cap{font-size:13.2px; color:var(--ink-2)}
.step-n{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-4); white-space:nowrap}

/* ---------- Before / after ---------- */
.ba-tabs{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; margin-left:auto}
.ba-tabs button{font-family:var(--font-mono); font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; padding:5px 11px; color:var(--ink-3)}
.ba-tabs button.on{background:var(--ink); color:var(--bg)}
.ba-grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line-2)}
.ba-pane{background:var(--panel)}
.ba-lbl{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  padding:9px 14px; border-bottom:1px solid var(--line-2); color:var(--ink-4)}
.ba-pane.b .ba-lbl{color:var(--amber)} .ba-pane.a .ba-lbl{color:var(--green)}
.ba-pane .ascii{margin:0; border:none; border-radius:0; background:transparent}
.ba-why{padding:12px 14px; border-top:1px solid var(--line-2); font-size:13.4px; color:var(--ink-2)}
.ba-why b{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-4); display:block; margin-bottom:3px}

/* ---------- Explorers ---------- */
.exp{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:26px 0; overflow:hidden}
.exp-bar{display:flex; flex-wrap:wrap; gap:6px; padding:11px 13px;
  border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.chip{font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  padding:5px 10px; border:1px solid var(--line); border-radius:20px; color:var(--ink-3); background:var(--panel)}
.chip:hover{border-color:var(--line-3); color:var(--ink)}
.chip.on{background:var(--blue); border-color:var(--blue); color:#fff}
:root[data-theme="dark"] .chip.on{color:#0e1116}
.exp-g{display:grid; grid-template-columns:228px 1fr}
.exp-list{border-right:1px solid var(--line-2); overflow-y:auto; max-height:470px}
.exp-i{display:block; width:100%; text-align:left; padding:9px 13px; font-size:13.6px;
  color:var(--ink-2); border-bottom:1px solid var(--line-2); line-height:1.35}
.exp-i:hover{background:var(--bg-sunk); color:var(--ink)}
.exp-i.on{background:var(--blue-bg); color:var(--ink); font-weight:580; box-shadow:inset 2px 0 0 var(--blue)}
.exp-i small{display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-4)}
.exp-d{padding:18px 20px; overflow-y:auto; max-height:470px}
.exp-d h4{margin:0 0 4px; font-size:20px; font-weight:620; letter-spacing:-.015em; font-family:var(--font-serif)}
.exp-row{margin-top:16px}
.exp-k{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-4); padding-bottom:5px; border-bottom:1px solid var(--line-2); margin-bottom:7px}
.exp-row p{margin:0; font-size:14.4px; color:var(--ink-2)}
.exp-row.g .exp-k{color:var(--green)} .exp-row.b .exp-k{color:var(--red)}
.exp-row.t .exp-k{color:var(--amber)} .exp-row.v .exp-k{color:var(--purple)}

/* ---------- Chain ---------- */
.chain{margin:26px 0}
.chain-n{border:1px solid var(--line); background:var(--panel); border-radius:8px; overflow:hidden}
.chain-b{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:11px 15px}
.chain-b:hover{background:var(--bg-sunk)}
.chain-k{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-4); width:86px; flex:none}
.chain-v{font-size:14.6px; color:var(--ink); line-height:1.35}
.chain-n.on{border-color:var(--purple-line); box-shadow:inset 3px 0 0 var(--purple)}
.chain-n.on .chain-k{color:var(--purple)}
.chain-c{display:none; padding:0 15px 15px 113px; font-size:13.8px; color:var(--ink-2)}
.chain-n.on .chain-c{display:block}
.chain-arrow{text-align:center; font-family:var(--font-mono); color:var(--line-3); font-size:12px; line-height:1; padding:5px 0}

/* ---------- Lens radial ---------- */
/* ============================================================
   THE ARCHITECTURE MODEL — views, depth matrix, contracts
   ============================================================ */
.pill.red{border-color:var(--red-line); color:var(--red); background:var(--red-bg)}

/* architecture model tree */
.amodel{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:26px 0; overflow:hidden}
.am-b{padding:6px 0}
.am-n{border-bottom:1px solid var(--line-2); position:relative}
.am-n:last-child{border-bottom:none}
.am-n::before{content:""; position:absolute; left:20px; top:0; bottom:0; width:1px; background:var(--line-2)}
.am-n:first-child::before{top:50%}
.am-n:last-child::before{bottom:50%}
.am-r{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px 16px 10px 34px; position:relative}
.am-r::before{content:""; position:absolute; left:20px; top:50%; width:10px; height:1px; background:var(--line-2)}
.am-r:hover{background:var(--bg-sunk)}
.am-t{font-size:14.8px; font-weight:600; color:var(--ink)}
.am-tag{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-4); border:1px solid var(--line); border-radius:3px; padding:2px 6px; margin-left:auto}
.am-n.depth .am-tag{color:var(--blue); border-color:var(--blue-line); background:var(--blue-bg)}
.am-n.on{background:var(--panel-2)}
.am-n.on .am-t{color:var(--blue)}
.am-c{display:none; padding:0 18px 14px 44px}
.am-n.on .am-c{display:block}
.am-c p{margin:0; font-size:14px; color:var(--ink-2)}
.am-sub{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.am-sub span{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3);
  border:1px solid var(--line); border-radius:4px; padding:3px 8px; background:var(--panel)}

/* views explorer additions */
.lens-wrap.wide{grid-template-columns:minmax(300px,.85fr) 1.15fr}
.lens-node.cross circle{stroke-dasharray:3.5 3}
.lens-node.cross.on circle{fill:var(--amber-bg); stroke:var(--amber); stroke-dasharray:none}
.vchain{display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin:14px 0 2px}
.vchain span{font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); background:var(--bg-sunk); border-radius:3px; padding:3px 7px}
.vchain i{color:var(--line-3); font-style:normal; font-size:11px}

/* depth x views matrix */
.dvm{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:26px 0; overflow:hidden}
.dvm-scroll{overflow-x:auto}
.dvm-t{border-collapse:collapse; width:100%; min-width:720px}
.dvm-t th{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); font-weight:500; padding:9px 4px; text-align:center; border-bottom:1px solid var(--line-2);
  white-space:nowrap}
.dvm-t th.cross{color:var(--amber)}
.dvm-t th.dvm-c{text-align:left; padding-left:14px; width:52px; color:var(--blue)}
.dvm-t td{padding:3px; text-align:center; border-bottom:1px solid var(--line-2)}
.dvm-t tbody th.dvm-c{border-bottom:1px solid var(--line-2); font-size:11px; letter-spacing:.1em}
.dvm-cell{width:100%; height:26px; border:1px solid var(--line-2); border-radius:4px; background:var(--panel-2);
  transition:all .15s; display:block}
.dvm-cell:hover{background:var(--blue-bg); border-color:var(--blue-line)}
.dvm-cell.on{background:var(--blue); border-color:var(--blue); box-shadow:0 0 0 2px var(--blue-bg)}
.dvm-d{padding:16px 18px; border-top:1px solid var(--line-2); background:var(--panel-2); min-height:84px}
.dvm-d p{margin:6px 0 0; font-size:14.4px; color:var(--ink-2)}

/* module architecture contract */
.mcon{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:26px 0; overflow:hidden}
.mcon-b{max-height:none}
.mcon-n{border-bottom:1px solid var(--line-2)}
.mcon-n:last-child{border-bottom:none}
.mcon-r{display:flex; align-items:baseline; gap:11px; width:100%; text-align:left; padding:9px 16px}
.mcon-r:hover{background:var(--bg-sunk)}
.mcon-i{font-family:var(--font-mono); font-size:10px; color:var(--ink-4); width:19px; flex:none}
.mcon-k{font-size:14.2px; font-weight:620; color:var(--ink); flex:none; min-width:186px}
.mcon-q{font-size:13.2px; color:var(--ink-3); line-height:1.4}
.mcon-n.on{background:var(--panel-2); box-shadow:inset 3px 0 0 var(--blue)}
.mcon-n.on .mcon-k{color:var(--blue)}
.mcon-c{display:none; padding:2px 18px 14px 46px}
.mcon-n.on .mcon-c{display:block}

/* artifact map header pills */
.amap-h{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 2px}

/* capability loop — stations that cannot be skipped */
.chain-n.must{border-left:3px solid var(--amber)}
.chain-n.must.on{box-shadow:inset 3px 0 0 var(--amber)}

/* completeness */
.gate-no{display:block; margin-top:7px; color:var(--red); font-size:12.8px}

/* process loop */
.ploop{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:26px 0; overflow:hidden}
.pl-row{display:flex; flex-wrap:wrap; align-items:center; gap:4px; padding:14px 16px; background:var(--panel-2);
  border-bottom:1px solid var(--line-2)}
.pl-n{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:6px;
  background:var(--panel); padding:6px 10px; font-size:13px; color:var(--ink-2); transition:all .15s}
.pl-n:hover{border-color:var(--blue-line); color:var(--ink)}
.pl-n.on{background:var(--blue-bg); border-color:var(--blue); color:var(--blue); font-weight:600}
.pl-i{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-4)}
.pl-n.on .pl-i{color:var(--blue)}
.pl-a{font-family:var(--font-mono); color:var(--line-3); font-size:12px}
.pl-a.loop{color:var(--purple)}
.pl-d{padding:16px 20px}
.pl-d p{color:var(--ink-2)}

@media (max-width:860px){
  .lens-wrap.wide{grid-template-columns:1fr}
  .mcon-k{min-width:0}
  .mcon-r{flex-wrap:wrap}
}
.lens-wrap{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line-2)}
.lens-stage{background:var(--panel); padding:10px}
.lens-stage svg{width:100%; height:auto; display:block}
.lens-node{cursor:pointer}
.lens-node text{font-family:var(--font-mono); font-size:9.5px; fill:var(--ink-3); letter-spacing:.05em}
.lens-node circle{fill:var(--panel); stroke:var(--line-3); stroke-width:1.4; transition:all .2s}
.lens-node:hover circle{stroke:var(--blue)}
.lens-node.on circle{fill:var(--blue-bg); stroke:var(--blue); stroke-width:2.2}
.lens-node.on text{fill:var(--ink); font-weight:600}
.lens-core circle{fill:var(--bg-sunk); stroke:var(--line-3); stroke-dasharray:4 3}
.lens-core text{font-family:var(--font-mono); font-size:10px; fill:var(--ink-3); letter-spacing:.14em}
.lens-spoke{stroke:var(--line-2); stroke-width:1}
.lens-spoke.on{stroke:var(--blue); stroke-width:1.5}
.lens-d{background:var(--panel); padding:18px 20px}
.lens-d h4{margin:0 0 2px; font-size:19px; font-family:var(--font-serif); font-weight:620}
.lens-q{list-style:none; margin:12px 0 0; padding:0}
.lens-q li{position:relative; padding:6px 0 6px 20px; font-size:14.2px; color:var(--ink-2);
  border-bottom:1px solid var(--line-2)}
.lens-q li::before{content:"?"; position:absolute; left:2px; font-family:var(--font-mono);
  color:var(--blue); font-size:12px}
.lens-q li:last-child{border-bottom:none}

/* ---------- Matrix ---------- */
.mx{overflow-x:auto}
.mx table{font-size:13.2px}
.mx td.c{text-align:center; font-family:var(--font-mono)}
.mx .yes{color:var(--green); font-weight:700}
.mx .no{color:var(--ink-4)}
.mx td:first-child{font-weight:560}

/* ---------- Baseline ---------- */
.bl{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:26px 0; overflow:hidden}
.bl-row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px 16px;
  border-bottom:1px solid var(--line-2); font-size:14.4px}
.bl-row:hover{background:var(--bg-sunk)}
.bl-st{font-family:var(--font-mono); font-size:10.5px; margin-left:auto; padding:2px 8px;
  border-radius:20px; border:1px solid var(--line); white-space:nowrap}
.bl-st.ok{color:var(--green); border-color:var(--green-line); background:var(--green-bg)}
.bl-st.warn{color:var(--amber); border-color:var(--amber-line); background:var(--amber-bg)}
.bl-st.open{color:var(--blue); border-color:var(--blue-line); background:var(--blue-bg)}
.bl-exp{display:none; padding:12px 16px 14px; font-size:13.6px; color:var(--ink-2);
  background:var(--panel-2); border-bottom:1px solid var(--line-2)}
.bl-item.on .bl-exp{display:block}

/* ---------- Depth ---------- */
.depth{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:26px 0; overflow:hidden}
.depth-l{display:flex; align-items:center; gap:14px; padding:12px 16px; width:100%;
  text-align:left; border-bottom:1px solid var(--line-2)}
.depth-l:hover{background:var(--bg-sunk)}
.depth-n{font-family:var(--font-mono); font-size:10px; letter-spacing:.11em; color:var(--ink-4);
  border:1px solid var(--line); border-radius:4px; padding:3px 7px; flex:none}
.depth-i.on .depth-n{background:var(--blue); border-color:var(--blue); color:#fff}
:root[data-theme="dark"] .depth-i.on .depth-n{color:#0e1116}
.depth-t{font-size:14.8px; font-weight:560}
.depth-sub{font-size:12.4px; color:var(--ink-3); margin-left:auto; text-align:right}
.depth-c{display:none; padding:4px 16px 18px; background:var(--panel-2); border-bottom:1px solid var(--line-2)}
.depth-i.on .depth-c{display:block}

/* ---------- Decision canvas ---------- */
.dec{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:26px 0; overflow:hidden}
.dec-s{padding:15px 18px; border-bottom:1px solid var(--line-2)}
.dec-k{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-4); margin-bottom:6px}
.dec-opts{display:grid; gap:8px}
.opt{display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left; padding:11px 13px;
  border:1px solid var(--line); border-radius:8px; background:var(--panel-2)}
.opt:hover{border-color:var(--line-3)}
.opt.on{border-color:var(--purple); background:var(--purple-bg)}
.opt-r{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--line-3); flex:none; margin-top:3px}
.opt.on .opt-r{border-color:var(--purple); border-width:4px}
.opt-t{font-size:14.6px; font-weight:580}
.opt-d{font-size:13.2px; color:var(--ink-2); margin-top:2px}
.bars{display:grid; gap:7px}
.bar-r{display:grid; grid-template-columns:128px 1fr 80px; align-items:center; gap:11px; font-size:13px}
.bar-l{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.bar-t{height:7px; background:var(--line-2); border-radius:3px; overflow:hidden}
.bar-t span{display:block; height:100%; background:var(--purple); transition:width .4s cubic-bezier(.3,.8,.4,1)}
.bar-v{font-family:var(--font-mono); font-size:10px; color:var(--ink-4); text-align:right}
.dec-out{background:var(--purple-bg); border-top:1px solid var(--purple-line)}

/* ---------- Sequence player ---------- */
.seq{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:26px 0; overflow:hidden}
.seq-g{display:grid; grid-template-columns:1.1fr 1fr; background:var(--line-2); gap:1px}
.seq-l{background:var(--panel); padding:6px 0}
.seq-step{display:grid; grid-template-columns:86px 1fr; gap:10px; align-items:center; width:100%;
  text-align:left; padding:8px 14px; font-size:13.6px; border-left:2px solid transparent}
.seq-step:hover{background:var(--bg-sunk)}
.seq-step.on{background:var(--blue-bg); border-left-color:var(--blue)}
.seq-step.past{opacity:.55}
.seq-who{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-4); text-align:right; letter-spacing:.03em}
.seq-step.on .seq-who{color:var(--blue)}
.seq-msg{color:var(--ink-2)}
.seq-step.on .seq-msg{color:var(--ink); font-weight:560}
.seq-d{background:var(--panel-2); padding:16px 18px}
.seq-ctl{display:flex; align-items:center; gap:8px; padding:10px 14px;
  border-top:1px solid var(--line-2); background:var(--panel-2)}
.play{display:inline-flex; align-items:center; gap:7px; padding:5px 12px; border:1px solid var(--line);
  border-radius:6px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-2); background:var(--panel)}
.play:hover{border-color:var(--line-3); color:var(--ink)}
.play.on{background:var(--blue); border-color:var(--blue); color:#fff}
:root[data-theme="dark"] .play.on{color:#0e1116}

/* ---------- Failure simulator ---------- */
.fsim{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:26px 0; overflow:hidden}
.fsim-bar{display:flex; flex-wrap:wrap; gap:6px; padding:11px 13px;
  border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.chip.dangerous.on{background:var(--red); border-color:var(--red)}
.chip.safe.on{background:var(--green); border-color:var(--green)}
.fchain{display:flex; align-items:stretch; padding:20px 16px; overflow-x:auto}
.fnode{flex:1; min-width:106px; border:1.5px solid var(--line-3); border-radius:8px;
  padding:11px 10px; text-align:center; background:var(--panel-2)}
.fnode .n{font-family:var(--font-mono); font-size:11px; color:var(--ink)}
.fnode .s{font-size:9.5px; font-family:var(--font-mono); letter-spacing:.09em;
  text-transform:uppercase; margin-top:5px; color:var(--ink-4)}
.fnode.ok{border-color:var(--green-line); background:var(--green-bg)} .fnode.ok .s{color:var(--green)}
.fnode.slow{border-color:var(--amber-line); background:var(--amber-bg)} .fnode.slow .s{color:var(--amber)}
.fnode.down{border-color:var(--red-line); background:var(--red-bg)} .fnode.down .s{color:var(--red)}
.fnode.deg{border-color:var(--amber-line)} .fnode.deg .s{color:var(--amber)}
.farrow{display:grid; place-items:center; padding:0 7px; color:var(--line-3);
  font-family:var(--font-mono); font-size:13px}
.farrow.bad{color:var(--red)}
.fsim-d{border-top:1px solid var(--line-2); padding:15px 18px; background:var(--panel-2)}

/* ---------- ADR viewer ---------- */
.adr{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:26px 0; overflow:hidden}
.adr-g{display:grid; grid-template-columns:182px 1fr; background:var(--line-2); gap:1px}
.adr-stages{background:var(--panel); padding:6px 0}
.adr-s{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 14px;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.adr-s:hover{background:var(--bg-sunk); color:var(--ink)}
.adr-s.on{background:var(--purple-bg); color:var(--purple); box-shadow:inset 2px 0 0 var(--purple)}
.adr-s i{width:5px; height:5px; border-radius:50%; background:var(--line-3); flex:none}
.adr-s.on i{background:var(--purple)}
.adr-c{background:var(--panel); padding:18px 20px; font-size:14.6px; color:var(--ink-2); min-height:250px}
.adr-c h4{margin:0 0 10px; font-size:17px; color:var(--ink); font-weight:620}

/* ---------- Cross references ---------- */
.xref{display:flex; flex-wrap:wrap; gap:7px; margin:22px 0}
.xref-l{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-4); width:100%; margin-bottom:-2px}
.xref a{display:inline-flex; align-items:center; gap:6px; font-size:12.8px; padding:4px 10px;
  border:1px solid var(--line); border-radius:20px; color:var(--ink-2); background:var(--panel)}
.xref a:hover{border-color:var(--blue-line); color:var(--blue); background:var(--blue-bg); text-decoration:none}
.xref a::before{content:"→"; font-family:var(--font-mono); color:var(--ink-4); font-size:11px}

/* ---------- Chapter footer ---------- */
.chapnav{border-top:1px solid var(--line); margin-top:56px; padding:22px 0 0;
  display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center}
.cn-a{display:block; padding:12px 15px; border:1px solid var(--line); border-radius:9px;
  background:var(--panel); max-width:330px}
.cn-a:hover{border-color:var(--line-3); text-decoration:none}
.cn-a .k{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-4)}
.cn-a .t{font-size:14.4px; color:var(--ink); margin-top:3px; font-weight:560}
.cn-a.next{margin-left:auto; text-align:right}
.mark-btn{display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border:1px solid var(--line);
  border-radius:8px; font-size:13px; color:var(--ink-2); background:var(--panel); white-space:nowrap}
.mark-btn.on{border-color:var(--green-line); background:var(--green-bg); color:var(--green)}

/* ---------- Home ---------- */
.hero{padding:74px 0 30px; border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--font-serif); font-size:clamp(42px,7.6vw,84px); line-height:.98;
  letter-spacing:-.035em; margin:14px 0 0; font-weight:600}
.hero h1 .amp{color:var(--ink-4); font-style:italic; display:block; font-size:.46em; margin:2px 0; letter-spacing:0}
.hero-sub{font-size:20px; color:var(--ink-2); margin:26px 0 0; max-width:40ch; line-height:1.45}
.hero-cta{display:flex; flex-wrap:wrap; gap:10px; margin-top:30px}
.btn{display:inline-flex; align-items:center; gap:9px; padding:11px 18px; border-radius:8px;
  font-size:14px; font-weight:560; border:1px solid var(--ink); background:var(--ink); color:var(--bg)}
.btn:hover{text-decoration:none; opacity:.88}
.btn.sec{background:var(--panel); color:var(--ink); border-color:var(--line-3)}
.loop{display:grid; grid-template-columns:repeat(auto-fit,minmax(172px,1fr)); gap:1px; background:var(--line-2);
  border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:26px 0}
.loop-c{background:var(--panel); padding:15px 16px; display:block}
.loop-c:hover{background:var(--bg-sunk); text-decoration:none}
.loop-n{font-family:var(--font-mono); font-size:10px; color:var(--ink-4)}
.loop-t{font-family:var(--font-mono); font-size:12.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink); margin:5px 0}
.loop-d{font-size:12.8px; color:var(--ink-3); line-height:1.42}
.explore{display:grid; grid-template-columns:repeat(auto-fit,minmax(186px,1fr)); gap:10px; margin:22px 0}
.ex-c{border:1px solid var(--line); border-radius:9px; padding:14px 16px; background:var(--panel); display:block}
.ex-c:hover{border-color:var(--line-3); text-decoration:none}
.ex-t{font-size:15px; font-weight:600; color:var(--ink)}
.ex-d{font-size:12.8px; color:var(--ink-3); margin-top:3px; line-height:1.4}

/* ---------- Modals ---------- */
.scrim{position:fixed; inset:0; background:rgba(10,12,16,.45); backdrop-filter:blur(2px); z-index:90; display:none}
.scrim.show{display:block}
.modal{position:fixed; z-index:100; display:none; background:var(--panel); border:1px solid var(--line);
  border-radius:12px; box-shadow:0 24px 60px rgba(10,12,16,.24)}
.modal.show{display:flex; flex-direction:column}
#searchModal{top:64px; left:50%; transform:translateX(-50%); width:min(660px,94vw); max-height:74vh; overflow:hidden}
.srch-in{display:flex; align-items:center; gap:11px; padding:13px 16px; border-bottom:1px solid var(--line-2)}
.srch-in input{flex:1; border:none; background:none; font:inherit; font-size:16px; color:var(--ink); outline:none}
.srch-res{overflow-y:auto; padding:6px}
.sr{display:block; padding:10px 12px; border-radius:7px}
.sr:hover,.sr.on{background:var(--bg-sunk); text-decoration:none}
.sr-t{font-size:14.6px; color:var(--ink); font-weight:560}
.sr-m{font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-4); margin-top:2px}
.sr-x{font-size:12.6px; color:var(--ink-3); margin-top:4px; line-height:1.4}
.sr-x mark{background:var(--amber-bg); color:var(--ink); padding:0 2px; border-radius:2px}
.srch-f{padding:9px 14px; border-top:1px solid var(--line-2); font-size:11.5px;
  color:var(--ink-4); display:flex; gap:14px; flex-wrap:wrap}
#mapModal{top:50%; left:50%; transform:translate(-50%,-50%); width:min(1000px,95vw); max-height:88vh; overflow:hidden}
.map-h{display:flex; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--line-2)}
.map-t{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.map-b{overflow:auto; padding:20px}
.map-b svg{width:100%; height:auto; min-width:540px}
.mapn{cursor:pointer}
.mapn rect,.mapn ellipse{fill:var(--panel); stroke:var(--line-3); stroke-width:1.5; transition:all .2s}
.mapn text{font-family:var(--font-mono); font-size:10.5px; fill:var(--ink); letter-spacing:.06em}
.mapn:hover rect,.mapn:hover ellipse{stroke:var(--blue); fill:var(--blue-bg)}
.mapn.here rect{stroke:var(--blue); stroke-width:2.2; fill:var(--blue-bg)}
.mapn.here text{fill:var(--blue); font-weight:600}
.mape{stroke:var(--line-3); stroke-width:1.4; fill:none}

/* ---------- Misc ---------- */
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); z-index:120;
  background:var(--ink); color:var(--bg); font-size:13px; padding:9px 16px; border-radius:20px;
  opacity:0; transition:opacity .25s, transform .25s; pointer-events:none}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.skip{position:fixed; top:8px; left:8px; z-index:200; background:var(--ink); color:var(--bg);
  padding:8px 14px; border-radius:7px; transform:translateY(-200%)}
.skip:focus{transform:none}
.toc-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(248px,1fr)); gap:12px; margin:22px 0}

/* ---------- Responsive ---------- */
@media (max-width:1180px){ :root{--side-w:252px} }
@media (max-width:920px){
  #navToggle{display:inline-grid}
  .side{transform:translateX(-100%); transition:transform .24s ease; width:290px; box-shadow:0 0 40px rgba(0,0,0,.18)}
  .side.open{transform:none}
  .main{margin-left:0}
  .main::before{left:0}
  .crumb{display:none}
  .wrap{padding:0 18px 70px}
  .exp-g,.lens-wrap,.seq-g,.adr-g,.ba-grid,.gw{grid-template-columns:1fr}
  .exp-list{border-right:none; border-bottom:1px solid var(--line-2); max-height:200px}
  .exp-d{max-height:none}
  .adr-stages{display:flex; overflow-x:auto; border-bottom:1px solid var(--line-2)}
  .adr-s{white-space:nowrap}
  .chapnav{grid-template-columns:1fr; gap:10px}
  .cn-a.next{margin-left:0; text-align:left}
  .bar-r{grid-template-columns:96px 1fr 70px}
}
@media (max-width:620px){
  body{font-size:15.4px}
  .ch-num{font-size:34px}
  .ascii{font-size:10.5px; padding:14px 12px}
  .hero{padding:44px 0 24px}
  .hdr{gap:8px; padding:0 10px}
  .brand-sub,.ghost-btn .lbl,.prog{display:none}
  .dgm-stage{overflow-x:auto}
  .dgm svg{min-width:500px}
  .artc-g{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important; transition-duration:.001ms!important}
}
@media print{
  .hdr,.side,.rail,.chapnav,.dgm-ctl,.modal,.scrim,.skip{display:none!important}
  .main{margin:0} .wrap{max-width:none} .main::before{display:none}
}
</style>

<body>
<a class="skip" href="#main">Skip to content</a>
<header class="hdr">
  <button class="icon-btn" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">≡</button>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <a href="#/" class="brand-t" style="color:inherit">Architecture &amp; System Design</a>
    <span class="brand-sub">Handbook</span>
  </div>
  <div class="crumb" id="crumb"></div>
  <div class="hdr-right">
    <button class="ghost-btn" id="searchBtn" aria-label="Search the handbook">⌕ <span class="lbl">Search</span> <kbd>/</kbd></button>

    <div class="prog" title="Material covered"><span class="prog-bar"><span class="prog-fill" id="progFill"></span></span><span class="prog-n" id="progN">0/0</span></div>

</header>
<nav class="side" id="side" aria-label="Handbook contents"></nav>

  <div id="view"></div>
</main>
<div class="scrim" id="scrim"></div>
<div class="modal" id="searchModal" role="dialog" aria-modal="true" aria-label="Search the handbook">
  <div class="srch-in">
    <span style="color:var(--ink-4)" aria-hidden="true">⌕</span>
    <input id="srchInput" type="search" placeholder="Search concepts, principles, lenses, artifacts, chapters…" autocomplete="off" spellcheck="false">
    <kbd>Esc</kbd>
  </div>
  <div class="srch-res" id="srchRes"></div>
  <div class="srch-f"><span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>/</kbd> search anywhere</span></div>
</div>
