{id:'ch2', n:2, title:'The Architecture Lifecycle', stage:'understand',
 sum:'Architecture has two entry points: you are establishing one, or you are assessing the impact of a change on one. Everything in this book hangs off that distinction.',
 why:'Teams get lost because they use new-system techniques on existing systems, and existing-system habits on new ones.',
 blocks:[
 {t:'callout', kind:'note', title:'The activity list and the loop',
  h:'<p>The lifecycle below describes the <em>stages</em> of architecture work. The Architecture Process — the last chapter of Part III — states the same work as seventeen activities and a nine-station loop — Understand, Model, Decide, Design, Validate, Baseline, Implement, Observe, Evolve — which is the form to reach for when someone wants architecture scheduled as a phase.</p>'},

 {t:'ascii', cap:'The lifecycle', art:
`NEW PROJECT
    ↓
Architecture Initialization
    ↓
Architecture Baseline  ←───────────────┐
    ↓                                  │
System Design                          │
    ↓                                  │
Implementation                         │
    ↓                                  │
Change                                 │
    ↓                                  │
Architecture Impact Assessment         │
    ↓                                  │
Architecture Evolution ────────────────┘
    ↓
Updated Baseline`},

 {t:'p', h:'The loop matters more than the list. A baseline is established once and updated many times. Every change that reaches the system is asked one question — <em>does this affect the architecture?</em> — and the answer routes the work.'},

 {t:'h', h:'Two entry modes'},
 {t:'twocol', left:{k:'Entry mode A — New system', t:'Establish architecture',
   h:'<p>There is no baseline. The work is to understand the problem, identify drivers and constraints, choose principles, shape boundaries, decide the consequential questions, and record enough that delivery can start safely.</p><p><strong>Route:</strong> Parts IV → VIII → IX, then the baseline gate in Chapter 39.</p>'},
  right:{k:'Entry mode B — Existing system', t:'Assess architectural impact',
   h:'<p>A baseline exists, explicitly or implicitly. The work is to determine whether a proposed change alters structure, boundaries, ownership, trust or quality attributes — and if so, to run a scoped version of the same process.</p><p><strong>Route:</strong> Part XIII, which borrows from Parts IX and X as needed.</p>'}},

 {t:'callout', kind:'warn', title:'The most common lifecycle error',
  h:'<p>Treating every change as Entry mode A (re-architecting on every ticket) or every change as neither (no impact assessment at all, until the boundary has quietly disappeared). Chapter 61 gives you the triage question that separates the two.</p>'},

 {t:'h', h:'What happens at each stage'},
 {t:'table', filter:false, cols:['Stage','You produce','You stop when'],
  rows:[
   ['Initialization','Input brief, drivers, constraints, candidate principles, relevant lenses','The problem is understood well enough to shape a boundary'],
   ['Baseline','Context, major structure, decisions, assumptions, open questions','The baseline gate passes (Ch. 39)'],
   ['System design','Component, API, data, workflow, security and runtime design','A team can implement without inventing architecture'],
   ['Implementation','Working software plus guardrails that keep it inside the architecture','The capability works and the guardrails hold'],
   ['Change','A proposal, and an impact answer','You know whether architecture is affected'],
   ['Evolution','New decisions, revised structure, updated baseline','The baseline again describes reality']]},

 {t:'p', h:'Notice what is <em>not</em> in the table: a stage called “draw the diagrams” or “write the ADRs”. Those artifacts are produced throughout, as tools of the process. Part XI teaches them properly, but they never become the process itself.'},

 {t:'cp', items:[
   'Identify which entry mode a piece of work belongs to',
   'Describe the loop from baseline through change back to baseline',
   'Explain why architecture is not a phase that finishes'],
  link:{label:'Open the architecture map', href:'#map'}},

 {t:'xref', items:[
   {t:'Architecture Baseline', h:'#/ch/ch27'},
   {t:'Baseline Gate', h:'#/ch/ch28'},
   {t:'Architecture Impact', h:'#/ch/ch50'},
   {t:'Evolving the Baseline', h:'#/ch/ch52'}]}
]},

{id:'ch3', n:3, title:'Architectural Thinking', stage:'understand',
 sum:'How architects reason: problem before solution, evidence before preference, constraints before technology, and consequences before commitment.',
 why:'Technique without reasoning produces confident, well-documented, expensive mistakes.',
 blocks:[
 {t:'quote', h:'Architecture is not choosing technologies. Architecture is making consequential structural decisions under constraints.'},

 {t:'h', h:'Eleven habits'},
 {t:'disc', items:[
  {k:'01', t:'Problem before solution', h:'<p>The first question is never “should we use a queue?” It is “what problem are we solving, for whom, and what makes it hard?” Solutions proposed before the problem is stated are preferences wearing a costume.</p>'},
  {k:'02', t:'Evidence before preference', h:'<p>Experience is a prior, not a proof. The weight of evidence should scale with the consequence of the decision and the uncertainty around it (Chapter 43).</p>'},
  {k:'03', t:'Constraints before technology', h:'<p>Constraints eliminate options for free. Discovering the batch-only partner API after choosing an event-driven design wastes weeks; discovering it first makes the design obvious.</p>'},
  {k:'04', t:'Explicit assumptions', h:'<p>Every architecture rests on beliefs about volume, growth, team, and behaviour. Write them down, date them, and mark them as assumptions. Undated assumptions become facts within one quarter.</p>'},
  {k:'05', t:'Trade-offs, not wins', h:'<p>Every structural choice buys something and sells something. If you cannot name what a decision costs, you have not finished analysing it — you have finished advocating for it.</p>'},
  {k:'06', t:'Consequences over elegance', h:'<p>The question is not “is this beautiful?” but “what does this make easy, what does it make hard, and what does it make impossible?”</p>'},
  {k:'07', t:'Uncertainty is a first-class input', h:'<p>Say “we do not know” out loud, then decide how much that matters. Unknowns with high impact deserve a spike; unknowns with low impact deserve a note and a date.</p>'},
  {k:'08', t:'Reversibility', h:'<p>Classify every decision: reversible, expensive to reverse, effectively permanent. Move quickly on the first, deliberately on the second, and slowly with evidence on the third.</p>'},
  {k:'09', t:'Cost of decisions', h:'<p>Count the full cost: build, operate, learn, staff, and eventually migrate. A design that is cheap to build and expensive to operate is a loan against a team that has not agreed to take it.</p>'},
  {k:'10', t:'Local versus systemic optimisation', h:'<p>A change that makes one team faster and three teams slower is a loss. Architecture is judged at the system level, which is precisely why it needs someone whose view is the system.</p>'},
  {k:'11', t:'Avoid premature detail', h:'<p>Detail signals confidence. Detail produced before the shape is settled fabricates confidence you have not earned — and, worse, makes the shape hard to change because so much depends on it.</p>'}]},

 {t:'callout', kind:'fail', title:'Common failure — the solution that arrived first',
  h:'<p><strong>❌ Choosing the structure in the first meeting, then gathering requirements that support it.</strong></p><p><strong>Why it fails:</strong> every later piece of evidence gets evaluated against the commitment instead of against the problem. The team stops discovering and starts defending. The tell is that the risks named in review are always risks of <em>not</em> doing the chosen thing.</p>'},

 {t:'h', h:'Thinking in consequences'},
 {t:'p', h:'A useful drill: take any structural choice and complete four sentences before you argue for it.'},
 {t:'ascii', cap:'The consequence drill', art:
`This makes EASY      ......................
This makes HARD      ......................
This makes IMPOSSIBLE ......................
To reverse this we would have to ..........`},
 {t:'p', h:'If the last line reads “rewrite the system”, you are looking at an architectural decision and it needs a record (Chapter 42).'},

 {t:'cp', items:[
   'State a problem without implying a solution',
   'Separate a constraint from an assumption from a preference',
   'Classify a decision by reversibility and choose evidence accordingly',
   'Name what a favoured design makes hard'],
  link:{label:'Now go find the drivers', href:'#/ch/ch4'}},

 {t:'xref', items:[
   {t:'Constraints, Assumptions & Unknowns', h:'#/ch/ch6'},
   {t:'Applying Principles Without Dogma', h:'#/ch/ch8'},
   {t:'Decision Framework', h:'#/ch/ch30'},
   {t:'Evidence, Experiments & Spikes', h:'#/ch/ch32'}]}
]}
]},

/* ===================== PART II ===================== */
{id:'p2', num:'II', title:'Drivers', stage:'frame',
 intro:'Architecture responds to something. This part is about finding out what, precisely, it is responding to — and separating what must be true from what we merely believe.',
 chapters:[

{id:'ch4', n:4, title:'Understanding the Problem', stage:'understand',
 sum:'Work from problem to actors to goals to capabilities to requirements to constraints — in that order, and slowly enough to be surprised.',
 why:'An architecture can only be as good as the problem statement it answers. Most architectural failures are comprehension failures wearing technical clothes.',
 blocks:[
 {t:'ascii', cap:'The understanding workflow', art:
`Problem
   ↓
Users / Actors
   ↓
Goals
   ↓
Capabilities
   ↓
Requirements
   ↓
Constraints`},

 {t:'h', h:'Three problems, not one'},
 {t:'table', filter:false, cols:['Level','Question','Example — Farm Commerce Platform'],
  rows:[
   ['Business problem','What outcome does the organisation need?','Farms capture the retail margin currently lost to distributors.'],
   ['User problem','What is hard or annoying for a person today?','Households want a weekly box they can adjust until the last minute without phoning anyone.'],
   ['System problem','What makes this hard to build correctly?','The basket changes until a cut-off, the harvest is uncertain after it, and money moves in between.']]},
 {t:'p', h:'The system problem is the one architects are paid to notice. It is rarely in the brief. In this example, everything difficult about the platform lives in the gap between “basket is final” and “harvest is known”.'},

 {t:'h', h:'The four kinds of requirement'},
 {t:'disc', items:[
  {k:'FR', t:'Functional requirements', h:'<p>What the system does. They determine capabilities and therefore candidate boundaries — but on their own they rarely determine structure. Two systems with identical functional requirements can be shaped completely differently.</p>'},
  {k:'NFR', t:'Non-functional / quality requirements', h:'<p>How well it must do it: latency, availability, throughput, changeability, security, accessibility. These are the primary source of architectural drivers, and they are only useful when measurable. “Fast” is not a requirement; “p95 under 400ms at 40× median write rate” is.</p>'},
  {k:'OPS', t:'Operational requirements', h:'<p>What must be true to run it: deployment cadence, recovery objectives, on-call model, environments, support hours. These are routinely discovered after launch, which is the most expensive time to discover them.</p>'},
  {k:'REG', t:'Regulatory requirements', h:'<p>What the law or a contract requires: data residency, retention, auditability, separation of duties, payment scope. These behave like constraints — they remove options rather than rank them.</p>'}]},

 {t:'callout', kind:'why', title:'Why measurability matters so much here',
  h:'<p>An unmeasurable quality requirement cannot be traded off, cannot be validated, and cannot be used to reject an option. It therefore contributes nothing to a decision, while feeling like it does. If you can only get a vague statement, record it as an <em>assumption</em> with an owner and a date rather than promoting it to a driver.</p>'},

 {t:'art', name:'Architecture Input Brief',
  purpose:'Capture everything the architecture must respond to, in one place, before shaping anything.',
  when:'At the start of a new system, or before a significant new capability on an existing one.',
  output:'A short document — two to four pages is typical and sufficient.',
  users:'Architects • Product • Engineering leads • Reviewers',
  template:['Problem statement — business, user, system',
    'Actors and external systems',
    'Goals and non-goals',
    'Capabilities in scope',
    'Functional requirements (summary, linked)',
    'Quality requirements with measures',
    'Operational requirements',
    'Regulatory requirements',
    'Known constraints',
    'Known assumptions, with owners and dates',
    'Open questions, with the decision each one blocks'],
  example:`PROBLEM (system)
The customer basket remains editable until Thursday 18:00. Actual
harvest is only known Friday 06:00. Payment is captured between the
two. Substitutions must reach the customer before picking starts.

QUALITY REQUIREMENTS
 · p95 basket edit < 400ms at 40× median write rate, 4-hour window
 · Substitution visible to customer within 60s of farm confirmation
 · Zero duplicate payment captures; every capture traces to one
   order version

NON-GOALS (year one)
 · Same-day delivery
 · Multi-region operation
 · Farm-managed pricing

OPEN QUESTION
Does the cut-off model survive same-day delivery? Blocks: ordering
boundary decision (ADR-002). Owner: Product. Due: end of quarter.`},

 {t:'callout', kind:'fail', title:'Common failure — the requirements list with no shape',
  h:'<p><strong>❌ A 200-line requirements document in which nothing is marked as architecturally significant.</strong></p><p><strong>Why it fails:</strong> everything looks equally important, so structure gets chosen by habit or fashion instead. Chapter 16 is the filter that fixes this.</p>'},

 {t:'cp', items:[
   'Separate the business, user and system problem',
   'Classify requirements as functional, quality, operational or regulatory',
   'Write a quality requirement with a measure attached',
   'Produce an Architecture Input Brief'],
  link:{label:'Filter these into drivers', href:'#/ch/ch5'}},

 {t:'xref', items:[
   {t:'Architectural Drivers', h:'#/ch/ch5'},
   {t:'Constraints & Assumptions', h:'#/ch/ch6'},
   {t:'Establishing System Context', h:'#/ch/ch25'},
   {t:'Worked Example', h:'#/ch/ch53'}]}
]},

{id:'ch5', n:5, title:'Architectural Drivers', stage:'frame',
 sum:'Only a minority of requirements shape structure. Finding that minority — and making it measurable and ranked — is the highest-leverage work in the book.',
 why:'Drivers are what you will point at later when someone asks why the system is not simpler.',
 blocks:[
 {t:'p', h:'<span class="lead">A requirement is an architectural driver when a plausible alternative structure would satisfy it materially better or worse.</span> That test does real work. “The user can reset their password” passes no structure test. “Farms publish availability without central gatekeeping” immediately implies ownership, permission and boundary decisions.'},

 {t:'h', h:'Common driver categories'},
 {t:'table', filter:true, cols:['Driver','What it typically forces','Measure it with'],
  rows:[
   ['High availability','Redundancy, failure isolation, degraded modes','Target availability, maximum tolerable outage per workflow'],
   ['Low latency','Colocation, caching, denormalisation, fewer hops','p95/p99 budget per user-visible operation'],
   ['Multi-tenancy','Isolation model, scoping in data access, noisy-neighbour control','Tenants per store, isolation level required'],
   ['Regulatory isolation','Residency boundaries, separated stores, audit paths','Jurisdictions, retention, evidence required'],
   ['Large data volume','Partitioning, archival, read models','Growth rate, retention, query shapes'],
   ['External integration','Anti-corruption layers, async boundaries, idempotency','Partner SLAs, protocols, failure rates'],
   ['Security sensitivity','Trust boundaries, least privilege, auditability','Asset classification, threat profile'],
   ['Rapid product evolution','Small independent units, narrow contracts, reversibility','Change frequency by area'],
   ['Offline operation','Local state, sync model, conflict resolution','Offline duration, conflict rate tolerated'],
   ['Geographic distribution','Regional deployment, replication, consistency choices','Regions, cross-region latency budget'],
   ['Team topology','Deployment independence, ownership boundaries','Team count, on-call model, deploy cadence']]},

 {t:'callout', kind:'note', title:'Team shape is an architectural driver',
  h:'<p>Four engineers with no operations specialist is not an inconvenience to be engineered around — it is a real, measurable constraint on how many runtime components can be operated competently. Treat it as a driver, rank it, and let it eliminate options honestly.</p>'},

 {t:'h', h:'Drivers for the worked example'},
 {t:'driverTable'},

 {t:'ascii', cap:'The output of this chapter', art:
`Architectural Drivers
       ↓
  Prioritized
       ↓
Measurable where possible
       ↓
Traceable to a decision`},

 {t:'p', h:'That last line is the one teams forget. A driver that never appears in a decision record either was not a driver, or the decision was not reasoned. Both are worth knowing.'},

 {t:'gw', good:[
   'Between three and seven drivers, ranked',
   'Each has a measure or an explicit “not measurable yet”',
   'Each traces to at least one decision',
   'Drivers survive a challenge from someone outside the team'],
  weak:[
   'Everything is “high priority”',
   'Drivers are adjectives: fast, scalable, secure, flexible',
   'Drivers were written after the design was chosen',
   'Nobody can say which driver a component exists to serve']},

 {t:'cp', items:[
   'Apply the alternative-structure test to separate drivers from requirements',
   'Attach a measure to a quality driver',
   'Rank drivers and defend the ranking',
   'Trace a structural element back to the driver that justifies it'],
  link:{label:'Now separate must-be-true from believed-true', href:'#/ch/ch6'}},

 {t:'xref', items:[
   {t:'Understanding the Problem', h:'#/ch/ch4'},
   {t:'Constraints, Assumptions & Unknowns', h:'#/ch/ch6'},
   {t:'Prefer Simplicity', h:'#/ch/ch7'},
   {t:'Decision Framework', h:'#/ch/ch30'}]}
]},

{id:'ch6', n:6, title:'Constraints, Assumptions & Unknowns', stage:'frame',
 sum:'Three different things that look identical in a meeting: what must be true, what we believe is true, and what we do not know.',
 why:'Architectures fail most often not because someone chose badly, but because an assumption silently became a fact.',
 blocks:[
 {t:'threecol', cols:[
  {k:'Constraint', t:'Must be true', tone:'blue',
   h:'<p>Not negotiable by this team, within this horizon. A law, a contract, a platform limit, a budget, an organisational fact.</p><p><strong>Handling:</strong> use it to eliminate options immediately. Record its source, because sources change.</p>'},
  {k:'Assumption', t:'Believed true', tone:'amber',
   h:'<p>Currently believed, not verified. Volume forecasts, behaviour predictions, partner reliability, team stability.</p><p><strong>Handling:</strong> record it, give it an owner, a date and an impact-if-wrong. Review on a schedule.</p>'},
  {k:'Unknown', t:'Not yet known', tone:'purple',
   h:'<p>An open question whose answer would change a decision.</p><p><strong>Handling:</strong> name the decision it blocks. Then either get evidence (Ch. 43), or decide in a way that survives either answer.</p>'}]},

 {t:'callout', kind:'warn', title:'The silent promotion',
  h:'<p>An assumption written on a whiteboard in March is quoted as a fact in June and defended as a requirement in September. The only reliable defence is a register with dates and owners — and a review that asks, explicitly, “is this still an assumption?”</p>'},

 {t:'h', h:'Register — worked example'},
 {t:'constraintTable'},

 {t:'p', h:'Read the two “Unknown” rows again. Both would change the ordering boundary. That is exactly the signal to either run a spike or choose a structure that survives both answers — and to record which of those you did, and why.'},

 {t:'art', name:'Constraints & Assumptions Register',
  purpose:'Keep the difference between fact, belief and ignorance visible for the life of the system.',
  when:'Created during initialization; reviewed at every baseline update and architecture review.',
  output:'A living table, stored with the architecture documentation, not in a slide deck.',
  users:'Architects • Engineering leads • Reviewers • Auditors',
  template:['ID','Type — constraint / assumption / unknown','Statement','Source or owner','Date recorded','Review date',
    'Impact if wrong (for assumptions)','Decision it affects','Status — active / verified / invalidated / superseded'],
  example:`A-004  ASSUMPTION
Statement    Farms confirm harvest by 06:00 Friday.
Source       Operations; currently true for 38 of 40 farms.
Recorded     2026-02-11      Review  Quarterly
Impact       If false, substitution cannot complete before picking.
             Cut-off and notification design both change.
Affects      ADR-003 (harvest confirmation model)
Status       ACTIVE — two farms consistently late; escalate if a
             third joins them.`},

 {t:'cp', items:[
   'Classify a statement as constraint, assumption or unknown',
   'Record an assumption with owner, date and impact-if-wrong',
   'Link an unknown to the decision it blocks',
   'Spot a promoted assumption during review'],
  link:{label:'On to the principles that shape structure', href:'#/ch/ch7'}},

 {t:'xref', items:[
   {t:'Architectural Thinking', h:'#/ch/ch3'},
   {t:'Evidence, Experiments & Spikes', h:'#/ch/ch32'},
   {t:'Architecture Baseline', h:'#/ch/ch27'},

]}
]},

/* ===================== PART III ===================== */
{id:'p3', num:'III', title:'Universal Architecture Principles', stage:'reason',
 intro:'Principles are the reasoning patterns used to shape a system — and they are decision guides, not laws. This part gives you both halves.',
 chapters:[

{id:'ch7', n:7, title:'Principles of Good Architecture', stage:'reason',
 sum:'Thirty-seven principles in seven families, each with intent, a good and a bad example, its trade-off, how to apply it and how to validate it.',
 why:'Principles give a team a shared basis for judgement, so structure is argued from reasoning rather than seniority.',
 blocks:[
 {t:'ascii', cap:'Seven families', art:
`STRUCTURE      what the parts are
DEPENDENCIES   how they rely on each other
CHANGE         what happens when requirements move
RELIABILITY    what happens when things fail
DATA           who owns truth
SECURITY       who is allowed to do what
OPERATIONS     how it is run and recovered`},

 {t:'p', h:'Use the explorer below rather than reading the catalogue end to end. Filter by family, select a principle, and read its six faces. Every principle in this handbook carries a trade-off and a failure mode — a principle presented without them is propaganda.'},

 {t:'princExp'},

 {t:'callout', kind:'why', title:'Why these six fields, every time',
  h:'<p><strong>Intent</strong> tells you what the principle is for, so you can tell when it does not apply. <strong>Good</strong> and <strong>Bad</strong> make it concrete enough to argue about. <strong>Trade-off</strong> and <strong>Failure mode</strong> prevent dogma. <strong>Apply</strong> and <strong>Validate</strong> turn a belief into something a team can actually do and check.</p>'},

 {t:'h', h:'Principles collide — on purpose'},
 {t:'table', filter:false, cols:['Tension','One side says','The other says','Resolve by'],
  rows:[
   ['Modularity vs Simplicity','Separate for independent change','Fewer parts are easier to run','Which driver is ranked higher, and what is the cost of reversing each'],
   ['DRY vs Loose Coupling','Share the logic','Sharing creates a dependency','Do these consumers have to agree, by definition? If not, duplicate'],
   ['Strong consistency vs Availability','Never show wrong data','Always answer','Per workflow, not per system'],
   ['Least privilege vs Operability','Narrow every permission','Incidents need reach','Pre-approved break-glass with audit'],
   ['Fail securely vs Graceful degradation','Deny when the control fails','Keep serving','Classify the asset; the answer differs for catalogue and for payments']]},
 {t:'p', h:'A team that cannot articulate these tensions will apply whichever principle it heard most recently. Chapter 19 is about handling the collisions honestly.'},

 {t:'cp', items:[
   'Name the family a principle belongs to and what it optimises for',
   'State the trade-off of any principle you invoke',
   'Identify two principles in tension in a real decision',
   'Describe how you would validate a principle in a codebase'],
  link:{label:'Learn when not to apply them', href:'#/ch/ch8'}},

 {t:'xref', items:[
   {t:'Applying Principles Without Dogma', h:'#/ch/ch8'},
   {t:'Principles → Standards', h:'#/ch/ch21'},
   {t:'Architecture Standards', h:'#/ch/ch22'},
   {t:'Engineering Lens', h:'#/ch/ch10'}]}
]},

{id:'ch8', n:8, title:'Applying Principles Without Becoming Dogmatic', stage:'reason',
 sum:'Principles are decision guides, not absolute laws. This chapter is the handbook’s immune system against cargo-cult architecture.',
 why:'Most architectural damage done in the name of good practice is a principle applied past the point where it helped.',
 blocks:[
 {t:'quote', h:'A principle applied without its intent is a superstition with good branding.'},

 {t:'ascii', cap:'How to hold a principle', art:
`Principle
   ↓
Intent          why it exists
   ↓
Benefit         what it buys
   ↓
Trade-off       what it costs
   ↓
Failure mode    how it goes wrong
   ↓
When to apply
   ↓
When NOT to apply`},

 {t:'h', h:'Worked correction — modularity'},
 {t:'ba', title:'Modularity, misread and read correctly',
  before:{label:'Misreading', art:
`“Create a module for everything.”

  src/
   ├── user-name-formatter/
   ├── user-email-validator/
   ├── user-id-generator/
   ├── user-address-mapper/
   └── user-audit-logger/

Every change touches four modules.
Nobody can find anything.
The boundaries encode nothing.`},
  after:{label:'Correct reading', art:
`“Create meaningful boundaries where separation
 improves changeability, ownership, reasoning
 or isolation.”

  src/
   ├── identity/      owns users, auth, sessions
   ├── ordering/      owns orders, baskets, cut-off
   └── fulfilment/    owns picking, routes, delivery

A change to cut-off rules touches one module.
Each has an owner and one sentence of purpose.`},
  why:'The misreading optimises for a metric (module count) instead of the intent (independent change). The correct reading can be checked: name a likely change and count the modules it touches.'},

 {t:'h', h:'Four questions before invoking a principle'},
 {t:'ol', items:[
  'What is the intent of this principle, in one sentence, without jargon?',
  'Which driver in our list does applying it serve?',
  'What does applying it here cost us — in parts, indirection, latency or operational surface?',
  'What would have to be true for the opposite choice to be correct?']},
 {t:'p', h:'If question four produces nothing, you are not reasoning. Every principle has conditions under which its opposite is right; a team that cannot name them will apply the principle everywhere.'},

 {t:'h', h:'Where principles stop'},
 {t:'table', filter:false, cols:['Principle','Stops being helpful when','Better guidance then'],
  rows:[
   ['Separation of concerns','The separated parts always change together','Merge them; the seam was imaginary'],
   ['Dependency inversion','There is one implementation and no test need','Call the thing directly; add the interface when a second reason appears'],
   ['Loose coupling','The indirection hides the only flow that matters','Make the flow explicit even if it couples; readability is a real quality'],
   ['Least privilege','Nobody can operate the system during an incident','Break-glass access with audit and expiry'],
   ['Idempotency','The operation is naturally safe to repeat','Do not build keys for a read'],
   ['Observability','Telemetry costs more than the insight it produces','Instrument boundaries and known incident questions only']]},

 {t:'callout', kind:'fail', title:'Common failure — the principle used as a veto',
  h:'<p><strong>❌ “That violates separation of concerns” as the entirety of a review comment.</strong></p><p><strong>Why it fails:</strong> it ends the conversation without transferring any understanding. The reviewer has cited authority, not reasoning. The useful form names the intent, the concrete consequence, and a cheaper alternative: <em>“Pricing rules in the controller means the scheduled repricing job cannot reuse them — it will end up duplicated. Moving the rule to the domain costs one interface.”</em></p>'},

 {t:'cp', items:[
   'State any principle’s intent, benefit, trade-off and failure mode',
   'Explain when a principle should not be applied',
   'Rewrite a dogmatic review comment as a reasoned one',
   'Detect optimisation of a proxy metric instead of the intent'],
  link:{label:'Move from shaping to examining: the lenses', href:'#/ch/ch9'}},

 {t:'xref', items:[
   {t:'Principles of Good Architecture', h:'#/ch/ch7'},
   {t:'Patterns & Reference Architectures', h:'#/ch/ch23'},
   {t:'Architecture Review Checklist', h:'#/ch/ch48'},
   {t:'Architecture Debt', h:'#/ch/ch51'}]}
]}
]},

/* ===================== PART IV ===================== */
{id:'p4', num:'IV', title:'Architecture Lenses', stage:'reason',
 intro:'A principle tells you how architecture should be shaped. A lens tells you which concern you are examining. Same architecture, different perspective.',
 chapters:[

{id:'ch9', n:9, title:'The Architecture Lens Model', stage:'reason',
 sum:'Nine standing lenses and three conditional ones. Each is a disciplined way of asking a different set of questions about the same structure.',
 why:'Teams review architecture through whichever lens they personally own. Everything outside that lens is discovered in production.',
 blocks:[
 {t:'twocol',
  left:{k:'Principle', t:'How should this be shaped?', h:'<p>Principles are normative. They push structure in a direction: separate this, invert that, bound the other. They answer <em>what should be true of the shape</em>.</p>'},
  right:{k:'Lens', t:'What concern am I examining?', h:'<p>Lenses are investigative. They supply the questions a particular discipline would ask, and the evidence that would answer them. They answer <em>what have we not looked at</em>.</p>'}},

 {t:'p', h:'Select a lens below. The questions change; the architecture does not. That is the entire idea — and it is why a single person, however senior, cannot review architecture alone without deliberately switching lenses.'},

 {t:'lensExp'},

 {t:'callout', kind:'rule', title:'The depth rule',
  h:'<p><strong>Not every lens gets equal depth. Depth is driven by architectural risk and by the drivers you ranked in Chapter 16.</strong> A read-only internal reporting tool does not need the same security depth as a payment flow. Applying all nine lenses at full depth to everything is how architecture review becomes a ceremony that people learn to route around.</p>'},

 {t:'h', h:'Choosing depth'},
 {t:'table', filter:false, cols:['Signal','Lens that deserves depth'],
  rows:[
   ['Money, personal data, or permissions are involved','Security, Data, Compliance'],
   ['A user waits for the result','UX, Performance, Reliability'],
   ['An external system is in the path','Reliability, Operations, Data'],
   ['Several teams must coordinate to ship','Engineering, DX, Product'],
   ['The area changes every sprint','Engineering, DX, Product'],
   ['It runs unattended or overnight','Operations, Reliability, Data'],
   ['Spend scales with usage','Cost, Performance']]},

 {t:'cp', items:[
   'Explain the difference between a principle and a lens',
   'List the nine standing lenses and the three conditional ones',
   'Choose which lenses deserve depth for a given change',
   'Recognise when a review has only used one lens'],
  link:{label:'Start with the engineering lens', href:'#/ch/ch10'}},

 {t:'xref', items:[
  {t:'Cross-Lens Review', h:'#/ch/ch20'},
  {t:'Architecture Review', h:'#/ch/ch47'},
  {t:'Principles of Good Architecture', h:'#/ch/ch7'}]}
]},

{id:'ch10', n:10, title:'Engineering Lens', stage:'reason',
 sum:'Structure, cohesion, coupling, dependency direction, maintainability, testability, changeability, complexity.',
 why:'This is the lens most engineers already use — which is exactly why its blind spots are so consistent.',
 blocks:[
 {t:'lensCard', id:'engineering'},
 {t:'h', h:'The change-cost walkthrough'},
 {t:'p', h:'The single most useful engineering-lens exercise is not reading the code. It is taking two real, likely changes and tracing them through the structure.'},
 {t:'ascii', cap:'Change-cost walkthrough', art:
`CHANGE            "Add a second delivery window per day"

Touches           ordering (cut-off rules)
                  fulfilment (route building)
                  notification templates

Coordinated?      No — deployable independently
Contract change?  Yes — DeliverySlot gains a window id
Migration?        Yes — backfill existing slots
Verdict           Localised. Acceptable.


CHANGE            "Let farms set their own prices"

Touches           catalogue, ordering, billing, admin,
                  reporting, farm portal
Coordinated?      Yes — single release across six areas
Verdict           Not localised. The pricing boundary is
                  wrong for the product direction.`},
 {t:'p', h:'The second walkthrough is an architectural finding, produced without a single opinion about frameworks.'},
 {t:'gw', good:['Dependencies point one way and a tool enforces it','A typical change touches one module','Business rules can be tested without infrastructure','Complexity is present where the problem is complex'],
  weak:['Import graph contradicts the diagram','Every change is a cross-team release','Tests require a database and a network','Accidental complexity accumulated by convention']},
 {t:'xref', items:[{t:'Structure principles', h:'#/ch/ch7'},{t:'Designing Components', h:'#/ch/ch34'},{t:'Developer Experience Lens', h:'#/ch/ch13'}]}
]},

{id:'ch11', n:11, title:'Product & Business Lens', stage:'reason',
 sum:'Business capabilities, product evolution, domain boundaries, critical workflows, business risk, value versus complexity.',
 why:'Structure that does not match how the business changes will be fought by the roadmap every quarter.',
 blocks:[
 {t:'lensCard', id:'product'},
 {t:'h', h:'Aligning boundaries with capability'},
 {t:'ascii', cap:'Capability → boundary check', art:
`CAPABILITY                 OWNED BY            CHANGES
Browse & discover          catalogue           weekly
Subscribe & adjust basket  ordering            monthly
Confirm harvest            supply              seasonal
Take payment               billing             rarely
Pick & deliver             fulfilment          monthly

Rule of thumb: a capability that changes weekly should
not share a deployable with one that changes rarely
unless something else forces it.`},
 {t:'callout', kind:'why', title:'Why value versus complexity belongs to this lens',
  h:'<p>Engineering can tell you what a structure costs to build and run. Only product can tell you what it is worth. A decision that doubles operational surface to serve a capability worth 2% of revenue is not an engineering mistake — it is an unasked product question.</p>'},
 {t:'gw', good:['Boundaries named in business language','Critical workflows identified and protected','Roadmap direction visible in the architecture','Complexity traded against value explicitly'],
  weak:['Boundaries named after technologies','All workflows treated as equally critical','Architecture reflects an old org chart','Complexity justified only by engineering preference']},
 {t:'xref', items:[{t:'Understanding the Problem', h:'#/ch/ch4'},{t:'Architectural Drivers', h:'#/ch/ch5'},{t:'Architecture Debt', h:'#/ch/ch51'}]}
]},

{id:'ch12', n:12, title:'UX Lens', stage:'reason',
 sum:'User workflows, latency, state, failure experiences, interruptions, accessibility, feedback, recovery.',
 why:'Architecture decides what the user experiences during waiting and failure — long before any interface is designed.',
 blocks:[
 {t:'lensCard', id:'ux'},
 {t:'callout', kind:'rule', title:'Architecture writes the failure UX',
  h:'<p>By the time a designer sees the flow, the architecture has already decided whether a failure can be retried, whether the user loses their work, whether the result arrives later, and whether the system can tell the user what happened. Those are architectural properties expressed as feelings.</p>'},
 {t:'h', h:'Three states every workflow has'},
 {t:'table', filter:false, cols:['State','Architectural question','Farm Commerce example'],
  rows:[
   ['Waiting','Is this synchronous? What is the budget? What do we show?','Basket edit is synchronous, budget 400ms, optimistic UI with rollback'],
   ['Failing','What can fail, and can the user act on it?','Payment declined is actionable; provider timeout is retried silently up to the cut-off'],
   ['Recovering','Can the user resume, and is anything lost?','Basket is server-side, so a lost connection loses nothing']]},
 {t:'ascii', cap:'Asynchrony must be honest', art:
`DISHONEST                      HONEST

[Save]  → spinner → done       [Save]  → "Saved. Your farm
          (but the box is       confirmation arrives Friday
          not actually          morning — we'll email you
          confirmed yet)        if anything is substituted."

The architecture is async.     The architecture is async.
The UI pretends it is not.     The UI says so.
Every later surprise is a      Expectation matches
support ticket.                mechanism.`},
 {t:'xref', items:[{t:'Workflow & Sequence Design', h:'#/ch/ch37'},{t:'Reliability Lens', h:'#/ch/ch16'},{t:'Accessibility Lens', h:'#/ch/ch19'}]}
]},

{id:'ch13', n:13, title:'Developer Experience Lens', stage:'reason',
 sum:'Discoverability, local development, contracts, tooling, debugging, consistency, architecture discoverability, safe change.',
 why:'An architecture that cannot be understood will be violated — not out of malice, but out of ignorance.',
 blocks:[
 {t:'lensCard', id:'dx'},
 {t:'h', h:'Architecture discoverability'},
 {t:'p', h:'Ask a new engineer to answer three questions using only the repository: where does ordering live, what is it allowed to depend on, and where is that written down? The time they take is a direct measurement of your architecture’s discoverability.'},
 {t:'gw', good:['Structure visible from the directory layout','Boundaries documented next to the code they govern','A guardrail catches a violation in seconds, not in review','The conventional path is the correct path'],
  weak:['Architecture lives in a slide deck from last year','Rules exist but only a few people know them','Violations are caught by a reviewer’s memory','Doing it correctly requires knowing folklore']},
 {t:'callout', kind:'fail', title:'Common failure — the tribal boundary',
  h:'<p><strong>❌ A boundary that exists only in senior engineers’ heads.</strong></p><p><strong>Why it fails:</strong> it degrades at exactly the rate people join and leave. Every violation is reasonable from the violator’s point of view, because nothing in the system said otherwise. Chapter 32 converts this into a rule and a guardrail.</p>'},
 {t:'xref', items:[{t:'Principles → Standards', h:'#/ch/ch21'},{t:'Architecture Standards', h:'#/ch/ch22'},{t:'Documentation as a System', h:'#/ch/ch41'}]}
]},

{id:'ch14', n:14, title:'Security Lens', stage:'reason',
 sum:'Identity, authentication, authorization, trust boundaries, secrets, tenant isolation, data protection, threats, abuse cases, auditability.',
 why:'Security is structural. Controls added after the structure is fixed can only detect, not prevent.',
 blocks:[
 {t:'lensCard', id:'security'},
 {t:'h', h:'Trust boundaries are the core artifact'},
 {t:'dgm', title:'Trust boundaries — farm commerce', hint:'Select a node. Dashed containers are trust boundaries; what crosses them must be authenticated, authorised and validated.',
  groups:[{label:'UNTRUSTED', c0:0, c1:2, r0:0, r1:0},{label:'TRUSTED — OUR CONTROL', c0:0, c1:2, r0:1, r1:2}],
  nodes:[
   {id:'cust', label:'CUSTOMER', kind:'human', col:0, row:0, resp:'Unauthenticated until proven otherwise; every input is hostile until validated.', owner:'—', lenses:'Security, UX'},
   {id:'farm', label:'FARM STAFF', kind:'human', col:1, row:0, resp:'Authenticated, scoped to their own farm. A farm must not see another farm’s orders.', owner:'—', lenses:'Security, Product'},
   {id:'pay', label:'PAYMENT PROV.', kind:'ext', col:2, row:0, resp:'External. Webhooks must be signature-verified; never trusted on content alone.', owner:'Vendor', lenses:'Security, Reliability'},
   {id:'api', label:'API', kind:'sys', col:1, row:1, resp:'Authenticates callers, resolves a principal, and refuses any command without an authorisation decision.', owner:'Platform team', deps:'Identity, Ordering, Catalogue', lenses:'Security, Performance, Operations', why:'This boundary exists so that no internal component has to decide whether its caller is real.'},
   {id:'dom', label:'DOMAIN', kind:'sys', col:0, row:2, resp:'Enforces business invariants. Assumes the caller is authenticated but re-checks tenant scope.', owner:'Ordering team', lenses:'Engineering, Security'},
   {id:'db', label:'DATABASE', kind:'store', col:2, row:2, resp:'Per-service credentials; write grants only on owned tables. Row scoping by farm and customer.', owner:'Platform team', lenses:'Security, Data'}],
  edges:[{f:'cust',t:'api',l:'HTTPS + session'},{f:'farm',t:'api',l:'HTTPS + role'},{f:'pay',t:'api',l:'signed webhook'},
         {f:'api',t:'dom',l:'authorised command'},{f:'api',t:'db'},{f:'dom',t:'db',l:'scoped'}]},
 {t:'callout', kind:'warn', title:'“It is internal” is not a security property',
  h:'<p>It is a network fact, and network facts change with every new integration, VPN, debugging tool and acquisition. Chapter 50 turns this lens into a concrete security design.</p>'},
 {t:'xref', items:[{t:'Security Design', h:'#/ch/ch39'},{t:'Security principles', h:'#/ch/ch7'},{t:'Compliance Lens', h:'#/ch/ch19'}]}
]},

{id:'ch15', n:15, title:'Data Lens', stage:'reason',
 sum:'Ownership, source of truth, lifecycle, consistency, integrity, replication, migration, retention, privacy.',
 why:'Data outlives every service that touches it. Data decisions are the least reversible decisions you will make.',
 blocks:[
 {t:'lensCard', id:'data'},
 {t:'h', h:'The ownership table'},
 {t:'table', filter:true, caption:'Farm Commerce — entity ownership',
  cols:['Entity','Owner','Readers','Consistency','Retention'],
  rows:[
   ['Product / availability','Catalogue','Ordering, Web','Eventual (seconds)','Current season + 2 years'],
   ['Basket','Ordering','Web','Strong','Until cut-off + 30 days'],
   ['Order','Ordering','Billing, Fulfilment','Strong','7 years (tax)'],
   ['Harvest confirmation','Supply','Ordering, Fulfilment','Strong within farm','2 years'],
   ['Payment intent','Billing','Ordering (read)','Strong','7 years'],
   ['Delivery route','Fulfilment','Partner export','Eventual','90 days'],
   ['Customer profile','Identity','All (via API)','Strong','Until deletion request + 30 days']]},
 {t:'p', h:'This table is short, boring, and prevents more incidents than most architecture diagrams. Two owners for one entity is always a finding.'},
 {t:'callout', kind:'fail', title:'Common failure — consistency by infrastructure default',
  h:'<p><strong>❌ Everything is eventually consistent because the chosen platform is, or everything is in one transaction because the ORM makes that easy.</strong></p><p><strong>Why it fails:</strong> consistency is a per-workflow requirement. Stock reservation and a sales dashboard have opposite needs. Deciding once, globally, guarantees one of them is wrong.</p>'},
 {t:'xref', items:[{t:'Data Design', h:'#/ch/ch36'},{t:'Data principles', h:'#/ch/ch7'},{t:'State & Event Design', h:'#/ch/ch38'}]}
]},

{id:'ch16', n:16, title:'Reliability & Resilience Lens', stage:'reason',
 sum:'Failure modes, dependency failure, partial failure, retries, timeouts, idempotency, recovery, degradation.',
 why:'Every dependency is an outage you have agreed to share. This lens makes that agreement explicit.',
 blocks:[
 {t:'lensCard', id:'reliability'},
 {t:'h', h:'Simulate the failure'},
 {t:'p', h:'Reading that systems should “handle failure gracefully” teaches nothing. Trigger a failure and watch what the architecture does about it.'},
 {t:'fsim', title:'Checkout path under failure',
  nodes:[{id:'user', n:'USER'},{id:'api', n:'API'},{id:'ord', n:'ORDERING'},{id:'pay', n:'PAYMENT'},{id:'db', n:'DATABASE'}],
  scenarios:[
   {id:'normal', label:'Normal', tone:'safe',
    states:{user:'ok',api:'ok',ord:'ok',pay:'ok',db:'ok'},
    title:'Happy path',
    body:'<p>Order is created, payment intent authorised, order persisted, confirmation returned. Total budget 1200ms, of which the provider owns up to 800ms.</p>'},
   {id:'paytimeout', label:'Payment timeout', tone:'dangerous',
    states:{user:'ok',api:'ok',ord:'ok',pay:'slow',db:'ok'},
    title:'Provider is slow, then times out at 800ms',
    body:'<p><strong>Expected behaviour:</strong> the call is abandoned at the timeout, not retried inline. The order is saved as <code class="i">payment_pending</code> with an idempotency key. A background worker reconciles against the provider. The customer sees “payment confirming” rather than an error.</p><p><strong>What makes this possible:</strong> bounded resources (the timeout exists), idempotency (retry is safe), and failure isolation (the worker, not the request, carries the retry).</p><p><strong>What breaks without it:</strong> inline retries hold web workers, the pool exhausts, and a slow partner becomes a full outage.</p>'},
   {id:'dbdown', label:'Database unavailable', tone:'dangerous',
    states:{user:'ok',api:'ok',ord:'deg',pay:'ok',db:'down'},
    title:'Primary store is unreachable',
    body:'<p><strong>Expected behaviour:</strong> writes fail fast with a clear error; reads served from cache where they are safe to serve stale; the catalogue stays browsable; checkout is explicitly disabled with an honest message. No partial order is created.</p><p><strong>Design requirement:</strong> the degraded mode must be a designed path that is tested. Degradation that has never been exercised does not exist.</p>'},
   {id:'dupe', label:'Duplicate request', tone:'dangerous',
    states:{user:'ok',api:'ok',ord:'ok',pay:'ok',db:'ok'},
    title:'Customer double-clicks; the client retries after a timeout',
    body:'<p><strong>Expected behaviour:</strong> the second request carries the same idempotency key, matches the stored result, and returns the original response. Exactly one payment capture exists.</p><p><strong>Watch for:</strong> keys generated server-side per request (useless), keys without stored results (deduplicates the write but not the response), and keys with a shorter lifetime than the retry window.</p>'},
   {id:'netsplit', label:'Network failure mid-capture', tone:'dangerous',
    states:{user:'ok',api:'ok',ord:'deg',pay:'down',db:'ok'},
    title:'The provider captured, but we never received the response',
    body:'<p><strong>This is the genuinely hard one.</strong> Money may have moved without our knowing. Expected behaviour: the order sits in an explicit reconciling state; the worker queries the provider by idempotency key; the webhook is treated as a second, independent source of truth. The customer is told only what we are certain of.</p><p><strong>Architectural requirement:</strong> the state machine must have a state for “we do not know yet”. Systems without that state invent it in production, badly.</p>'}]},
 {t:'xref', items:[{t:'Reliability principles', h:'#/ch/ch7'},{t:'State & Event Design', h:'#/ch/ch38'},{t:'Operations Lens', h:'#/ch/ch18'}]}
]},

{id:'ch17', n:17, title:'Performance & Scalability Lens', stage:'reason',
 sum:'Latency, throughput, concurrency, resource consumption, hot paths, growth, capacity, bottlenecks.',
 why:'Performance is a budget that gets spent by structure long before anyone profiles a function.',
 blocks:[
 {t:'lensCard', id:'performance'},
 {t:'h', h:'Spend the budget on paper first'},
 {t:'ascii', cap:'Latency budget — basket edit (p95 target 400ms)', art:
`Browser → CDN/edge                   20ms
Edge → API                           15ms
API auth + principal resolution      10ms
Ordering: load basket                25ms
Ordering: apply rule + validate      15ms
Persist basket                       35ms
Publish basket-changed (async)        0ms   ← off the path
Response serialisation               10ms
Network back                         35ms
                                    -----
                                    165ms   headroom 235ms

RULE: anything that would consume headroom must either be
moved off the critical path or challenged as a requirement.`},
 {t:'p', h:'A budget written like this converts an argument about speed into arithmetic. It also shows immediately what a “small” synchronous addition really costs.'},
 {t:'gw', good:['A measured budget per user-visible operation','Peak, not average, used for capacity','Known bottleneck with a named next bottleneck','Load tested at expected and 3× volume'],
  weak:['“It is fast enough” with no number','Capacity sized on averages','Caching added before the bottleneck is known','First load test is the launch']},
 {t:'xref', items:[{t:'Runtime & Deployment Design', h:'#/ch/ch40'},{t:'Bounded resources', h:'#/ch/ch7'},{t:'Evidence & Spikes', h:'#/ch/ch32'}]}
]},

{id:'ch18', n:18, title:'Operations Lens', stage:'reason',
 sum:'Deployment, configuration, observability, incident response, recovery, rollback, capacity, operational complexity.',
 why:'Every structural decision creates operational work that somebody carries at 3am — often somebody who was not in the design meeting.',
 blocks:[
 {t:'lensCard', id:'operations'},
 {t:'callout', kind:'rule', title:'Operational surface is a design output',
  h:'<p>Each new runtime component adds deployment, configuration, monitoring, alerting, on-call knowledge, upgrade work and one more thing to be woken up by. With four engineers and no operations specialist, this is a hard constraint — and it is completely legitimate for it to eliminate an otherwise elegant design.</p>'},
 {t:'h', h:'Operational readiness questions'},
 {t:'gate', title:'Operational readiness — per component', sim:true,
  items:[
   {l:'It can be deployed independently, or the coupling is deliberate and documented', ev:'A deployment plan naming what must ship together and why.'},
   {l:'Configuration is declared, versioned and environment-specific', ev:'Configuration in version control; no hand-edited production values.'},
   {l:'Health is observable before users notice', ev:'A signal that would fire for the last three real incidents.'},
   {l:'Failures are attributable to a boundary', ev:'Correlated logs or traces that follow one request across components.'},
   {l:'Rollback is defined, including data changes', ev:'A rehearsed rollback, with backward-compatible migration strategy.'},
   {l:'Someone is named as on-call for it', ev:'Rota entry plus a runbook whose first step is unambiguous.'},
   {l:'Capacity has a headroom number and a growth trigger', ev:'Current utilisation, threshold, and what happens at the threshold.'}]},
 {t:'xref', items:[{t:'Runtime & Deployment Design', h:'#/ch/ch40'},{t:'Operations principles', h:'#/ch/ch7'},{t:'Architecture Gates', h:'#/ch/ch49'}]}
]},

{id:'ch19', n:19, title:'Cost, Compliance & Accessibility Lenses', stage:'reason',
 sum:'Three conditional lenses. Apply them when a trigger is present — and say so explicitly when it is not.',
 why:'Forcing every lens onto every system trains people to treat review as paperwork. Naming the trigger keeps rigour where it belongs.',
 blocks:[
 {t:'p', h:'A conditional lens is not a lesser lens. When its trigger is present it may be the <em>dominant</em> lens — a residency requirement can determine the entire deployment topology. The discipline is in naming the trigger.'},
 {t:'table', filter:false, cols:['Lens','Apply when','Skip when — and record that you did'],
  rows:[
   ['Cost','Spend scales with usage; committed capacity; multi-region; large data retention','Fixed small footprint with predictable cost'],
   ['Compliance','Regulated data or industry; audit obligations; residency; contractual evidence','No regulated data and no contractual audit obligation'],
   ['Accessibility','Any human-facing interface; public sector; timing-sensitive or async UI','No human interface (with the caveat that internal tools have humans too)']]},
 {t:'lensCard', id:'cost'},
 {t:'lensCard', id:'compliance'},
 {t:'lensCard', id:'accessibility'},
 {t:'callout', kind:'note', title:'Recording a skip is part of the review',
  h:'<p>“Compliance lens not applied — no regulated data in this capability; revisit if payment data or health data enters scope” is a valid, valuable review output. It is auditable, it is honest, and it names the trigger that would change the answer.</p>'},
 {t:'xref', items:[{t:'Cross-Lens Review', h:'#/ch/ch20'},{t:'Data Lens', h:'#/ch/ch15'},{t:'UX Lens', h:'#/ch/ch12'}]}
]},

{id:'ch20', n:20, title:'Cross-Lens Architecture Review', stage:'review',
 sum:'Put the lenses together into a matrix, so a decision is examined from every angle that matters and from none that do not.',
 why:'Single-lens review is how systems ship that are elegant, fast, and impossible to operate.',
 blocks:[
 {t:'ascii', cap:'One decision, many perspectives', art:
`              Architecture Decision
                       │
       ┌──────┬──────┬─┴────┬──────┬──────┐
       │      │      │      │      │      │
  Engineering Product UX    DX  Security Data
       │      │      │      │      │      │
       └──────┴──────┴──┬───┴──────┴──────┘
                        │
            Reliability • Performance • Operations`},

 {t:'p', h:'Select the lenses relevant to your change and read the matrix. The cells are concerns; a tick means that lens has a real question about that concern. Concerns with several ticks are where cross-discipline disagreement lives — review those together, in one room.'},
 {t:'lensMatrix'},

 {t:'h', h:'Running the review'},
 {t:'ol', items:[
  'State the decision or change in one sentence.',
  'Select lenses by risk and by the ranked drivers — not all of them, every time.',
  'For each selected lens, ask its questions and record the evidence, or record that evidence is missing.',
  'Collect the concerns that appear under two or more lenses; these get discussed jointly.',
  'Record findings as one of: accepted, accepted with a risk, needs evidence, or blocked.',
  'Write the skipped lenses down with the trigger that would bring them back.']},

 {t:'callout', kind:'fail', title:'Common failure — the round-table review',
  h:'<p><strong>❌ Eight people give general impressions for ninety minutes.</strong></p><p><strong>Why it fails:</strong> without lenses, the loudest concern wins and whole categories go unexamined. With lenses, each participant has a defined set of questions and a defined kind of evidence, and the meeting produces findings rather than feelings.</p>'},

 {t:'cp', items:[
   'Select lenses by risk rather than by habit',
   'Use the matrix to find concerns that need cross-discipline discussion',
   'Produce findings with evidence status rather than opinions',
   'Record which lenses were skipped and why'],
  link:{label:'Turn principles into enforceable standards', href:'#/ch/ch21'}},

 {t:'xref', items:[{t:'Architecture Review Checklist', h:'#/ch/ch48'},{t:'Architecture Gates', h:'#/ch/ch49'},{t:'The Lens Model', h:'#/ch/ch9'}]}
]}
]},

/* ===================== PART V ===================== */
{id:'p5', num:'V', title:'From Principles to Standards', stage:'build',
 intro:'A principle nobody can check is a preference. This part is the machinery that turns reasoning into something a codebase actually obeys.',
 chapters:[

{id:'ch21', n:21, title:'Principles → Standards', stage:'build',
 sum:'The transformation chain: principle, intent, standard, rule, pattern, guardrail, validation. The signature move of the handbook.',
 why:'It is the only reliable way to make architecture survive team growth and turnover.',
 blocks:[
 {t:'p', h:'Each step in the chain removes ambiguity and adds enforceability. A principle is a direction; a standard is normative; a rule is mechanical; a guardrail makes the rule cheap to obey; validation closes the loop. Click through the chain — each node explains what it adds and what it must not try to do.'},

 {t:'chain'},

 {t:'h', h:'What each step must not do'},
 {t:'table', filter:false, cols:['Step','Adds','Must not'],
  rows:[
   ['Principle','Direction and reasoning','Pretend to be a law'],
   ['Intent','The reason that survives technology change','Be phrased in terms of a tool'],
   ['Standard','A normative, testable statement','Specify one implementation'],
   ['Rule','Mechanical decidability','Require judgement'],
   ['Pattern','A proven way to comply','Become mandatory by stealth'],
   ['Guardrail','Cheap compliance, expensive violation','Be bypassable without a trace'],
   ['Validation','Evidence the rule holds','Run only on request']]},

 {t:'callout', kind:'why', title:'Why the pattern must stay optional',
  h:'<p>The moment a pattern becomes mandatory, teams comply with its shape and abandon its intent — repository classes that pass raw SQL through, hexagons with the database in the middle. Keep the standard binding and the pattern recommended, and review against the standard.</p>'},

 {t:'h', h:'Where it goes wrong'},
 {t:'gw', good:['Standards state outcomes, not tools','Rules are checkable by a machine','Guardrails run in CI and locally','Exceptions are recorded, scoped and dated'],
  weak:['Standards written as tool mandates','Rules that need a human to interpret','Checks that only run on request','Exceptions granted verbally and forgotten']},

 {t:'cp', items:[
   'Convert a principle into a standard, a rule and a guardrail',
   'Explain why a pattern must not be mandatory',
   'Design a validation that closes the loop',
   'Write an exception that expires'],
  link:{label:'See the standards catalogue', href:'#/ch/ch22'}},

 {t:'xref', items:[{t:'Architecture Standards', h:'#/ch/ch22'},{t:'Patterns & Reference Architectures', h:'#/ch/ch23'},{t:'Principles', h:'#/ch/ch7'}]}
]},

{id:'ch22', n:22, title:'Architecture Standards', stage:'build',
 sum:'What standards can cover, how to write one, and how to keep the set small enough that people read it.',
 why:'Standards are how architecture reaches code that you will never review personally.',
 blocks:[
 {t:'p', h:'A standard has four parts and fits on half a page: <strong>statement</strong> (what must be true), <strong>rationale</strong> (which principle and driver it serves), <strong>verification</strong> (how compliance is checked), and <strong>exception path</strong> (who may grant one, for how long).'},

 {t:'code', file:'standards/ARC-004-data-ownership.md', lang:'markdown',
  lines:[
   {c:'# ARC-004 — Single Writer per Entity', note:'Standards get identifiers. They are referenced from ADRs, review findings and guardrail failures — an unnumbered standard cannot be cited.'},
   {c:''},
   {c:'Status: Active   Since: 2026-03-01   Owner: Platform'},
   {c:''},
   {c:'## Statement', note:'Normative and outcome-shaped. Note it constrains writing, not reading — the narrowest statement that achieves the intent.'},
   {c:'Each persisted entity has exactly one owning module. Other'},
   {c:'modules must not write to it; they use the owner\'s API or'},
   {c:'subscribe to its published events.'},
   {c:''},
   {c:'## Rationale', note:'Traceability to a principle and a driver. A standard that cannot name its driver is a preference with a template.'},
   {c:'Principle: Explicit Data Ownership. Driver: payment'},
   {c:'correctness — invariants must be enforceable in one place.'},
   {c:''},
   {c:'## Verification', note:'Two layers: a preventive control (grants) and a detective one (CI). Prefer controls that make violation impossible.'},
   {c:'- Per-module DB credentials; write grants on owned tables only'},
   {c:'- CI check: schema-ownership map vs migration diff'},
   {c:''},
   {c:'## Exceptions', note:'Exceptions must be scoped, dated and owned. An exception without an expiry becomes a second, undocumented standard.'},
   {c:'Granted by: Platform lead. Max duration: one quarter.'},
   {c:'Current: EX-11 reporting read-replica writes to `report_cache`'},
   {c:'until 2026-09-30 (ADR-014).'}]},

 {t:'h', h:'What standards can cover'},
 {t:'table', filter:true, cols:['Area','A standard here typically says','Verified by'],
  rows:[
   ['Project structure','Where capabilities live and how modules are named','Directory lint, scaffolding'],
   ['Dependency boundaries','Which module may depend on which, and in which direction','Import graph check in CI'],
   ['API conventions','Resource shape, errors, pagination, versioning, idempotency','Schema lint, contract tests'],
   ['Data access','Who writes what; scoping requirements; transaction rules','Grants, schema-ownership check'],
   ['Security','Authentication, authorisation location, secret handling, tenant scoping','Policy tests, secret scanning'],
   ['Logging','Structure, correlation identifiers, what must never be logged','Log schema validation, PII scan'],
   ['Errors','Taxonomy, machine-readable codes, mapping to transport','Contract tests'],
   ['Configuration','Declared, environment-specific, no secrets in code','Config schema check, scanning'],
   ['Observability','Required signals per boundary','Dashboard/alert coverage check'],
   ['Deployment','Independence, migration compatibility, rollback expectations','Pipeline gates'],
   ['Testing','What must be testable without infrastructure','Test layer rules in CI'],
   ['Documentation','What must exist for a capability to be considered done','Docs-as-code checks'],
   ['Naming','Domain language, consistency across API and storage','Review plus lint where feasible'],
   ['Integration','Anti-corruption at external boundaries, retry and idempotency rules','Adapter structure checks']]},

 {t:'callout', kind:'warn', title:'Keep the set small',
  h:'<p>Twelve standards that everyone knows beat forty that nobody reads. If a rule can be enforced by a tool without anyone learning it, prefer the tool and leave it out of the standards document entirely — standards are for the things humans must hold in their heads.</p>'},

 {t:'cp', items:[
   'Write a standard with statement, rationale, verification and exception path',
   'Choose between a standard and a silent tool-enforced rule',
   'Identify which areas need standards for your system',
   'Grant an exception that expires and is traceable'],
  link:{label:'And now patterns, carefully', href:'#/ch/ch23'}},

 {t:'xref', items:[{t:'Principles → Standards', h:'#/ch/ch21'},{t:'Developer Experience Lens', h:'#/ch/ch13'},{t:'Architecture Review', h:'#/ch/ch47'}]}
]},

{id:'ch23', n:23, title:'Patterns & Reference Architectures', stage:'build',
 sum:'A standard says what should be true. A pattern says one proven way to make it true. Never confuse the two.',
 why:'Pattern catalogues are where handbooks go to become fashion magazines.',
 blocks:[
 {t:'twocol',
  left:{k:'Standard', t:'What must be true', h:'<p>Binding. Outcome-shaped. Survives technology change. Reviewed against.</p><p><em>“Business logic must not depend on transport or persistence mechanisms.”</em></p>'},
  right:{k:'Pattern', t:'One way to make it true', h:'<p>Recommended. Structure-shaped. May be replaced by another compliant approach.</p><p><em>“Application → Domain → Repository with adapters at the edges.”</em></p>'}},

 {t:'h', h:'Selecting a pattern'},
 {t:'ol', items:[
  'Name the problem the pattern claims to solve — in your words, not the pattern’s.',
  'Check that you have that problem, evidenced by a driver.',
  'Read the pattern’s costs, not only its benefits: operational surface, latency, cognitive load, failure modes.',
  'Check the assumptions the pattern makes about team size, traffic shape and data volume.',
  'Decide what you will do if the pattern turns out to be wrong — and how expensive that is.']},

 {t:'table', filter:true, caption:'Common patterns and their real cost',
  cols:['Pattern','Solves','Costs','Do not use when'],
  rows:[
   ['Layered (app/domain/infra)','Keeps rules independent of delivery mechanism','Indirection; can become ceremony','The system is a thin CRUD adapter with no rules'],
   ['Modular monolith','Boundaries without distribution','Boundaries need enforcement or they erode','Teams genuinely need independent deploy cadence'],
   ['Service per capability','Independent deploy, scaling and ownership','Network failure, data distribution, operational surface','Fewer teams than services; no operations capacity'],
   ['Event-driven integration','Decoupling producers from consumers','Eventual consistency, ordering, replay, debugging','A strongly consistent answer is required now'],
   ['CQRS','Divergent read and write models','Two models, sync lag, more code','Reads and writes fit one model comfortably'],
   ['Outbox','Atomic state change plus publication','A relay component and its operations','No cross-component publication is needed'],
   ['Saga / process manager','Multi-step workflows without distributed transactions','Compensation logic, state machine, visibility','A single transaction would do'],
   ['Anti-corruption layer','Stops a foreign model leaking inward','Translation code to maintain','The external model is genuinely a good fit'],
   ['Cache-aside','Reduces load and latency','Staleness, invalidation, one more failure mode','The bottleneck has not been measured']]},

 {t:'callout', kind:'fail', title:'Common failure — the pattern that arrived before the problem',
  h:'<p><strong>❌ Adopting event-driven integration to “decouple”, in a system with one team and one database.</strong></p><p><strong>Why it fails:</strong> the coupling was never the constraint; the cost — eventual consistency, ordering, replay, and debugging across asynchronous hops — is paid in full regardless. Then a consistency requirement arrives and is met with a synchronous call over the event bus, which has all the costs of both approaches.</p>'},

 {t:'h', h:'Reference architectures'},
 {t:'p', h:'A reference architecture is a pre-assembled set of decisions for a recurring situation. Used well, it saves a team weeks. Used badly, it imports decisions whose drivers you do not share. The discipline is simple: <strong>a reference architecture must arrive with its drivers and constraints attached</strong>, and adopting it means checking that yours match — and recording the differences.'},

 {t:'cp', items:[
   'Distinguish a standard from a pattern in conversation',
   'Select a pattern from a driver rather than from familiarity',
   'State a pattern’s costs and its exit cost',
   'Adopt a reference architecture by checking its drivers against yours'],
  link:{label:'Now build an architecture from scratch', href:'#/ch/ch24'}},

 {t:'xref', items:[{t:'Architecture Standards', h:'#/ch/ch22'},{t:'Prefer Simplicity', h:'#/ch/ch7'},{t:'Decision Framework', h:'#/ch/ch30'}]}
]}
]},

{id:'p6', num:'VI', title:'Architecture Initialization', stage:'shape',
 intro:'You have a new project. This part takes you from “we have a problem” to “we have a defensible baseline”.',
 chapters:[

{id:'ch24', n:24, title:'Starting a New Project', stage:'shape',
 sum:'The practical workflow, in order, with the trap at each step named.',
 why:'Order matters more than technique. Most of the damage is done by doing the right things in the wrong sequence.',
 blocks:[
 {t:'ascii', cap:'The initialization workflow', art:
`Understand product
       ↓
Identify drivers
       ↓
Identify constraints
       ↓
Identify principles
       ↓
Identify relevant lenses
       ↓
Establish system boundary
       ↓
Define initial architecture`},

 {t:'table', filter:false, cols:['Step','Output','The trap'],
  rows:[
   ['Understand product','Input brief (Ch. 15)','Accepting the feature list as the problem statement'],
   ['Identify drivers','Ranked, measured drivers (Ch. 16)','Everything is a driver, so nothing is'],
   ['Identify constraints','Register (Ch. 17)','Recording preferences as constraints to win an argument'],
   ['Identify principles','A short list your team will actually use','Adopting all 37 and applying none'],
   ['Identify lenses','Which lenses get depth, and which are skipped','Applying all of them shallowly'],
   ['Establish boundary','Context diagram (Ch. 36)','Drawing internals before the edge is agreed'],
   ['Define initial architecture','Containers and major components (Ch. 37)','Designing level 4 on day two']]},

 {t:'callout', kind:'rule', title:'Pick five to eight principles, not thirty-seven',
  h:'<p>Choose the principles that your ranked drivers actually demand, write them where engineers will see them, and make two or three of them enforceable (Chapter 32). A team that knows five principles well will make better decisions than one that has a poster of thirty-seven.</p>'},

 {t:'h', h:'Farm Commerce — principles chosen and why'},
 {t:'table', filter:false, cols:['Principle','Chosen because','Enforced by'],
  rows:[
   ['Explicit Data Ownership','Payment correctness needs invariants in one place','Per-module DB grants + CI check'],
   ['Separation of Concerns','Cut-off rules must be reusable by API, worker and admin','Dependency-boundary validator'],
   ['Idempotency Where Required','Money moves on a retryable path','Idempotency key required by the command bus'],
   ['Prefer Simplicity','Four engineers, no operations specialist','Component count is a reviewed number'],
   ['Graceful Degradation','A weekly cut-off means downtime has a deadline','Degraded modes tested in staging'],
   ['Observability','No operations specialist means the system must explain itself','Required signals per boundary']]},

 {t:'cp', items:[
   'Run the initialization workflow in order',
   'Choose a small principle set from your drivers',
   'Name the lenses that get depth and the ones you are skipping',

{id:'ch25', n:25, title:'Establishing System Context', stage:'shape',
 sum:'Draw the edge before anything inside it: the system, its users, the external systems it depends on, and what crosses the boundary.',
 why:'Nearly every late architectural surprise arrives from outside the boundary you never agreed.',
 blocks:[
 {t:'p', h:'The context view answers one question: <strong>what is ours, what is not, and what crosses between?</strong> It is the cheapest architecture artifact to produce and the most expensive one to skip.'},

 {t:'dgm', title:'System context — Farm Commerce Platform', legend:true,
  hint:'Click any node. Context level shows who we serve and what we depend on — never internals.',
  groups:[{label:'OUR SYSTEM', c0:1, c1:1, r0:1, r1:1}],
  nodes:[
   {id:'cu', label:'CUSTOMER', kind:'human', col:0, row:0, resp:'Subscribes to a weekly box, adjusts it until the Thursday cut-off, pays, receives delivery.', owner:'—', lenses:'UX, Product, Performance', why:'The cut-off behaviour of this actor is the origin of the system’s hardest property.'},
   {id:'fs', label:'FARM STAFF', kind:'human', col:1, row:0, resp:'Publishes weekly availability, confirms actual harvest on Friday morning, prints pick lists.', owner:'—', lenses:'Product, Security, UX'},
   {id:'ad', label:'ADMIN', kind:'human', col:2, row:0, resp:'Manages catalogue, zones, pricing rules and refunds.', owner:'—', lenses:'Security, Product'},
   {id:'sys', label:'FARM COMMERCE', sub:'the system we are building', kind:'sys', col:1, row:1, resp:'Owns ordering, catalogue, supply confirmation, billing coordination and fulfilment planning.', owner:'Us', deps:'Payment provider, Delivery partner, Email', lenses:'All'},
   {id:'pp', label:'PAYMENT PROV.', kind:'ext', col:0, row:2, resp:'Hosted card fields, authorisation, capture, webhooks. Card data never reaches us.', owner:'Vendor', lenses:'Security, Reliability, Compliance', why:'Chosen specifically so PCI scope stays outside our boundary — a constraint, not a preference.'},
   {id:'dp', label:'DELIVERY PARTNER', kind:'ext', col:1, row:2, resp:'Accepts a route file at 06:00, returns delivery status hourly. Batch only.', owner:'Partner', lenses:'Reliability, Operations', why:'Batch-only integration is a hard constraint that shapes the entire fulfilment boundary.'},
   {id:'em', label:'EMAIL / SMS', kind:'ext', col:2, row:2, resp:'Transactional notifications: confirmations, substitutions, delivery windows.', owner:'Vendor', lenses:'UX, Reliability'}],
  edges:[{f:'cu',t:'sys',l:'browse, order, pay'},{f:'fs',t:'sys',l:'availability, harvest'},{f:'ad',t:'sys',l:'manage'},
         {f:'sys',t:'pp',l:'authorise / capture'},{f:'sys',t:'dp',l:'routes (batch 06:00)'},{f:'sys',t:'em',l:'notify'}]},

 {t:'h', h:'What to record for every external system'},
 {t:'ul', items:[
  '<strong>Ownership</strong> — who can change it, and how much notice we get',
  '<strong>Protocol and shape</strong> — synchronous, batch, webhook, file',
  '<strong>Failure behaviour</strong> — what it does when unhealthy, and what its SLA actually promises',
  '<strong>Trust</strong> — what we must validate on the way in',
  '<strong>Data</strong> — what it holds that we depend on, and who owns the truth',
  '<strong>Exit cost</strong> — what replacing it would take']},

 {t:'callout', kind:'fail', title:'Common failure — context drawn as a first draft of the internals',
  h:'<p><strong>❌ A “context diagram” containing the API, the worker and the database.</strong></p><p><strong>Why it fails:</strong> the conversation skips straight to internal structure, and the genuinely dangerous external facts — a batch-only partner, a webhook that cannot be trusted, a provider whose retry semantics differ from ours — never get examined. Keep the system a single box until the edge is agreed.</p>'},

 {t:'art', name:'System Context Document',
  purpose:'Agree the boundary of the system and its relationships with the outside world.',
  when:'First artifact of initialization; revisited whenever an integration is added or removed.',
  output:'One diagram plus one table of external systems.',
  users:'Everyone — this is the artifact with the widest audience',
  template:['Purpose of the system, in one paragraph','Actors and what each needs','External systems table (ownership, protocol, failure, trust, data, exit cost)',
    'Context diagram','What is explicitly out of scope','Open questions about the boundary'],
  example:`EXTERNAL SYSTEM — Delivery Partner
Ownership      Partner; 30 days notice on API change (contract §7)
Protocol       SFTP route file 06:00; status poll hourly
Failure        No acknowledgement path; a rejected file is only
               discovered on the next poll
Trust          Untrusted input; status records validated on read
Data           They own delivery status; we own the route
Exit cost      High — two competitors, both batch; 3 months`},

 {t:'cp', items:[
   'Draw a context view without internals',
   'Record ownership, protocol, failure behaviour and trust for each external system',
   'Identify the external constraint that will shape the architecture most',
   'State what is explicitly out of scope'],
  link:{label:'Now shape the inside', href:'#/ch/ch26'}},

 {t:'xref', items:[{t:'Initial Architecture', h:'#/ch/ch26'},{t:'Security Lens', h:'#/ch/ch14'},{t:'Diagramming', h:'#/ch/ch44'}]}
