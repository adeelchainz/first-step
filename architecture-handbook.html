{id:'p9', num:'IX', title:'Architecture Documentation', stage:'baseline',
 intro:'How to write and draw architecture: document types, drafting procedures, diagram selection, and what separates a diagram that teaches from one that decorates.',
 chapters:[

{id:'ch41', n:41, title:'Documentation as a System', stage:'baseline',
 sum:'Architecture documentation is the maintained representation of architectural knowledge — not a record of meetings.',
 why:'Undocumented architecture is unreviewable, and therefore unevolvable.',
 blocks:[
 {t:'p', h:'<span class="lead">Treat documentation as a system with inputs, owners, update triggers and validation.</span> The failure is never “we did not write anything”. It is that what was written had no owner, no trigger to update it, and no way to detect that it had gone stale.'},

 {t:'table', filter:false, cols:['Property','Documentation as a system','Documentation as an artifact pile'],
  rows:[
   ['Ownership','Every document has a named owner','Written by whoever had time'],
   ['Update trigger','Defined: which events force a revision','Updated when someone notices'],
   ['Location','Where engineers already work','Wherever it was first uploaded'],
   ['Validation','Reviewed at gates; drift is detectable','Trusted until proven wrong in an incident'],
   ['Lifecycle','Superseded and archived deliberately','Grows forever; nothing is ever wrong, only old'],
   ['Audience','Stated per document','Assumed to be “everyone”']]},

 {t:'callout', kind:'rule', title:'The staleness rule',
  h:'<p>Documentation that is wrong is worse than documentation that is missing, because it is trusted. If you cannot commit to maintaining a document, write a shorter one you can maintain — or write down the date and the fact that it is a snapshot.</p>'},

 {t:'h', h:'Three update triggers worth automating'},
 {t:'ul', items:[
  '<strong>An ADR is accepted</strong> → the baseline must be revisited in the same change',
  '<strong>A new external dependency appears</strong> → the context view and the externals table must change',
  '<strong>A module is added, removed or renamed</strong> → the container view and the ownership table must change']},
 {t:'p', h:'Each of these can be a pull-request checklist item or a CI warning. Documentation drift is mostly a workflow problem wearing a discipline costume.'},

 {t:'xref', items:[{t:'Architecture Document Types', h:'#/ch/ch42'},{t:'Architecture Baseline', h:'#/ch/ch27'},{t:'Architecture Debt', h:'#/ch/ch51'}]}
]},

{id:'ch42', n:42, title:'Architecture Document Types', stage:'baseline',
 sum:'Twelve document types, each with purpose, trigger, inputs, author, reviewer, required sections and validation.',
 why:'Most documentation problems are actually type confusion — an ADR written as a design, a design written as a status report.',
 blocks:[
 {t:'p', h:'Filter the table, then open the artifact cards below for the types you use most. Each card carries its template and a worked example.'},
 {t:'table', filter:true, caption:'Document types',
  cols:['Type','Purpose','Created when','Owner','Reviewer'],
  rows:[
   ['Architecture overview','Orient a reader in ten minutes','System exists or is being established','Architect','Engineering lead'],
   ['System context','Agree the boundary and externals','Initialization; integration change','Architect','Product + Engineering'],
   ['Architecture baseline','The agreed current model','End of initialization; every architectural change','Architect','Independent reviewer'],
   ['Detailed design','Enough to implement a capability safely','Before building a significant capability','Senior engineer','Architect'],
   ['ADR','Record one consequential decision','A decision is architecturally significant','Decision owner','Peer or architect'],
   ['Decision register','Index of decisions and status','Maintained continuously','Architect','—'],
   ['Constraints register','Facts, beliefs and unknowns','Initialization; reviewed at every gate','Architect','Engineering lead'],
   ['Risk register','Architectural risks with impact and trigger','Initialization; reviewed at every gate','Architect','Engineering lead'],
   ['Threat model','Abuse cases and controls','Security lens applied at depth','Security-minded engineer','Security reviewer'],
   ['Integration contract','The agreement with an external system','Before integrating','Integration owner','Both sides'],
   ['Deployment architecture','How and where it runs','Before first production deploy','Platform engineer','Operations reviewer'],
   ['Operational model','How it is run, watched and recovered','Before first production deploy','Platform engineer','On-call team']]},

 {t:'art', name:'Architecture Overview',
  purpose:'Let a competent newcomer understand the system’s shape and reasoning in about ten minutes.',
  when:'Once a baseline exists; refreshed whenever the baseline changes materially.',
  output:'Two to five pages, diagram-led.',
  users:'New joiners • Reviewers • Partner teams • Leadership',
  template:['What the system does, in one paragraph','Context diagram','Container diagram with responsibilities and owners',
    'The three to five decisions that explain the shape','Quality attributes and their targets','What is deliberately not here',
    'Where to go next (baseline, ADRs, standards)'],
  example:`FARM COMMERCE — ARCHITECTURE OVERVIEW           v1.2

WHAT IT DOES
Sells farm boxes to households on a weekly cycle: customers
adjust a basket until Thursday 18:00, farms confirm harvest
Friday 06:00, routes go to the delivery partner at 06:00
Saturday.

THE SHAPE, IN THREE DECISIONS
 1  One deployable with enforced module boundaries (ADR-001)
    — four engineers, no operations specialist.
 2  Cut-off is an ordering invariant, not a UI rule (ADR-002)
    — every entry point must obey it.
 3  Payment capture runs in a worker with idempotency keys
    (ADR-004) — money must not depend on request timing.

WHAT IS DELIBERATELY NOT HERE
 · No service mesh, no per-capability services: no driver.
 · No multi-region: single market in year one (assumption
   A-002, reviewed quarterly).`},

 {t:'art', name:'Detailed Design Document',
  purpose:'Describe how one capability works, to the level where implementation carries no architectural choices.',
  when:'Before building a capability that crosses boundaries, touches money or data ownership, or introduces a dependency.',
  output:'Three to eight pages with sequence and component views.',
  users:'Implementing engineers • Reviewers • Future maintainers',
  template:['Capability and use cases in scope','Components involved and their responsibilities','Contracts — commands, queries, events, errors',
    'Data — entities touched, ownership, consistency, migration','Workflow with failure branches','Security — identity, authorisation, trust crossings',
    'Failure modes and expected behaviour','Observability — signals and the questions they answer','Open questions and assumptions'],
  example:`DETAILED DESIGN — Harvest substitution         2026-04-02

IN SCOPE
Farm confirms actual harvest; shortfalls generate substitutions;
affected customers are notified before picking begins.

FAILURE BRANCHES
 · Farm confirms late (after 06:00): picking proceeds on
   forecast; substitution becomes a delivery-time note.
 · Substitution rule finds no acceptable alternative: item is
   removed and the order total reduced; refund path ADR-009.
 · Notification provider down: substitution still applies;
   notification retried for 2h, then surfaced in the app.

OBSERVABILITY
 · substitution_latency_seconds  — driver target is 60s
 · unconfirmed_farms_at_0700     — alerts operations
 · notification_failures_total   — alerts after 2h retry`},

 {t:'xref', items:[{t:'How to Write Architecture Documents', h:'#/ch/ch43'},{t:'ADRs', h:'#/ch/ch31'},{t:'Templates', h:'#/ch/ch54'}]}
]},

{id:'ch43', n:43, title:'How to Write Architecture Documents', stage:'baseline',
 sum:'A ten-step drafting procedure that works for overviews, designs and baselines alike.',
 why:'Most architecture writing fails at structure, not at prose.',
 blocks:[
 {t:'ascii', cap:'Drafting procedure', art:
` 1  State the purpose — who reads this and what they must be
    able to do afterwards
 2  Define the scope — and what is explicitly out of it
 3  State the drivers — what this must satisfy
 4  Explain the boundaries — what is inside, outside, crossing
 5  Describe the decisions — and link the ADRs
 6  Explain the relationships — how the parts interact
 7  Document the trade-offs — what this shape costs
 8  Record assumptions — with dates and owners
 9  Record open questions — with what each one blocks
10  Link supporting artifacts — diagrams, ADRs, registers`},

 {t:'h', h:'Writing rules that survive review'},
 {t:'ul', items:[
  '<strong>Lead with the decision, not the journey.</strong> Readers need the conclusion first; the reasoning second.',
  '<strong>One idea per paragraph.</strong> If a paragraph needs “additionally”, it is two paragraphs.',
  '<strong>Name things exactly once.</strong> One concept, one name, everywhere — API, diagram, database, documentation.',
  '<strong>Write dates and owners, not “recently” and “the team”.</strong>',
  '<strong>Say what you did not do.</strong> The absence of a component is a decision and deserves a sentence.',
  '<strong>Prefer a table to a list, and a diagram to a table</strong> — when the content is relational. Prose is for reasoning.']},

 {t:'gw', good:['Purpose and audience stated in the first paragraph','Trade-offs written down','Assumptions dated and owned','Diagrams that each answer a stated question','Links to decisions rather than restatements'],
  weak:['Starts with a history of the project','Only advantages listed','Assumptions stated as facts','Diagrams with no question','Decisions re-explained in three documents, inconsistently']},

 {t:'callout', kind:'fail', title:'Common failure — the document that describes the code',
  h:'<p><strong>❌ Pages of prose restating what the classes do.</strong></p><p><strong>Why it fails:</strong> the code already says that, more accurately, and it drifts the moment it is written. Architecture documentation exists to record what the code <em>cannot</em> say: why the boundary is there, what was rejected, what must remain true, and what we are assuming.</p>'},

 {t:'xref', items:[{t:'Diagramming', h:'#/ch/ch44'},{t:'Document Types', h:'#/ch/ch42'},{t:'Diagram Quality', h:'#/ch/ch46'}]}
]},

{id:'ch44', n:44, title:'Diagramming', stage:'baseline',
 sum:'Choose the diagram from the question. Nine questions, nine artifacts, one visual grammar.',
 why:'Most bad diagrams are not badly drawn. They are answering no question at all.',
 blocks:[
 {t:'table', filter:true, caption:'Diagram selection',
  cols:['Question','Artifact','Shows','Never shows'],
  rows:[
   ['What is the system?','Context','System, actors, external systems','Internal components'],
   ['What are its major parts?','Container','Deployable / runnable units and responsibilities','Classes'],
   ['What is inside this part?','Component','Components in one container and their relationships','Every class'],
   ['How does a request work?','Sequence','Ordered interaction across boundaries, with branches','Static structure'],
   ['How does data move?','Data flow','Stores, flows, transformations, trust crossings','Call stacks'],
   ['How does state change?','State machine','States, transitions, guards, terminal states','Implementation'],
   ['Where does it run?','Deployment','Nodes, regions, networks, scaling units','Business logic'],
   ['How do systems integrate?','Integration','Protocols, direction, frequency, failure handling','Internal design'],
   ['How does a business process work?','Workflow','Human and system steps, decisions, handoffs','Technical detail']]},

 {t:'h', h:'One visual grammar, everywhere'},
 {t:'dgm', title:'The notation used throughout this handbook', legend:true,
  hint:'Every diagram in this book uses these shapes. Consistency is what lets a reader recognise a store or an external system without a key.',
  nodes:[
   {id:'h', label:'HUMAN', kind:'human', col:0, row:0, resp:'A person or role interacting with the system. Drawn as an oval, always outside the system boundary.'},
   {id:'s', label:'SYSTEM', kind:'sys', col:1, row:0, resp:'A system or container we own and can change. Rounded rectangle, solid border.'},
   {id:'e', label:'EXTERNAL', kind:'ext', col:2, row:0, resp:'A system we depend on but do not control. Dashed border — a permanent reminder that its behaviour is not ours to decide.'},
   {id:'d', label:'DATA STORE', kind:'store', col:1, row:1, resp:'Persistent state. Cylinder, green border, because ownership questions attach to every store.'},
   {id:'n', label:'PROPOSED', kind:'new', col:2, row:1, resp:'An element being introduced by a proposed change. Purple dashed — used in evolution diagrams so readers can see what is new at a glance.'}],
  edges:[{f:'h',t:'s',l:'uses'},{f:'s',t:'e',l:'depends on'},{f:'s',t:'d',l:'owns'},{f:'s',t:'n',l:'proposed',async:true}]},

 {t:'callout', kind:'rule', title:'The golden rule',
  h:'<p><strong>Every diagram should answer a question.</strong> Write the question as the title, or at least as the caption. A diagram whose question cannot be written is a picture of a system, which is not the same thing as a communication.</p>'},

 {t:'xref', items:[{t:'How to Draft a Diagram', h:'#/ch/ch45'},{t:'Diagram Quality', h:'#/ch/ch46'},{t:'Diagram catalog', h:'#/ch/ch56'}]}
]},

{id:'ch45', n:45, title:'How to Draft a Diagram', stage:'baseline',
 sum:'A ten-step drafting sequence that starts with a question and ends with a published artifact.',
 why:'Diagrams drawn before understanding become an expression of assumptions.',
 blocks:[
 {t:'ascii', cap:'Drafting sequence', art:
`Question            what must a reader be able to answer?
    ↓
Scope               what is in, what is out
    ↓
Participants        only those needed for the question
    ↓
Relationships       direction, meaning, frequency
    ↓
Boundaries          trust, ownership, deployment
    ↓
First draft         ugly, fast, by hand
    ↓
Remove detail       anything not serving the question
    ↓
Validate            against the real system, with someone who
                    knows it better than you
    ↓
Review              with the audience it is for
    ↓
Publish             where it will be found and maintained`},

 {t:'callout', kind:'fail', title:'Common failure — the diagram that came first',
  h:'<p><strong>❌ Creating diagrams before understanding the system.</strong></p><p><strong>Why it fails:</strong> the diagram becomes an expression of assumptions rather than a representation of the system — and because it looks authoritative, those assumptions propagate into designs, estimates and decisions. Validate against reality before publishing: open the code, read the configuration, ask the person who is paged.</p>'},

 {t:'h', h:'The removal pass'},
 {t:'p', h:'The most valuable step is step seven. Take the draft and delete everything that does not serve the stated question. Load balancers on a context diagram; every queue on a workflow; the logging library on a container view — each one costs the reader attention and returns nothing.'},
 {t:'ba', title:'The removal pass, applied',
  before:{label:'Before — 19 elements, no question', art:
` [Browser] → [CDN] → [LB] → [API GW] → [Auth svc]
                                  ↓
     [Cache] ← [Ordering] → [Catalogue] → [Search]
        ↓           ↓            ↓
     [Redis]    [Postgres]   [Elastic]
                    ↓
     [Backup] ← [Replica] → [Reporting] → [BI tool]
                    ↓
              [Monitoring] [Logging] [Tracing]`},
  after:{label:'After — question: “who owns order data?”', art:
`        ┌──────────────┐
        │   ORDERING   │  owns: orders, baskets
        └──────┬───────┘
               │ writes
               ▼
        ╭──────────────╮
        │  PRIMARY DB  │  orders, order_lines, baskets
        ╰──────┬───────╯
               │ replicates
               ▼
        ╭──────────────╮
        │   REPLICA    │  read-only: reporting, BI
        ╰──────────────╯

  Catalogue and Search read orders via the ordering API.
  No other component writes these tables (ARC-004).`},
  why:'The first diagram contains more information and communicates less. The second answers one question completely — and the sentence underneath it carries more architectural weight than nine of the removed boxes.'},

 {t:'xref', items:[{t:'Diagramming', h:'#/ch/ch44'},{t:'Diagram Quality', h:'#/ch/ch46'},{t:'Architectural Thinking', h:'#/ch/ch3'}]}
]},

{id:'ch46', n:46, title:'Diagram Quality', stage:'baseline',
 sum:'Scope, legibility, consistency, direction, labels, boundaries, level of detail — and keeping them synchronised.',
 why:'A diagram is read far more often than it is drawn, usually by someone under pressure.',
 blocks:[
 {t:'table', filter:false, cols:['Quality','Check','Failure it prevents'],
  rows:[
   ['Scope','One level of abstraction only','Containers and classes in the same picture'],
   ['Legibility','Readable at the size it will actually be viewed','The screenshot in the incident channel'],
   ['Consistency','Same shapes and arrows as every other diagram','A reader learning a new notation each chapter'],
   ['Direction','Flow is consistent — usually top-down or left-right','Arrows that cross and reverse for layout reasons'],
   ['Labels','Every relationship says what it means','“Uses”, on all fourteen arrows'],
   ['Boundaries','Trust, ownership and deployment edges marked','A security review with nothing to review'],
   ['Detail','Enough to answer the question, no more','The diagram that took a day and is wrong by Friday'],
   ['Synchronisation','A trigger exists to update it','The reorganisation that happened two years ago']]},

 {t:'h', h:'Diagram-as-code, used well'},
 {t:'gw', good:['Diagram source lives beside the code it describes','Rendered in review so changes are visible','Generated views (import graphs) marked as generated','Hand-drawn views kept deliberately small'],
  weak:['Generating everything, producing unreadable graphs','Source in a repository nobody has checked out','Layout arguments in pull requests','Treating a generated dependency graph as an architecture diagram']},

 {t:'callout', kind:'note', title:'Generated is not the same as true',
  h:'<p>A generated dependency graph shows what the code does. An architecture diagram shows what it is supposed to do. The interesting information is the <em>difference</em> between them — which is why the most valuable use of generation is drift detection, not documentation.</p>'},

 {t:'cp', items:[
   'Select a diagram type from a question',
   'Draft one through scope, participants, relationships and removal',
   'Apply the quality checks before publishing',
   'Use generation for drift detection rather than for documentation'],
  link:{label:'Now review the architecture', href:'#/ch/ch47'}},

 {t:'xref', items:[{t:'How to Draft a Diagram', h:'#/ch/ch45'},{t:'Documentation as a System', h:'#/ch/ch41'},{t:'Architecture Review', h:'#/ch/ch47'}]}
]}
]},

/* ===================== PART X ===================== */
{id:'p10', num:'X', title:'Architecture Review', stage:'review',
 intro:'Reviewing architecture means comparing what is proposed against requirements, principles, lenses, standards, decisions, evidence and risk — in that order.',
 chapters:[

{id:'ch47', n:47, title:'Reviewing Architecture', stage:'review',
 sum:'Seven things to review against, and the order that makes the review productive.',
 why:'Reviews without a reference produce opinions. Reviews with one produce findings.',
 blocks:[
 {t:'ascii', cap:'Review against', art:
`Requirements     does it satisfy the drivers?
     ↓
Principles       is the shape defensible?
     ↓
Lenses           what concerns have not been examined?
     ↓
Standards        does it comply, and where does it not?
     ↓
Decisions        are significant choices recorded and consistent?
     ↓
Evidence         is the evidence proportionate to the risk?
     ↓
Risks            what could go wrong, and is that acceptable?`},

 {t:'h', h:'Findings, not feelings'},
 {t:'table', filter:false, cols:['Finding type','Means','Required next step'],
  rows:[
   ['Blocking','A driver is not met, or a standard is violated without an exception','Change the design or record an exception with an owner'],
   ['Needs evidence','A claim is load-bearing and unproven','A spike or test, with a date'],
   ['Accepted risk','Known, understood, deliberately taken','Risk register entry with trigger and owner'],
   ['Advisory','Would be better; not load-bearing','Recorded, not blocking'],
   ['Not applicable','A lens was skipped deliberately','Record the trigger that would change this']]},

 {t:'callout', kind:'rule', title:'A reviewer’s obligation',
  h:'<p>A finding must name the concern, the consequence and, where possible, a cheaper alternative. “I would not do it that way” is not a finding. “Confirming the basket in the request path couples user latency to a provider with a 1.4s p99 — moving capture to the worker costs one queue and removes that coupling” is.</p>'},

 {t:'gw', good:['Reviewer knows the drivers before reading the design','Findings typed and tracked','Disagreements resolved by evidence or recorded as risks','Author and reviewer are different people'],
  weak:['Review starts at the technology choices','Findings are a list of preferences','Disagreements resolved by seniority','The architect reviews their own work']},

 {t:'xref', items:[{t:'Review Checklist', h:'#/ch/ch48'},{t:'Architecture Gates', h:'#/ch/ch49'},{t:'Cross-Lens Review', h:'#/ch/ch20'}]}
]},

{id:'ch48', n:48, title:'Architecture Review Checklist', stage:'review',
 sum:'The working checklist, grouped by concern. Every item has the evidence that satisfies it.',
 why:'Checklists are how experienced people avoid forgetting what they already know.',
 blocks:[
 {t:'p', h:'Click any item for the evidence that satisfies it. Use the groups selectively — depth is driven by risk, as always.'},

 {t:'gate', title:'Structure', sim:true, items:[
  {l:'Are the boundaries clear, named and enforced?', ev:'A list of boundaries, what crosses each, and the mechanism that enforces it. “Convention” is not a mechanism.'},
  {l:'Is each responsibility clear enough to describe in one sentence without “and”?', ev:'A responsibility statement per component, and an owner per component.'},
  {l:'Is the coupling reasonable and intentional?', ev:'A dependency graph compared with the intended direction, plus an explanation for each exception.'},
  {l:'Is the complexity proportionate to the drivers?', ev:'Every structural element traced to a ranked driver.'}]},

 {t:'gate', title:'Data', sim:true, items:[
  {l:'Is ownership explicit — exactly one writer per entity?', ev:'The ownership table, plus a check of who actually holds write grants.'},
  {l:'Is the consistency model appropriate per workflow?', ev:'A per-workflow consistency statement, with the window the user may observe.'},
  {l:'Is there a migration path for the model?', ev:'A migration plan that is deployable in reversible steps.'},
  {l:'Is retention and deletion defined, including derived copies?', ev:'A retention policy per entity, and a deletion trace through caches, indexes and exports.'}]},

 {t:'gate', title:'Security', sim:true, items:[
  {l:'Are trust boundaries explicit?', ev:'A diagram marking each boundary and what is validated on crossing.'},
  {l:'Is authorisation enforced in a single, consistent layer?', ev:'A named layer, plus tests asserting refusal at every entry point including background work.'},
  {l:'Does identity flow correctly through asynchronous work?', ev:'An identity propagation design, with service identity distinct from user authority.'},
  {l:'Are abuse cases considered, with controls named preventive or detective?', ev:'A threat model with a control per abuse case and its failure behaviour.'}]},

 {t:'gate', title:'Reliability', sim:true, items:[
  {l:'Are failure modes understood per dependency?', ev:'A table: dependency, slow behaviour, unavailable behaviour, expected system response.'},
  {l:'Is every resource bounded?', ev:'Timeouts, pool sizes, queue limits and retry budgets written down with chosen values.'},
  {l:'Are retryable operations idempotent?', ev:'Key derivation and stored outcomes, demonstrated by a duplicate-request test.'},
  {l:'Has the degraded mode been exercised?', ev:'A test or drill in which the dependency was actually disabled.'}]},

 {t:'gate', title:'Operations', sim:true, items:[
  {l:'Is it deployable — independently, or with deliberate coupling?', ev:'A deployment plan naming what must ship together and why.'},
  {l:'Is it observable enough to answer incident questions?', ev:'Signals mapped to the questions from the last three real incidents.'},
  {l:'Is it recoverable, and has recovery been practised?', ev:'A drilled restore with a recorded duration, and a rehearsed rollback.'},
  {l:'Is the operational surface acceptable to the team that carries it?', ev:'Component count, on-call rota and a statement from the people on it.'}]},

 {t:'gate', title:'UX & DX', sim:true, items:[
  {l:'Are user-visible consequences of the architecture understood?', ev:'Waiting, failing and recovering states described for each critical workflow.'},
  {l:'Is asynchrony expressed honestly in the interface?', ev:'Copy and states that match the mechanism rather than implying completion.'},
  {l:'Can a new engineer find and change the right thing?', ev:'An onboarding walkthrough with measured times for three real tasks.'},
  {l:'Is the correct path also the convenient one?', ev:'Guardrails and scaffolding that make compliance the default.'}]},

 {t:'xref', items:[{t:'Cross-Lens Review', h:'#/ch/ch20'},{t:'Architecture Gates', h:'#/ch/ch49'},{t:'Checklists', h:'#/ch/ch55'}]}
]},

{id:'ch49', n:49, title:'Architecture Gates', stage:'review',
 sum:'Five gates, each with a purpose, entry criteria and an honest failure mode.',
 why:'Gates exist to make “are we ready?” answerable with evidence instead of confidence.',
 blocks:[
 {t:'table', filter:false, cols:['Gate','Passes when','Fails usefully by'],
  rows:[
   ['Baseline','Architecture is established and documented (Ch. 39)','Naming which of the ten criteria is missing'],
   ['Detailed design','Enough detail exists to implement safely (Ch. 44)','Identifying the unanswered design question'],
   ['Change','Architectural impact is understood (Ch. 61)','Showing which areas are affected and unexamined'],
   ['Review','Relevant concerns have been examined through the right lenses','Listing the lens that has not been applied'],
   ['Evolution','The baseline again describes reality (Ch. 63)','Naming the document that no longer matches the system']]},

 {t:'h', h:'The four named gates'},
 {t:'p', h:'The table above lists the gates by stage. What follows states the four that carry the most weight, with the criteria each one actually checks. Tick what your architecture can answer today; the unticked rows are the gate.'},
 {t:'gates4'},

 {t:'callout', kind:'rule', title:'Gate 4 is the one teams skip',
  h:'<p>Initialization, baseline and design gates happen at visible moments, so they get scheduled. The change gate has no moment — it belongs at the start of every piece of work with architectural impact, which is exactly where nobody is looking for a gate. An impact assessment written after the pull request is open is not an assessment; the decision has already been made by the diff.</p>'},

 {t:'callout', kind:'warn', title:'Gates fail when they become schedule events',
  h:'<p>The moment a gate is a date rather than a state, it is passed by assertion. Keep the criteria objective, keep the evidence attached, and make failing a gate a normal, low-drama outcome that produces a next action rather than a negotiation.</p>'},

 {t:'cp', items:[
   'Review against requirements, principles, lenses, standards, decisions, evidence and risk',
   'Produce typed findings with required next steps',
   'Run the five gates and fail them usefully',
   'Keep a gate from degrading into a ceremony'],
  link:{label:'Now evolve the architecture', href:'#/ch/ch50'}},

 {t:'xref', items:[{t:'Baseline Gate', h:'#/ch/ch28'},{t:'Architecture Impact', h:'#/ch/ch50'},{t:'Review Checklist', h:'#/ch/ch48'}]}
]}
]},

/* ===================== PART XI ===================== */
{id:'p11', num:'XI', title:'Architecture Evolution', stage:'evolve',
 intro:'Architecture is an evolving model, not a static diagram. This part is the loop that keeps the baseline honest.',
 chapters:[

{id:'ch50', n:50, title:'Architecture Impact', stage:'evolve',
 sum:'One triage question, asked of every change, with a defined route for each answer.',
 why:'Architecture erodes one reasonable, unexamined change at a time.',
 blocks:[
 {t:'ascii', cap:'The triage', art:
`Change proposed
       ↓
Does it affect architecture?
       │
   ┌───┴────┐
   NO       YES
   │         ↓
   │    Assess impact
   │         ↓
   │      Decision
   │         ↓
   │       Design
   │         ↓
   │   Update baseline
   ↓         ↓
Continue delivery`},

 {t:'h', h:'The impact questions'},
 {t:'p', h:'A change affects the architecture if any answer is yes:'},
 {t:'ul', items:[
  'Does it add, remove or move a <strong>boundary</strong>?',
  'Does it change <strong>who owns</strong> data, a capability or an operational responsibility?',
  'Does it introduce a new <strong>external dependency</strong>, or change an existing one’s role?',
  'Does it change a <strong>quality attribute</strong> that appears in the drivers?',
  'Does it change a <strong>trust boundary</strong> or how identity flows?',
  'Does it add a <strong>runtime component</strong> or deployment unit?',
  'Does it contradict a recorded <strong>decision</strong> or standard?',
  'Would it be <strong>expensive to reverse</strong> once shipped?']},

 {t:'callout', kind:'note', title:'“No” is a real answer and should be common',
  h:'<p>Most changes are not architectural, and routing them through architecture review would destroy the credibility of the process. The value of the triage is that it is fast, explicit, and creates a record when the answer is yes.</p>'},

 {t:'gw', good:['Triage is a checklist item on the change itself','A “yes” produces a scoped assessment, not a full re-architecture','Answers are recorded and occasionally revisited','Engineers can run the triage themselves'],
  weak:['Triage happens only when someone senior notices','Every “yes” becomes a three-week process','Nobody can find what was decided','Only architects are allowed to ask the question']},

 {t:'xref', items:[{t:'Architecture Debt', h:'#/ch/ch51'},{t:'Evolving the Baseline', h:'#/ch/ch52'},{t:'Architecture Gates', h:'#/ch/ch49'}]}
]},

{id:'ch51', n:51, title:'Architecture Debt', stage:'evolve',
 sum:'Six kinds of architectural debt, how to recognise each, and how to decide what to pay down.',
 why:'“Legacy” is a feeling. Architecture debt is a list with owners.',
 blocks:[
 {t:'quote', h:'Architecture debt is not simply “old code”.'},
 {t:'p', h:'Old code that is well bounded, well understood and cheap to change is an asset. New code that has eroded a boundary is debt on the day it merges.'},

 {t:'table', filter:true, caption:'The six kinds',
  cols:['Kind','Looks like','Detect by','Interest it charges'],
  rows:[
   ['Intentional shortcut','A decision deferred deliberately, under time pressure','The ADR that recorded it — if one exists','Grows quietly until the deferral is forgotten'],
   ['Accidental complexity','Structure nobody chose, produced by accumulated convention','Elements that cannot name a driver','Every change costs more than it should'],
   ['Documentation drift','The baseline no longer describes reality','Comparing generated graphs with documented intent','Wrong decisions made from trusted documents'],
   ['Boundary erosion','Cross-boundary calls that were once forbidden','Dependency checks, or their absence','Modules become folders; extraction becomes excavation'],
   ['Coupling creep','Shared tables, shared libraries, shared release trains','Change-impact walkthroughs; coordinated releases','Independent delivery stops being possible'],
   ['Deprecated decisions','A recorded decision whose drivers no longer hold','Reviewing ADRs against current drivers','The team follows reasoning that has expired']]},

 {t:'h', h:'The eleven kinds'},
 {t:'p', h:'Architecture debt is not one thing. Naming the kind matters, because the repayment differs completely: a stale diagram is an afternoon, an eroded boundary is a quarter, and a duplicated architectural approach is a decision nobody wants to make.'},
 {t:'table', filter:true, caption:'Architecture debt taxonomy — and how each one announces itself',
  cols:['Kind','What it is','How you notice'],
  rows:DEBT_KINDS.map(d => [d.k, d.s, d.tell])},

 {t:'h', h:'Deciding what to pay'},
 {t:'ol', items:[
  'Name the debt as a statement about change cost, not as a complaint about code.',
  'Identify which driver it obstructs — if none, it may be acceptable forever.',
  'Estimate the interest: what does it cost per change, per incident, per onboarding?',
  'Estimate the principal: what does correcting it cost, including migration?',
  'Decide — pay, contain, or accept — and record the decision as an ADR.',
  'If accepting, set a trigger that would force a revisit.']},

 {t:'callout', kind:'rule', title:'Containment is a legitimate answer',
  h:'<p>You do not have to fix an eroded boundary to stop it getting worse. Add the guardrail now, freeze the violation set as a documented exception list, and let the debt shrink as code changes. This turns an unbounded problem into a monotonically decreasing one — usually for a fraction of the cost of a migration.</p>'},

 {t:'xref', items:[{t:'Architecture Impact', h:'#/ch/ch50'},{t:'Principles → Standards', h:'#/ch/ch21'},{t:'Documentation as a System', h:'#/ch/ch41'}]}
]},

{id:'ch52', n:52, title:'Evolving the Baseline', stage:'evolve',
 sum:'Walk a real change from proposal to updated baseline, and watch the architecture move.',
 why:'This is the interaction that teaches architecture as a living model rather than a diagram someone drew once.',
 blocks:[
 {t:'ascii', cap:'What happens to the baseline when new work arrives', art:
`New Work
   ↓
Architecture Impact Assessment
   ↓
No meaningful impact?
   ├── YES → Continue. Record that it was assessed.
   └── NO
        ↓
     Assess — which views, which boundaries, which decisions
        ↓
     Decide — options, trade-offs, ADR
        ↓
     Design — to the depth the risk justifies
        ↓
     Update Architecture — before implementation, not after
        ↓
     Implement
        ↓
     Validate — evidence against the claim
        ↓
     Rebaseline — version moves, open questions updated`},

 {t:'callout', kind:'rule', title:'Record the assessments that found nothing',
  h:'<p>The “no meaningful impact” branch is the one that must leave a trace. Without it there is no way to distinguish work that was assessed and cleared from work that nobody looked at — and those two look identical six months later, when something breaks along a boundary everyone assumed had been considered.</p>'},

 {t:'p', h:'The change: <strong>“The system now needs asynchronous report generation.”</strong> Farms want a weekly performance report over a full season of data — a query too heavy for the request path. Step through the assessment and watch the architecture change.'},

 {t:'evolution'},

 {t:'h', h:'Updating the artifacts'},
 {t:'table', filter:false, cols:['Artifact','Update','Trigger that forced it'],
  rows:[
   ['Container diagram','Add the report worker and object store path','A new runtime component'],
   ['Baseline','New component, owner, and the driver it serves','Structure changed'],
   ['ADR','ADR-015 accepted; ADR-004 referenced, not superseded','A new decision was made'],
   ['Ownership table','Report artifacts owned by reporting; source data read-only','New data with a new owner'],
   ['Standards','No change — existing ownership standard already covers it','Checked and recorded as unchanged'],
   ['Risk register','Add: report generation could saturate the replica','New failure mode'],
   ['Runbook','Add: report backlog alert and its first action','New operational surface']]},

 {t:'h', h:'Supersede, deprecate, migrate'},
 {t:'ul', items:[
  '<strong>Superseding an ADR</strong> — write the new one, mark the old <em>Superseded by ADR-0NN</em>, and keep it. History is how a team learns that past decisions were reasonable given what was known.',
  '<strong>Deprecating a pattern</strong> — state what replaces it, whether existing usage must migrate or may remain, and the date the guardrail starts rejecting new usage.',
  '<strong>Recording a migration path</strong> — from state, to state, reversible steps, and who owns each. A migration without an owner is a wish.',
  '<strong>Keeping history</strong> — version the baseline. “Why is it like this?” is usually answered by a version from two years ago.']},

 {t:'cp', items:[
   'Run an impact assessment on a real change',
   'Identify the affected areas by lens',
   'Update every artifact the change touches',
   'Supersede a decision without destroying the record',
   'Explain architecture as an evolving model'],
  link:{label:'See the whole process end to end', href:'#/ch/ch53'}},

 {t:'xref', items:[{t:'Architecture Impact', h:'#/ch/ch50'},{t:'Architecture Baseline', h:'#/ch/ch27'},{t:'Worked Example', h:'#/ch/ch53'}]}
]}
]},

/* ===================== PART XII ===================== */
{id:'p12', num:'XII', title:'Complete Worked Example', stage:'build',
 intro:'One realistic product, carried from problem statement to evolved baseline, with every artifact traceable to the process that produced it.',
 chapters:[

{id:'ch53', n:53, title:'Farm Commerce Platform, End to End', stage:'build',
 sum:'Twenty-four artifacts in the order they were produced, each linked to the chapter that explains how.',
 why:'Comparing an artifact with the process that produced it is how the method becomes yours.',
 blocks:[
 {t:'p', h:'<span class="lead">A regional cooperative of 40 farms sells boxes and single items directly to households, with weekly delivery windows.</span> Everything difficult about the system lives in one gap: the basket is final at Thursday 18:00, the harvest is known at Friday 06:00, and money moves in between.'},

 {t:'farmActors'},

 {t:'h', h:'The twenty-four steps'},

/* ===================== PART — THE ARCHITECTURE MODEL ===================== */
const MODEL_PART_A = {id:'pm', num:'II', title:'The Architecture Model', stage:'understand',
 intro:'L0 to L4 describe how deeply we have described the system. They do not describe every dimension of it. This part separates depth from view, and makes runtime behaviour a first-class part of the architecture rather than a diagram someone drew once.',
 chapters:[

{id:'ch57', n:57, title:'Depth Is Not the Whole Architecture', stage:'understand',
 sum:'L0 to L4 is one axis — structural decomposition. Architecture also has behaviour, patterns, data, deployment, cross-cutting guarantees, decisions and evidence. Those are views, not deeper levels.',
 why:'Teams that treat L0-L4 as the complete model produce architectures that are structurally accurate and behaviourally unknown. They can tell you every module and not one failure path.',
 blocks:[
 {t:'p', h:'<span class="lead">A team finishes L4. Every module is named, every folder is placed, the dependency rule is enforced in CI. Then the first incident arrives and nobody can say what happens when the outbox relay dies halfway through a drain.</span>'},
 {t:'p', h:'Nothing was done wrong. The structural model was complete. The problem is that structure was mistaken for the whole architecture, and the levels invited the mistake: a numbered sequence ending at 4 looks finished at 4.'},

 {t:'callout', kind:'rule', title:'The correction',
  h:'<p><strong>L0-L4 describe architectural depth — structural decomposition. They do not describe every dimension of architecture.</strong> Depth answers <em>how finely have we decomposed this</em>. It never answers <em>how does it behave</em>, <em>what does it guarantee</em>, or <em>how do we know</em>.</p>'},

 {t:'p', h:'The fix is not another level. There is no L5. Adding one would repeat the mistake in a more expensive form: behaviour is not a finer decomposition of structure, and deployment is not a finer decomposition of behaviour. They are <em>different questions about the same system</em>, and different questions belong on a different axis.'},

 {t:'h', h:'The model'},
 {t:'archModel'},

 {t:'p', h:'Read it this way. <strong>Structure</strong> is the only branch with levels, because structure is the only dimension that decomposes. Every other branch is a view: a complete perspective on the whole system, examined at whatever depth the risk justifies.'},

 {t:'ascii', cap:'What each dimension answers', art:
`Structure      "What exists and how is it decomposed?"
Behavior       "How does it behave at runtime?"
Patterns       "What established approach is being used?"
Data           "What data exists, who owns it, how does it move?"
Deployment     "Where does it run?"
Cross-cutting  "What guarantees apply across the system?"
Decisions      "Why was it designed this way?"
Validation     "How do we know it satisfies its intent?"`},

 {t:'h', h:'Why the mistake is so easy to make'},
 {t:'disc', items:[
  {k:'Cause', t:'Levels are numbered and views are not', h:'<p>A numbered ladder implies completion at the top. A set of views implies a judgement about which ones matter, and judgement is harder than counting. Teams reach for the ladder.</p>'},
  {k:'Cause', t:'Structure is the easiest dimension to draw', h:'<p>Boxes and lines are quick, look authoritative, and rarely provoke disagreement. A failure-flow diagram forces someone to admit what happens at 3am, which is a longer meeting.</p>'},
  {k:'Cause', t:'Tools model structure and nothing else', h:'<p>Most diagramming tools have a component shape and no concept of a guarantee, a trust boundary or an idempotency requirement. What the tool cannot hold, the architecture tends not to contain.</p>'},
  {k:'Cause', t:'Structure survives review', h:'<p>A reviewer can confirm a module list without knowing the domain. Confirming that the failure behaviour is right requires understanding what the business can tolerate — so reviews drift toward the part that is easy to check.</p>'}]},

 {t:'gw', good:[
  'Someone can say which views are deliberately shallow, and why',
  'Behaviour is described for the capabilities where it is not obvious',
  'Every cross-cutting guarantee has an owner',
  'The record says what is claimed and what is demonstrated',
  'Depth varies across the system in proportion to risk'],
  weak:[
  'A complete L2 and no failure behaviour anywhere',
  'Every module documented to the same depth regardless of consequence',
  '“The architecture” means the container diagram',
  'Security appears once, as a box labelled Auth',
  'Nobody can name what has been validated versus asserted']},

 {t:'h', h:'What this does not change'},
 {t:'ck', items:[
  '<strong>L0-L4 stay exactly as they are.</strong> They are the right model for structural depth and this part preserves them intact.',
  '<strong>There is no L5.</strong> Behaviour, patterns, deployment, data and decisions do not become another level.',
  '<strong>Nothing becomes mandatory.</strong> Views are dimensions you can examine, not documents you must produce.',
  '<strong>The lifecycle is unchanged.</strong> Discover, frame, shape, decide, design, document, review, evolve — the same loop, now with a clearer answer to “review <em>what</em>”.']},

 {t:'callout', kind:'warn', title:'The failure this prevents',
  h:'<p>An architecture that is structurally complete and behaviourally unknown passes every review it is given, because reviewers are shown structure. It then fails in production along a dimension nobody examined. The most expensive incidents are almost never caused by the wrong module boundary; they are caused by an unexamined failure path, an unowned guarantee, or a decision nobody recorded.</p>'},

 {t:'cp', items:[
  'Explain why depth and views are different axes without reaching for an L5',
  'Name the eight dimensions and the question each answers',
  'Diagnose an architecture that is structurally complete and behaviourally unknown',
  'Decide which views deserve depth in a given system'],
  link:{label:'Now examine each view', href:'#/ch/ch59'}},

 {t:'xref', items:[
  {t:'Architecture Depth, L0 to L4', h:'#/ch/ch58'},
  {t:'The Architecture Views', h:'#/ch/ch59'},
  {t:'Depth × Views', h:'#/ch/ch60'},
  {t:'What Is Architecture?', h:'#/ch/ch1'},

]},

{id:'ch58', n:58, title:'Architecture Depth — L0 to L4', stage:'understand',
 sum:'Five levels of structural decomposition, each answering a different set of questions. L4 is implementation design, not a mandatory artifact for every part of the system.',
 why:'Depth is the axis teams already understand. Stated precisely, it stops being a documentation quota and becomes a decision about where detail earns its cost.',
 blocks:[
 {t:'p', h:'<span class="lead">Each level answers questions the level above cannot. Descending is not a formality; it is a commitment of effort that should be justified by uncertainty, complexity, consequence or risk.</span>'},

 {t:'depthModel'},

 {t:'h', h:'Progressive elaboration'},
 {t:'p', h:'The single most damaging misreading of a depth model is that every part of the system must reach the bottom. It must not. Some capabilities deserve a sequence diagram, a data model and a failure flow. Others deserve a sentence. The difference is not seniority or taste — it is <strong>risk-weighted</strong>, and the weights can be named.'},

 {t:'table', caption:'What justifies more depth — walk this before writing L3 or L4', filter:false,
  cols:['Force','Ask','More depth when','Less depth when'],
  rows:DEPTH_FORCES.map(f => [f.k, f.q, f.more, f.less])},

 {t:'callout', kind:'rule', title:'The depth rule',
  h:'<p>Document to the depth at which <em>the next person would otherwise make an expensive mistake</em>. Above that line you are under-describing. Below it you are producing artifacts that will go stale faster than they are read — which is worse than nothing, because stale documents are trusted.</p>'},

 {t:'gw', good:[
  'Depth varies visibly across the system',
  'The deepest documentation sits on the riskiest capability',
  'Someone can say why a given module has no L4',
  'L3 exists everywhere behaviour is non-obvious',
  'Each artifact names who it is for'],
  weak:[
  'Every module documented identically',
  'L4 required by policy, produced by obligation, read by nobody',
  'Depth decided by who had time',
  'The riskiest workflow has the thinnest description',
  'Documentation completeness measured by count']},

 {t:'twocol', left:{k:'Too little', t:'Under-described', h:'<p>A billing workflow with a container diagram and nothing else. Every engineer who touches it rediscovers the consistency rules, and one of them gets it wrong in a way that takes three weeks to find.</p>'},
  right:{k:'Too much', t:'Over-described', h:'<p>A settings page with a sequence diagram, a component diagram and an ADR. Six months later the page has changed four times and all three artifacts are wrong, which now makes them dangerous rather than merely useless.</p>'}},

 {t:'callout', kind:'why', title:'Why L4 is optional and L3 usually is not',
  h:'<p>L4 describes implementation, and the implementation is present in the code where it can be read directly. L3 describes behaviour that spans components — sequences, consistency, failure branches — and that is <em>nowhere</em> readable in full. It exists only in the heads of the people who built it. That is why skipping L3 is the expensive omission and skipping L4 usually is not.</p>'},

 {t:'cp', items:[

{id:'ch59', n:59, title:'The Architecture Views', stage:'understand',
 sum:'Twelve views of one system. Each asks a different set of questions, is answered by different artifacts, and is validated differently.',
 why:'Same architecture, different dimension. A team that can name the views can name what it has not examined — which is the only way to be honest about what a baseline covers.',
 blocks:[
 {t:'p', h:'<span class="lead">A view is not a document type and not a diagram. It is a standing set of questions about the whole system. The artifacts exist to answer them; when the questions change, the artifacts should.</span>'},

 {t:'viewsExp'},

 {t:'h', h:'Views and lenses are not the same thing'},
 {t:'p', h:'They are closely related and constantly confused. A <strong>view</strong> is a dimension of the architecture itself — it exists whether or not anyone examines it. A <strong>lens</strong> is a perspective a reviewer adopts in order to examine one. Security is both: there is a security view of the system, and there is a security lens someone looks through to interrogate it.'},

 {t:'table', caption:'Same word, different job', filter:false,
  cols:['','View','Lens'],
  rows:[
   ['What it is','A dimension of the architecture','A disciplined way of examining it'],
   ['Exists when','Always — described or not','Only when someone adopts it'],
   ['Produces','Artifacts: diagrams, contracts, models','Findings, questions, evidence requests'],
   ['Answers','“What is true of the system here?”','“What would go wrong if nobody asked?”'],
   ['Fails by','Being left blank','Being owned by only one person'],
   ['Related chapter','This chapter','Part VI, The Architecture Lens Model']]},

 {t:'callout', kind:'rule', title:'Cross-cutting means every view, not one section',
  h:'<p>Security, reliability, performance, scalability, observability and operations are <em>cross-cutting</em>: each one has something to say about structure, behaviour, data and deployment. A security section at the end of a document is a confession that security was considered last. The test is simple — if the security content is confined to one chapter, it was not cross-cutting.</p>'},

 {t:'h', h:'Choosing which views to invest in'},
 {t:'ol', items:[
  '<strong>Context, structure and decisions are never optional.</strong> A system without these is not described at all.',
  '<strong>Behaviour is required wherever the runtime is not obvious</strong> — which is anywhere that has more than one participant, asynchrony, or money.',
  '<strong>Data is required wherever state has an owner</strong>, which is everywhere, though the depth varies enormously.',
  '<strong>Cross-cutting views are ranked by the drivers.</strong> If availability is the top driver, reliability gets depth; if the product is internal and low-traffic, performance may honestly be a paragraph.',
  '<strong>Validation is required in proportion to consequence.</strong> Cheap to be wrong means an argument suffices; expensive to be wrong means evidence.',
  '<strong>Write down which views you deliberately left shallow.</strong> An undescribed view and a deliberately shallow one look identical in a document and are completely different in a review.']},

 {t:'gw', good:[
  'Each view names who owns it',
  'Shallow views are marked shallow, with a reason',
  'Cross-cutting concerns appear in several views, not one section',
  'The views with depth match the ranked drivers',
  'Validation states what is proven and what is asserted'],
  weak:[
  'Views nobody has looked at, indistinguishable from views with nothing to say',
  'Security as an appendix',
  'Performance targets with no measurement point',
  'Deployment described without where state lives',
  'Decisions recorded after the fact to match the code']},

 {t:'cp', items:[

{id:'ch60', n:60, title:'Depth × Views', stage:'understand',
 sum:'The two axes intersect. “What does security look like at L1?” is a better question than either axis can ask alone.',
 why:'Most architecture gaps live in a cell nobody thought to visit — data at L3, operations at L2, validation anywhere.',
 blocks:[
 {t:'p', h:'<span class="lead">Depth and views are independent. Crossing them turns a vague instruction — “think about security” — into a specific, answerable question at a specific altitude.</span>'},

 {t:'ascii', cap:'The two axes', art:
`                         ARCHITECTURE VIEWS
             Context  Structure  Behavior  Data  Security  ...
                │         │         │       │       │
   L0 Context   ·         ·         ·       ·       ·
   L1 Container ·         ·         ·       ·       ·
   L2 Component ·         ·         ·       ·       ·
   L3 Design    ·         ·         ·       ·       ·
   L4 Impl.     ·         ·         ·       ·       ·

   Each cell is a question somebody should be able to answer —
   or deliberately decline to.`},

 {t:'dvMatrix'},

 {t:'h', h:'Using the matrix'},
 {t:'disc', items:[
  {k:'Use', t:'As a review agenda', h:'<p>Walk the cells that matter for the change in front of you. A reviewer who asks “what does data ownership look like at L3 for this?” gets a precise answer or a precise silence. Both are useful; vague approval is not.</p>'},
  {k:'Use', t:'As a gap finder', h:'<p>Fill the matrix for your own system and look at the empty cells. Some are empty because nothing needed saying. Others are empty because nobody asked. Only you can tell them apart, and only if you look.</p>'},
  {k:'Use', t:'As a scoping tool', h:'<p>Before a design session, mark the four or five cells the session is actually about. It prevents the meeting where structure is re-litigated because the failure behaviour was uncomfortable.</p>'},
  {k:'Use', t:'As an onboarding path', h:'<p>A new engineer reads the top-left cells first — context and structure at L0 and L1 — and descends only into the capability they are about to change. Most onboarding documents have no such path, which is why they are read once.</p>'}]},

 {t:'callout', kind:'warn', title:'Not a documentation quota',
  h:'<p>Sixty cells is not sixty documents. Most systems have real content in perhaps fifteen of them, a sentence in another twenty, and a defensible blank in the rest. The matrix is a <em>question generator</em>. Treating it as a checklist to complete is how architecture becomes theatre.</p>'},

 {t:'cp', items:[

  'Find gaps by looking for cells nobody visited',

{id:'ch61', n:61, title:'Runtime & Behavioural Architecture', stage:'design',
 sum:'Knowing a module exists is not knowing how the system behaves when that module participates in a real scenario.',
 why:'This is the view most often missing and most expensive to be missing. Structure tells you where a change goes; behaviour tells you what breaks at 3am.',
 blocks:[
 {t:'p', h:'<span class="lead">A component diagram can tell you that work, policy, gateway and notify exist. It cannot tell you that the outbox relay delivers at-least-once, that the notification consumer is idempotent on eventId, or that a version conflict returns 409 and the client refetches. Those are behavioural facts, and they are architecture.</span>'},

 {t:'callout', kind:'rule', title:'The behavioural test',
  h:'<p>Pick any capability. Ask: <em>what happens, step by step, when it is exercised — and what happens at each step when it fails?</em> If the team can answer the first half and not the second, the behavioural view does not exist yet, regardless of how complete the structure is.</p>'},

 {t:'h', h:'The questions this view asks'},
 {t:'threecol', cols:[
  {k:'Ask', t:'Trigger and entry', h:'<ul class="bl"><li>What triggers the behaviour?</li><li>Which component receives it first?</li><li>Which boundaries are crossed, in what order?</li></ul>'},
  {k:'Ask', t:'Participation', h:'<ul class="bl"><li>Which components participate?</li><li>Which data changes?</li><li>Which events are emitted?</li><li>Which external systems are called?</li></ul>'},
  {k:'Ask', t:'Timing', h:'<ul class="bl"><li>What is synchronous?</li><li>What is asynchronous?</li><li>What does the user wait for?</li></ul>'},
  {k:'Ask', t:'Success', tone:'green', h:'<ul class="bl"><li>What is true afterwards?</li><li>What invariants hold?</li><li>What has the user been told?</li></ul>'},
  {k:'Ask', t:'Failure', tone:'red', h:'<ul class="bl"><li>What happens on failure at each step?</li><li>What is retried?</li><li>What is idempotent?</li><li>What if a dependency is unavailable?</li></ul>'},
  {k:'Ask', t:'Edge cases', tone:'amber', h:'<ul class="bl"><li>What if the request is duplicated?</li><li>What if processing partially succeeds?</li><li>What if two people do it at once?</li></ul>'}]},

 {t:'h', h:'Worked example — assigning a task in Squid'},
 {t:'p', h:'The same example is used from here to the end of this part. It is deliberately ordinary: a member assigns a task to a colleague. There is no distributed transaction, no exotic technology, and nine places where it can go wrong.'},

 {t:'taskSeq'},

 {t:'p', h:'Read the failure column rather than the happy path. Each branch is a decision somebody made: 404 rather than 403 for a wrong-tenant read, so the endpoint cannot be used to enumerate; 409 rather than last-write-wins, so no edit is silently discarded; the outbox rather than a direct publish, so a crash between write and publish cannot lose the event.'},

 {t:'h', h:'Failure behaviour, stated as outcomes'},
 {t:'taskFsim'},

 {t:'gw', good:[
  'Every step names the boundary it crosses',
  'Every step has a failure branch or an explicit “cannot fail”',
  'Synchronous and asynchronous are visually distinct',
  'Idempotency is stated where delivery is at-least-once',
  'The sequence has been executed, not only drawn'],
  weak:[
  'A happy path with an error box at the end',
  '“Errors are logged” as a failure strategy',
  'Retry described without idempotency',
  'Asynchronous steps drawn as if the user waits for them',
  'Partial success unaddressed because it is uncomfortable']},

 {t:'h', h:'Artifacts that carry this view'},
 {t:'table', caption:'Pick the one that answers the question being asked', filter:false,
  cols:['Artifact','Answers','Use when'],

   ['Event-flow diagram','What is published and who reacts','Asynchronous fan-out exists'],
   ['Data-flow diagram','Where data originates, is copied and leaves','Privacy, deletion or replication is in question'],
   ['Failure-flow diagram','What the system does when a dependency is degraded or gone','There is a designed degradation worth describing']]},

 {t:'callout', kind:'why', title:'Why this view is skipped',
  h:'<p>Because it is the only view that forces specific commitments. A box labelled “Notification Service” commits nobody to anything. “At-least-once delivery, idempotent on eventId, dead-letters after five attempts, backlog alerts at 500” commits somebody to building all four, and to watching the fourth forever. Teams skip behaviour because behaviour is where the work becomes real.</p>'},

const MODEL_PART_B = {id:'pp', num:'III', title:'Architecture in Practice', stage:'build',
 intro:'Patterns chosen honestly, modules that state what they guarantee, artifacts selected by the question they answer, and a repeatable loop for every capability. This part turns the model into something a team can run on a Tuesday.',
 chapters:[

{id:'ch62', n:62, title:'Architectural Patterns in Practice', stage:'build',
 sum:'A pattern is a named trade-off. Every entry here must be usable as an argument against itself.',
 why:'Pattern cargo-culting is the most common way an architecture acquires cost with no corresponding benefit — and it always arrives with good intentions.',
 blocks:[
 {t:'p', h:'<span class="lead">Boxes and arrows show what a system is shaped like. Patterns explain <em>why it has that shape</em> — and, more usefully, what that shape costs.</span>'},

 {t:'callout', kind:'rule', title:'How to record a pattern',
  h:'<p>Pattern → intent → problem it solves → context where it fits → structure → runtime behaviour → benefits → <strong>costs</strong> → risks → <strong>when not to use it</strong> → example → validation. A pattern entry with no cost section and no exclusion is marketing, and it will be cited in a design review as though it were analysis.</p>'},

 {t:'patternExp'},

 {t:'h', h:'Preventing cargo cult'},
 {t:'disc', items:[
  {k:'Test', t:'Name the problem before the pattern', h:'<p>If the sentence starts with the pattern — “we should use CQRS” — stop and write the problem first. A problem statement that does not survive being written down was a preference.</p>'},
  {k:'Test', t:'State the cost in this system', h:'<p>Not the textbook cost. <em>Ours.</em> “Two models to keep consistent” is generic. “Two models, maintained by four engineers who also own billing, with no projection rebuild yet written” is a decision input.</p>'},
  {k:'Test', t:'Name what you are rejecting', h:'<p>Every pattern selection is a rejection of at least one alternative. If no alternative was considered, no decision was made — a default was accepted.</p>'},
  {k:'Test', t:'Name the abandonment trigger', h:'<p>Under what future condition would this pattern be wrong? A pattern with no abandonment trigger becomes permanent by default, which is how systems end up with two event buses.</p>'},
  {k:'Test', t:'Check the prerequisite', h:'<p>Several patterns have hard prerequisites. Retry requires idempotency. A circuit breaker requires a timeout. At-least-once delivery requires idempotent consumers. Adopting the headline without the prerequisite produces the failure the pattern was meant to prevent, with extra machinery.</p>'}]},

 {t:'callout', kind:'warn', title:'The three most expensive mis-adoptions',
  h:'<ul class="bl"><li><strong>CQRS without a measurement.</strong> Adopted because reads “will get slow”, paid for in two models forever. Measure first; an index usually wins.</li><li><strong>Microservices without an operations capability.</strong> The boundaries are the benefit; the network is the cost. A modular monolith gives the first without the second.</li><li><strong>Retry without idempotency.</strong> Turns a transient failure into a duplicate write, which is a data problem rather than an availability one, and far harder to see.</li></ul>'},

 {t:'gw', good:[
  'Each pattern names the problem it was chosen for',
  'Costs are stated in this system’s terms',
  'At least one pattern has been rejected in writing',
  'Prerequisites are satisfied before the pattern is adopted',
  'Each pattern has an abandonment trigger'],
  weak:[
  'Patterns named in a diagram legend and nowhere else',
  'Benefits listed, costs absent',
  'A pattern adopted because another team uses it',
  'Three retry implementations with three behaviours',
  'Nobody can say when the pattern would be wrong']},

 {t:'cp', items:[
  'Record a pattern with intent, cost, exclusion and validation',
  'Reject a pattern in writing, with the reason',
  'Identify a missing prerequisite before adoption',
  'Name the abandonment trigger for a pattern in your system'],
  link:{label:'Now make a module state what it guarantees', href:'#/ch/ch63'}},

 {t:'xref', items:[
  {t:'Patterns & Reference Architectures', h:'#/ch/ch23'},
  {t:'Principles → Standards', h:'#/ch/ch21'},
  {t:'Decision Framework', h:'#/ch/ch30'},
  {t:'The Module Architecture Contract', h:'#/ch/ch63'}]}
]},

{id:'ch63', n:63, title:'The Module Architecture Contract', stage:'build',
 sum:'Twenty-one clauses that turn “this module exists” into “this is what you may rely on”.',
 why:'A module is not architecturally complete because folders and files have been defined. Folders answer where; a contract answers what, why, how, and what if it fails.',
 blocks:[
 {t:'p', h:'<span class="lead">Ask most teams to describe a module and you get a directory listing and a sentence. Ask what happens when its dependency is unavailable, who owns its data, which events it publishes and what it guarantees under concurrency, and the room goes quiet. The contract is the set of questions that fills that silence.</span>'},

 {t:'ascii', cap:'What a real architectural description of a module answers', art:
`WHAT?                 It exists, and owns this
WHY?                  It exists for this reason
HOW?                  It is structured this way
HOW DOES IT INTERACT? Through this interface, these events
WHAT PATTERN?         This approach, at this cost
WHAT DATA?            These collections, this lifecycle
WHAT IF IT FAILS?     These outcomes, not these exceptions
WHAT GUARANTEES?      This, under these conditions
HOW DO WE KNOW?       This evidence, dated`},

 {t:'moduleContract'},

 {t:'h', h:'How to use it'},
 {t:'ol', items:[
  '<strong>Not every module needs all twenty-one clauses.</strong> A module with no state skips owned data; a module with no events skips events. Skipping is fine; leaving a clause blank because nobody asked is not.',
  '<strong>Write it when the module is created, not when it is finished.</strong> Half the clauses are decisions, and decisions made in writing are cheaper than decisions discovered in review.',
  '<strong>Keep it beside the code.</strong> A contract in a wiki drifts; a contract in the module directory is edited by the same pull request that breaks it.',
  '<strong>Review it when the boundary changes.</strong> A new dependency, a new event, or a new writer to owned data are all contract amendments, not implementation details.',
  '<strong>Treat the evidence clause as load-bearing.</strong> Without it, the other twenty clauses describe intentions.']},

 {t:'twocol',
  left:{k:'Not a contract', t:'A README', h:'<p>Tells you how to run the module, what the scripts do, and where the tests are. Necessary. It says nothing about what other modules may rely on, so it cannot be violated.</p>'},
  right:{k:'A contract', t:'What others may depend on', h:'<p>States the interface, the guarantees, the failure behaviour and the evidence. It can be violated, which is precisely what makes it worth writing — a promise nobody can break is not a promise.</p>'}},

 {t:'callout', kind:'why', title:'Why twenty-one clauses and not five',
  h:'<p>Because the omitted clauses are always the same ones — failure behaviour, dependency direction, owned data lifecycle, observability and evidence — and they are exactly the clauses that cost money when they are missing. A shorter template would be adopted faster and would omit the expensive parts, which is the outcome it was meant to prevent.</p>'},

 {t:'cp', items:[
  'Write a module contract that someone could violate',
  'Distinguish a contract from a README',
  'Identify which clauses a given module can legitimately skip',
  'Use the evidence clause to separate what is true from what is intended'],
  link:{label:'Choose the right artifact for a question', href:'#/ch/ch64'}},

 {t:'xref', items:[
  {t:'Designing Components', h:'#/ch/ch34'},
  {t:'API & Contract Design', h:'#/ch/ch35'},
  {t:'Architecture Document Types', h:'#/ch/ch42'},
  {t:'Architecture Completeness', h:'#/ch/ch66'}]}
]},

{id:'ch64', n:64, title:'The Architecture Artifact Map', stage:'baseline',
 sum:'Start from the question, not from the artifact. Fifteen questions, fifteen answers, and what each artifact must not try to be.',
 why:'Teams produce artifacts because a template listed them. Producing them because someone has a question is the difference between documentation and architecture.',
 blocks:[
 {t:'p', h:'<span class="lead">Every artifact in this handbook exists to answer a specific question. When the question is not being asked, the artifact is overhead — maintained, trusted, and slowly becoming wrong.</span>'},

 {t:'artifactMap'},

 {t:'h', h:'Reading the map backwards'},
 {t:'p', h:'The map is also a diagnostic. Take the artifacts your team actually maintains and find the question each one answers. Any artifact whose question nobody is asking is a candidate for deletion. Any question on the map that nothing in your system answers is a gap — and the gap is usually behaviour, data ownership or evidence.'},

 {t:'callout', kind:'rule', title:'One artifact, one question',
  h:'<p>An artifact that answers three questions answers none of them well and goes stale three times as fast. When a diagram starts accumulating annotations about deployment, security and failure, it is telling you that three views want their own artifact.</p>'},

 {t:'gw', good:[
  'Every maintained artifact has a question and an audience',
  'Artifacts are deleted when their question stops being asked',
  'The riskiest question has the most carefully maintained answer',
  'Each artifact states what it is not'],
  weak:[
  'A documentation folder nobody has opened in a year',
  'One diagram carrying structure, deployment and failure',
  'Artifacts produced because a template required them',
  'Questions answered only in the heads of two people']},

 {t:'cp', items:[
  'Select an artifact by the question being asked',
  'Delete an artifact whose question is dead',
  'Find gaps by looking for unanswered questions',
  'Explain what each artifact must refuse to become'],
  link:{label:'Run the loop for one capability', href:'#/ch/ch65'}},

 {t:'xref', items:[
  {t:'Architecture Document Types', h:'#/ch/ch42'},
  {t:'Diagramming', h:'#/ch/ch44'},
  {t:'Documentation as a System', h:'#/ch/ch41'},
  {t:'The Architecture Views', h:'#/ch/ch59'}]}
]},

{id:'ch65', n:65, title:'The Capability Architecture Loop', stage:'design',
 sum:'Twelve stations, run per capability, at whatever depth the capability deserves.',
 why:'Architecture fails at the seams between capabilities. A repeatable loop means the same questions get asked every time, including by whoever is least likely to think of them.',
 blocks:[
 {t:'p', h:'<span class="lead">This is the reusable mental model of the handbook. It is not a process to be scheduled; it is a sequence of questions that takes ten minutes for a small capability and two sessions for a consequential one.</span>'},

 {t:'capLoop'},

 {t:'h', h:'Running it well'},
 {t:'disc', items:[
  {k:'Rule', t:'Never skip boundary, failure, cross-cutting or validation', h:'<p>The other eight stations can be answered in a sentence when the capability is simple. These four are where the expensive omissions live, and a sentence each is still an answer.</p>'},
  {k:'Rule', t:'Scale the output, not the station list', h:'<p>A small capability produces one paragraph covering all twelve. A large one produces a sequence diagram, a data model and an ADR. The stations do not change; the artifacts do.</p>'},
  {k:'Rule', t:'“Nothing to add” is a valid answer, silence is not', h:'<p>Walking the cross-cutting station and recording “no security implications beyond workspace membership” takes ten seconds and is worth exactly as much as the sentence it saves in the incident review.</p>'},
  {k:'Rule', t:'Decide the evidence before the implementation', h:'<p>Validation named at station eleven, before any code exists, is a test somebody writes. Validation named afterwards is a test somebody intends to write.</p>'}]},

 {t:'callout', kind:'warn', title:'The failure mode of any loop',
  h:'<p>Ritual. Twelve stations walked mechanically, each with a sentence that means nothing, produces a document that satisfies a process and protects nobody. The signal that this is happening: the failure-behaviour station says “handled gracefully” more than once.</p>'},

 {t:'cp', items:[
  'Run the loop for one capability at proportionate depth',
  'Identify the four stations that must never be skipped',
  'Record “nothing to add” honestly rather than leaving silence',
  'Spot a loop that has degenerated into ritual'],
  link:{label:'Know when it is complete', href:'#/ch/ch66'}},

 {t:'xref', items:[
  {t:'From Architecture to System Design', h:'#/ch/ch33'},
  {t:'Runtime & Behavioural Architecture', h:'#/ch/ch61'},
  {t:'Architecture Impact', h:'#/ch/ch50'},
  {t:'Evidence, Experiments & Spikes', h:'#/ch/ch32'}]}
]},

{id:'ch66', n:66, title:'Architecture Completeness', stage:'review',
 sum:'An element is not architecturally complete because it appears on a diagram. Fourteen questions decide.',
 why:'“Is the architecture done?” is unanswerable. “Can this element answer these fourteen questions, at the depth its risk justifies?” is answerable in a meeting.',
 blocks:[
 {t:'p', h:'<span class="lead">Completeness is not the number of documents. It is whether a significant element can answer the questions someone will need answered before they can safely change it — or before they are paged about it.</span>'},

 {t:'callout', kind:'rule', title:'The completeness standard',
  h:'<p><strong>A significant architectural element is not considered architecturally complete merely because it appears on an architecture diagram.</strong> It is complete when it can answer structure, responsibility, boundary, dependencies, behaviour, interaction, patterns, data, failure, security, reliability, operations, decisions and validation — each to the depth its risk justifies, and no further.</p>'},

 {t:'completeness'},

 {t:'h', h:'Significant, and what it excludes'},
 {t:'p', h:'This standard applies to <em>significant</em> elements: those whose failure, change or misuse has consequences beyond their own boundary. A utility that formats dates is not significant. A module that owns data, crosses a trust boundary, integrates with an external system, or sits on a critical path is. Applying the standard to everything is how a useful bar becomes bureaucracy, and how teams learn to ignore it.'},

 {t:'threecol', cols:[
  {k:'Apply', t:'Always significant', tone:'blue', h:'<ul class="bl"><li>Owns persistent data</li><li>Crosses a trust boundary</li><li>Integrates with an external system</li><li>Sits on a critical path</li><li>Has a failure mode that affects others</li></ul>'},
  {k:'Judge', t:'Sometimes', tone:'amber', h:'<ul class="bl"><li>Internal module with no state</li><li>Component with one caller</li><li>Job that can be re-run freely</li><li>Read-only projection</li></ul>'},
  {k:'Skip', t:'Not significant', tone:'green', h:'<ul class="bl"><li>Pure functions and formatters</li><li>UI components with no rules</li><li>Configuration wrappers</li><li>Anything cheap to delete and rewrite</li></ul>'}]},

 {t:'callout', kind:'why', title:'Why “complete” must be relative to risk',
  h:'<p>An absolute standard produces one of two outcomes: everything is incomplete forever, or the bar is lowered until everything passes. A risk-relative standard produces a third — a small number of elements documented deeply, most documented briefly, and an explicit, reviewable statement of which is which.</p>'},

 {t:'cp', items:[
  'Judge whether an element is architecturally complete',
  'Decide whether an element is significant enough to hold to the standard',
  'Explain why completeness is relative to risk',
  'Use the fourteen questions as a review agenda'],
  link:{label:'And the process that produces it', href:'#/ch/ch67'}},

 {t:'xref', items:[
  {t:'Architecture Review Checklist', h:'#/ch/ch48'},
  {t:'Architecture Baseline Gate', h:'#/ch/ch28'},
  {t:'The Module Architecture Contract', h:'#/ch/ch63'},
  {t:'Depth × Views', h:'#/ch/ch60'}]}
]},

{id:'ch67', n:67, title:'The Architecture Process', stage:'understand',
 sum:'Seventeen activities, and the nine-station loop that stops them being a waterfall.',
 why:'Written as a sequence, architecture looks like a phase. Written as a loop, it looks like what it is — a model that is established early, corrected by evidence, and evolved on purpose.',
 blocks:[
 {t:'p', h:'<span class="lead">The activities below are real and each one produces something. The order is a reasonable default, not a gate sequence. Most systems revisit half of them in any given quarter.</span>'},

 {t:'ascii', cap:'The activities — a default order, not a waterfall', art:
` 1 Establish context              10 Record architectural decisions
 2 Establish structure            11 Review architecture
 3 Identify architectural drivers 12 Validate with evidence
 4 Define boundaries              13 Baseline architecture
 5 Select / define patterns       14 Perform detailed system design
 6 Define runtime behavior        15 Implement
 7 Define data                    16 Validate
 8 Define deployment              17 Evolve architecture
 9 Define cross-cutting concerns`},

 {t:'callout', kind:'warn', title:'Read this before using the list',
  h:'<p>This is <strong>not</strong> a rigid waterfall. Architecture is progressively elaborated: you establish enough context to propose structure, enough structure to find the real decisions, and enough evidence to know whether the structure survives. Teams that run the list top to bottom once, then stop, have performed architecture rather than done it.</p>'},

 {t:'h', h:'The loop underneath'},
 {t:'procLoop'},

 {t:'p', h:'The loop and the list describe the same work. The list is what you produce; the loop is how the work actually moves — and the two stations teams most often have no path for are <strong>Observe</strong> and <strong>Evolve</strong>. Without a feedback path from production into the architecture, the baseline is a snapshot of what was believed at the start, and the drift is invisible until an incident measures it.'},

 {t:'gw', good:[
  'Architecture work happens at the depth the uncertainty justifies',
  'Production behaviour feeds back into the model',
  'The baseline version moves when the system changes',
  'Evidence corrects earlier decisions in writing',
  'Open questions are visible in the baseline'],
  weak:[
  'A single architecture phase before delivery',
  'A baseline that has not changed in a year of change',
  'Incidents that never reach the architecture record',
  'Decisions superseded in practice and not in writing',
  'The same depth of analysis applied to everything']},

 {t:'cp', items:[
  'Run the activities as a loop rather than a sequence',
  'Name the feedback path from production into the architecture',
  'Explain progressive elaboration to someone who wants a phase',
  'Identify a missing Observe or Evolve station in your own team'],
  link:{label:'Back to the lifecycle', href:'#/ch/ch2'}},

 {t:'xref', items:[
  {t:'The Architecture Lifecycle', h:'#/ch/ch2'},
  {t:'Architecture Gates', h:'#/ch/ch49'},
  {t:'Evolving the Baseline', h:'#/ch/ch52'},
  {t:'Architecture Debt', h:'#/ch/ch51'},
  {t:'The Capability Architecture Loop', h:'#/ch/ch65'}]}
]}
]};

 {k:'Drivers', st:'ok', h:'<p><strong>Satisfied by:</strong> three to seven ranked drivers, measured where possible, each traceable to a decision.</p><p><strong>Weak version:</strong> a list of adjectives, all marked high priority.</p>'},
