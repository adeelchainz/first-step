/* ---------------- Diagram engine ---------------- */
const DG = {CW:198, RH:112, NW:150, NH:52, PX:26, PY:24};

function nodeXY(n){
  return {x: DG.PX + n.col * DG.CW + DG.CW / 2, y: DG.PY + n.row * DG.RH + DG.NH / 2};
}
function nodeShape(n, p){
  const w = DG.NW, h = DG.NH, x = p.x - w/2, y = p.y - h/2;
  if(n.kind === 'human') return '<ellipse class="nd-shape" cx="'+p.x+'" cy="'+p.y+'" rx="'+(w/2)+'" ry="'+(h/2)+'"/>';
  if(n.kind === 'store'){
    const ry = 9;
    return '<path class="nd-shape" d="M'+x+','+(y+ry)+' A'+(w/2)+','+ry+' 0 0 1 '+(x+w)+','+(y+ry)+
           ' L'+(x+w)+','+(y+h-ry)+' A'+(w/2)+','+ry+' 0 0 1 '+x+','+(y+h-ry)+' Z"/>'+
           '<path class="nd-shape" style="fill:none" d="M'+x+','+(y+ry)+' A'+(w/2)+','+ry+' 0 0 0 '+(x+w)+','+(y+ry)+'"/>';
  }
  return '<rect class="nd-shape" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="8"/>';
}
function edgePath(a, b){
  const half = DG.NH / 2;
  if(a.row === b.row){
    const dir = b.col > a.col ? 1 : -1;
    const sx = a.p.x + dir * (DG.NW/2 + 3), ex = b.p.x - dir * (DG.NW/2 + 9);
    return {d:'M'+sx+','+a.p.y+' L'+ex+','+b.p.y, mx:(sx+ex)/2, my:a.p.y - 9};
  }
  const down = b.row > a.row;
  const sy = a.p.y + (down ? half : -half), ey = b.p.y + (down ? -half - 8 : half + 8);
  const my = (sy + ey) / 2;
  const d = 'M'+a.p.x+','+sy+' L'+a.p.x+','+my+' L'+b.p.x+','+my+' L'+b.p.x+','+ey;
  return {d:d, mx:(a.p.x + b.p.x)/2, my:my - 6};
}
function diagramSVG(spec, id){
  const nodes = spec.nodes, edges = spec.edges || [], groups = spec.groups || [];
  const cols = Math.max.apply(null, nodes.map(n => n.col)) + 1;
  const rows = Math.max.apply(null, nodes.map(n => n.row)) + 1;
  const W = DG.PX * 2 + cols * DG.CW, H = DG.PY * 2 + rows * DG.RH;
  const map = {}; nodes.forEach(n => { map[n.id] = Object.assign({}, n, {p: nodeXY(n)}); });
  let g = '';
  groups.forEach(gr => {
    const x = DG.PX + gr.c0 * DG.CW + 10, y = DG.PY + gr.r0 * DG.RH - 14;
    const w = (gr.c1 - gr.c0 + 1) * DG.CW - 20, h = (gr.r1 - gr.r0 + 1) * DG.RH - 8;
    g += '<rect class="bnd" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10"/>'+
         '<text class="bnd-l" x="'+(x+10)+'" y="'+(y-5)+'">'+esc(gr.label)+'</text>';
  });
  edges.forEach((e, i) => {
    const a = map[e.f], b = map[e.t]; if(!a || !b) return;
    const pp = edgePath(a, b);
    g += '<path class="eg'+(e.async ? ' async' : '')+'" data-e="'+i+'" data-f="'+e.f+'" data-t="'+e.t+
         '" d="'+pp.d+'" marker-end="url(#ah-'+id+')"/>';
    if(e.l) g += '<text class="eg-l" data-el="'+i+'" x="'+pp.mx+'" y="'+pp.my+'" text-anchor="middle">'+esc(e.l)+'</text>';
  });
  nodes.forEach(n => {
    const p = map[n.id].p;
    g += '<g class="nd k-'+(n.kind === 'ext' ? 'ext' : n.kind)+'" data-n="'+esc(n.id)+'" tabindex="0" role="button" aria-label="'+esc(n.label)+'">'+
         nodeShape(n, p) +
         '<text class="nd-l" x="'+p.x+'" y="'+(p.y + (n.sub ? -2 : 4))+'" text-anchor="middle">'+esc(n.label)+'</text>'+
         (n.sub ? '<text class="nd-s" x="'+p.x+'" y="'+(p.y+13)+'" text-anchor="middle">'+esc(n.sub)+'</text>' : '')+
         '</g>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Architecture diagram">'+
    '<defs><marker id="ah-'+id+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
    '<path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--line-3)"/></marker></defs>'+
    '<g data-zoom>'+g+'</g></svg>';
}
function wireDiagram(root, spec){
  const svg = $('svg', root), stage = $('.dgm-stage', root), info = $('.dgm-info', root);
  const zoomG = $('[data-zoom]', svg);
  let scale = 1, tx = 0, ty = 0, drag = null;
  const apply = () => zoomG.setAttribute('transform', 'translate('+tx+','+ty+') scale('+scale+')');
  const zi = $('[data-zin]', root), zo = $('[data-zout]', root), zr = $('[data-zreset]', root);
  if(zi) zi.onclick = () => { scale = Math.min(2.4, scale * 1.25); apply(); };
  if(zo) zo.onclick = () => { scale = Math.max(.5, scale / 1.25); apply(); };
  if(zr) zr.onclick = () => { scale = 1; tx = ty = 0; apply(); };
  stage.addEventListener('pointerdown', e => {
    if(e.target.closest('.nd')) return;
    drag = {x:e.clientX - tx, y:e.clientY - ty}; stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => { if(!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); });
  stage.addEventListener('pointerup', () => { drag = null; });
  stage.addEventListener('pointercancel', () => { drag = null; });

  let sel = null;
  function select(nid){
    sel = (sel === nid) ? null : nid;
    $$('.nd', svg).forEach(g => {
      const on = g.dataset.n === sel;
      g.classList.toggle('on', on);
      g.classList.toggle('dim', !!sel && !on && !isLinked(g.dataset.n, sel));
    });
    $$('.eg', svg).forEach(p => {
      const hot = sel && (p.dataset.f === sel || p.dataset.t === sel);
      p.classList.toggle('hot', !!hot);
      p.classList.toggle('dim', !!sel && !hot);
    });
    if(!info) return;
    if(!sel){ info.classList.remove('show'); info.innerHTML = ''; return; }
    const n = spec.nodes.filter(x => x.id === sel)[0];
    const deps = (spec.edges || []).filter(e => e.f === sel).map(e => {
      const t = spec.nodes.filter(x => x.id === e.t)[0]; return t ? t.label : e.t;
    });
    info.innerHTML =
      '<div class="k">'+esc({human:'Actor', ext:'External system', store:'Data store', 'new':'Proposed', risk:'Risk'}[n.kind] || 'System')+'</div>'+
      '<h4>'+esc(n.label)+'</h4>'+
      (n.resp ? '<p style="margin:6px 0 0;color:var(--ink-2)">'+esc(n.resp)+'</p>' : '')+
      '<dl>'+
        (n.owner ? '<div><dt>Owner</dt><dd>'+esc(n.owner)+'</dd></div>' : '')+
        (deps.length ? '<div><dt>Depends on</dt><dd>'+deps.map(esc).join(' · ')+'</dd></div>' : '')+
        (n.lenses ? '<div><dt>Relevant lenses</dt><dd>'+esc(n.lenses)+'</dd></div>' : '')+
      '</dl>'+
      (n.why ? '<div class="callout why" style="margin:14px 0 0"><div class="callout-h">Why this exists</div><p>'+esc(n.why)+'</p></div>' : '');
    info.classList.add('show');
  }
  function isLinked(a, b){
    return (spec.edges || []).some(e => (e.f === a && e.t === b) || (e.f === b && e.t === a));
  }
  $$('.nd', svg).forEach(g => {
    g.addEventListener('click', () => select(g.dataset.n));
    g.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); select(g.dataset.n); } });
  });
}

      '<th data-sort="'+i+'" title="Sort by '+esc(c)+'">'+esc(c)+' <span class="ar">↕</span></th>').join('') +
      '</tr></thead><tbody>' +
      rows.map(r => '<tr>' + r.map((c, i) =>
        '<td'+(i === 0 ? '' : '')+'>'+c+'</td>').join('') + '</tr>').join('') +
      '</tbody></table>';
  if(opts.caption) h += '<div style="padding:9px 14px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--ink-4)">'+esc(opts.caption)+'</div>';
  h += '</div>';
  onMount(() => {
    const root = document.getElementById(id); if(!root) return;
    const tb = $('tbody', root);
    const f = $('[data-tf]', root);
    if(f) f.addEventListener('input', () => {
      const q = f.value.toLowerCase();
      $$('tr', tb).forEach(tr => { tr.style.display = tr.textContent.toLowerCase().indexOf(q) > -1 ? '' : 'none'; });
    });
    let dir = {};
    $$('th[data-sort]', root).forEach(th => th.addEventListener('click', () => {
      const i = +th.dataset.sort; dir[i] = !dir[i];
      const rs = $$('tr', tb).sort((a, b) => {
        const x = a.children[i].textContent.trim(), y = b.children[i].textContent.trim();
        return (dir[i] ? 1 : -1) * x.localeCompare(y, undefined, {numeric:true});
      });
      rs.forEach(r => tb.appendChild(r));
      $$('th .ar', root).forEach(s => s.textContent = '↕');
      $('.ar', th).textContent = dir[i] ? '↑' : '↓';
    }));
  });
  return h;
}

     '<div class="seq-g"><div class="seq-l">' + b.steps.map((s, i) =>

     '<span class="step-n" data-num>1 / ' + b.steps.length + '</span></div></div>';
   onMount(() => {
     const root = document.getElementById(id); if(!root) return;
     let i = 0, timer = null;
     function show(){
       const s = b.steps[i];
       $$('.seq-step', root).forEach((el, j) => {
         el.classList.toggle('on', j === i); el.classList.toggle('past', j < i);
       });
       $('[data-num]', root).textContent = (i + 1) + ' / ' + b.steps.length;

         '<div class="exp-k">What happens</div><p style="margin:0;font-size:14.4px;color:var(--ink-2)">' + esc(s.what) + '</p>' +

         '<div class="exp-row v"><div class="exp-k">Boundary crossed</div><p>' + esc(s.bnd) + '</p></div>';
     }
     function stop(){ clearInterval(timer); timer = null; $('[data-play]', root).classList.remove('on'); $('[data-play]', root).textContent = '▶ Play'; }
     $$('.seq-step', root).forEach(el => el.onclick = () => { stop(); i = +el.dataset.s; show(); });
     $('[data-back]', root).onclick = () => { stop(); i = Math.max(0, i - 1); show(); };
     $('[data-fwd]', root).onclick = () => { stop(); i = Math.min(b.steps.length - 1, i + 1); show(); };

   scenarios: [
    {label:'Normal', states:{}, title:'Everything healthy',

    {label:'Database unavailable', tone:'red', states:{db:'down', gw:'deg'}, title:'MongoDB unavailable',
     body:'<p>The transaction fails and rolls back. No task change, therefore no outbox row, therefore no event. The system is exactly consistent with having done nothing — which is the reason the outbox exists. The user gets a retryable 500 and the action is safe to repeat.</p>'},
    {label:'External API timeout', tone:'amber', states:{mail:'slow', con:'deg'}, title:'Mail provider slow',
     body:'<p>Nothing the user did is affected — the write committed long before. The consumer retries with backoff up to fifteen minutes, then dead-letters. The backlog signal rises; the runbook says to check the provider status page before replaying.</p>'},
    {label:'Duplicate request', tone:'amber', states:{act:'deg'}, title:'The same command arrives twice',
     body:'<p>The client-generated ULID makes the second attempt a no-op returning the first result. Downstream, the consumer keys on eventId + channel, so even a redelivered event produces one notification. Retry without this would be duplication with extra steps.</p>'},
    {label:'Event delivery failure', tone:'red', states:{rel:'down', con:'down'}, title:'The relay dies mid-drain',
     body:'<p>Rows already marked delivered are not resent; rows in flight are. Consumers absorb the redelivery because they are idempotent. The outbox grows and alerts at 500 rows. Nothing is lost, and the cost of that guarantee is a component somebody watches forever.</p>'},
    {label:'Authorization failure', tone:'red', states:{pol:'deg'}, title:'The actor may not assign',

    href:'#/ch/ch7', text:[p.intent, p.good, p.bad, p.trade, p.apply, p.validate].join(' '), kind:'principle',

    href:'#/ch/ch59', text:[v.q].concat(v.asks, v.artifacts, [v.squid, v.fails]).join(' '), kind:'view',
    also:['Depth × Views (Ch. ' + chN('ch60') + ')','Completeness (Ch. ' + chN('ch66') + ')']}));
  PATTERNS.forEach(p => INDEX.push({t:p.name, m:'Pattern · Chapter ' + chN('ch62'),
    href:'#/ch/ch62', text:[p.intent, p.problem, p.context, p.structure, p.runtime, p.avoid, p.example]
      .concat(p.benefits, p.costs, p.risks).join(' '), kind:'pattern',
    also:['Patterns & Reference Architectures (Ch. 34)','Decision Framework (Ch. 41)']}));
  MODULE_CONTRACT.forEach(c => INDEX.push({t:'Contract — ' + c.k, m:'Module contract clause ' + c.n + ' · Chapter ' + chN('ch63'),
    href:'#/ch/ch63', text:c.ask + ' ' + c.sq + ' ' + c.bad, kind:'contract'}));
  ARTIFACT_MAP.forEach(r => INDEX.push({t:r.a, m:'Artifact · Chapter ' + chN('ch64'),
    href:'#/ch/ch64', text:r.q + ' ' + r.shows + ' ' + r.ex + ' ' + r.not, kind:'artifact'}));
  DEPTH_MODEL.forEach(l => INDEX.push({t:l.n + ' — ' + l.t, m:'Architecture depth · Chapter ' + chN('ch58'),
    href:'#/ch/ch58', text:l.answers.concat(l.artifacts, [l.squid, l.enough, l.risk]).join(' '), kind:'depth'}));
  return INDEX;
}
function search(q){
  const idx = buildIndex(), terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length) return [];
  return idx.map(e => {
    const title = e.t.toLowerCase(), body = e.text.toLowerCase();
    let score = 0;
    terms.forEach(t => {
      if(title === t) score += 60;
      else if(title.indexOf(t) === 0) score += 34;
      else if(title.indexOf(t) > -1) score += 22;
      if(body.indexOf(t) > -1) score += 6;
      if(e.m.toLowerCase().indexOf(t) > -1) score += 4;
    });
    if(score && e.kind !== 'chapter') score += 3;
    let ctx = '';
    const first = body.indexOf(terms[0]);
    if(first > -1){
      const s = Math.max(0, first - 55);
      ctx = (s ? '…' : '') + e.text.slice(s, first + 110).trim() + '…';
      ctx = esc(ctx).replace(new RegExp('(' + terms[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
    }
    return {e:e, score:score, ctx:ctx};
  }).filter(r => r.score > 0).sort((a, b) => b.score - a.score).slice(0, 14);
}
function renderSearch(q){
  const res = search(q), box = $('#srchRes');
  if(!q){ box.innerHTML = '<div style="padding:14px 12px;font-size:13px;color:var(--ink-4)">' +
    'Search chapters, principles, lenses, templates, checklists and terminology.</div>'; return; }
  if(!res.length){ box.innerHTML = '<div style="padding:14px 12px;font-size:13px;color:var(--ink-4)">No matches for “' + esc(q) + '”.</div>'; return; }
  box.innerHTML = res.map((r, i) => '<a class="sr' + (i === 0 ? ' on' : '') + '" href="' + r.e.href + '" data-r="' + i + '">' +
    '<div class="sr-t">' + esc(r.e.t) + '</div><div class="sr-m">' + esc(r.e.m) + '</div>' +
    (r.ctx ? '<div class="sr-x">' + r.ctx + '</div>' : '') +
    (r.e.also ? '<div class="sr-x" style="color:var(--ink-4)">Also appears in: ' + r.e.also.map(esc).join(' · ') + '</div>' : '') +
    '</a>').join('');
  $$('.sr', box).forEach(a => a.onclick = () => closeModals());
}

    renderRail(null);
    $('#crumb').textContent = 'The model · Understand → Frame → Reason → Shape → Decide → Baseline → Design → Review → Build → Evolve';
    document.title = 'Architecture & System Design Handbook';
  }
  INITS.forEach(fn => { try{ fn(); }catch(e){ /* one broken component must not break the page */ } });
  INITS = [];
  $('#side').classList.remove('open');
  window.scrollTo(0, 0);
  $('#main').focus({preventScroll:true});
  syncProgress();
}

/* ---------------- Theme ---------------- */
function initTheme(){
  const saved = store('ash:theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  $('#themeBtn').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const dark = cur === 'dark' || (cur !== 'light' && prefersDark);
    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    store('ash:theme', next);
    toast(next === 'dark' ? 'Dark theme' : 'Light theme');
  };
}

/* ---------------- Boot ---------------- */
function boot(){
  initTheme();
  window.addEventListener('hashchange', render);
  $('#searchBtn').onclick = () => openModal('search');
  $('#mapBtn').onclick = () => openModal('map');
  $('#mapClose').onclick = closeModals;
  $('#scrim').onclick = closeModals;
  $('#navToggle').onclick = function(){
    const open = $('#side').classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  $('#srchInput').addEventListener('input', e => renderSearch(e.target.value.trim()));
  $('#srchInput').addEventListener('keydown', e => {
    const items = $$('.sr');
    const cur = items.map(x => x.classList.contains('on')).indexOf(true);
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      if(!items.length) return;
      const next = e.key === 'ArrowDown' ? Math.min(items.length - 1, cur + 1) : Math.max(0, cur - 1);
      items.forEach(x => x.classList.remove('on'));
      items[next].classList.add('on');
      items[next].scrollIntoView({block:'nearest'});
    } else if(e.key === 'Enter'){
      const target = items[cur > -1 ? cur : 0];
      if(target){ location.hash = target.getAttribute('href'); closeModals(); }
    }
  });
  document.addEventListener('keydown', e => {
    const typing = /input|textarea|select/i.test((e.target.tagName || ''));
    if(e.key === 'Escape'){ closeModals(); return; }
    if(typing) return;
    if(e.key === '/'){ e.preventDefault(); openModal('search'); }
    else if(e.key === 'm'){ openModal('map'); }
    else if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
      const c = currentChapter(); if(!c) return;
      const i = CHAPTERS.indexOf(chapterById(c.id));
      const t = e.key === 'ArrowLeft' ? CHAPTERS[i - 1] : CHAPTERS[i + 1];
      if(t) location.hash = '#/ch/' + t.id;
    }
  });
  render();
  syncProgress();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
