  <div class="map-h">
    <span class="map-t">Architecture Map</span>
    <span style="font-size:12.5px;color:var(--ink-3)">Every node navigates — this is the handbook's “you are here”.</span>
    <button class="icon-btn" id="mapClose" style="margin-left:auto" aria-label="Close map">✕</button>
  </div>
  <div class="map-b" id="mapBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";

/* ================================================================
   CORE MODELS
   Content is data. Chapters assemble components; they never
   hand-code presentation.
   ================================================================ */

const LIFECYCLE = [
  {id:'understand', label:'Understand', target:'ch4',  blurb:'Problem • Product • Requirements • Context'},
  {id:'frame',      label:'Frame',      target:'ch5',  blurb:'Drivers • Constraints • Assumptions'},
  {id:'reason',     label:'Reason',     target:'ch7',  blurb:'Principles • Lenses • Risks • Trade-offs'},
  {id:'shape',      label:'Shape',      target:'ch26', blurb:'Boundaries • Components • Relationships'},
  {id:'decide',     label:'Decide',     target:'ch30', blurb:'Options • Evidence • ADRs • Consequences'},
  {id:'baseline',   label:'Baseline',   target:'ch27', blurb:'Architecture + documentation + decisions'},
  {id:'design',     label:'Design',     target:'ch33', blurb:'APIs • Data • Workflows • Runtime • Security'},
  {id:'review',     label:'Review',     target:'ch47', blurb:'Requirements • Principles • Lenses • Risk'},
  {id:'build',      label:'Build',      target:'ch22', blurb:'Implementation + architectural guardrails'},
  {id:'evolve',     label:'Evolve',     target:'ch50', blurb:'Impact → Decision → Design → Update'}
];

/* Concerns shared by the lens matrix --------------------------------- */
const CONCERNS = [
  {id:'boundary',  label:'Boundary clarity'},
  {id:'identity',  label:'Identity & trust flow'},
  {id:'failure',   label:'Failure handling'},
  {id:'obs',       label:'Observability'},
  {id:'deps',      label:'Dependency structure'},
  {id:'owner',     label:'Data ownership'},
  {id:'latency',   label:'Latency budget'},
  {id:'change',    label:'Cost of change'},
  {id:'recovery',  label:'Recovery path'},
  {id:'visible',   label:'User-visible behaviour'}
];

const LENSES = [
  {id:'engineering', name:'Engineering', ch:'ch10', ang:-90,
   focus:'Structure, cohesion, coupling, dependency direction, maintainability, testability, changeability, complexity.',
   questions:[
     'Where are the boundaries, and what does each side own?',
     'Which direction do dependencies point, and is that direction stable?',
     'What has to change when a typical requirement changes?',
     'Can this be tested without standing up the whole system?',
     'What is accidental complexity here versus essential complexity?'],
   evidence:['Module/dependency graph','Change-impact walkthrough for two real requirements','Test pyramid and what each layer can be run against'],
   covers:['boundary','failure','obs','deps','change']},

  {id:'product', name:'Product & Business', ch:'ch11', ang:-50,
   focus:'Business capabilities, product evolution, domain boundaries, critical workflows, business risk, value versus complexity.',
   questions:[
     'Which business capabilities does each part of the system serve?',
     'Which workflows must never break, and what is merely inconvenient?',
     'Where is the product most likely to change in the next four quarters?',
     'Does the structure match how the business talks about itself?',
     'Is the complexity we are buying proportional to the value?'],
   evidence:['Capability map','Roadmap overlaid on architecture boundaries','Revenue/risk annotation on critical workflows'],
   covers:['boundary','change','visible']},

  {id:'ux', name:'UX', ch:'ch12', ang:-10,
   focus:'User workflows, latency, state, failure experiences, interruptions, accessibility, feedback, recovery.',
   questions:[
     'What does the user see while the system is waiting?',
     'What does failure look like from the user side, and can they recover?',
     'Where does user state live, and what happens if the session is interrupted?',
     'Is an asynchronous step honest about being asynchronous?',
     'Does the architecture make an accessible experience possible?'],
   evidence:['Annotated workflow with latency budget per step','Failure-state wireframes','Interruption/resume walkthrough'],
   covers:['latency','failure','recovery','visible']},

  {id:'dx', name:'Developer Experience', ch:'ch13', ang:30,
   focus:'Discoverability, local development, contracts, tooling, debugging, consistency, safe change.',
   questions:[
     'Can a new engineer find where a capability lives within an hour?',
     'Can the system be run locally, or a useful slice of it?',
     'Are contracts explicit enough to work against without reading implementations?',
     'When something breaks, how long does it take to find out where?',
     'Is the safe way to make a change also the easy way?'],
   evidence:['Onboarding walkthrough with timings','Local-dev setup script','Contract/schema artifacts and where they live'],
   covers:['boundary','obs','deps','change']},

  {id:'security', name:'Security', ch:'ch14', ang:70,
   focus:'Identity, authentication, authorization, trust boundaries, secrets, tenant isolation, data protection, threats, abuse cases, auditability.',
   questions:[
     'Where are the trust boundaries, and what is validated as data crosses them?',
     'Where is authorization enforced — and is it enforced only there?',
     'How does identity flow through asynchronous and background work?',
     'What happens if one tenant is compromised?',
     'What would an attacker do with this component, and would we know?'],
   evidence:['Trust-boundary diagram','Threat model with abuse cases','Authorization matrix','Audit log sample for a sensitive action'],
   covers:['identity','boundary','owner','obs']},

  {id:'data', name:'Data', ch:'ch15', ang:110,
   focus:'Ownership, source of truth, lifecycle, consistency, integrity, replication, migration, retention, privacy.',
   questions:[
     'Who owns each entity, and who is merely a reader?',
     'Where is the source of truth, and what are copies?',
     'What consistency does each workflow actually require?',
     'How does this data get created, corrected, archived and deleted?',
     'What is the migration path when the model changes?'],
   evidence:['Entity-ownership table','Consistency requirement per workflow','Retention and deletion policy','Migration plan'],
   covers:['owner','boundary','recovery','change']},

  {id:'reliability', name:'Reliability', ch:'ch16', ang:150,
   focus:'Failure modes, dependency failure, partial failure, retries, timeouts, idempotency, recovery, degradation.',
   questions:[
     'What happens when each dependency is slow, then unavailable?',
     'Which operations are safe to retry, and what makes them safe?',
     'What does partial success look like, and who reconciles it?',
     'What degrades, and what must never degrade?',
     'How does the system come back after a total outage?'],
   evidence:['Failure-mode table per dependency','Timeout and retry budget','Idempotency key design','Recovery runbook'],
   covers:['failure','recovery','latency','obs']},

  {id:'performance', name:'Performance', ch:'ch17', ang:190,
   focus:'Latency, throughput, concurrency, resource consumption, hot paths, growth, capacity, bottlenecks.',
   questions:[
     'What is the latency budget for the critical path, per hop?',
     'What is the expected and peak throughput, and where does it break?',
     'Which resources are contended, and what serialises?',
     'What grows fastest, and what breaks first when it does?',
     'What have we measured, and what have we assumed?'],
   evidence:['Latency budget per hop','Load test results at expected and 3× volume','Capacity model with growth assumptions'],
   covers:['latency','deps','failure','change']},

  {id:'operations', name:'Operations', ch:'ch18', ang:230,
   focus:'Deployment, configuration, observability, incident response, recovery, rollback, capacity, operational complexity.',
   questions:[
     'How is this deployed, and can it be deployed independently?',
     'How would we know it is unhealthy before a user tells us?',
     'What does rollback mean here, especially with data changes?',
     'Who is paged, and what do they do first?',
     'How much operational surface are we adding, and who carries it?'],
   evidence:['Deployment topology','Signals: logs, metrics, traces per boundary','Rollback procedure','On-call runbook'],
   covers:['obs','recovery','failure','deps']},

  /* conditional lenses */
  {id:'cost', name:'Cost', ch:'ch19', conditional:true,
   focus:'Unit economics, fixed versus variable cost, cost of idle capacity, cost of operational effort.',
   questions:[
     'What does one unit of work cost, and how does that scale?',
     'Which costs are fixed commitments and which track usage?',
     'What is the cost of the operational effort, not just the infrastructure?',
     'Which cheap decision today becomes an expensive commitment later?'],
   evidence:['Unit cost model','Cost per environment','Cost of a 10× traffic scenario'],
   covers:['change','deps']},

  {id:'compliance', name:'Compliance', ch:'ch19', conditional:true,
   focus:'Regulatory obligations, residency, auditability, evidence, retention, separation of duties.',
   questions:[
     'Which regulation applies, to which data, in which jurisdiction?',
     'What evidence must the system be able to produce, and for how long?',
     'Where must data physically reside?',
     'Which actions require separation of duties or approval?'],
   evidence:['Obligation-to-control mapping','Data residency map','Audit evidence sample'],
   covers:['owner','identity','obs']},

  {id:'accessibility', name:'Accessibility', ch:'ch19', conditional:true,
   focus:'Whether the architecture permits an accessible experience — timing, state, rendering strategy, error semantics.',
   questions:[
     'Do architectural timeouts conflict with users who need more time?',
     'Does the rendering strategy preserve semantics and focus?',
     'Are errors expressed as data the interface can render accessibly?',
     'Do asynchronous updates announce themselves?'],
   evidence:['Error contract with machine-readable codes','Timing/timeout review','Rendering strategy decision'],
   covers:['visible','failure','latency']}
];

/* ================================================================
   PRINCIPLE CATALOG
   ================================================================ */
const P_FAMILIES = [
  {id:'structure',    label:'Structure'},
  {id:'dependencies', label:'Dependencies'},
  {id:'change',       label:'Change'},
  {id:'reliability',  label:'Reliability'},
  {id:'data',         label:'Data'},
  {id:'security',     label:'Security'},
  {id:'operations',   label:'Operations'}
];

const PRINCIPLES = [
/* --- structure --- */
{id:'soc', f:'structure', name:'Separation of Concerns',
 intent:'Keep unrelated responsibilities in places that can change independently.',
 good:'Transport, business rules and persistence live in separate units; the business rule can be exercised by an HTTP request, a scheduled job and an event without being rewritten.',
 bad:'A controller parses the request, applies pricing rules, writes SQL and calls the payment provider — so every reason to change lands in one file.',
 trade:'More units, more indirection, more names to learn. Separation that does not follow a real axis of change is pure overhead.',
 fail:'Layer theatre: three folders that must all be edited for every change, which proves the split was not along a real seam.',
 apply:'Split where two responsibilities have different reasons to change, different owners, or different rates of change.',
 validate:'Name a likely change and count the units it touches. If a routine change touches every layer, the seam is wrong.',
 rel:['cohesion','modularity','dep-dir']},

{id:'modularity', f:'structure', name:'Modularity',
 intent:'Organise the system into units with meaningful, defensible boundaries.',
 good:'An "ordering" module owns its data, exposes an explicit interface, and can be reasoned about without reading billing.',
 bad:'Twelve modules that all import each other — a distributed monolith with extra ceremony.',
 trade:'Boundaries cost coordination. Cross-boundary changes are slower than in-module changes, by design.',
 fail:'Creating a module for everything. Modularity is not folder count.',
 apply:'Create a boundary where separation improves changeability, ownership, reasoning or isolation — and you can say which.',
 validate:'Each module should have one sentence describing what it owns, and one team accountable for it.',
 rel:['soc','coupling','cohesion']},

{id:'cohesion', f:'structure', name:'Cohesion',
 intent:'Things that change together should live together.',
 good:'Pricing rules, discount policy and the price calculation test sit in one place because they change in the same pull request.',
 bad:'A "utils" package holding date maths, currency rounding and PDF rendering, changing for unrelated reasons every week.',
 trade:'High cohesion sometimes means duplicating a little code rather than sharing across a boundary.',
 fail:'Grouping by technical type (all controllers, all mappers) when the real cohesion is by capability.',
 apply:'Group by what changes together, not by what looks alike.',
 validate:'Look at the last 20 commits. Do they cluster inside units, or spray across them?',
 rel:['modularity','coupling','localize']},

{id:'coupling', f:'structure', name:'Loose Coupling',
 intent:'Reduce what one unit must know about another in order to work.',
 good:'A module depends on a narrow interface it defines, and does not know which adapter satisfies it.',
 bad:'Two services sharing a database table, so a column rename breaks a system nobody remembered.',
 trade:'Indirection has a cost in readability and debugging. Every abstraction is a bet about what will vary.',
 fail:'Loose coupling in the code, tight coupling in the data or deployment — the coupling just moved.',
 apply:'Couple to contracts, not to internals. Prefer explicit, narrow, versioned interfaces.',
 validate:'Ask what would break if the other side changed its internals. If the answer is "a lot", the coupling is real.',
 rel:['cohesion','dep-inv','surface']},

{id:'encap', f:'structure', name:'Encapsulation',
 intent:'A unit protects its own invariants; nobody else can put it in an invalid state.',
 good:'An Order enforces its own state transitions; no caller can move it from Cancelled to Shipped.',
 bad:'An anaemic record with public fields mutated by five services, none of which enforce the rules.',
 trade:'Enforcement inside a unit can make bulk operations and reporting less convenient.',
 fail:'Getters and setters for every field — syntactic encapsulation with no invariant behind it.',
 apply:'Put the rule where the state lives. Expose intent-shaped operations, not field mutation.',
 validate:'Try to write code that produces an invalid state from outside. If you can, the invariant is not protected.',
 rel:['info-hiding','boundaries','integrity']},

{id:'info-hiding', f:'structure', name:'Information Hiding',
 intent:'Hide decisions that are likely to change behind an interface that is not.',
 good:'Callers ask for "the customer’s available credit" and never learn whether it is computed, cached or fetched.',
 bad:'The API returns the database row shape, so the storage model becomes the public contract.',
 trade:'Hidden information is harder to inspect. Observability must be added deliberately.',
 fail:'Hiding stable things (a data structure everyone needs) while exposing volatile things (storage details).',
 apply:'Identify what is most likely to change, and put the interface there.',
 validate:'List what a consumer must know to use the unit. Anything beyond the contract is leakage.',
 rel:['encap','coupling','api']},

{id:'boundaries', f:'structure', name:'Explicit Boundaries',
 intent:'Make the edges of the system and its parts visible, named and enforced.',
 good:'A request crossing into the domain is validated, authorised and translated into domain terms at a named boundary.',
 bad:'Boundaries exist only in the architect’s head, so every new engineer erodes them by accident.',
 trade:'Explicit boundaries require translation code and ceremony at the edges.',
 fail:'Drawing boundaries in diagrams that nothing in the codebase enforces.',
 apply:'Name each boundary, state what crosses it, and enforce the rule mechanically where you can.',
 validate:'A dependency check in CI that fails when the boundary is crossed the wrong way.',
 rel:['trust','dep-dir','guardrail']},

{id:'srp', f:'structure', name:'Single Responsibility',
 intent:'A unit should have one reason to change.',
 good:'The invoice renderer changes when the invoice layout changes, and for no other reason.',
 bad:'A "service" class that authenticates, calculates tax, writes to the database and emails the customer.',
 trade:'Taken literally it produces a fog of tiny classes; responsibility is judged at the level that matters to the reader.',
 fail:'Confusing "one responsibility" with "one function".',
 apply:'Ask: who asks for this to change? If two different stakeholders do, consider splitting.',
 validate:'Describe the unit in one sentence without using "and".',
 rel:['cohesion','soc']},

/* --- dependencies --- */
{id:'dep-dir', f:'dependencies', name:'Dependency Direction',
 intent:'Dependencies should point towards stability and towards the things that define meaning.',
 good:'Infrastructure depends on the domain. The domain depends on nothing but itself.',
 bad:'The domain imports the web framework and the database driver, so it cannot be reused or tested alone.',
 trade:'Inverting direction requires interfaces and wiring that would otherwise be unnecessary.',
 fail:'A correct diagram and an import graph that says the opposite.',
 apply:'Decide the direction deliberately per boundary, then enforce it.',
 validate:'Generate the import graph. Compare it with the intended direction.',
 rel:['dep-inv','stable-dep','boundaries']},

{id:'dep-inv', f:'dependencies', name:'Dependency Inversion',
 intent:'Depend on abstractions owned by the consumer, not on concrete providers.',
 good:'The application defines a PaymentGateway interface; the Stripe adapter implements it.',
 bad:'The application calls the vendor SDK directly in twelve places, so the vendor is now an architectural decision you cannot revisit.',
 trade:'An interface with exactly one implementation forever is a cost with no return.',
 fail:'Wrapping a vendor in an interface that simply mirrors the vendor’s own shape — the leak survives.',
 apply:'Invert where the provider is likely to change, be swapped, or needs to be faked in tests.',
 validate:'Can you replace the provider with a test double without touching business code?',
 rel:['dep-dir','coupling','reversible']},

{id:'stable-dep', f:'dependencies', name:'Stable Dependencies',
 intent:'Depend in the direction of things that change less often than you do.',
 good:'Many modules depend on a small, slow-moving domain model.',
 bad:'A core module depends on a fast-moving experimental one, so every experiment destabilises the core.',
 trade:'Stability can become ossification; a stable component is expensive to change by definition.',
 fail:'Treating "shared" as a synonym for "stable". Shared code that changes weekly is a broadcast of instability.',
 apply:'Before adding a dependency, ask how often the target changes compared with you.',
 validate:'Track change frequency per module; look for many-dependents plus high churn.',
 rel:['dep-dir','surface','debt']},

{id:'surface', f:'dependencies', name:'Minimise Dependency Surface',
 intent:'Depend on as little of another thing as possible.',
 good:'A consumer uses three fields of a published event and ignores the rest.',
 bad:'A consumer reads the producer’s whole database schema, making every internal change a breaking change.',
 trade:'Narrow surfaces sometimes mean more round trips or more explicit mapping.',
 fail:'"Just expose the model" — convenient today, an unremovable contract tomorrow.',
 apply:'Publish the smallest contract that satisfies the need; keep internals internal.',
 validate:'Count the fields and operations actually used versus exposed.',
 rel:['coupling','info-hiding','api']},

{id:'composition', f:'dependencies', name:'Composition',
 intent:'Build capability by assembling small pieces with explicit wiring.',
 good:'A workflow composes validation, pricing and persistence steps that each stand alone.',
 bad:'A deep inheritance hierarchy where behaviour is assembled by accident of ancestry.',
 trade:'Composition moves complexity into wiring, which must itself stay readable.',
 fail:'Composition so fine-grained that no single place describes what happens.',
 apply:'Prefer assembling behaviour over specialising it; keep the assembly point explicit.',
 validate:'Can a reader see the whole workflow in one place, even if the steps live elsewhere?',
 rel:['modularity','dep-inv']},

/* --- change --- */
{id:'localize', f:'change', name:'Localise Change',
 intent:'A typical change should touch one place.',
 good:'Adding a delivery slot type changes the scheduling module and nothing else.',
 bad:'Adding a field requires edits in seven repositories and a coordinated release.',
 trade:'Localising one kind of change often spreads another; you are choosing which change is cheap.',
 fail:'Optimising for a change that never comes while the real change stays expensive.',
 apply:'Identify the two or three changes you expect most, and make those cheap.',
 validate:'Trace a recent real change through the codebase and count the touch points.',
 rel:['cohesion','accidental','simplicity']},

{id:'accidental', f:'change', name:'Minimise Accidental Coupling',
 intent:'Do not create dependencies that the problem did not require.',
 good:'Two capabilities that merely both need "a customer" keep their own view of a customer.',
 bad:'A shared "core" library that everything imports, so every change is a global change.',
 trade:'Avoiding shared code can mean similar logic in two places; that is sometimes correct.',
 fail:'DRY applied to code that merely looks alike rather than code that must agree.',
 apply:'Share a thing only when the two users must change together, by definition.',
 validate:'If one consumer needs a change to the shared thing and the other must not, coupling was accidental.',
 rel:['coupling','localize','cohesion']},

{id:'simplicity', f:'change', name:'Prefer Simplicity',
 intent:'Choose the simplest structure that satisfies the drivers you can defend.',
 good:'A single well-structured deployable with clear internal boundaries, because there is no driver for more.',
 bad:'Eleven services, a message bus and a service mesh for a team of four and 300 daily users.',
 trade:'Simple now can mean a migration later; that migration is often cheaper than the complexity it avoids.',
 fail:'Confusing "simple" with "easy" — a pile of scripts is easy and not simple.',
 apply:'Make complexity earn its place by naming the driver it serves.',
 validate:'For each structural element, name the driver. Elements without one are candidates for removal.',
 rel:['speculative','reversible','drivers']},

{id:'speculative', f:'change', name:'Avoid Speculative Complexity',
 intent:'Do not build for requirements nobody has asked for and nobody can evidence.',
 good:'A single-tenant model with an explicit note on what would change if multi-tenancy arrived.',
 bad:'A plugin framework, an abstraction layer per vendor and a generic rules engine, all unused.',
 trade:'Some speculation is prudent when reversal is very expensive — say, data residency.',
 fail:'"We might need it" as a design argument with no probability, no cost and no evidence.',
 apply:'Prepare for change by keeping things small and decisions reversible, not by pre-building.',
 validate:'Ask who requested it and what evidence supports it. Silence is an answer.',
 rel:['simplicity','reversible','evidence']},

{id:'reversible', f:'change', name:'Prefer Reversible Decisions',
 intent:'When uncertain, choose the option that is cheaper to undo.',
 good:'Isolating a vendor behind an interface while uncertain, then simplifying once it is proven.',
 bad:'Spreading a vendor’s data model through the domain during a two-week evaluation.',
 trade:'Reversibility costs indirection now to buy optionality later; optionality you never use is waste.',
 fail:'Treating everything as reversible, including data model and public contract decisions, which rarely are.',
 apply:'Classify the decision: reversible, expensive to reverse, or effectively permanent. Spend evidence accordingly.',
 validate:'State the exit cost of the decision in the ADR. If nobody can, that is the finding.',
 rel:['evidence','speculative','adr']},

/* --- reliability --- */
{id:'iso', f:'reliability', name:'Failure Isolation',
 intent:'One failing part should not take the system with it.',
 good:'Report generation runs in a worker; if it fails, checkout is unaffected.',
 bad:'A slow third-party call inside the request path exhausts the web pool and the whole site stops.',
 trade:'Isolation costs runtime units, queues and operational surface.',
 fail:'"Isolated" components that share a connection pool, a database or a single node.',
 apply:'Isolate by blast radius: what must stay up when this fails?',
 validate:'Name the dependency, then state exactly what still works when it is down.',
 rel:['degrade','bounded','explicit-fail']},

{id:'degrade', f:'reliability', name:'Graceful Degradation',
 intent:'Lose capability, not correctness, when something is unavailable.',
 good:'Recommendations disappear when the recommender is down; the catalogue still sells.',
 bad:'A missing avatar service returns a 500 for the entire page.',
 trade:'Degraded modes are extra paths that must be designed, built and tested, or they will not work when needed.',
 fail:'Degradation that silently changes meaning — showing stale prices as if they were current.',
 apply:'Decide per dependency: required, degradable or optional. Design the degraded experience.',
 validate:'Turn the dependency off in a test environment and look at the result.',
 rel:['iso','explicit-fail','visible']},

{id:'explicit-fail', f:'reliability', name:'Explicit Failure Handling',
 intent:'Failures are part of the contract, not an exception to it.',
 good:'The API documents its error codes; callers handle timeout, conflict and rejection distinctly.',
 bad:'Every failure becomes a generic 500, so no caller can respond intelligently.',
 trade:'Explicit error contracts are more work to design and to version.',
 fail:'Catch-all handlers that convert precise failures into vague ones.',
 apply:'Enumerate what can fail at each boundary and define the response for each.',
 validate:'For each dependency, point at the code path that handles its timeout.',
 rel:['degrade','idem','api']},

{id:'bounded', f:'reliability', name:'Bounded Resources',
 intent:'Everything that can grow must have a limit: time, memory, queue depth, concurrency, retries.',
 good:'Every outbound call has a timeout; every queue has a maximum depth and a dead-letter path.',
 bad:'An unbounded retry loop turning a brief outage into a self-inflicted denial of service.',
 trade:'Limits cause rejection under load, which must be designed for and communicated.',
 fail:'Defaults nobody chose: an infinite client timeout is a decision, just not yours.',
 apply:'Give every resource an explicit bound and a defined behaviour at the bound.',
 validate:'List the timeouts, pool sizes and queue limits. Unknown values are the finding.',
 rel:['iso','explicit-fail','perf']},

{id:'idem', f:'reliability', name:'Idempotency Where Required',
 intent:'Operations that may be retried must be safe to repeat.',
 good:'Payment capture is keyed by an idempotency key, so a retried request does not charge twice.',
 bad:'A network timeout on "create order" leaves the caller unable to retry safely.',
 trade:'Idempotency requires keys, storage and deduplication logic with its own lifecycle.',
 fail:'Assuming at-least-once delivery is at-most-once, and discovering the difference in production.',
 apply:'Identify every retryable operation with side effects and give it a key.',
 validate:'Send the same request twice and inspect the state.',
 rel:['explicit-fail','events','recover']},

{id:'recover', f:'reliability', name:'Recoverability',
 intent:'The system must be able to get back to a correct state after failure.',
 good:'Restore is practised; there is a documented reconciliation for partially completed workflows.',
 bad:'Backups exist and have never been restored; nobody knows how long it takes.',
 trade:'Recovery capability costs storage, drills and design of reconciliation paths.',
 fail:'Confusing backup with recovery. An untested restore is a hope.',
 apply:'For each failure mode, define the path back and who runs it.',
 validate:'Run the restore. Record the time it took.',
 rel:['ops-recover','idem','bounded']},

/* --- data --- */
{id:'own', f:'data', name:'Explicit Data Ownership',
 intent:'Exactly one component owns each piece of data and its rules.',
 good:'Orders are owned by ordering; billing reads a published, versioned projection.',
 bad:'Three services write the same table; the last writer wins and nobody knows the rules.',
 trade:'Single ownership means others must ask, which adds calls, copies or events.',
 fail:'"Shared database, shared ownership" — which is nobody’s ownership.',
 apply:'Write an ownership table. Every entity gets exactly one owner.',
 validate:'Find all writers of each store. More than one owner is a finding.',
 rel:['integrity','consistency','boundaries']},

{id:'integrity', f:'data', name:'Integrity',
 intent:'Invalid data should be impossible to create, not merely reported later.',
 good:'Invariants enforced at the owner plus constraints in the store; corrections are explicit operations.',
 bad:'Validation only in the browser, so any other client can write nonsense.',
 trade:'Strict integrity makes imports, migrations and corrections harder.',
 fail:'Nightly "data fixing" scripts that become a permanent part of operations.',
 apply:'Enforce at the owner, enforce again in the store, and design deliberate correction paths.',
 validate:'Attempt to write invalid data through each path that exists.',
 rel:['own','encap','consistency']},

{id:'consistency', f:'data', name:'Appropriate Consistency',
 intent:'Choose the consistency each workflow actually needs, and make it visible.',
 good:'Stock reservation is strongly consistent; the sales dashboard is eventually consistent, and says so.',
 bad:'Everything eventually consistent, including money — or everything in one transaction, including email.',
 trade:'Strong consistency costs availability and latency; eventual consistency costs user-visible complexity.',
 fail:'Choosing consistency by infrastructure default rather than by workflow requirement.',
 apply:'Per workflow, state the consistency requirement and the window users may observe.',
 validate:'For each eventually consistent path, describe what the user sees inside the window.',
 rel:['own','ux','events']},

{id:'lifecycle', f:'data', name:'Explicit Data Lifecycle',
 intent:'Every entity has a defined birth, change, archive and deletion.',
 good:'Retention is defined per entity; deletion propagates to derived copies and exports.',
 bad:'Data accumulates forever because nobody decided otherwise; deletion requests cannot be honoured.',
 trade:'Lifecycle rules add work in every place data is copied.',
 fail:'Deleting in the primary store while copies persist in caches, search indexes and backups.',
 apply:'Define retention and deletion at design time, including derived data.',
 validate:'Delete a record; then look for it everywhere else.',
 rel:['own','compliance-lens','migration']},

/* --- security --- */
{id:'least-priv', f:'security', name:'Least Privilege',
 intent:'Every actor gets the minimum access needed, for the minimum time.',
 good:'The worker has write access to one queue and read access to one bucket.',
 bad:'One database user with full rights shared by every service and every engineer.',
 trade:'Fine-grained permissions add operational friction and more things to get wrong.',
 fail:'Least privilege at deploy time, broadened during an incident and never narrowed again.',
 apply:'Derive permissions from what each component actually does; review them when it changes.',
 validate:'Enumerate each identity’s permissions and compare with its behaviour.',
 rel:['trust','defense','audit']},

{id:'defense', f:'security', name:'Defence in Depth',
 intent:'No single control should be the only thing standing between an attacker and the data.',
 good:'Network restrictions, authenticated calls, authorization at the domain and constraints in the store.',
 bad:'A gateway that validates everything, and internal services that trust every caller completely.',
 trade:'Redundant controls cost latency, complexity and duplicated logic.',
 fail:'Layers that all depend on the same assumption — depth in appearance only.',
 apply:'For each asset, list the independent controls protecting it.',
 validate:'Remove one control on paper and ask what is still true.',
 rel:['least-priv','trust','secure-design']},

{id:'secure-design', f:'security', name:'Secure by Design',
 intent:'Security is a property of the structure, not a layer added later.',
 good:'Tenant scoping in the data access path, so a query without a tenant is impossible to express.',
 bad:'A security review scheduled for the sprint before launch.',
 trade:'Designing for security constrains some convenient shortcuts.',
 fail:'A threat model written once and never revisited as the architecture changes.',
 apply:'Include the security lens when shaping boundaries, not after.',
 validate:'Point at the structural element that makes the bad case impossible rather than merely detected.',
 rel:['trust','defense','least-priv']},

{id:'trust', f:'security', name:'Explicit Trust Boundaries',
 intent:'Name where trust changes, and validate everything that crosses.',
 good:'Input from browsers, partner APIs and internal jobs are all treated as untrusted at the boundary.',
 bad:'"It is internal" as a reason to skip validation and authorization.',
 trade:'Validation at every boundary costs performance and duplicated schema knowledge.',
 fail:'A trust boundary drawn in the diagram but not present in the deployment.',
 apply:'Mark each boundary in the architecture; define authentication, authorization and validation at each.',
 validate:'Call an internal endpoint directly, without going through the gateway.',
 rel:['boundaries','defense','secure-design']},

{id:'fail-secure', f:'security', name:'Fail Securely',
 intent:'When a security control fails, the system must deny, not allow.',
 good:'If the authorization service is unreachable, the request is rejected and the event is recorded.',
 bad:'A cached "allow" is used when the policy service times out.',
 trade:'Failing closed converts a security dependency into an availability dependency.',
 fail:'Exception handlers that skip the check because the check threw.',
 apply:'Define the failure behaviour of each control explicitly and deliberately.',
 validate:'Make the control fail in a test environment and observe what is permitted.',
 rel:['explicit-fail','defense','audit']},

/* --- operations --- */
{id:'obs', f:'operations', name:'Observability',
 intent:'The system should be able to explain its own behaviour.',
 good:'Correlated logs, metrics and traces at every boundary; a failed order can be followed end to end.',
 bad:'Debugging by adding print statements and redeploying.',
 trade:'Telemetry costs money, performance and privacy review.',
 fail:'Dashboards full of infrastructure metrics that answer no question a user would ask.',
 apply:'Decide what questions you must answer in an incident, then instrument for those.',
 validate:'Pick a real incident and try to answer its questions from telemetry alone.',
 rel:['ops-recover','explicit-fail','audit']},

{id:'automation', f:'operations', name:'Automation',
 intent:'Anything done repeatedly and correctly should be executed by a machine.',
 good:'Environments, migrations and deployments are scripted and version controlled.',
 bad:'A wiki page of manual steps that only one person can perform correctly.',
 trade:'Automation is code: it has bugs, needs maintenance and can fail in new ways.',
 fail:'Automating a broken process, so it now fails faster and more often.',
 apply:'Automate the steps whose correctness matters and whose repetition is frequent.',
 validate:'Can a second person produce the same environment without asking anyone?',
 rel:['repeat','guardrail','ops-recover']},

{id:'repeat', f:'operations', name:'Repeatability',
 intent:'The same inputs should produce the same system.',
 good:'Environments built from declared configuration; builds reproducible from a commit.',
 bad:'A production server nobody can rebuild because of changes made during an incident in 2022.',
 trade:'Reproducibility constrains ad-hoc fixes, which is exactly the point and occasionally painful.',
 fail:'Reproducible infrastructure with hand-edited configuration inside it.',
 apply:'Treat environment and configuration as declared artifacts.',
 validate:'Rebuild an environment from scratch and compare.',
 rel:['automation','ops-recover']},

{id:'ops-recover', f:'operations', name:'Operational Recoverability',
 intent:'Getting back to healthy is a designed, practised procedure.',
 good:'Rollback is defined including data changes; restore is drilled; the runbook names the first action.',
 bad:'Rollback means redeploying the old version and hoping the migration was backward compatible.',
 trade:'Backward-compatible change is slower to write than the version that breaks things.',
 fail:'A rollback plan that cannot actually run because the schema moved forward.',
 apply:'Design forward and backward paths together; practise them.',
 validate:'Roll back a real deployment in a non-production environment and time it.',
 rel:['recover','repeat','obs']}
];

/* Principle → Standard → Rule → Pattern → Guardrail → Validation ----- */
const CHAINS = [
{id:'c1', principle:'Separation of Concerns',
 nodes:[
  {k:'Principle', v:'Separation of Concerns',
   c:'Keep responsibilities that change for different reasons in places that can change independently.'},
  {k:'Intent', v:'Keep business rules independently changeable from transport and storage.',
   c:'The intent is what survives when the technology changes. It is the sentence you can still defend in three years.'},
  {k:'Standard', v:'Business logic must not depend on transport or persistence mechanisms.',
   c:'A standard is normative and testable. It says what must be true across the organisation, not how to achieve it.'},
  {k:'Rule', v:'Domain modules must not import web framework or database driver packages.',
   c:'A rule is the mechanically checkable expression of the standard. It has no judgement left in it.'},
  {k:'Pattern', v:'Application → Domain → Repository abstraction; adapters at the edges.',
   c:'A pattern is one proven way to satisfy the standard. Other ways may also satisfy it; the pattern is a recommendation, not the law.'},
  {k:'Guardrail', v:'Dependency-boundary validator with an allow-list per module.',
   c:'A guardrail makes the rule cheap to follow and expensive to violate by accident.'},
  {k:'Validation', v:'CI architecture check; violations fail the build with the rule cited.',
   c:'Validation closes the loop. A standard nobody checks is a preference.'}]},

{id:'c2', principle:'Explicit Data Ownership',
 nodes:[
  {k:'Principle', v:'Explicit Data Ownership', c:'Exactly one component owns each entity and the rules that govern it.'},
  {k:'Intent', v:'Make the rules for an entity enforceable in one place.',
   c:'Ownership exists so invariants have a home. Without it, integrity is everyone’s job and therefore nobody’s.'},
  {k:'Standard', v:'Each entity has exactly one owning module; others read through a published contract.',
   c:'Note that this permits reading — it constrains writing and rule interpretation.'},
  {k:'Rule', v:'No module may write to a table owned by another module.',
   c:'Mechanical and unambiguous. Writes are the thing that breaks invariants.'},
  {k:'Pattern', v:'Owner exposes commands; consumers use the API or subscribe to published events.',
   c:'Both synchronous and asynchronous variants satisfy the standard; choose per consistency requirement.'},
  {k:'Guardrail', v:'Per-module database credentials with write grants only on owned tables.',
   c:'The strongest guardrails make violation impossible rather than detectable.'},
  {k:'Validation', v:'Schema-ownership test plus periodic grant audit.',
   c:'Automated where possible, audited where not.'}]},

{id:'c3', principle:'Explicit Trust Boundaries',
 nodes:[
  {k:'Principle', v:'Explicit Trust Boundaries', c:'Name where trust changes and validate everything that crosses.'},
  {k:'Intent', v:'Ensure no component inherits trust simply by being inside the network.',
   c:'"Internal" is a network fact, not a security property.'},
  {k:'Standard', v:'Every entry point authenticates the caller and authorises the action.',
   c:'Applies to HTTP handlers, queue consumers, scheduled jobs and admin tooling alike.'},

 {id:'layered', name:'Layered Architecture', fam:'shape', use:'used',
  intent:'Separate concerns into horizontal layers so that policy does not depend on mechanism.',
  problem:'Business rules, persistence and transport get written in the same function and become impossible to test or move.',
  context:'Almost any application. Cheapest possible structural discipline.',
  structure:'Presentation → application → domain → infrastructure. Dependencies point inward only.',
  runtime:'A request enters at the outer layer and is translated at each boundary; no layer calls outward.',
  benefits:['Trivial to explain','Cheap to enforce with an import rule','Makes the domain testable without a database'],
  costs:['Adds indirection for genuinely simple operations','Tempts teams to create anaemic pass-through layers'],
  risks:['Layers that all import each other are not layers, they are folders','Mapping fatigue leads people to leak persistence models upward'],
  avoid:'Do not layer a script. If there is no domain logic, a route handler talking to a query is the honest design.',
  example:'Squid: ui → actions → domain → gateway. The import rule in architecture/deps.json fails CI when domain imports gateway internals.',
  validate:'A guardrail that fails the build on an outward dependency, plus a domain test suite that runs with no database.'},

 {id:'modmono', name:'Modular Monolith', fam:'shape', use:'used',
  intent:'Get the boundaries of a distributed system without paying for the network.',
  problem:'Microservices bought early cost distributed transactions, deployment complexity and an operations burden before there is a team to carry it.',
  context:'One team or a few teams, one deployment cadence, boundaries not yet proven.',
  structure:'One deployable, modules with explicit public interfaces, no cross-module private access, one database with per-module ownership.',
  runtime:'In-process calls between modules through published interfaces; events for anything that would otherwise be a reverse dependency.',
  benefits:['Refactoring a boundary is a rename, not a migration','One deploy, one trace, one transaction where you need it','Extraction later is cheap if the boundary held'],
  costs:['Boundary discipline is voluntary unless automated','A single runtime failure affects everything','Scaling is coarse — you scale the whole app'],
  risks:['"Modular" that is not enforced becomes a distributed ball of mud without the distribution','One slow module can starve the rest of the process'],
  avoid:'Do not use it when parts genuinely have incompatible scaling or availability requirements, or when independent teams need independent release cadence.',
  example:'Squid: nine modules in one Next.js deployment plus a worker fleet. ADR-001 records the choice and names the trigger for revisiting it — a module that needs to scale or release separately.',
  validate:'Dependency guardrail in CI, plus a written extraction trigger per module.'},

 {id:'hex', name:'Hexagonal Architecture', fam:'shape', use:'partial',
  intent:'Make the application core independent of how it is driven and what it drives.',
  problem:'The domain becomes unusable outside an HTTP request because it is written against the framework.',
  context:'Systems with real domain logic, multiple entry points, or a long expected life.',
  structure:'Application core in the middle; driving adapters (HTTP, CLI, queue consumer) on one side, driven adapters (database, mail, payment) on the other; both attach through ports.',
  runtime:'An adapter translates the outside world into a port call; the core never knows which adapter called it.',
  benefits:['The same use case can be driven by a route, a job or a test','Infrastructure can be replaced without touching rules','Tests run in milliseconds'],
  costs:['Two extra types for every operation','Genuine overhead for CRUD that has no rules'],
  risks:['Ports invented for things that will never have a second adapter','Teams confuse the shape with the benefit and produce ceremony'],
  avoid:'Do not apply it to modules that are a thin shell over a query. Squid\'s search module has no hexagon and should not.',
  example:'Squid: work and billing have ports; search and files talk to their infrastructure directly, deliberately.',
  validate:'A use case executed by two different adapters, at least one of which is a test.'},

 {id:'ports', name:'Ports and Adapters', fam:'bound', use:'partial',
  intent:'Name the interface the core owns, and keep the implementation on the other side of it.',
  problem:'Direct calls to a vendor SDK scatter a replacement across fifty files.',
  context:'Any dependency that is external, unstable or likely to be swapped.',
  structure:'The core declares the port (an interface expressed in domain terms). The adapter implements it in vendor terms.',
  runtime:'The core calls the port. Composition supplies the adapter. Failures are translated into the core\'s error set at the boundary.',
  benefits:['Vendor changes are contained','The core\'s error vocabulary stays stable','Test doubles are trivial'],
  costs:['An interface per dependency','Leaky ports are worse than none — a port that exposes the vendor\'s types buys nothing'],
  risks:['Port-per-class ritual','Hiding a dependency so thoroughly that its real failure behaviour is invisible to the core'],
  avoid:'Do not port a dependency you would never replace and whose failure you already handle locally — the standard library, for instance.',
  example:'Squid: MailPort with send(to, template, data). The adapter maps provider errors into Transient and Permanent, which is the only distinction notify cares about.',
  validate:'Grep for the vendor package name: it should appear in exactly one directory. This is also the same idea as Hexagonal Architecture, named for the mechanism rather than the shape — knowing that saves an argument.'},

 {id:'clean', name:'Clean Architecture', fam:'shape', use:'no',
  intent:'Organise the whole codebase around the dependency rule: source dependencies point only toward higher-level policy.',
  problem:'Frameworks become load-bearing and the business rules cannot outlive them.',
  context:'Long-lived systems with substantial rules and a real chance of outliving their framework.',
  structure:'Entities, use cases, interface adapters, frameworks and drivers — four rings, dependencies inward.',
  runtime:'Control flows outward through interfaces while source dependencies point inward; the inversion is the whole trick.',
  benefits:['Domain survives framework churn','Explicit use cases are excellent documentation'],
  costs:['Substantial ceremony — request models, response models, presenters','Slower to write, and noticeably so for small features'],
  risks:['Teams adopt the folder structure and none of the dependency rule, paying the cost and getting nothing','Four rings for an application with no rules'],
  avoid:'Do not use it in a product still searching for its shape, or where the framework is the product.',
  example:'Squid rejected it. ADR-002: the Next.js App Router is load-bearing by choice, and a layered modular monolith gives most of the benefit at a fraction of the cost.',
  validate:'If adopted: an entity test that imports nothing from the framework. If not adopted: an ADR saying so, which is what Squid has.'},

 {id:'repo', name:'Repository', fam:'data', use:'used',
  intent:'Give the domain a collection-like interface and keep query mechanics out of it.',
  problem:'Query builders spread through business logic; nobody can tell which indexes are needed or which tenant predicate was forgotten.',
  context:'Any module that owns persistent state.',
  structure:'One repository per aggregate, expressed in domain terms: findAssignable, save, ofId.',
  runtime:'The domain calls the repository; the repository owns the query, the index assumption and the mapping.',
  benefits:['Queries become reviewable in one place','Tenant and soft-delete predicates can be enforced centrally','Index requirements become visible'],
  costs:['Generic repositories degenerate into a worse ORM','Rich query needs push methods onto the interface until it is a query language again'],
  risks:['findAll() plus filtering in memory','A repository that returns database documents is not a repository'],
  avoid:'Do not wrap a reporting query in a repository. Reporting wants the query language, not an abstraction over it.',
  example:'Squid: the gateway is the only code that touches Mongo. Every call carries a workspace predicate and honours deletedAt, because it is one place rather than four hundred.',
  validate:'A test that proves a query without a workspace predicate cannot compile or cannot pass review.'},

 {id:'appsvc', name:'Application Service', fam:'shape', use:'used',
  intent:'Hold one use case: orchestrate, do not decide.',
  problem:'Transport handlers accumulate rules, and the same rule ends up implemented differently in a route and in a job.',
  context:'Any operation with more than one step or more than one participant.',
  structure:'A function per use case: validate input, check policy, load, invoke domain, persist, emit.',
  runtime:'Owns the transaction boundary and the event emission. Contains orchestration, not business rules.',
  benefits:['One place per use case','Reusable from HTTP, queue and test','Transaction boundary is explicit'],
  costs:['A thin extra hop for genuinely trivial operations'],
  risks:['Application services that grow rules become a second domain model','"Service" as a dumping ground for anything homeless'],
  avoid:'Do not create one for a pure read with no policy beyond tenancy.',
  example:'Squid: assignTask(cmd) validates, asks policy, loads the task, calls the domain operation, writes task and outbox in one transaction, returns a Result.',
  validate:'Read the service aloud. If it contains the word "if" more than twice, the rules belong in the domain.'},

 {id:'domev', name:'Domain Events', fam:'msg', use:'used',
  intent:'Let a module announce that something happened without knowing who cares.',
  problem:'Every new reaction to an action means editing the action. Work ends up importing notify, search and analytics.',
  context:'When several unrelated reactions follow one business fact.',
  structure:'The owning module publishes a named past-tense fact with a stable payload. Consumers subscribe.',
  runtime:'Emitted inside the transaction that made the fact true; delivered after commit.',
  benefits:['Reverse dependencies disappear','New consumers require no change to the producer','The event log is a readable history of the domain'],
  costs:['The payload is a contract and versioning it is real work','Debugging crosses an asynchronous seam'],
  risks:['Events used as commands in disguise ("TaskShouldBeIndexed")','Consumers depending on fields the producer considered incidental'],
  avoid:'Do not use events where you need an answer. A question is a call, not an event.',
  example:'Squid: TaskAssigned carries workspaceId, taskId, assigneeId, actorId, at. Notify, search and activity consume it. Work imports none of them.',
  validate:'The producer module\'s import list contains no consumer. Check it in CI.'},

 {id:'eda', name:'Event-Driven Architecture', fam:'msg', use:'partial',
  intent:'Make the event stream the primary means of integration between components.',
  problem:'Synchronous chains couple availability: if any participant is down, the whole operation fails.',
  context:'Many independent reactions, tolerance for eventual consistency, and an operations capability to match.',
  structure:'Producers, a broker, independent consumers with their own state and failure handling.',
  runtime:'Asynchronous, at-least-once, out-of-order unless you pay for ordering.',
  benefits:['Availability decoupling','Independent scaling of consumers','Natural audit trail'],
  costs:['Every consumer needs idempotency, retry and a dead-letter path','End-to-end tracing becomes a project','"Where is my data" becomes a support category'],
  risks:['Eventual consistency leaking into a UI that promised immediacy','A broker outage becoming a silent, system-wide failure'],
  avoid:'Do not make everything an event. Squid keeps commands synchronous so the user sees the result of their own action.',
  example:'Squid is event-driven only after the commit: the user\'s write is synchronous and immediate; notification, search indexing and activity are asynchronous.',
  validate:'For every asynchronous path: an idempotency strategy, a retry policy, a dead-letter queue and a backlog alert. Missing any one of the four means it is not ready.'},

 {id:'outbox', name:'Transactional Outbox', fam:'msg', use:'used',
  intent:'Make "state changed" and "event published" atomic without a distributed transaction.',
  problem:'Writing to the database and then publishing to a broker can succeed halfway. The dual write is the bug.',
  context:'Any system that must emit events about its own state changes reliably.',
  structure:'An outbox collection written inside the same transaction as the state change; a relay drains it and publishes.',
  runtime:'Commit writes both. The relay polls or tails, publishes, marks delivered. Delivery is at-least-once.',
  benefits:['No lost events, ever, without two-phase commit','The outbox is a replayable log when a consumer was broken'],
  costs:['A relay to run and watch','Publication latency of one poll interval','Consumers must be idempotent'],
  risks:['An outbox that grows unbounded because nobody purges delivered rows','A relay running twice and doubling every event'],
  avoid:'Do not use it when losing the event is genuinely acceptable — a best-effort metric does not need this.',
  example:'Squid: ADR-007 chose the outbox over dual write after a spike showed a 0.3% loss rate under worker restarts. Rows purge after 7 days; backlog depth alerts at 500.',
  validate:'Kill the relay mid-drain. Every event must arrive exactly once from the consumer\'s point of view.'},

 {id:'saga', name:'Saga / Process Manager', fam:'msg', use:'partial',
  intent:'Coordinate a multi-step process that cannot be one transaction, with explicit compensation.',
  problem:'A business process spans systems that cannot share a transaction, and failing halfway leaves inconsistent state.',
  context:'Long-running processes crossing a real boundary — usually money, an external provider, or both.',
  structure:'A state machine per process instance, persisted; each step has a compensating action.',
  runtime:'Step, persist, react to the result, compensate backwards on failure.',
  benefits:['Partial failure becomes a designed state rather than an incident','The process is inspectable and resumable'],
  costs:['A state machine to build, persist, version and monitor','Compensations are business decisions, not technical ones — refunds are not rollbacks'],
  risks:['Saga adopted for processes that fit in one transaction','Stuck instances nobody monitors'],
  avoid:'Do not use it inside one database. Squid assigns a task in a single transaction and needs no saga to do it.',
  example:'Squid uses one: subscription upgrade — reserve seats, charge the provider, apply entitlements, notify. Compensation releases the seat reservation and records a failed upgrade.',
  validate:'A test that fails at each step and asserts the compensated end state, plus an alert on instances older than an hour.'},

 {id:'cqrs', name:'CQRS', fam:'data', use:'no',
  intent:'Separate the model that writes from the model that reads when their needs genuinely conflict.',
  problem:'One model optimised for invariants makes read queries expensive, or vice versa.',
  context:'Very different read and write shapes, very different scaling, or a read path that cannot tolerate write-side contention.',
  structure:'Command side with the domain model; query side with denormalised read models kept up to date by events.',
  runtime:'Writes go through the domain; reads bypass it entirely; propagation is asynchronous.',
  benefits:['Reads can be shaped exactly for the screen','Read and write scale independently'],
  costs:['Two models to maintain and keep consistent','Every read is stale by some amount you must now specify','Debugging requires understanding the projection'],
  risks:['Adopted as a default and paid for forever','Projections that drift with no rebuild path'],
  avoid:'Do not adopt it before a specific read that a well-indexed query demonstrably cannot serve.',
  example:'Squid rejected it (ADR-009). Board reads are served by a compound index and a projection; the p95 measured 180ms at the target size. A denormalised board read model is named as the next step if that number degrades.',
  validate:'Before adopting: a measurement proving the single model cannot meet the target. After adopting: a projection rebuild that has actually been run.'},

 {id:'gateway', name:'API Gateway', fam:'edge', use:'partial',
  intent:'Put cross-cutting edge concerns in one place in front of the system.',
  problem:'Authentication, rate limiting, TLS and routing get reimplemented per service, differently.',
  context:'Multiple backend services exposed to untrusted clients.',
  structure:'A single entry point handling termination, authentication, routing, rate limiting and request logging.',
  runtime:'Every external request passes through it; internal traffic may not.',
  benefits:['One place for edge policy','Backends stop caring about transport concerns'],
  costs:['A component on the critical path of everything','Configuration becomes a deployment concern of its own'],
  risks:['Business logic creeping into gateway configuration','A single point of failure with no fallback'],
  avoid:'Do not put one in front of a single application that already terminates its own requests — that is what Squid does.',
  example:'Squid: the Next.js edge performs the gateway role for web traffic. A separate gateway is deferred until the public API has external consumers, recorded as a trigger rather than a plan.',
  validate:'Ask what happens when the gateway is down. If the answer is "everything", the pattern needs a second instance before it needs more features.'},

 {id:'bff', name:'Backend-for-Frontend', fam:'edge', use:'used',
  intent:'Give each client surface a backend shaped for that surface.',
  problem:'One generic API forces every client to over-fetch, and every client\'s needs distort it.',
  context:'Genuinely different surfaces — a web app, a mobile app, a partner API — with different payload and latency needs.',
  structure:'A thin per-surface layer that composes and shapes responses from shared services.',
  runtime:'Client talks only to its BFF; the BFF talks to the modules.',
  benefits:['Payloads fit the screen','Clients evolve without renegotiating a shared contract'],
  costs:['One more thing to deploy per surface','Logic duplicated across BFFs if discipline slips'],
  risks:['BFFs that accumulate business rules','A "BFF" that is actually the only backend'],
  avoid:'Do not build one per client when the clients want the same data.',
  example:'Squid: React Server Components are the web BFF — they compose module calls server-side and send the page, not the data model. A separate mobile BFF is not built and not needed yet.',
  validate:'Count the fields the client discards. If it is near zero, the shaping is working.'},

 {id:'cache', name:'Cache-Aside', fam:'data', use:'used',
  intent:'Reduce load on a source of truth without making the cache authoritative.',
  problem:'Repeated identical reads of slow or expensive data.',
  context:'Read-heavy data that tolerates a defined staleness.',
  structure:'Read cache; on miss read source and populate; on write invalidate.',
  runtime:'The cache is never the source of truth and never written to directly by business logic.',
  benefits:['Large latency and load win for small effort','Cache loss degrades performance, not correctness'],
  costs:['Every cached item needs an invalidation story and a TTL','Stampedes on popular keys need handling'],
  risks:['Invalidation that is forgotten on one of the write paths','Caching personal data past its retention window'],
  avoid:'Do not cache what you have not measured, and never cache an authorisation decision without a very short TTL.',
  example:'Squid: workspace membership and feature flags, 60-second TTL, invalidated on membership change. Task content is not cached — it changes too often and correctness matters more than the milliseconds.',
  validate:'Flush the cache under load and watch the source survive. Then change the underlying data and time how long the stale value lives.'},

 {id:'retry', name:'Retry with Backoff', fam:'res', use:'used',
  intent:'Survive transient failure without amplifying it.',
  problem:'A brief dependency blip fails a user operation that would have succeeded a second later.',
  context:'Transient, idempotent operations across a network.',
  structure:'Bounded attempts, exponential delay, jitter, and a distinction between retryable and permanent errors.',
  runtime:'Attempt, classify the error, wait, retry, then give up into a dead-letter path.',
  benefits:['Most transient faults disappear','Cheap to add where it belongs'],
  costs:['Latency on the failure path','Requires the operation to be idempotent — or it creates duplicates'],
  risks:['Retry storms turning a degradation into an outage','Retrying a permanent error forever','Retries stacked at three layers multiplying into hundreds of calls'],
  avoid:'Never retry a non-idempotent write without an idempotency key. Never retry a 4xx.',
  example:'Squid: mail delivery retries 5 times with jitter up to 15 minutes, then dead-letters. Payment capture never retries without the provider\'s idempotency key.',
  validate:'Count the calls the dependency actually receives during an injected failure. Retry budgets should be visible in that number.'},

 {id:'breaker', name:'Circuit Breaker', fam:'res', use:'partial',
  intent:'Stop calling a dependency that is clearly broken, so the caller stays alive.',
  problem:'A slow dependency consumes every worker thread and takes down a healthy system.',
  context:'A remote dependency with a plausible failure mode of slowness rather than refusal.',
  structure:'Closed, open, half-open — with a failure threshold, an open duration and a trial request.',
  runtime:'When open, fail immediately with the designed degraded behaviour instead of waiting.',
  benefits:['Bounded blast radius','Recovery without a deploy'],
  costs:['Thresholds require tuning against real traffic','A breaker that opens too eagerly creates the outage it was meant to prevent'],
  risks:['No designed behaviour for the open state — an exception is not a design','Breakers per instance behaving inconsistently across a fleet'],
  avoid:'Do not add one before you have a timeout. A timeout is the prerequisite; the breaker is the amplifier.',
  example:'Squid: the search adapter opens after 10 failures in 30 seconds and the board renders with a "search unavailable" banner. Mail has retries and a dead-letter queue instead — it is asynchronous and nothing waits on it.',
  validate:'Injected latency should cause the breaker to open and the user-facing degradation to appear, both within the stated time.'},

 {id:'bulkhead', name:'Bulkhead', fam:'res', use:'used',
  intent:'Partition resources so one workload cannot consume everything.',
  problem:'A single expensive job class starves every other job in a shared pool.',
  context:'Shared pools — threads, connections, queue workers — serving workloads of different importance.',
  structure:'Separate pools, queues or instances per workload class, each with its own limit.',
  runtime:'Saturating one partition degrades only that partition.',
  benefits:['Failure isolation without new services','Priority becomes structural rather than aspirational'],
  costs:['Lower average utilisation','More pools to size and watch'],
  risks:['Partitions sized by guesswork','So many partitions that none has enough headroom to absorb a spike'],
  avoid:'Do not partition below the point where a partition can absorb one unit of its own work.',
  example:'Squid: export jobs run on their own queue and worker pool with concurrency 1, so a large export cannot delay notification delivery during the morning peak.',
  validate:'Saturate one pool and confirm the others meet their targets unchanged.'},

 {id:'idem', name:'Idempotency', fam:'res', use:'used',
  intent:'Make repeating an operation harmless, so that retries and at-least-once delivery are safe.',
  problem:'Network uncertainty means the caller cannot tell whether an operation happened. Retrying may duplicate it.',
  context:'Every asynchronous consumer and every externally retryable write.',
  structure:'A caller-supplied key, or natural idempotency through a deterministic identifier and a conditional write.',
  runtime:'First execution performs the work and records the key; subsequent executions return the first result.',
  benefits:['Makes at-least-once delivery acceptable','Turns a retry from a risk into a tool'],
  costs:['A key store with its own retention','The key must cover the right scope, which is easy to get subtly wrong'],
  risks:['Keys scoped per attempt rather than per intent — which protects nothing','Idempotency asserted but never tested'],
  avoid:'Do not bolt it on after adopting retries. It is the precondition, not the follow-up.',
  example:'Squid: notification consumers key on eventId + channel. Task creation from the UI keys on a client-generated ULID, so a double submit creates one task.',
  validate:'Deliver the same event twice on purpose in a test and assert one effect.'},

 {id:'strangler', name:'Strangler Fig', fam:'change', use:'no',
  intent:'Replace a system incrementally by routing capability away from it, piece by piece.',
  problem:'A rewrite that must land all at once will not land.',
  context:'Replacing or extracting from a system that must keep running throughout.',
  structure:'A routing seam in front of old and new; capabilities move across one at a time; the old system shrinks until it is removed.',
  runtime:'Every request is routed to one implementation; both run in parallel during migration.',
  benefits:['Value lands continuously','Each step is individually reversible','Risk is bounded per capability'],
  costs:['Two implementations to run, monitor and keep consistent','The seam itself is work'],
  risks:['The final 10% never gets migrated and the seam becomes permanent','Data ownership split across both systems with no source of truth'],
  avoid:'Do not use it when the system can be replaced in a single safe step, or when nobody has committed to finishing.',
  example:'Squid does not need it today — it is a new system. It is recorded as the intended approach if the work module is ever extracted, together with the seam that would be required.',
  validate:'A dated plan with the last capability named, and a per-capability traffic percentage that someone actually watches.'}
];

   ARTIFACT MAP — question in, artifact out.
   ================================================================ */

 {q:'What is the system?', a:'Context Diagram', view:'v-context', lvl:'L0', ch:'ch25',
  shows:'The system as one box, its actors, the external systems it depends on, and the boundary between them.',
  ex:'Squid with members, admins, guests around it and identity, storage, mail, payments and calendar outside.',
  not:'It does not show internal components, and the moment it does it has stopped being a context diagram.'},
 {q:'What exists?', a:'Container / Architecture Diagram', view:'v-structure', lvl:'L1', ch:'ch26',
  shows:'Independently deployable or independently meaningful blocks, what each owns, and how they communicate.',
  ex:'Next.js app, worker fleet, realtime service, MongoDB, Redis, object storage, Atlas Search — with protocol on every edge.',
  not:'It does not show classes, and it should not show every collection.'},
 {q:'What is inside a module?', a:'Component Diagram', view:'v-structure', lvl:'L2', ch:'ch34',
  shows:'Components inside one container or module, their responsibilities and their dependency directions.',

 {q:'How does it execute?', a:'Sequence Diagram', view:'v-behaviour', lvl:'L3', ch:'ch37',
  shows:'Participants in order, the boundary crossed at each step, and the failure branch at each step.',
  ex:'Assign task: action → validation → policy → gateway → transaction → outbox → relay → notify.',
  not:'It is not a call graph. If every function appears, it is too detailed to be read.'},
 {q:'How does a business process work?', a:'Workflow Diagram', view:'v-behaviour', lvl:'L3', ch:'ch37',
  shows:'The business-level steps, decision points, actors and compensations — independent of components.',
  ex:'Onboarding a workspace: invite, accept, seat allocation, first project, billing activation.',
  not:'It does not name components, which is exactly why product people can read it.'},
 {q:'How does state change?', a:'State Diagram', view:'v-behaviour', lvl:'L3', ch:'ch38',
  shows:'The legal states of one entity, the transitions between them, and who may cause each transition.',
  ex:'Task: DRAFT → OPEN → IN_PROGRESS → BLOCKED → DONE → ARCHIVED, with the rule that DONE cannot return to DRAFT.',
  not:'It is not a flowchart of the UI.'},
 {q:'How does data move?', a:'Data-Flow Diagram', view:'v-data', lvl:'L3', ch:'ch36',
  shows:'Where data originates, where it is stored, where it is copied, and where it leaves the system.',
  ex:'Task text → Mongo → search index → notification e-mail body → the mail provider\'s logs. That last hop is why deletion is hard.',
  not:'It is not the entity model; it is about movement, not shape.'},
 {q:'Who owns data?', a:'Data Architecture', view:'v-data', lvl:'L2', ch:'ch36',
  shows:'Every store and collection with exactly one owning module, plus retention and deletion rules.',
  ex:'Squid: 21 collections, one writer each, soft delete with a 30-day purge.',
  not:'Not a schema dump. Ownership and lifecycle are the point.'},
 {q:'Where does it run?', a:'Deployment Diagram', view:'v-deploy', lvl:'L1', ch:'ch40',
  shows:'Runtime placement, environments, scaling units, and where state actually lives.',
  ex:'Vercel edge + regional functions, worker containers scaling on queue depth, Atlas in one region.',
  not:'Not the logical structure again with cloud icons.'},
 {q:'How does it fail?', a:'Failure-Flow Diagram', view:'v-reliability', lvl:'L3', ch:'ch16',
  shows:'The path a request takes when a dependency is degraded or gone, and what the user sees.',
  ex:'Search unavailable: the board renders, the search box is disabled with a banner, an alert fires.',
  not:'Not an exception-handling diagram. It is about designed behaviour, not stack traces.'},
 {q:'What pattern is being used?', a:'Pattern Specification', view:'v-patterns', lvl:'L2–L3', ch:'ch23',
  shows:'Intent, problem, structure, runtime behaviour, cost in this system, and when it would be abandoned.',
  ex:'Outbox in Squid: chosen over dual write, costs a relay and a purge job, abandoned if the broker gains transactional writes.',
  not:'Not a textbook summary. If it has no cost section it is not finished.'},
 {q:'Why was this chosen?', a:'Architecture Decision Record', view:'v-decisions', lvl:'any', ch:'ch31',
  shows:'Context, problem, drivers, options, criteria, evidence, decision, consequences, risks, rejected alternatives.',
  ex:'ADR-012: CRDT over operational transform for document sync, with a spike behind it.',
  not:'Not for every implementation choice. Reserve it for the expensive and the irreversible.'},
 {q:'What does this module guarantee?', a:'Module Architecture Contract', view:'v-structure', lvl:'L2–L3', ch:'ch63',
  shows:'Purpose, boundary, owned data, dependencies and direction, public interface, patterns, runtime behaviour, events, state, failure, security, reliability, performance, observability, operations, decisions, constraints, evidence.',
  ex:'The Squid work module\'s contract — the persistent example of this handbook.',
  not:'Not a README. A README tells you how to run it; a contract tells you what you may rely on.'},
 {q:'What constraints apply?', a:'Architecture Standards', view:'v-structure', lvl:'any', ch:'ch22',
  shows:'Enforceable rules derived from principles, each with a guardrail and a stated exception path.',
  ex:'"No module imports another module\'s db folder" — enforced by the dependency checker in CI.',
  not:'Not a style guide, and not advice. A standard that cannot be violated visibly is a preference.'},
 {q:'What proves the architecture?', a:'Architecture Evidence', view:'v-validation', lvl:'any', ch:'ch32',
  shows:'Measurements, spikes, injected failures, guardrail runs and review records tied to specific claims.',

];

/* ================================================================
   MODULE ARCHITECTURE CONTRACT — 21 clauses, with the Squid work
   module answered in full.
   ================================================================ */
const MODULE_CONTRACT = [
 {n:1, k:'Purpose', ask:'Why does this module exist, in one sentence a product person would accept?',

   ['Boundary','A named edge where responsibility, trust or ownership changes','A folder'],
   ['Component','A unit with a responsibility and an interface','A class'],
   ['Container','An independently deployable or runnable unit','A Docker image, necessarily'],
   ['Decision','A commitment made among considered options','A preference stated confidently'],
   ['Standard','A normative statement of what must be true','A pattern'],
   ['Pattern','One proven way to satisfy a standard','A requirement'],
   ['Guardrail','A mechanism that makes a rule cheap to follow','A code review comment'],
   ['Baseline','The current agreed architectural model of the system','A one-off document']]},
