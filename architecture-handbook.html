{id:'ch26', n:26, title:'Establishing the Initial Architecture', stage:'shape',
 sum:'Progressive elaboration: context, then containers, then components, then the runtime boundaries that matter. Stop before internals.',
 why:'Premature detail manufactures false confidence and makes the shape expensive to change.',
 blocks:[
 {t:'p', h:'Work outside in, one level at a time, and let each level be challenged before drawing the next. The progressive view below is how the Farm Commerce architecture was actually reached — each step adds exactly one idea, and names the driver that forced it.'},

 {t:'prog', title:'Building the architecture, one decision at a time',
  steps:[
   {cap:'Start with the honest picture: a user and a system.',
    note:'Nothing has been decided yet. This is a deliberate refusal to design.',
    nodes:[{id:'u',label:'CUSTOMER',kind:'human',col:1,row:0},{id:'s',label:'SYSTEM',kind:'sys',col:1,row:1}],
    edges:[{f:'u',t:'s'}]},
   {cap:'Separate delivery from logic: a web client and an API.',
    note:'Driver: three different client types (customer web, farm portal, admin) need the same rules. The split is forced by reuse, not by fashion.',
    nodes:[{id:'u',label:'CUSTOMER',kind:'human',col:1,row:0},{id:'w',label:'WEB',kind:'sys',col:1,row:1},{id:'a',label:'API',kind:'sys',col:1,row:2}],
    edges:[{f:'u',t:'w'},{f:'w',t:'a',l:'HTTPS'}]},
   {cap:'Give truth a home: a primary store owned by the API.',
    note:'Driver: payment correctness. Order invariants need a single owner and a single source of truth.',
    nodes:[{id:'u',label:'CUSTOMER',kind:'human',col:1,row:0},{id:'w',label:'WEB',kind:'sys',col:1,row:1},
           {id:'a',label:'API',kind:'sys',col:1,row:2},{id:'d',label:'DATABASE',kind:'store',col:1,row:3}],
    edges:[{f:'u',t:'w'},{f:'w',t:'a'},{f:'a',t:'d',l:'owns'}]},
   {cap:'Push the external payment provider off the critical path.',
    note:'Driver: zero duplicate captures, and a provider that can be slow. The call is bounded and retried outside the request.',
    nodes:[{id:'u',label:'CUSTOMER',kind:'human',col:1,row:0},{id:'w',label:'WEB',kind:'sys',col:1,row:1},
           {id:'a',label:'API',kind:'sys',col:1,row:2},{id:'d',label:'DATABASE',kind:'store',col:0,row:3},
           {id:'p',label:'PAYMENT',kind:'ext',col:2,row:3}],
    edges:[{f:'u',t:'w'},{f:'w',t:'a'},{f:'a',t:'d'},{f:'a',t:'p',l:'authorise'}]},
   {cap:'Add a worker for everything that must not block a user.',
    note:'Driver: harvest substitution, payment reconciliation, route export and notifications are all slow, retryable, or scheduled. Failure isolation demands they leave the request path.',
    nodes:[{id:'u',label:'CUSTOMER',kind:'human',col:0,row:0},{id:'f',label:'FARM STAFF',kind:'human',col:2,row:0},
           {id:'w',label:'WEB',kind:'sys',col:0,row:1},{id:'a',label:'API',kind:'sys',col:1,row:2},
           {id:'k',label:'WORKER',kind:'sys',col:2,row:2},{id:'d',label:'DATABASE',kind:'store',col:0,row:3},
           {id:'p',label:'PAYMENT',kind:'ext',col:2,row:3}],
    edges:[{f:'u',t:'w'},{f:'f',t:'a',l:'harvest'},{f:'w',t:'a'},{f:'a',t:'d'},{f:'a',t:'k',l:'enqueue',async:true},{f:'k',t:'d'},{f:'k',t:'p',l:'capture'}]},
   {cap:'The initial architecture. Five runtime pieces, each with a named driver.',
    note:'This is where initialization stops. Module boundaries inside the API are the next level down — and they are Chapter 44’s business, not today’s.',
    nodes:[{id:'u',label:'CUSTOMER',kind:'human',col:0,row:0},{id:'f',label:'FARM STAFF',kind:'human',col:2,row:0},
           {id:'w',label:'WEB',kind:'sys',col:0,row:1},{id:'a',label:'API',kind:'sys',col:1,row:2},
           {id:'k',label:'WORKER',kind:'sys',col:2,row:2},{id:'d',label:'DATABASE',kind:'store',col:0,row:3},
           {id:'p',label:'PAYMENT',kind:'ext',col:2,row:3},{id:'dl',label:'DELIVERY',kind:'ext',col:1,row:4}],
    edges:[{f:'u',t:'w'},{f:'f',t:'a'},{f:'w',t:'a'},{f:'a',t:'d'},{f:'a',t:'k',async:true},{f:'k',t:'d'},{f:'k',t:'p'},{f:'k',t:'dl',l:'route file 06:00'}]}]},

 {t:'callout', kind:'why', title:'Why each step names a driver',
  h:'<p>Because that is the review. Any element that cannot name the driver it serves is a candidate for removal — and this is the only moment when removing it is cheap. Six months later it has dependents.</p>'},

 {t:'h', h:'How far down to go'},
 {t:'ul', items:[
  '<strong>Go deep enough</strong> that a team can start work without inventing architecture on the fly',
  '<strong>Stop</strong> before you are designing the internals of a component nobody has built yet',
  '<strong>Go deeper only where risk is</strong> — payment reconciliation deserves detail now; the admin catalogue screen does not',
  '<strong>Record what you deliberately did not decide</strong>, as an open question with the trigger that will force it']},

 {t:'cp', items:[
   'Elaborate an architecture level by level rather than all at once',
   'Attach a driver to every structural element',
   'Decide where to go deeper based on risk',
   'Record deliberate non-decisions'],
  link:{label:'Capture it as a baseline', href:'#/ch/ch27'}},

 {t:'xref', items:[{t:'System Context', h:'#/ch/ch25'},{t:'Architecture Baseline', h:'#/ch/ch27'},{t:'From Architecture to System Design', h:'#/ch/ch33'}]}
]},

{id:'ch27', n:27, title:'Architecture Baseline', stage:'baseline',
 sum:'The baseline is the current agreed architectural model of the system. Nine parts, no more.',
 why:'Without a baseline there is nothing to review against, nothing to evolve, and no way to tell drift from design.',
 blocks:[
 {t:'h', h:'What a baseline must minimally establish'},
 {t:'p', h:'Seventeen items. Not seventeen documents — several of them are a paragraph, and two are a name. The test is whether the architectural contract is established, not whether the folder is full.'},
 {t:'ol', items:BASELINE_17.map(x => '<strong>' + x + '</strong>')},
 {t:'callout', kind:'rule', title:'Sufficient, not exhaustive',
  h:'<p>A baseline does not require every possible diagram. It requires enough for a competent engineer to build against it, and enough for a reviewer to disagree with it specifically. Volume is not the measure; <em>disagreeability</em> is. A baseline nobody can argue with has said nothing.</p>'},
 {t:'xref', items:[{t:'The Architecture Views', h:'#/ch/ch59'},{t:'Architecture Completeness', h:'#/ch/ch66'},{t:'Baseline Gate', h:'#/ch/ch28'}]},

 {t:'p', h:'A baseline is not a document you write once. It is the maintained answer to “what is this system, and why is it like this?” Click each row to see what satisfies it — and what a weak version looks like.'},

 {t:'baseline'},

 {t:'callout', kind:'rule', title:'Open questions belong in the baseline',
  h:'<p>A baseline with three open questions listed is stronger than one with none, because the second is almost certainly lying. Unknowns do not disappear when they go unrecorded; they simply become other people’s surprises.</p>'},

 {t:'art', name:'Architecture Baseline',
  purpose:'Describe the agreed architecture of the system, with the reasoning and the gaps.',
  when:'At the end of initialization; updated at every architectural change.',
  output:'A living document with diagrams, plus links to decisions and registers.',
  users:'Architects • Engineers • Reviewers • New joiners',
  template:['Purpose and scope','System context (diagram + externals)','Major structure (containers, responsibilities, owners)',
    'Architectural drivers, ranked and measured','Constraints','Quality attributes with targets','Important boundaries and what crosses them',
    'Significant decisions (linked ADRs)','Known assumptions with review dates','Open questions and what each blocks','Version and change history'],
  example:`BASELINE v1.2 — Farm Commerce Platform      2026-04-18

MAJOR STRUCTURE
  Web        customer + farm portal (SSR)     owner: Product eng
  API        ordering, catalogue, supply,     owner: Platform
             billing coordination
  Worker     payment capture, substitution,   owner: Platform
             route export, notifications
  Database   single primary, per-module       owner: Platform
             write grants

BOUNDARIES
  Public edge        authenticate, validate, rate limit
  Domain boundary    authorised commands only
  Data ownership     one writer per entity (ARC-004)

DECISIONS      ADR-001 modular monolith
               ADR-002 cut-off as an ordering invariant
               ADR-003 harvest confirmation is async
               ADR-004 payment capture via worker + idempotency

OPEN QUESTIONS
  Q1  Same-day delivery in year two?   blocks: ordering boundary
  Q2  Cross-border tax treatment?      blocks: pricing model
  Q3  Farm-managed pricing?            blocks: catalogue ownership`},

 {t:'cp', items:[
   'List what a minimum baseline contains',
   'Explain why open questions strengthen a baseline',
   'Distinguish a baseline from a one-off design document',
   'Identify what is missing from an existing baseline'],

 {t:'xref', items:[{t:'Baseline Gate', h:'#/ch/ch28'},{t:'Evolving the Baseline', h:'#/ch/ch52'},{t:'Documentation as a System', h:'#/ch/ch41'}]}
]},

{id:'ch28', n:28, title:'Architecture Baseline Gate', stage:'baseline',
 sum:'Ten objective criteria to pass before substantial delivery begins. Each one has evidence that satisfies it.',
 why:'A gate is how a team agrees that uncertainty has been reduced enough to spend money safely.',
 blocks:[
 {t:'p', h:'Click any item to see the evidence that satisfies it. This is a learning tool — ticking boxes here reflects your own reading, not a validated project.'},

 {t:'gate', title:'Architecture Baseline Gate', sim:true,
  items:[
   {l:'System boundary is defined', ev:'A context view that a product person and an engineer describe the same way, plus an explicit out-of-scope list.'},
   {l:'Major actors are identified', ev:'Every actor named with what they need from the system; no “users” as a single undifferentiated group.'},
   {l:'Major capabilities are understood', ev:'A capability list mapped to structure, showing which part serves which capability.'},
   {l:'Major dependencies are identified', ev:'External systems table with ownership, protocol, failure behaviour, trust and exit cost.'},
   {l:'Architectural shape is established', ev:'Container-level structure where every element names the driver it serves.'},
   {l:'Architectural drivers are identified and ranked', ev:'Three to seven drivers, measured where possible, each traceable to at least one decision.'},
   {l:'Important risks are identified', ev:'A risk register entry per high-impact assumption or unknown, with impact and a trigger.'},
   {l:'Significant decisions are recorded', ev:'An ADR for every decision that would be expensive to reverse, with rejected options preserved.'},
   {l:'Documentation exists and is findable', ev:'Baseline stored where engineers work, not in a private drive, and linked from the repository.'},
   {l:'An owner and a reviewer are identified', ev:'A named person accountable for the baseline and a named reviewer who is not the author.'}]},

 {t:'callout', kind:'warn', title:'What a gate is not',
  h:'<p>It is not a sign-off ceremony, a date to be defended, or a promise that the architecture is correct. It is a check that <em>enough uncertainty has been removed to proceed safely</em>. Failing a gate is a normal, useful outcome: it names exactly what to do next.</p>'},

 {t:'h', h:'Failing well'},
 {t:'table', filter:false, cols:['Failed item','Usual real cause','Next action'],
  rows:[
   ['Boundary undefined','Product scope genuinely unsettled','Timebox a scope decision; record the assumption you will proceed on'],
   ['Drivers unranked','Nobody will say no to a stakeholder','Force a ranking in one session with the trade-off made explicit'],
   ['No significant decisions recorded','Decisions were made implicitly','Reverse-engineer two or three ADRs from the current design'],
   ['Risks not identified','Assumptions never separated from facts','Run Chapter 17 on the current understanding'],
   ['No reviewer','No second architect available','Use a senior engineer from an adjacent team; outside eyes matter more than title']]},

 {t:'cp', items:[
   'State the ten baseline criteria and the evidence for each',
   'Run a gate without turning it into theatre',
   'Respond usefully to a failed criterion',
   'Explain why a gate reduces risk rather than adding process'],
  link:{label:'On to decision-making', href:'#/ch/ch29'}},

 {t:'xref', items:[{t:'Architecture Gates', h:'#/ch/ch49'},{t:'Architecture Baseline', h:'#/ch/ch27'},{t:'Architecture Review', h:'#/ch/ch47'}]}
]}
]},

/* ===================== PART VII ===================== */
{id:'p7', num:'VII', title:'Architectural Decision-Making', stage:'decide',
 intro:'Decisions are the durable part of architecture. Structures change; the reasoning is what lets the next person change them safely.',
 chapters:[

{id:'ch29', n:29, title:'What Is an Architectural Decision?', stage:'decide',
 sum:'Six things that sound alike in a meeting and behave completely differently afterwards.',
 why:'Half of all architecture confusion is a category error about which of these six is being discussed.',
 blocks:[
 {t:'sixgrid', items:[
  {k:'Fact', t:'Verifiable and true now', tone:'green', h:'The partner API accepts a batch file at 06:00. Check it; it is either true or not.'},
  {k:'Assumption', t:'Believed, unverified', tone:'amber', h:'Under 20,000 households in year one. Needs an owner, a date and an impact-if-wrong.'},
  {k:'Preference', t:'A taste, held by a person', tone:'', h:'“I would rather use this framework.” Legitimate, not binding, and not evidence.'},
  {k:'Decision', t:'A commitment among options', tone:'purple', h:'We will keep one deployable with enforced module boundaries. Has consequences and an exit cost.'},
  {k:'Constraint', t:'Must be true; not ours to change', tone:'blue', h:'Card data must never reach our systems. Eliminates options for free.'},
  {k:'Standard', t:'Normative across the organisation', tone:'blue', h:'Each entity has exactly one writing owner. Applies beyond this system.'}]},

 {t:'h', h:'The test for architectural significance'},
 {t:'p', h:'A decision is architecturally significant if any of these is true:'},
 {t:'ul', items:[
  'It is <strong>expensive to reverse</strong> — measured in weeks or in data migration',
  'It <strong>constrains other decisions</strong> — it removes options from people not in the room',
  'It <strong>crosses a boundary</strong> — between teams, systems, or trust levels',
  'It <strong>affects a quality attribute</strong> that appears in your drivers',
  'It <strong>changes who owns what</strong> — data, capability or operational responsibility']},

 {t:'callout', kind:'note', title:'The cheapest possible test',
  h:'<p>Ask: “if we get this wrong, what does fixing it look like?” If the honest answer involves a migration, a coordinated release across teams, or a conversation with a customer, write it down as a decision.</p>'},

 {t:'gw', good:['Decisions distinguished from preferences in writing','Facts checked rather than asserted','Constraints traced to a source','Standards cited by identifier'],
  weak:['Preferences presented with the confidence of facts','Assumptions never labelled as such','Constraints that are really someone’s opinion','Standards that exist only as habit']},

 {t:'cp', items:[
   'Classify a statement as fact, assumption, preference, decision, constraint or standard',
   'Apply the architectural significance test',
   'Explain why a preference is legitimate but not binding'],
  link:{label:'Now make one properly', href:'#/ch/ch30'}},

 {t:'xref', items:[{t:'Constraints & Assumptions', h:'#/ch/ch6'},{t:'Decision Framework', h:'#/ch/ch30'},{t:'ADRs', h:'#/ch/ch31'}]}
]},

{id:'ch30', n:30, title:'Decision Framework', stage:'decide',
 sum:'Problem, options, criteria, evidence, trade-offs, decision, consequences — a sequence that makes reasoning visible.',
 why:'The purpose is not to find the optimal answer. It is to make the reasoning inspectable, so it can be revisited when the world changes.',
 blocks:[
 {t:'ascii', cap:'The framework', art:
`Problem
   ↓
Options        at least three, one of which is "do nothing"
   ↓
Criteria       derived from drivers, not invented here
   ↓
Evidence       proportional to consequence and uncertainty
   ↓
Trade-offs     what each option costs, stated plainly
   ↓
Decision       one option, chosen, with a date
   ↓
Consequences   what becomes easy, hard, impossible; exit cost`},

 {t:'p', h:'Below is a real decision from the worked example, presented as a decision canvas. Select an option to see how it scores against criteria that came directly from the ranked drivers — and read the trade-off before the recommendation.'},

 {t:'dec', title:'ADR-001 — How should the system be decomposed?',
  problem:'We need a structure that lets four engineers deliver weekly while keeping ordering invariants enforceable and payment correct. The catalogue changes weekly; ordering rules change monthly; billing rarely changes.',
  drivers:['Small team, no operations specialist','Payment correctness','Weekly cut-off peak','Seasonal catalogue change'],
  criteria:['Operability with 4 engineers','Invariant enforceability','Independent change','Peak scalability','Exit cost'],
  options:[
   {t:'A — Single application, no internal boundaries', d:'Everything in one deployable, no enforced module structure.',
    scores:[90,30,25,55,35],
    trade:'Fastest to start and simplest to operate. Invariants erode quickly because nothing stops any code writing any table; within two quarters, ordering rules are being applied in three places. Exit cost is high precisely because the boundaries were never there to cut along.'},
   {t:'B — Modular monolith with enforced boundaries', d:'One deployable; modules own their data; dependency and grant rules enforced in CI.',
    scores:[85,85,70,70,75],
    trade:'Operationally simple, invariants enforceable, boundaries real enough to split later. Costs discipline: the guardrails must exist from the start or the modules become folders. Scaling is coarse-grained — the whole application scales together, which the cut-off peak makes acceptable but not free.'},
   {t:'C — Service per capability', d:'Separate deployables for ordering, catalogue, supply, billing, fulfilment.',
    scores:[25,70,90,85,55],
    trade:'Maximum independence and precise scaling. Buys five deployment pipelines, distributed failure modes, cross-service data consistency and an on-call surface that four engineers without an operations specialist cannot carry. Invariant enforcement gets harder, not easier, because ordering now spans a network.'}],
  evidence:'A cut-off load test against a single application at 40× median write rate reached p95 210ms with 35% headroom — the peak driver does not require per-capability scaling. A one-week spike implemented the dependency-boundary validator and the per-module grants, proving the guardrails are cheap enough to be real.',
  decision:'Option B — modular monolith with enforced boundaries. Modules: identity, catalogue, ordering, supply, billing, fulfilment. Ownership enforced by per-module database grants and a CI dependency check.',
  consequences:'<strong>Easy:</strong> one pipeline, one on-call surface, transactional invariants inside a module, low-friction refactoring of boundaries while they are still cheap.<br><strong>Hard:</strong> independent scaling per capability; independent release cadence per team.<br><strong>Impossible without revisiting:</strong> a team that needs to deploy on its own schedule without coordination.<br><strong>Exit:</strong> moderate. Because modules own their data and the boundaries are enforced, extracting one is a scoped project rather than an excavation. <strong>Revisit when:</strong> a second team forms, or one capability needs a materially different scaling profile.'},

 {t:'callout', kind:'rule', title:'On scoring',
  h:'<p>The bars above are a <em>communication device</em>, not a calculation. Do not sum them, do not weight them, and never let a total pick the option. The moment a number decides, people tune the numbers. The decision is made by reading the trade-offs; the bars only make the shape of the comparison visible at a glance.</p>'},

 {t:'h', h:'Always include “do nothing”'},
 {t:'p', h:'The option to defer is real, and often correct. Deferring is only legitimate when you can state three things: what you are waiting for, what it costs to wait, and what triggers the decision. Otherwise “we will decide later” is a decision to let the system decide for you.'},

 {t:'cp', items:[
   'Run a decision through the seven-step framework',
   'Derive criteria from drivers instead of inventing them',
   'Present trade-offs rather than a winner',
   'Defer a decision explicitly, with a trigger'],
  link:{label:'Record it as an ADR', href:'#/ch/ch31'}},

 {t:'xref', items:[{t:'Evidence & Spikes', h:'#/ch/ch32'},{t:'ADRs', h:'#/ch/ch31'},{t:'Architectural Drivers', h:'#/ch/ch5'}]}
]},

{id:'ch31', n:31, title:'Architecture Decision Records', stage:'decide',
 sum:'A durable, dated record of one decision, its reasoning, its rejected alternatives and its consequences.',
 why:'Six months later, nobody remembers why. An ADR is the difference between evolving an architecture and re-litigating it.',
 blocks:[
 {t:'p', h:'Walk the stages below. Each reveals the corresponding section of a real ADR from the worked example — and what that section is actually for.'},

 {t:'adr', id:'ADR-004', title:'Payment capture occurs in a worker, keyed by idempotency',
  stages:[
   {k:'Context', h:'<h4>Context</h4><p>Baskets remain editable until Thursday 18:00. Capture happens after the cut-off against a final basket. The provider’s p99 is 1.4s and it occasionally times out while still completing the capture on its side. We have no operations specialist and one on-call rotation.</p><p><em>What this section is for:</em> the situation a future reader will no longer remember. Not the decision, not the options — the world as it was.</p>'},
   {k:'Problem', h:'<h4>Problem</h4><p>Where should payment capture execute, and how do we guarantee that a network failure, a retry or a duplicate request cannot produce two captures for one order?</p><p><em>What this section is for:</em> one question, answerable. If the problem statement contains “and”, it is probably two ADRs.</p>'},
   {k:'Drivers', h:'<h4>Drivers</h4><ul class="bl"><li>Payment correctness — zero duplicate captures (ranked High)</li><li>Weekly cut-off peak — capture volume concentrates immediately after 18:00</li><li>Small team — no appetite for a component that needs bespoke operational care</li></ul><p><em>What this section is for:</em> traceability. Every criterion below must descend from a driver here.</p>'},
   {k:'Options', h:'<h4>Options considered</h4><ol class="nl"><li><strong>Synchronous capture in the request</strong> — simplest control flow; couples user-facing latency to provider latency; retries are unsafe without keys anyway.</li><li><strong>Worker with idempotency keys</strong> — capture leaves the request path; retry is safe; adds a worker and a reconciliation path.</li><li><strong>Provider-driven via webhooks only</strong> — least code; depends entirely on webhook delivery, which is at-least-once and occasionally delayed by hours.</li></ol><p><em>What this section is for:</em> proof that alternatives existed. An ADR with one option is an announcement.</p>'},
   {k:'Criteria', h:'<h4>Decision criteria</h4><ul class="bl"><li>Can a duplicate capture occur under retry, double-submit or network partition?</li><li>Does provider latency reach the user?</li><li>How many new runtime components and failure modes?</li><li>Can we detect and reconcile an unknown outcome?</li></ul>'},
   {k:'Evidence', h:'<h4>Evidence</h4><p>A two-day spike replayed 10,000 captures with duplicate keys against the provider sandbox: exactly one capture per key, confirmed by provider ledger. Timeout injection at 800ms showed 0.4% of captures complete on the provider side after our client gives up — confirming that the “unknown outcome” state is not hypothetical and must exist in the model.</p><p><em>What this section is for:</em> the weight behind the decision. Note that the evidence changed the design, not just the confidence.</p>'},
   {k:'Decision', h:'<h4>Decision</h4><p>Capture executes in the worker. Every capture carries an idempotency key derived from <code class="i">order_id + order_version</code>. The order state machine includes an explicit <code class="i">capture_unknown</code> state, reconciled by querying the provider and by webhook, treated as two independent sources of truth.</p><p><strong>Status:</strong> Accepted, 2026-03-14. <strong>Owner:</strong> Platform.</p>'},
   {k:'Consequences', h:'<h4>Consequences</h4><p><strong>Easy:</strong> safe retries; provider latency invisible to users; a single place to reason about capture.</p><p><strong>Hard:</strong> the customer does not get an instant final confirmation; the UI must express “confirming” honestly (see UX lens).</p><p><strong>New obligations:</strong> the worker becomes on-call surface; key lifetime must exceed the retry window; the reconciliation job needs its own monitoring.</p>'},
   {k:'Risks', h:'<h4>Risks</h4><ul class="bl"><li>Key lifetime shorter than the provider’s retry window would silently re-enable duplicates. <em>Mitigation:</em> keys retained 30 days; a test asserts the window.</li><li>Webhook signature verification failure would strand orders in <code class="i">capture_unknown</code>. <em>Mitigation:</em> alert on state age over 15 minutes.</li></ul>'},
   {k:'Rejected', h:'<h4>Rejected alternatives</h4><p><strong>Synchronous capture</strong> — rejected: couples user latency to a dependency with a 1.4s p99, and the timeout case still requires the same reconciliation machinery, so it costs the complexity without the benefit.</p><p><strong>Webhook-only</strong> — rejected: at-least-once delivery with occasional multi-hour delay cannot meet the customer confirmation expectation, and makes us unable to answer “did it work?” on demand.</p><p><em>What this section is for:</em> stopping the same debate from restarting annually. Record why an option lost, not merely that it did.</p>'},
   {k:'Related', h:'<h4>Related</h4><ul class="bl"><li>ADR-001 — modular monolith (constrains where the worker lives)</li><li>ADR-003 — harvest confirmation is asynchronous (same reconciliation pattern)</li><li>ARC-004 — single writer per entity (billing owns payment intents)</li><li>Risk R-02 — provider outage during the capture window</li></ul>'}]},

 {t:'h', h:'ADR practice'},
 {t:'gw', good:['One decision per record','Rejected options preserved with their reasons','Status and date maintained','Superseded records kept, marked, and linked forward','Stored in the repository, reviewed like code'],
  weak:['A record describing a design, not a decision','Only the chosen option documented','Status “proposed” eighteen months later','Superseded records deleted','Living in a wiki nobody opens']},

 {t:'callout', kind:'note', title:'Supersede, never delete',
  h:'<p>When a decision changes, write a new ADR and mark the old one <em>Superseded by ADR-0NN</em>. The historical record is what lets a future team understand that the old choice was correct given what was known then — which is the difference between learning and blame.</p>'},

 {t:'cp', items:[
   'Write an ADR with context, problem, options, criteria, evidence, decision and consequences',
   'Explain the purpose of the rejected-alternatives section',
   'Maintain status and supersession correctly',
   'Tell an ADR apart from a design document'],
  link:{label:'How much evidence is enough?', href:'#/ch/ch32'}},

 {t:'xref', items:[{t:'Decision Framework', h:'#/ch/ch30'},{t:'Architecture Document Types', h:'#/ch/ch42'},{t:'Evolving the Baseline', h:'#/ch/ch52'}]}
]},

{id:'ch32', n:32, title:'Evidence, Experiments & Spikes', stage:'decide',
 sum:'The more consequential and uncertain the decision, the stronger the evidence should be. This chapter makes that a calculation.',
 why:'Teams either gather no evidence and call it pragmatism, or gather evidence forever and call it diligence.',
 blocks:[
 {t:'quote', h:'The more consequential and uncertain the decision, the stronger the evidence should be.'},

 {t:'h', h:'Sizing the evidence'},
 {t:'table', filter:false, cols:['Consequence','Uncertainty','Proportionate evidence'],
  rows:[
   ['Low','Low','Decide. Record one line if it constrains anyone else.'],
   ['Low','High','Timebox a half-day spike; pick the reversible option.'],
   ['High','Low','Write the ADR. Cite the existing evidence you are relying on.'],
   ['High','High','Prototype, benchmark or load test before committing. This is where spikes pay for themselves.'],
   ['Very high (permanent)','Any','Multiple forms of evidence plus an independent reviewer. Data models, public contracts and residency live here.']]},

 {t:'h', h:'Forms of evidence'},
 {t:'disc', items:[
  {k:'01', t:'Prototype', h:'<p>Answers “can this be built the way we think?” Keep it disposable, and be explicit that it is. A prototype that quietly becomes production is how an experiment turns into an architecture nobody decided on.</p>'},
  {k:'02', t:'Benchmark', h:'<p>Answers “is it fast enough, under what conditions?” Always record the conditions: data volume, concurrency, hardware, cache state. A benchmark without conditions is an anecdote with decimals.</p>'},
  {k:'03', t:'Proof of concept', h:'<p>Answers “does this integration actually work end to end?” Especially valuable for third parties whose documentation describes an aspiration.</p>'},
  {k:'04', t:'Load test', h:'<p>Answers “where does it break, and how?” The <em>how</em> matters more than the number — graceful rejection and catastrophic collapse have the same throughput ceiling and completely different consequences.</p>'},
  {k:'05', t:'Security test', h:'<p>Answers “does the control hold when someone tries?” Threat modelling produces hypotheses; testing produces evidence.</p>'},
  {k:'06', t:'Vendor evaluation', h:'<p>Answers “what are we actually committing to?” Evaluate the failure behaviour, the support model, the exit path and the roadmap — not the feature grid.</p>'},
  {k:'07', t:'Technical spike', h:'<p>Timeboxed investigation with a written question and a written answer. The output is a paragraph in an ADR, not a branch.</p>'}]},

 {t:'callout', kind:'rule', title:'Every spike needs a question and an expiry',
  h:'<p>Write the question before starting: <em>“Can 10,000 captures with duplicate idempotency keys produce more than one charge in the provider sandbox?”</em> That is answerable in two days. <em>“Investigate payments”</em> is answerable in two months and answers nothing.</p>'},

 {t:'callout', kind:'fail', title:'Common failure — evidence gathered after the decision',
  h:'<p><strong>❌ Choosing the option, then running a benchmark to confirm it.</strong></p><p><strong>Why it fails:</strong> the experiment is designed to pass. Its conditions are the ones the chosen option is good at, and the result is reported as validation. A useful test is one whose outcome could have changed the decision — if it could not, do not run it.</p>'},

 {t:'cp', items:[
   'Size evidence by consequence and uncertainty',
   'Choose the right form of evidence for a question',
   'Write a spike question that is answerable in days',
   'Recognise evidence that was collected to confirm'],
  link:{label:'Move from architecture to system design', href:'#/ch/ch33'}},

 {t:'xref', items:[{t:'Decision Framework', h:'#/ch/ch30'},{t:'Performance Lens', h:'#/ch/ch17'},{t:'Constraints & Assumptions', h:'#/ch/ch6'}]}
]}
]},

/* ===================== PART VIII ===================== */
{id:'p8', num:'VIII', title:'System Design', stage:'design',
 intro:'Architecture says what the system is shaped like. System design says how a particular capability actually works — in enough detail to build safely, and no more.',
 chapters:[

{id:'ch33', n:33, title:'From Architecture to System Design', stage:'design',
 sum:'Descend deliberately: architecture, capability, use case, workflow, component interaction, detailed design.',
 why:'Starting at the bottom produces detailed designs for a structure nobody validated.',
 blocks:[
 {t:'ascii', cap:'The descent', art:
`Architecture
     ↓
Capability          "adjust a weekly box"
     ↓
Use case            "customer swaps an item before cut-off"
     ↓
Workflow            the steps, including failure branches
     ↓
Component interaction   who calls whom, with what contract
     ↓
Detailed design     interfaces, data, states, errors`},

 {t:'p', h:'The depth model below is the same idea expressed as zoom levels. Each level answers a different question and has a different audience. Click to descend.'},

 {t:'depth'},

 {t:'callout', kind:'rule', title:'Do not start at Level 4',
  h:'<p>Detail at the bottom is fast to produce and feels like progress. It is also the most expensive work to throw away, and it anchors the levels above it — once twenty classes assume a boundary, the boundary is decided. Descend only where the risk is, and only after the level above has been challenged.</p>'},

 {t:'h', h:'How much design is enough?'},
 {t:'p', h:'Enough that a competent team can implement without inventing architecture. Concretely, a design is finished when these are all answerable:'},
 {t:'ul', items:[
  'Which component owns this behaviour, and which owns the data it touches?',
  'What is the contract at each boundary crossed, including errors?',
  'What happens on each failure branch, and who retries?',
  'What state exists, where does it live, and who may change it?',
  'What must be true before and after — the invariants?',
  'How will we know in production that it is working?']},
 {t:'p', h:'Anything beyond those answers is implementation, and implementation is better decided by the person writing it with the tests in front of them.'},

 {t:'cp', items:[
   'Descend from architecture to design in order',
   'Choose the right level for a given question and audience',
   'Recognise a design that is finished',
   'Resist detail that outruns validation'],
  link:{label:'Design the components', href:'#/ch/ch34'}},

 {t:'xref', items:[{t:'Establishing the Initial Architecture', h:'#/ch/ch26'},{t:'Designing Components', h:'#/ch/ch34'},{t:'Diagramming', h:'#/ch/ch44'}]}
]},

{id:'ch34', n:34, title:'Designing Components', stage:'design',
 sum:'Responsibilities, interfaces, dependencies, state, ownership, contracts, error boundaries.',
 why:'A component with a fuzzy responsibility becomes the place everything difficult is put.',
 blocks:[
 {t:'p', h:'A component design is seven short answers. If any is missing, the component is not designed — it is named.'},
 {t:'table', filter:false, cols:['Facet','The question','Weak answer','Strong answer'],
  rows:[
   ['Responsibility','What is it accountable for?','“Handles orders”','“Owns the order lifecycle and enforces cut-off and basket invariants”'],
   ['Interface','How is it used?','“It has a service class”','“Four commands and two queries, each with a defined error set”'],
   ['Dependencies','What does it need?','“The usual”','“Catalogue read model, payment gateway port, clock”'],
   ['State','What does it hold?','“Some caching”','“Owns order and basket tables; holds no in-memory state between requests”'],
   ['Ownership','Who changes it?','“The backend team”','“Ordering team; reviewers named in CODEOWNERS”'],
   ['Contracts','What does it promise?','“Returns an order”','“Returns the order or one of: NotFound, CutOffPassed, ItemUnavailable, Conflict”'],
   ['Error boundary','What does it absorb?','“Errors bubble up”','“Translates gateway faults into domain outcomes; never leaks vendor errors upward”']]},

 {t:'h', h:'Interfaces express intent'},
 {t:'code', file:'ordering/ports.ts', lang:'typescript',
  lines:[
   {c:'// Commands the ordering module accepts. Nothing else may', note:'The comment states the boundary rule. The type system enforces the rest.'},
   {c:'// change an order.'},
   {c:'export type OrderingCommands = {'},
   {c:'  createBasket(customerId: CustomerId, week: DeliveryWeek): Basket'},
   {c:'  swapItem(basketId: BasketId, out: SkuId, in_: SkuId): Result<Basket, SwapError>', note:'Intent-shaped: “swap an item”, not “update basket”. An intent-shaped operation can enforce an invariant; a field setter cannot.'},
   {c:'  confirmBasket(basketId: BasketId, key: IdempotencyKey): Result<Order, ConfirmError>', note:'The idempotency key is in the signature. A required key cannot be forgotten; a documented key will be.'},
   {c:'}'},
   {c:''},
   {c:'export type SwapError =', note:'The error set is part of the contract. Callers can handle each case distinctly — the opposite of a generic failure.'},
   {c:'  | { kind: "CutOffPassed"; cutOff: Instant }'},
   {c:'  | { kind: "ItemUnavailable"; sku: SkuId }'},
   {c:'  | { kind: "NotInBasket"; sku: SkuId }'},
   {c:''},
   {c:'// Ports the module needs. Defined here, implemented outside.', note:'Dependency inversion in one line: the consumer owns the abstraction, so infrastructure depends on the domain rather than the reverse.'},
   {c:'export interface PaymentGateway {'},
   {c:'  capture(intent: PaymentIntent, key: IdempotencyKey): Promise<CaptureOutcome>'},
   {c:'}'}]},

 {t:'callout', kind:'why', title:'Why error sets belong in the design',
  h:'<p>Because they determine the user experience, the retry behaviour and the observability — three lenses at once. A design that says “returns an order” has quietly deferred all three decisions to whoever writes the code at 5pm on Friday.</p>'},

 {t:'xref', items:[{t:'API & Contract Design', h:'#/ch/ch35'},{t:'Engineering Lens', h:'#/ch/ch10'},{t:'Structure principles', h:'#/ch/ch7'}]}
]},

{id:'ch35', n:35, title:'API & Contract Design', stage:'design',
 sum:'Boundaries, commands and queries, request and response shape, errors, versioning, idempotency, authentication and authorisation.',
 why:'An API is the most public architectural decision you will make and the hardest one to take back.',
 blocks:[
 {t:'ul', items:[
  '<strong>Boundary</strong> — who may call this, from which trust zone, and what is validated on entry',
  '<strong>Commands vs queries</strong> — commands change state and need idempotency; queries do not and can be cached',
  '<strong>Shape</strong> — expressed in domain language, not storage language',
  '<strong>Errors</strong> — machine-readable codes, stable, documented, mapped to transport deliberately',
  '<strong>Versioning</strong> — decided before the first consumer, never after the second',
  '<strong>Idempotency</strong> — required for every state-changing operation that may be retried',
  '<strong>Authentication</strong> — who is calling',
  '<strong>Authorisation</strong> — what they may do, enforced in one layer']},

 {t:'h', h:'Error contracts'},
 {t:'code', file:'api/errors.http', lang:'http',
  lines:[
   {c:'HTTP/1.1 409 Conflict', note:'Transport status is a summary for machines that only speak HTTP. The body carries the real contract.'},
   {c:'Content-Type: application/problem+json'},
   {c:''},
   {c:'{'},
   {c:'  "type":   "https://api.farm.example/errors/cut-off-passed",', note:'A stable identifier. Consumers branch on this, never on the message text, which is free to change.'},
   {c:'  "title":  "The cut-off for this delivery week has passed",'},
   {c:'  "detail": "Week 2026-W17 closed at 2026-04-23T18:00:00Z",'},
   {c:'  "cutOff": "2026-04-23T18:00:00Z",', note:'Machine-usable data, so the client can render the real deadline instead of a generic apology.'},
   {c:'  "retryable": false,', note:'Tells callers and middleware whether retrying could ever help. This single field removes an entire class of retry storms.'},
   {c:'  "traceId": "01HW3K9QX5"', note:'Connects the user-visible failure to telemetry. Support can answer “what happened to my order?” in one query.'},
   {c:'}'}]},

 {t:'h', h:'Versioning decisions'},
 {t:'table', filter:false, cols:['Strategy','Good for','Costs'],
  rows:[
   ['Additive only, never break','Internal APIs with cooperative consumers','Accumulating optional fields; the shape tells the history'],
   ['Versioned path (/v2/)','Public APIs with independent consumers','Parallel implementations and a migration programme'],
   ['Media-type / header versioning','Fine-grained evolution','Harder to observe, cache and debug'],
   ['Consumer-driven contracts','Few, known consumers','Requires consumer test suites and coordination']]},
 {t:'p', h:'Pick before the first external consumer exists. After the second one arrives, every option has a migration attached.'},

 {t:'callout', kind:'fail', title:'Common failure — the database shape as the public contract',
  h:'<p><strong>❌ Returning rows.</strong></p><p><strong>Why it fails:</strong> the storage model becomes a published contract you cannot change without breaking consumers. Denormalising for performance, renaming for clarity, or splitting a table all become breaking API changes. The fix is a translation at the boundary — slightly tedious, permanently valuable.</p>'},

 {t:'xref', items:[{t:'Information Hiding', h:'#/ch/ch7'},{t:'Data Design', h:'#/ch/ch36'},{t:'Security Design', h:'#/ch/ch39'}]}
]},

{id:'ch36', n:36, title:'Data Design', stage:'design',
 sum:'Entities, ownership, relationships, persistence, transactions, consistency, caching, migration.',
 why:'Data decisions outlive the code that made them, the team that wrote it, and usually the company’s first two architectures.',
 blocks:[
 {t:'p', h:'Start from ownership, not from tables. The Data lens (Chapter 26) produced the ownership table; data design turns it into a model with transactions, consistency and a migration path.'},

 {t:'h', h:'Transaction boundaries'},
 {t:'ascii', cap:'What belongs in one transaction', art:
`INSIDE one transaction          OUTSIDE it
────────────────────────        ──────────────────────
Order + order lines             Sending email
Basket + basket version         Calling the payment provider
Reservation + stock counter     Writing the search index
Outbox row for the event        Building the route file

RULE  A transaction may span only data owned by the same
      module, and must never contain a network call to a
      system you do not control.`},
 {t:'p', h:'The outbox row in the left column is the trick that makes the right column safe: the state change and the intent to publish commit together, and a relay publishes afterwards. Without it you are choosing between lost events and phantom events.'},

 {t:'h', h:'Consistency per workflow'},
 {t:'table', filter:true, cols:['Workflow','Consistency required','Why','Window the user may see'],
  rows:[
   ['Basket edit','Strong','Two edits must not lose each other before cut-off','None'],
   ['Stock reservation','Strong','Overselling a harvest is a real-world failure','None'],
   ['Payment capture','Strong + idempotent','Money; duplicates unacceptable','None, but “confirming” state is visible'],
   ['Catalogue availability','Eventual (seconds)','Publishing is farm-driven and tolerant','Up to 30s stale, labelled'],
   ['Substitution notice','Eventual (< 60s)','Driver-specified','Under one minute'],
   ['Sales dashboard','Eventual (minutes)','Reporting, not decision-critical','Up to 5 minutes, timestamped']]},

 {t:'h', h:'Migration is part of the design'},
 {t:'ol', items:[
  'Add the new structure alongside the old — nothing reads it yet.',
  'Write to both; reads still come from the old. Deployable and reversible.',
  'Backfill, with a verification query that proves equivalence.',
  'Switch reads to the new structure behind a flag.',
  'Stop writing to the old; keep it readable for the rollback window.',
  'Remove the old structure, in a separate release.']},
 {t:'callout', kind:'note', title:'Rollback is why this has six steps',
  h:'<p>Each step is independently deployable and reversible. A migration that changes structure and reads in one release converts any bug into an outage with no way back — which is how “we cannot roll back because of the migration” becomes a sentence people say.</p>'},

 {t:'xref', items:[{t:'Data Lens', h:'#/ch/ch15'},{t:'State & Event Design', h:'#/ch/ch38'},{t:'Data principles', h:'#/ch/ch7'}]}
]},

{id:'ch37', n:37, title:'Workflow & Sequence Design', stage:'design',
 sum:'Show the steps, the boundaries they cross, and — most importantly — the failure branches.',
 why:'A happy-path sequence diagram is a marketing artifact. The branches are where the architecture lives.',
 blocks:[
 {t:'p', h:'Play the sequence below. At every step you get what happens, why it happens there, what can fail, and which boundary is being crossed. That fourth column is the one that turns a diagram into architecture.'},

 {t:'seq', title:'Confirm basket → order → capture',
  steps:[
   {from:'Customer', to:'Web', msg:'Confirm my box for this week',
    what:'The customer commits the basket before the Thursday 18:00 cut-off.',
    why:'Confirmation is an explicit act because it starts a money flow. An implicit auto-confirm would remove the user’s last moment of control.',
    fail:'Connection lost. Nothing has changed server-side; the basket is still editable.',
    bnd:'Untrusted → public edge'},
   {from:'Web', to:'API', msg:'POST /baskets/{id}/confirm  (Idempotency-Key)',
    what:'A command carrying a client-generated idempotency key.',
    why:'The key is generated by the client because the client is what retries. A server-generated key cannot deduplicate a retry.',
    fail:'Timeout. The client retries with the same key; the server returns the original outcome rather than acting twice.',
    bnd:'Public edge → application (authenticate, authorise, validate)'},
   {from:'API', to:'Ordering', msg:'confirmBasket(basketId, key)',
    what:'The application service resolves the principal, checks authorisation, and calls the domain.',
    why:'Authorisation lives here — not in transport, where it would be bypassable by other entry points, and not in the domain, which should not know about principals.',
    fail:'Unauthorised: rejected before any state changes and recorded in the audit log.',
    bnd:'Application → domain'},
   {from:'Ordering', to:'Ordering', msg:'Enforce cut-off and basket invariants',
    what:'Is the week still open? Is every item still available? Is this basket version current?',
    why:'The invariant is enforced by the owner of the data, so every path — API, admin tool, worker — gets the same rule.',
    fail:'CutOffPassed or ItemUnavailable returned as a typed outcome, not an exception. The UI can act on both.',
    bnd:'None — inside the domain'},
   {from:'Ordering', to:'Database', msg:'Persist order + outbox row (one transaction)',
    what:'The order and the intent to publish OrderConfirmed commit atomically.',
    why:'Without the outbox, the system can either lose the event (commit, then crash) or publish a phantom (publish, then roll back).',
    fail:'Constraint violation or store unavailable: the whole transaction rolls back; no partial order exists.',
    bnd:'Domain → persistence (owned tables only)'},
   {from:'Ordering', to:'Worker', msg:'OrderConfirmed (via outbox relay)',
    what:'The relay publishes after commit; the worker picks up capture and notification work.',
    why:'Capture is slow, retryable and involves a third party — three reasons it must not be in the request path.',
    fail:'Relay lag. The order exists and is correct; the capture is merely late. An alert fires on outbox age.',
    bnd:'Synchronous → asynchronous'},
   {from:'API', to:'Customer', msg:'200 — order confirmed, payment confirming',
    what:'The response returns before capture has happened.',
    why:'Because it must be honest. The architecture is asynchronous here; the message says so instead of implying a completed payment.',
    fail:'If the response is lost, the retry with the same key returns the identical result.',
    bnd:'Application → untrusted'},
   {from:'Worker', to:'Payment', msg:'capture(intent, key)',
    what:'The capture executes with the idempotency key derived from order id and version.',
    why:'Retries are now safe by construction rather than by carefulness.',
    fail:'Timeout with unknown outcome → the order moves to capture_unknown and is reconciled by query and by webhook.',
    bnd:'Our system → external provider (untrusted response)'}]},

 {t:'callout', kind:'fail', title:'Common failure — the diagram with no branches',
  h:'<p><strong>❌ Eight arrows, all of which succeed.</strong></p><p><strong>Why it fails:</strong> the design has not been done. Every one of those arrows can time out, be rejected, arrive twice or succeed invisibly. A sequence without branches communicates confidence that the team has not earned, and hides exactly the decisions the reviewer needs to see.</p>'},

 {t:'xref', items:[{t:'Reliability Lens', h:'#/ch/ch16'},{t:'State & Event Design', h:'#/ch/ch38'},{t:'Diagramming', h:'#/ch/ch44'}]}
]},

{id:'ch38', n:38, title:'State & Event Design', stage:'design',
 sum:'State machines, events, asynchronous workflows, queues, event ownership, delivery semantics, retries, idempotency.',
 why:'Asynchrony converts simple correctness into distributed correctness. That is a real cost and it must be chosen, not inherited.',
 blocks:[
 {t:'h', h:'Model the states, including the honest ones'},
 {t:'ascii', cap:'Order state machine', art:
`                 ┌──────────┐
                 │  DRAFT   │  basket editable
                 └────┬─────┘
                      │ confirm (before cut-off)
                      ▼
                 ┌──────────┐
                 │CONFIRMED │  order exists, money not moved
                 └────┬─────┘
                      │ capture requested
                      ▼
              ┌───────────────┐
              │ CAPTURING     │
              └───┬───────┬───┘
       captured   │       │   timeout / no response
                  ▼       ▼
           ┌──────────┐ ┌──────────────────┐
           │   PAID   │ │ CAPTURE_UNKNOWN  │ ← the honest state
           └────┬─────┘ └────────┬─────────┘
                │                │ reconcile (query + webhook)
                │                ├──→ PAID
                │                └──→ CAPTURE_FAILED
                ▼
           ┌──────────┐
           │ PICKING  │ → DISPATCHED → DELIVERED
           └──────────┘`},
 {t:'callout', kind:'why', title:'Why CAPTURE_UNKNOWN earns its place',
  h:'<p>Because it is true. For a measured 0.4% of captures, the provider completed the charge after our client gave up. A model without this state forces the code to guess — and guessing about money produces either double charges or unpaid orders. Systems without an explicit unknown state invent one in production, in the form of a spreadsheet.</p>'},

 {t:'h', h:'Event ownership and delivery'},
 {t:'table', filter:false, cols:['Question','Decide explicitly','Consequence of not deciding'],
  rows:[
   ['Who owns the event?','The module that owns the data it describes','Two producers, divergent meaning'],
   ['Is it a fact or a command?','Facts are named in the past tense and have no intended recipient','Events become remote procedure calls with extra latency'],
   ['Delivery semantics','At-least-once is the realistic default','Consumers written as if exactly-once; duplicates corrupt state'],
   ['Ordering','Per-key ordering, or none','Consumers silently depend on arrival order'],
   ['Schema evolution','Additive, with a version','A new field breaks every consumer'],
   ['Replay','Whether consumers may be replayed from the log','Recovery requires manual reconstruction'],
   ['Retention','How long events are kept','Replay window discovered during an incident']]},

 {t:'h', h:'Consumers must be idempotent'},
 {t:'code', file:'worker/handlers/order-confirmed.ts', lang:'typescript',
  lines:[
   {c:'export async function onOrderConfirmed(e: OrderConfirmed) {'},
   {c:'  // At-least-once delivery: this handler WILL run twice.', note:'Written as a statement of fact, not a warning. The delivery guarantee is a property of the infrastructure, not of the developer’s care.'},
   {c:'  const claimed = await claims.tryClaim(e.eventId, handlerName)', note:'Deduplication at the consumer. Ownership of the claim record belongs to the consumer, not the producer — each consumer deduplicates for itself.'},
   {c:'  if (!claimed) return                       // already handled'},
   {c:''},
   {c:'  const key = idempotencyKey(e.orderId, e.version)', note:'Derived, not random. The same order version always produces the same key, so a retry after a crash is still deduplicated by the provider.'},
   {c:'  const outcome = await gateway.capture(e.intent, key)'},
   {c:''},
   {c:'  if (outcome.kind === "unknown") {', note:'The unknown outcome is handled as a first-class case, moving the order into a state that a reconciler owns.'},
   {c:'    await orders.markCaptureUnknown(e.orderId)  // reconciler owns it'},
   {c:'    return'},
   {c:'  }'},
   {c:'  await orders.applyCaptureOutcome(e.orderId, outcome)'},
   {c:'}'}]},

 {t:'xref', items:[{t:'Idempotency', h:'#/ch/ch7'},{t:'Data Design', h:'#/ch/ch36'},{t:'Reliability Lens', h:'#/ch/ch16'}]}
]},

{id:'ch39', n:39, title:'Security Design', stage:'design',
 sum:'Trust boundaries, identity flow, authorisation, secrets, tenant isolation, threat modelling, abuse scenarios.',
 why:'Structure decides what is possible. Controls decide what is permitted. Only the first can make an attack impossible.',
 blocks:[
 {t:'h', h:'Identity must flow, including through asynchronous work'},
 {t:'ascii', cap:'Identity propagation', art:
`Customer session ──▶ API
                     │ resolve principal
                     ▼
              Principal{ id, tenant, roles }
                     │
        ┌────────────┴─────────────┐
        ▼                          ▼
  Domain command            Published event
  carries authz decision    carries actor id
        │                          │
        ▼                          ▼
    Audit log                 Worker handler
                              acts as SERVICE identity,
                              with actor recorded for audit

RULE  A worker never inherits user authority. It has its own
      identity with its own least-privilege grants, and it
      records on whose behalf it acted.`},
 {t:'callout', kind:'warn', title:'The classic background-job hole',
  h:'<p>A job that runs “as the system” with full privileges, triggered by an event whose payload came from user input. The authorisation was performed on the request that created the event — and never again. Anyone who can influence the event payload now acts with system authority. Re-authorise at the point of effect, not only at the point of request.</p>'},

 {t:'h', h:'Threat modelling that fits in an afternoon'},
 {t:'ol', items:[
  'Draw the trust boundaries (you already have them from Chapter 25).',
  'For each boundary, list what crosses it and in which direction.',
  'For each crossing, ask: spoofed? tampered? replayed? disclosed? denied? elevated?',
  'For each plausible answer, name the control and where it lives.',
  'For each control, ask what happens when it fails — and confirm it fails closed.',
  'Record what you decided not to defend against, and why.']},
 {t:'table', filter:false, cols:['Abuse case','Control','Fails how?'],
  rows:[
   ['Farm staff view another farm’s orders','Tenant scoping in the data access layer','Closed — query without scope is not expressible'],
   ['Forged payment webhook marks an order paid','Signature verification plus provider-side confirmation','Closed — unverified webhooks are dropped and alerted'],
   ['Replayed confirm request to double-charge','Idempotency key with stored outcome','Closed — returns the original result'],
   ['Basket manipulated to alter price','Price computed server-side from catalogue at confirm time','Closed — client price is never trusted'],
   ['Admin exports all customer data','Least privilege plus audited export with approval','Detective — logged, alerted, reviewed']]},
 {t:'p', h:'Note the last row: not every control can be preventive. What matters is knowing which are preventive and which are detective, and never mistaking one for the other in a review.'},

 {t:'xref', items:[{t:'Security Lens', h:'#/ch/ch14'},{t:'Security principles', h:'#/ch/ch7'},{t:'Compliance Lens', h:'#/ch/ch19'}]}
]},

{id:'ch40', n:40, title:'Runtime & Deployment Design', stage:'design',
 sum:'Runtime topology, infrastructure boundaries, networking, scaling, configuration, deployment, recovery.',
 why:'This is where architecture meets the invoice and the pager.',

 {t:'dgm', title:'Runtime topology — Farm Commerce', legend:true,

 {t:'h', h:'Deployment properties to decide explicitly'},
 {t:'table', filter:false, cols:['Property','Decision for this system','Why'],
  rows:[
   ['Independence','Web, API and worker deploy separately','Different change rates; worker deploys must not interrupt the cut-off window'],
   ['Migration compatibility','Every migration backward compatible for one release','Rollback must remain possible'],
   ['Deployment window','No API deploys Thursday 14:00–20:00','The peak driver, expressed as an operational rule'],
   ['Configuration','Declared per environment, secrets from a managed store','Repeatability; no secrets in images'],

 {t:'callout', kind:'rule', title:'A deployment rule is an architectural decision',
  h:'<p>“No API deploys during the Thursday peak” is a constraint that came from a driver, affects how work is planned, and will be forgotten unless it is written down and enforced by the pipeline. Operational rules deserve ADRs exactly as much as structural ones.</p>'},
