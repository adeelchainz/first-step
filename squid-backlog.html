   }).join('');
   return '<h2 class="sec">Wave 1 releases</h2>' +
   '<p style="color:var(--ink-2);max-width:78ch">Four increments, ordered by dependency. Windows come from the sprint ' +
   'plan, not from a wish. Select a release for its full record — scope, schedule, entry and exit, gate, migration, ' +
   'rollback, risk and verification.</p>' +
   '<div class="pltable rel"><div class="plhead">' +
     '<div class="cell c-name">Release</div><div class="cell">Audience</div><div class="cell">Window</div>' +
     '<div class="cell">Sprints</div><div class="cell">Epics</div><div class="cell c-num">Stories</div>' +
     '<div class="cell c-num">Points</div><div class="cell c-num">Tasks</div><div class="cell c-num">Tests</div>' +
     '<div class="cell">Release Gate</div></div>' + rows + '</div>' +
   '<p class="cfg-n">Gate progress is your own tick record, stored in this browser. The conditions are the same ten ' +
   'for every release — open any release record to work through them.</p>';
 }

 /* ---------------- sprints: a list with columns ---------------- */
 if(id === 'sprints'){
   const sp = sprintsCached();
   const total = readyStories().reduce((a, s) => a + pointsFor(s), 0);
   const dist = {};
   readyStories().forEach(s => { const k = sizeOf(s).k; dist[k] = (dist[k] || 0) + 1; });
   const rows = sp.map(s =>
     '<div class="plrow sprow" data-sprint="' + s.n + '" tabindex="0" role="button">' +
       '<div class="cell c-name">' + tw('sp-' + s.n, false, true) +
         '<span class="plid">Sprint ' + s.n + '</span>' +
         '<span class="nm">' + esc(s.goal) + '</span><span class="open-hint">open ›</span></div>' +
       '<div class="cell mono">' + DATE_SHORT(s.start) + ' → ' + DATE_SHORT(s.end) + '</div>' +
       '<div class="cell"><span class="pill ' + (s.committed ? 'green' : 'amber') + '">' +
         (s.committed ? 'committed' : 'forecast') + '</span></div>' +
       '<div class="cell mono">' + esc(s.releases.join(' ')) + '</div>' +
       '<div class="cell c-num">' + s.stories.length + '</div>' +
       '<div class="cell c-num">' + s.pts + '</div>' +
       '<div class="cell c-num">' + s.tasks + '</div>' +
       '<div class="cell c-num">' + pl(s.steps) + '</div>' +
       '<div class="cell c-num">' + s.cases + '</div>' +
       '<div class="cell mono">' + s.lanes.filter(l => l.stories.length).length + ' of ' + s.lanes.length + '</div>' +
     '</div>' +
     '<div class="spkids" data-spkids="' + s.n + '"></div>').join('');

   return '<h2 class="sec">Sprint plan</h2>' +
   '<div class="cfg"><div class="cfg-h">Capacity — change it and the whole plan repacks</div>' +
     '<div class="cfg-row">' +
     '<label>Engineers<select data-cfg="members">' +
       [4, 6, 8, 10].map(n => '<option value="' + n + '"' + (SPRINT_CFG.members === n ? ' selected' : '') + '>' + n + '</option>').join('') +
       '</select></label>' +
     '<label>Points per engineer per sprint<input type="range" min="6" max="20" step="1" value="' + SPRINT_CFG.capacity +
       '" data-cfg="capacity"><span class="mono" data-capv>' + SPRINT_CFG.capacity + '</span></label>' +
     '<label>Sprint length<span class="mono">2 weeks — fixed</span></label>' +
     '<label>First Monday<input type="date" value="' + SPRINT_CFG.start + '" data-cfg="start"></label>' +
     '<span class="cfg-note">Sprints run Monday to the Friday of the second week. Any other start date is moved ' +
       'forward to the next Monday.</span></div>' +
     '<p class="cfg-n">' + SPRINT_CFG.members + ' engineers, each carrying one vertical slice end to end — ' +
     'implementation through to a green staging walk. One point ≈ one size band from the implementation steps ' +
     'refinement produced: ' + SIZE_BANDS.map(b => b.k + ' = ' + b.pts).join(' · ') + '. ' +
     'There is no historical velocity, so <strong>sprints 1–3 are a commitment and the rest is a forecast</strong> ' +
     're-baselined after sprint 2.</p></div>' +

   '<div class="sumrow">' +
     '<div class="sum"><b>' + pl(readyStories().length) + '</b>Ready stories</div>' +
     '<div class="sum"><b>' + pl(total) + '</b>points</div>' +
     '<div class="sum"><b>' + sp.length + '</b>two-week sprints</div>' +
     '<div class="sum"><b>' + (sp.length * SPRINT_CFG.weeks) + '</b>weeks</div>' +
     '<div class="sum"><b>' + DATE_FMT(sp[sp.length - 1].end) + '</b>forecast finish</div>' +
   '</div>' +
   '<p style="color:var(--ink-3);font-size:13px">Size distribution: ' +
     SIZE_BANDS.map(b => (dist[b.k] || 0) + ' × ' + b.k + ' (' + b.d + ')').join(' · ') + '</p>' +

   '<div class="pltable spr"><div class="plhead">' +
     '<div class="cell c-name">Sprint · goal</div><div class="cell">Window</div><div class="cell">Status</div>' +
     '<div class="cell">Releases</div><div class="cell c-num">Stories</div><div class="cell c-num">Points</div>' +
     '<div class="cell c-num">Tasks</div><div class="cell c-num">Steps</div><div class="cell c-num">Tests</div>' +
     '<div class="cell">Engineers</div></div>' + rows + '</div>' +
   '<p class="cfg-n">Expand a sprint for its stories, tasks and steps in the same list format as the backlog. ' +
   'Select the row for the sprint record in the side panel.</p>' +

   '<div class="callout warn"><div class="callout-h">What this plan does not know</div>' +
   '<p>It has no velocity, no holidays, no on-call load and no defect budget. It assumes every engineer works on ' +
   'foundation stories, which is the only thing Ready today. Change the capacity above to see what any other ' +
   'assumption costs.</p></div>';
 }

 /* ---------------- team and cadence ---------------- */
 if(id === 'team'){
   const sp = sprintsCached();
   const load = {};
   TEAM.forEach(m => { load[m.id] = {pts:0, stories:0, feats:{}}; });
   sp.forEach(s => s.lanes.forEach(l => {
     if(!load[l.member.id]) return;
     load[l.member.id].pts += l.pts;
     load[l.member.id].stories += l.stories.length;
     l.stories.forEach(x => { load[l.member.id].feats[x.feature.name] = 1; });
   }));
   const maxPts = Math.max.apply(null, TEAM.map(y => load[y.id].pts)) || 1;
   return '<h2 class="sec">How the team works</h2>' +
   '<p style="color:var(--ink-2);max-width:78ch">Ten engineers, no squads. The unit of flow is a person and a ' +
   'story: one vertical slice at a time, carried from the first migration to a demonstrable staging walk.</p>' +
   '<div class="tbl-wrap"><table><thead><tr><th>Working agreement</th><th>What it means in practice</th></tr></thead><tbody>' +
   WORKING_AGREEMENT.map(w => '<tr><td><strong>' + esc(w.k) + '</strong></td><td>' + esc(w.d) + '</td></tr>').join('') +
   '</tbody></table></div>' +

   '<h2 class="sec">A vertical slice</h2>' +
   '<div class="vslice">' + ['Schema & migration', 'Domain rule', 'Policy binding', 'Server action', 'Surface',
     'Tests at every level', 'Signal & runbook line', 'Staging walk'].map((k, i, arr) =>
     '<span class="vs">' + (i + 1) + '. ' + esc(k) + '</span>' + (i < arr.length - 1 ? '<i>→</i>' : '')).join('') + '</div>' +
   '<p style="color:var(--ink-2);max-width:78ch">One person, all eight steps. If a story cannot be carried that way, ' +
   'it crosses a boundary the architecture did not intend — which makes it a finding, not a staffing problem.</p>' +

   '<h2 class="sec">Allocation across Wave 1</h2>' +
   '<div class="tbl-wrap"><table><thead><tr><th>Engineer</th><th>Affinity</th><th>Stories</th><th>Points</th>' +
   '<th>Features touched</th><th>Load</th></tr></thead><tbody>' +
   TEAM.slice(0, SPRINT_CFG.members).map(m => {
     const x = load[m.id];
     return '<tr><td><strong>' + esc(m.n) + '</strong></td><td>' + esc(m.f) + '</td>' +
       '<td class="mono">' + x.stories + '</td><td class="mono">' + x.pts + '</td>' +
       '<td class="mono">' + Object.keys(x.feats).length + '</td>' +
       '<td><span class="lbar"><span style="width:' + Math.round(x.pts / maxPts * 100) + '%"></span></span></td></tr>';
   }).join('') + '</tbody></table></div>' +

   '<h2 class="sec">Cadence</h2>' +
   '<p style="color:var(--ink-2);max-width:78ch">Each of these serves a stage of the delivery model. Where a ceremony ' +
   'has no stage behind it, it is a habit, and habits are the first thing to cut.</p>' +
   '<div class="tbl-wrap"><table><thead><tr><th>Ceremony</th><th>When</th><th>Input</th><th>Output</th><th>The rule that keeps it honest</th></tr></thead><tbody>' +
   CEREMONIES.map(c => '<tr><td><strong>' + esc(c.k) + '</strong></td><td class="mono">' + esc(c.when) + '</td>' +
     '<td>' + esc(c.in) + '</td><td>' + esc(c.out) + '</td><td>' + esc(c.rule) + '</td></tr>').join('') +
   '</tbody></table></div>' +

   '<h2 class="sec">Definition of Done</h2>' +
   '<p style="color:var(--ink-2);max-width:78ch">Acceptance criteria belong to the Story. This belongs to every ' +
   'Story, which is exactly why none of it is allowed to appear in a criterion. It is carried into every Story and ' +
   'Task record, where it is ticked per item.</p>' +
   '<div class="gatelist">' + DOD.map((d, i) => checkRow('dod:global:' + i, esc(d), '')).join('') + '</div>' +

   '<h2 class="sec">Definition of Ready</h2>' +
   '<p style="color:var(--ink-2);max-width:78ch">Already defined by the model: the eight Ready Gate conditions, ' +
   'computed per Story and visible in every Story record. ' + pl(COUNT.ready) + ' stories pass it today.</p>';
 }

 return '';
}

/* ================================================================
   RELEASE RECORD
   ================================================================ */
function openRelease(id){
  const r = releaseById(id); if(!r) return;
  const st = readyStories().filter(x => releaseOf(x) === r.id);
  const w = releaseWindow(r);
  const cases = st.reduce((a, x) => a.concat(testCasesFor(x)), []);
  const byLevel = {};
  cases.forEach(c => { byLevel[c.level] = (byLevel[c.level] || 0) + 1; });
  const gDone = RELEASE_GATE.filter((g, i) => TICKS.get('rg:' + r.id + ':' + i)).length;
  const people = [...new Set(st.map(x => (memberOf(x) || {}).id).filter(Boolean))];
  const feats = [...new Set(st.map(x => x.feature.name))];
  const oneWay = /one-way|forward-only|stops being an option/i.test(r.rollback);

  openModal(
  '<div class="bm-head">' +
    '<div class="bm-path">Wave 1 · Foundation › Release <b>' + esc(r.id) + '</b></div>' +
    '<h2 class="bm-title">' + esc(r.n) + '</h2>' +
    '<div class="bm-meta">' +
      '<span class="pill ' + (r.audience === 'internal' ? '' : 'amber') + '">' + esc(r.audience) + '</span>' +
      (w ? '<span class="pill blue">' + DATE_FMT(w.from) + ' → ' + DATE_FMT(w.to) + '</span>' : '') +
      (w ? '<span class="pill">sprints ' + w.sprints.join(', ') + '</span>' : '') +
      '<span class="pill">' + st.length + ' stories · ' + st.reduce((a, x) => a + pointsFor(x), 0) + ' pts</span>' +
      '<span class="pill">' + cases.length + ' test cases</span>' +
      (oneWay ? '<span class="pill red">has a one-way point</span>' : '') +
    '</div>' +
    '<button class="icon-btn bm-close" data-closebig aria-label="Close">✕</button>' +
  '</div>' +
  '<div class="bm-body">' +

  '<section class="bm-sec"><h3>Goal</h3>' +
    '<p class="bm-lede">' + esc(r.goal) + '</p>' +
    '<div class="bm-kv"><div><dt>Demonstrated by</dt><dd>' + esc(r.demo) + '</dd></div>' +
    '<div><dt>Audience</dt><dd>' + esc(r.audience === 'internal'
      ? 'Internal only — staging tenant. Nothing here is visible to a customer.'
      : 'The first external tenant. This release is the one that makes the product real.') + '</dd></div></div>' +
  '</section>' +

  '<section class="bm-sec"><h3>Scope <span class="bm-n">' + st.length + ' stories</span></h3>' +
    '<div class="relmods">' + r.epics.map(e => {
      const x = epicByN(e);
      return '<span class="pill blue">' + esc(e + (x ? ' ' + x.t : '')) + '</span>';
    }).join('') + '</div>' +
    '<p class="bm-note">' + feats.length + ' features · ' +
      st.reduce((a, x) => a + tasksFor(x).length, 0) + ' tasks · ' +
      pl(st.reduce((a, x) => a + stepCountOf(x), 0)) + ' implementation steps · carried by ' + people.length + ' engineers.</p>' +
    '<div class="relfeat">' + feats.map(f => '<span>' + esc(f) + '</span>').join('') + '</div>' +
  '</section>' +

  '<section class="bm-sec"><h3>Schedule</h3>' +
    (w
      ? '<div class="bm-kv">' +
          '<div><dt>Window</dt><dd>' + DATE_FMT(w.from) + ' → ' + DATE_FMT(w.to) + '</dd></div>' +
          '<div><dt>Sprints</dt><dd>' + w.sprints.map(n => 'Sprint ' + n +
            (sprintByN(n).committed ? ' (committed)' : ' (forecast)')).join(' · ') + '</dd></div>' +
          '<div><dt>Engineers</dt><dd>' + people.map(p => esc((memberById(p) || {}).n || p)).join(' · ') + '</dd></div>' +
        '</div>' +
        '<p class="bm-note">The window is the span of the sprints carrying this release, not an exclusive period. ' +
        'Increments overlap, because a sprint finishes one release while starting the next — what separates them is ' +
        'the gate, not the calendar.</p>'
      : '<p>No sprint carries this release at the current capacity.</p>') +
  '</section>' +

  '<section class="bm-sec"><h3>Entry and exit</h3>' +
    '<div class="gw" style="margin:0"><div class="gw-col g"><div class="gw-h">Entry — true before it starts</div>' +
      '<p style="font-size:14px;color:var(--ink-2);margin:0">' + esc(r.entry) + '</p></div>' +
    '<div class="gw-col g"><div class="gw-h">Exit — true before it is called done</div>' +
      '<p style="font-size:14px;color:var(--ink-2);margin:0">' + esc(r.exit) + '</p></div></div>' +
  '</section>' +

  '<section class="bm-sec"><h3>Release Gate ' + progressBar(gDone, RELEASE_GATE.length, gDone === RELEASE_GATE.length ? 'green' : 'amber') + '</h3>' +
    '<p class="bm-note">The delivery model names a Release Gate and leaves the conditions to the team. These are ' +
    'Squid’s ten, derived from the model’s Verify and Release stages and the handbook’s operational and validation ' +
    'views. A gate is a state, not a date.</p>' +
    RELEASE_GATE.map((g, i) => checkRow('rg:' + r.id + ':' + i, '<b>' + (i + 1) + '.</b> ' + esc(g.q), esc(g.c))).join('') +
  '</section>' +

  '<section class="bm-sec"><h3>Change management</h3>' +
    '<div class="bm-kv">' +
      '<div><dt>Feature flags</dt><dd>' + esc(r.flags) + '</dd></div>' +
      '<div><dt>Migration</dt><dd>' + esc(r.migration) + '</dd></div>' +
    '</div>' +
    '<div class="relroll' + (oneWay ? ' oneway' : '') + '"><b>Rollback</b>' + esc(r.rollback) + '</div>' +
  '</section>' +

  '<section class="bm-sec"><h3>Risk</h3><div class="relrisk">' + esc(r.risk) + '</div></section>' +

  '<section class="bm-sec"><h3>Verification <span class="bm-n">' + cases.length + '</span></h3>' +
    '<p class="bm-note">' + esc(r.verify) + '</p>' +
    '<div class="relcov">' + TEST_LEVELS.filter(l => byLevel[l.id]).map(l =>
      '<div class="rc"><b>' + pl(byLevel[l.id]) + '</b>' + esc(l.n) + '</div>').join('') + '</div>' +
    '<p class="bm-note">Plus the release packs that run for every release: tenant isolation, authorisation, failure ' +
    'behaviour, migration rehearsal and the accessibility walk.</p>' +
    '<p class="bm-note"><button class="hit" data-gocases="' + r.id + '">Open these test cases →</button></p>' +
  '</section>' +

  '<section class="bm-sec"><h3>Stories in this release</h3>' +
    '<div class="relst">' + st.slice(0, 60).map(x =>
      '<div class="relst-r"><button class="hit" data-gostory="' + x.id + '">' + esc(x.title) + '</button>' +
      '<span class="mono">' + esc(sizeOf(x).k) + ' · S' + (sprintOf(x) || '—') + ' · ' +
      esc((memberOf(x) || {n:'—'}).n) + '</span></div>').join('') +
    (st.length > 60 ? '<p class="bm-note">Showing 60 of ' + st.length + '. The sprint list carries all of them.</p>' : '') +
    '</div>' +
  '</section>' +

  '</div>' +
  '<div class="bm-foot">' +
    '<button class="btn sm" data-copy-rel="' + r.id + '">Copy release record</button>' +
    '<button class="btn sm sec" data-gocases="' + r.id + '">Test cases</button>' +
    '<span class="bm-localnote">Gate ticks are stored in this browser only</span>' +
    '<span style="margin-left:auto" class="mono">' + esc(r.id) + '</span>' +
  '</div>', true);
  wireBigModal(() => openRelease(id));
}

function releaseMarkdown(r){
  const st = readyStories().filter(x => releaseOf(x) === r.id);
  const w = releaseWindow(r);
  let o = '# ' + r.id + ' — ' + r.n + '\n\n';
  o += '**Audience.** ' + r.audience + (w ? '  \n**Window.** ' + w.from + ' → ' + w.to +
    '  \n**Sprints.** ' + w.sprints.join(', ') : '') + '\n\n';
  o += '**Goal.** ' + r.goal + '\n\n**Demonstrated by.** ' + r.demo + '\n\n';
  o += '**Scope.** epics ' + r.epics.join(', ') + ' · ' + st.length + ' stories · ' +
    st.reduce((a, x) => a + tasksFor(x).length, 0) + ' tasks\n\n';
  o += '**Entry.** ' + r.entry + '\n\n**Exit.** ' + r.exit + '\n\n';
  o += '**Flags.** ' + r.flags + '\n\n**Migration.** ' + r.migration + '\n\n**Rollback.** ' + r.rollback + '\n\n';
  o += '**Risk.** ' + r.risk + '\n\n**Verified by.** ' + r.verify + '\n\n';
  o += '## Release Gate\n\n';
  RELEASE_GATE.forEach(g => { o += '- [ ] **' + g.q + '** ' + g.c + '\n'; });
  o += '\n## Stories\n\n';
  st.forEach(x => { o += '- `' + x.id + '` ' + x.title + ' — ' + sizeOf(x).k + ', sprint ' + (sprintOf(x) || '—') +
    ', ' + ((memberOf(x) || {n:'unassigned'}).n) + '\n'; });
  return o;
}

/* ================================================================
   SPRINT RECORD — side panel
   ================================================================ */
function openSprint(n){
  const s = sprintByN(n); if(!s) return;
  const cases = s.stories.reduce((a, x) => a.concat(testCasesFor(x)), []);
  const byLevel = {};
  cases.forEach(c => { byLevel[c.level] = (byLevel[c.level] || 0) + 1; });
  const rels = s.releases.map(r => releaseById(r)).filter(Boolean);
  const risks = [];
  if(!s.committed) risks.push('Forecast, not a commitment. Every date in this sprint moves at the re-baseline after sprint 2.');
  s.lanes.filter(l => l.pts > SPRINT_CFG.capacity * 0.9).forEach(l =>
    risks.push(esc(l.member.n) + ' is loaded to ' + l.pts + ' of ' + SPRINT_CFG.capacity +
      ' points — no room for a defect or an interruption.'));
  rels.forEach(r => { if(/one-way|forward-only/i.test(r.rollback)) risks.push(esc(r.id) + ' contains a one-way step: ' + esc(r.rollback)); });
  if(!risks.length) risks.push('Nothing unusual. Standard load, no one-way steps, no single point of dependency.');

  drawerShell(
    'Wave 1 · Foundation &nbsp;›&nbsp; <b>Sprint ' + s.n + '</b>',
    'Sprint ' + s.n,
    '<div class="meta-row" style="margin:0 0 16px">' +
      '<span class="pill ' + (s.committed ? 'green' : 'amber') + '">' + (s.committed ? 'committed' : 'forecast') + '</span>' +
      '<span class="pill blue">' + DATE_FMT(s.start) + ' → ' + DATE_FMT(s.end) + '</span>' +
      '<span class="pill">' + s.pts + ' points</span>' +
    '</div>' +

    '<div class="field"><div class="field-k">Sprint goal</div><p><strong>' + esc(s.goal) + '</strong></p>' +
    '<p style="color:var(--ink-3);font-size:13px;margin-top:6px">A goal names the capability the sprint makes real. ' +
    'It is not the list below restated.</p></div>' +

    '<div class="field"><div class="field-k">Releases in flight</div>' +
      (rels.length ? rels.map(r => '<p><button class="hit" data-gorel="' + r.id + '">' + esc(r.id) + '</button> ' +
        esc(r.n) + ' — <em>' + esc(r.audience) + '</em></p>').join('') : '<p>None.</p>') + '</div>' +

    '<div class="field"><div class="field-k">Capacity</div>' +

function sprintMarkdown(s){
  let o = '# Sprint ' + s.n + ' — ' + s.goal + '\n\n';
  o += '**' + DATE_FMT(s.start) + ' → ' + DATE_FMT(s.end) + '** · ' + (s.committed ? 'committed' : 'forecast') +
    ' · ' + s.stories.length + ' stories · ' + s.pts + ' points · ' + s.tasks + ' tasks · ' + s.cases + ' test cases\n\n';
  o += 'Releases in flight: ' + (s.releases.join(', ') || 'none') + '\n\n';
  o += '## Who carries what\n\n';
  s.lanes.filter(l => l.stories.length).forEach(l => {
    o += '### ' + l.member.n + ' — ' + l.pts + '/' + SPRINT_CFG.capacity + ' points\n\n';
    l.stories.forEach(x => {
      o += '- `' + x.id + '` ' + x.title + ' — ' + sizeOf(x).k + ', ' + tasksFor(x).length + ' tasks, ' +
        testCasesFor(x).length + ' test cases\n';
    });
    o += '\n';
  });
  o += '## Definition of Done\n\n';
  DOD.forEach(d => { o += '- [ ] ' + d + '\n'; });
  return o;
}

function planListHTML(stories, id){
  const head = '<div class="lhead"><div class="cell c-name">Name</div>' +
    COLS.filter(c => c.on).map(c => '<div class="cell' + (c.num ? ' c-num' : '') + '">' + esc(c.label) + '</div>').join('') +
    '</div>';
  return '<div class="list plist" id="' + id + '" style="--cols:' + colTemplate() + '">' +
    '<div class="list-inner" style="--min-w:' + minWidth() + '">' + head +
    stories.map(rowStory).join('') + '</div></div>';
}
function planListApply(root){
  const map = {}, rows = $$('.lrow', root);
  rows.forEach(r => { map[r.dataset.row] = r; });
  rows.forEach(r => {
    let p = r.dataset.parent, vis = true;
    while(p && map[p]){
      if(!LIST.open[p]){ vis = false; break; }
      p = map[p].dataset.parent;
    }
    r.classList.toggle('hidden', !vis);
  });
}
function wirePlanList(root){
  root.addEventListener('click', e => {
    const tog = e.target.closest('[data-tog]');
    if(tog){
      e.stopPropagation();
      const id = tog.dataset.tog, rowEl = tog.closest('.lrow');
      const open = !LIST.open[id];
      LIST.open[id] = open;
      tog.classList.toggle('open', open);
      tog.setAttribute('aria-expanded', String(open));
      if(open && !rowEl.dataset.pbuilt){
        const html = childrenHTML(id);
        if(html) rowEl.insertAdjacentHTML('afterend', html);
        rowEl.dataset.pbuilt = '1';
      }
      planListApply(root);
      return;
    }
    const row = e.target.closest('.lrow');
    if(row) openRow(row);
  });
}

    '<button class="subtab' + (x.id === TEST_SEC ? ' on' : '') + '" data-tsec="' + x.id + '">' + esc(x.label) + '</button>').join('') +
  '</div><div data-testbody>' + testSection(TEST_SEC) + '</div></div>';
}

/* ---------------------------------------------------------------- exports */
function planMarkdown(){
  const sp = sprintsCached();
  let o = '# Squid — roadmap, releases and sprints\n\n';
  o += 'Only Wave 1 is scheduled. It is the only wave whose stories passed the Ready Gate.\n\n';
  o += '## Roadmap\n\n';
  ROADMAP.forEach(r => {
    o += '### Wave ' + r.w + ' — ' + r.n + ' (' + r.status + ')\n\n' + r.theme + '\n\n';
    o += '- **Outcome.** ' + r.outcome + '\n- **Unlocks.** ' + r.unlocks + '\n';
    o += '- **Entry.** ' + r.entry + '\n- **Exit.** ' + r.exit + '\n';
    o += '- **Architecture.** ' + r.arch + '\n- **Risk.** ' + r.risk + '\n\n';
  });
  o += '## Milestones\n\n| Date | Milestone | Means | Confidence |\n|---|---|---|---|\n';
  milestones().forEach(m => { o += '| ' + m.d + ' | ' + m.k + ' ' + m.n + ' | ' + m.what + ' | ' + CONF[m.conf][1] + ' |\n'; });
  o += '\n## Deliberately not on the roadmap\n\n';
  NOT_ON_ROADMAP.forEach(x => { o += '- **' + x[0] + '** — ' + x[1] + '\n'; });
  o += '\n## Wave 1 releases\n\n| Release | Audience | Window | Sprints | Stories | Points | Tests |\n|---|---|---|---|---|---|---|\n';
  RELEASES.forEach(r => {
    const st = readyStories().filter(s => releaseOf(s) === r.id);
    const w = releaseWindow(r);
    o += '| ' + r.id + ' ' + r.n + ' | ' + r.audience + ' | ' + (w ? w.from + ' → ' + w.to : '—') + ' | ' +
      (w ? w.sprints.join(', ') : '—') + ' | ' + st.length + ' | ' + st.reduce((a, s) => a + pointsFor(s), 0) +
      ' | ' + st.reduce((a, s) => a + testCasesFor(s).length, 0) + ' |\n';
  });
  o += '\n';
  RELEASES.forEach(r => { o += releaseMarkdown(r).replace(/^# /, '### ') + '\n'; });
  o += '## Team\n\n';
  o += SPRINT_CFG.members + ' engineers, each carrying one vertical slice end to end — implementation through to a ' +
    'green staging walk.\n\n';
  WORKING_AGREEMENT.forEach(w => { o += '- **' + w.k + '** — ' + w.d + '\n'; });
  o += '\n## Sprint plan\n\n';
  o += 'Capacity: ' + SPRINT_CFG.members + ' engineers × ' + SPRINT_CFG.capacity + ' points per ' +
       SPRINT_CFG.weeks + '-week sprint. Sprints 1–3 are committed; the rest is a forecast re-baselined after sprint 2.\n\n';
  o += '| Sprint | Dates | Status | Stories | Points | Tasks | Tests | Goal |\n|---|---|---|---|---|---|---|---|\n';
  sp.forEach(s => {
    o += '| ' + s.n + ' | ' + s.start + ' → ' + s.end + ' | ' + (s.committed ? 'committed' : 'forecast') +
      ' | ' + s.stories.length + ' | ' + s.pts + ' | ' + s.tasks + ' | ' + s.cases + ' | ' + s.goal + ' |\n';
  });
  o += '\n';
  sp.forEach(s => { o += sprintMarkdown(s).replace(/^# /, '### ') + '\n'; });
  o += '## Definition of Done\n\n';
  DOD.forEach(d => { o += '- ' + d + '\n'; });
  o += '\n## Cadence\n\n| Ceremony | When | Input | Output | Rule |\n|---|---|---|---|---|\n';
  CEREMONIES.forEach(c => { o += '| ' + c.k + ' | ' + c.when + ' | ' + c.in + ' | ' + c.out + ' | ' + c.rule + ' |\n'; });

function testPlanMarkdown(){
  const roll = testRoll();
  let o = '# Squid — test plan\n\n';
  o += 'Scope: the ' + readyStories().length + ' Ready stories of Wave 1. ' + roll.n +
       ' cases, one per acceptance criterion, generated from the backlog.\n\n';
  o += '## Levels\n\n| Level | Cases | Proves | Where | Tooling | Owner | Gates |\n|---|---|---|---|---|---|---|\n';
  TEST_LEVELS.forEach(l => {
    o += '| ' + l.n + ' | ' + (roll.byLevel[l.id] || 0) + ' | ' + l.proves + ' | ' + l.where + ' | ' + l.tool +
      ' | ' + l.owner + ' | ' + l.gate + ' |\n';
  });
  o += '\n## Out of scope\n\n';
  TEST_OUT_OF_SCOPE.forEach(x => { o += '- **' + x[0] + '** — ' + x[1] + '\n'; });
  o += '\n## Risk-based depth\n\n| Risk | If it happens | Levels | Rule |\n|---|---|---|---|\n';
  TEST_RISK_DEPTH.forEach(r => { o += '| ' + r[0] + ' | ' + r[1] + ' | ' + r[2] + ' | ' + r[3] + ' |\n'; });
  o += '\n## Environments\n\n| Environment | Shape | Runs | Data | Owner |\n|---|---|---|---|---|\n';
  TEST_ENVS.forEach(e => { o += '| ' + e.join(' | ') + ' |\n'; });
  o += '\n## Defect severity\n\n| Severity | Means | Effect |\n|---|---|---|\n';
  SEVERITY.forEach(s => { o += '| ' + s.join(' | ') + ' |\n'; });
  o += '\n## Release packs\n\n';
  TEST_PACKS.forEach(p => {
    o += '### ' + p.id + ' — ' + p.n + ' (' + p.pri + ', ' + p.when + ')\n\n';
    p.cases.forEach(c => { o += '- ' + c + '\n'; });
    o += '\n';
  });
  o += '## Coverage by release\n\n| Release | Stories | Cases | P1 |\n|---|---|---|---|\n';
  RELEASES.forEach(r => {
    const st = readyStories().filter(s => releaseOf(s) === r.id);
    const cs = st.reduce((a, s) => a.concat(testCasesFor(s)), []);
    o += '| ' + r.id + ' | ' + st.length + ' | ' + cs.length + ' | ' + cs.filter(c => c.pri === 'P1').length + ' |\n';
  });
  o += '\n## Coverage by sprint\n\n| Sprint | Stories | Cases | P1 | Manual |\n|---|---|---|---|---|\n';
  sprintsCached().forEach(s => {
    const cs = s.stories.reduce((a, x) => a.concat(testCasesFor(x)), []);
    o += '| ' + s.n + ' | ' + s.stories.length + ' | ' + cs.length + ' | ' +
      cs.filter(c => c.pri === 'P1').length + ' | ' + cs.filter(c => c.auto.indexOf('Manual') === 0).length + ' |\n';
  });
  return o;
}

function testCasesCSV(){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const head = ['Case ID','Title','Level','Method','Priority','Automation','Lens','Release','Sprint','Engineer','Module',
    'Feature','Story','Criterion','Requirements','Preconditions','Steps','Expected result'];
  const rows = allCases().map(c => [c.id, c.title,
    (TEST_LEVELS.filter(l => l.id === c.level)[0] || {}).n || c.level, c.method, c.pri, c.auto, c.lens,
    c.release, sprintOf(c.story) || '', (memberOf(c.story) || {n:''}).n, c.module, c.feature, c.story.id, c.acN,
    c.reqs.join(' '), c.pre, c.steps.map((s, i) => (i + 1) + '. ' + s).join(' | '), c.expect]);
  return [head].concat(rows).map(r => r.map(q).join(',')).join('\n');
}

/* ================================================================
   SPRINT EXECUTION — one sprint at a time
   ----------------------------------------------------------------
   The Plan tab answers "what order, and roughly when". This is the
   other question: what is in flight right now, who is carrying it,
   and how far through the delivery model it has actually got.

   Three rules keep it honest.

   1. A board is not the lifecycle, and the lifecycle is not a board.
      The model names eight stages; three of them — Discover, Refine,
      Design — happen before a story may enter a sprint, which is what
      the Ready Gate is for. Offering them as columns would invite the
      mid-flight discovery the gate exists to prevent. So the board
      covers the five stages a Ready Story passes through, and splits
      those five into the ten states a slice is actually observed in.

   2. A state is either derived from the record or asserted by a
      person, and the board says which. Six states can be read off
      the ticks. Four cannot: nothing in a single HTML file can prove
      that a branch is merged, that a build reached staging, that the
      Release Gate was run, or that the thing is live. Those four are
      assertions, and they are labelled as assertions.

   3. Blocked is a flag, not a column. A blocked slice still occupies
      the state it genuinely reached; moving it to a "Blocked" column
      would erase the only information that matters when it unblocks.
   ================================================================ */

/* The five lifecycle stages a Ready Story passes through, with the
   model's own question and gate — not paraphrased. */
const EXEC_STAGES = ['ready', 'deliver', 'verify', 'release', 'operate'].map(id => {
  const l = LIFECYCLE.filter(x => x.id === id)[0];
  return {id:id, n:l.name, q:l.q, gate:l.gate, produces:l.produces};
});
const EXEC_BEFORE = LIFECYCLE.filter(x => ['discover', 'refine', 'design'].indexOf(x.id) > -1);

/* The ten states, each belonging to exactly one stage.
   how: 'derived' — the ticks on the record already prove it.
        'asserted' — only a person can claim it; this file cannot see
        a branch, an environment, a gate meeting or production. */
const EXEC_STATES = [
/* s: the three-word label the narrow board shows.
   d: the full description, kept as the tooltip and in the stage strip. */
 {id:'ready',    n:'Ready',            stage:'ready',   how:'derived',
  s:'Not started',
  d:'Passed the Ready Gate and not started. Tasks exist, no step has been ticked.',
  ev:'The Ready Gate record on the story.'},
 {id:'progress', n:'In progress',      stage:'deliver', how:'derived',
  s:'Being built',
  d:'Someone is building the slice. At least one implementation step is ticked.',
  ev:'Ticked steps on the story’s tasks.'},
 {id:'review',   n:'In review',        stage:'deliver', how:'derived',
  s:'Waiting on review',
  d:'Every task is marked done, so the work is written and waiting on another pair of eyes.',
  ev:'All tasks ticked; the pull request is open.'},
 {id:'merged',   n:'Merged',           stage:'deliver', how:'asserted',
  s:'On main, CI green',
  d:'Approved and on the main branch with CI green. Not yet on any environment.',
  ev:'The merge commit and the CI run — neither of which this file can see.'},
 {id:'staged',   n:'Staged',           stage:'deliver', how:'asserted',
  s:'On staging',
  d:'Deployed to staging and reachable. This is the first state in which the slice can be walked.',
  ev:'The deployment record for the staging environment.'},
 {id:'test',     n:'In test',          stage:'verify',  how:'derived',
  s:'Cases running',
  d:'Test cases are being executed against the staged slice. At least one case is recorded.',
  ev:'Recorded test cases on the tasks that prove them.'},
 {id:'uat',      n:'UAT',              stage:'verify',  how:'derived',
  s:'With whoever asked',
  d:'Every case is recorded, and the person who asked for the capability is trying it.',
  ev:'All of the story’s cases recorded, plus the acceptance conversation.'},
 {id:'gate',     n:'Release gate',     stage:'release', how:'asserted',
  s:'At the Release Gate',
  d:'The increment is being taken through the Release Gate: flags, migration, rollback, evidence.',
  ev:'The Release Gate conditions ticked on the release record.'},
 {id:'released', n:'Released',         stage:'release', how:'derived',
  s:'Shipped',
  d:'Shipped to its audience. The Definition of Done is complete.',
  ev:'All seven Definition of Done conditions ticked.'},
 {id:'operate',  n:'Operating',        stage:'operate', how:'asserted',
  s:'Live and watched',
  d:'Live, with its signal watched and its first action known. New requirements start here.',
  ev:'The signal and the runbook line the operations lens demanded.'}
];
const STATE_IDS = EXEC_STATES.map(x => x.id);
const stateById = id => EXEC_STATES.filter(x => x.id === id)[0] || EXEC_STATES[0];
const stateIndex = id => Math.max(0, STATE_IDS.indexOf(id));
const statesOfStage = sid => EXEC_STATES.filter(x => x.stage === sid);
const stageByIdX = id => EXEC_STAGES.filter(x => x.id === id)[0] || EXEC_STAGES[0];

/* Tone follows meaning, not decoration: nothing until work starts,
   blue while it is in hand, amber while evidence is being produced,
   purple at the gate, green only once it is somewhere real. */
const STAGE_TONE = {ready:'none', deliver:'blue', verify:'amber', release:'purple', operate:'green'};
const stateTone = id => STAGE_TONE[stateById(id).stage] || 'none';

/* backwards compatibility: the first version of this board stored
   lifecycle stage ids. Map them onto the state each stage starts in. */
const LEGACY_STATE = {ready:'ready', deliver:'progress', verify:'test', release:'gate', operate:'operate'};

/* ---------------- working state, per device ---------------- */
const EXEC = {
  sprint: +(store('squid:exec:sprint') || 1) || 1,
  view:   store('squid:exec:view') || 'list',
  lanes:  store('squid:exec:lanes') || 'none',
  grain:  store('squid:exec:grain') || 'state',
  who:    store('squid:exec:who') || '',
  stage:  store('squid:exec:stagef') || '',
  q:      ''
};

/* Assignee overrides. The sprint plan forecasts who is likely to take
   a slice; on the day, the next person free pulls the next story.
   This is where that correction is recorded. */
const ASSIGNEE = {
  key: 'squid:exec:assign',
  data: store('squid:exec:assign') || {},
  raw(id){ return this.data[id] || ''; },
  set(id, v){ if(v) this.data[id] = v; else delete this.data[id]; store(this.key, this.data); },
  clear(){ this.data = {}; store(this.key, this.data); }
};
function assigneeOf(s){
  const over = ASSIGNEE.raw(s.id);
  if(over) return memberById(over) || null;
  return memberOf(s);
}
/* A task falls back to whoever carries its story — one slice, one
   person, so a task with a different assignee is a deliberate act. */
function taskAssignee(t){
  const over = ASSIGNEE.raw(t.id);
  if(over) return memberById(over) || null;
  return assigneeOf(t.story);
}

/* ---------------- state: derived, then asserted ---------------- */
const STAGE = {
  key: 'squid:exec:stage',
  data: store('squid:exec:stage') || {},
  raw(id){
    const v = this.data[id];
    if(!v) return '';
    return STATE_IDS.indexOf(v) > -1 ? v : (LEGACY_STATE[v] || '');
  },
  set(id, v){ if(v) this.data[id] = v; else delete this.data[id]; store(this.key, this.data); },
  clear(){ this.data = {}; store(this.key, this.data); }
};
/* Blocked is orthogonal to state, so it is stored separately. */
const BLOCKED = {
  key: 'squid:exec:blocked',
  data: store('squid:exec:blocked') || {},
  get(id){ return !!this.data[id]; },
  toggle(id){ if(this.data[id]) delete this.data[id]; else this.data[id] = 1; store(this.key, this.data); return this.get(id); },
  clear(){ this.data = {}; store(this.key, this.data); }
};

function execProgress(s){
  const ts = tasksFor(s);
  const steps = ts.reduce((a, t) => a.concat(subtasksFor(t)), []);
  const cases = testCasesFor(s);
  return {
    tasks: ts.length, tasksDone: ts.filter(t => TICKS.get(t.id)).length,
    steps: steps.length, stepsDone: steps.filter(u => TICKS.get(u.id)).length,
    cases: cases.length, casesDone: cases.filter((c, i) => TICKS.get('tcase:' + s.id + ':' + i)).length,
    dod: DOD.length, dodDone: DOD.filter((d, i) => TICKS.get(s.id + ':dod' + i)).length
  };
}
/* What the ticks already prove. Every input is something a person
   ticked in a record, so this is a reading, not a guess. */
function derivedState(s){
  const p = execProgress(s);
  if(p.dod && p.dodDone === p.dod) return 'released';
  if(p.cases && p.casesDone === p.cases) return 'uat';
  if(p.casesDone) return 'test';
  if(p.tasks && p.tasksDone === p.tasks) return 'review';
  if(p.stepsDone || p.tasksDone) return 'progress';
  return 'ready';
}
function stageOf(s){ return STAGE.raw(s.id) || derivedState(s); }
function stageIsManual(s){ return !!STAGE.raw(s.id); }
const stageOfStory = stageOf;
function lifecycleOf(s){ return stateById(stageOf(s)).stage; }

/* An assertion that has fallen behind its own record: the story is
   parked at Merged while its cases are already recorded. Worth
   surfacing, because it is the normal way a board starts lying. */
function staleAssertion(s){
  if(!stageIsManual(s)) return null;
  const set = stageOf(s), der = derivedState(s);
  if(stateIndex(der) > stateIndex(set)) return der;
  return null;
}

/* ---------------- the selected sprint ---------------- */
function execSprint(){
  const all = sprintsCached();
  return all.filter(x => x.n === EXEC.sprint)[0] || all[0];
}
function execStories(){
  const sp = execSprint();
  if(!sp) return [];
  const q = (EXEC.q || '').trim().toLowerCase();
  return sp.stories.filter(s => {
    if(EXEC.who){ const a = assigneeOf(s); if(!a || a.id !== EXEC.who) return false; }
    if(EXEC.stage && lifecycleOf(s) !== EXEC.stage) return false;
    if(q && (s.id + ' ' + s.title + ' ' + s.feature.name).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
/* Load per person, recomputed from the live assignment rather than the
   forecast — otherwise reassigning a story would leave the load lying. */
function execLoad(){
  const sp = execSprint();
  const rows = TEAM.slice(0, SPRINT_CFG.members).map(m => ({m:m, stories:[], pts:0, done:0, blocked:0}));
  const by = {}; rows.forEach(r => by[r.m.id] = r);
  (sp ? sp.stories : []).forEach(s => {
    const a = assigneeOf(s);
    const r = a && by[a.id];
    if(!r) return;
    r.stories.push(s);
    r.pts += pointsFor(s);
    if(stateById(stageOf(s)).stage === 'release' || stateById(stageOf(s)).stage === 'operate') r.done += pointsFor(s);
    if(BLOCKED.get(s.id)) r.blocked++;
  });
  return rows;
}
function execStateCounts(){
  const sp = execSprint();
  const out = {};
  STATE_IDS.forEach(id => out[id] = {n:0, pts:0});
  (sp ? sp.stories : []).forEach(s => {
    const k = stageOf(s);
    out[k].n++; out[k].pts += pointsFor(s);
  });
  return out;
}
function execStageCounts(){
  const st = execStateCounts();
  const out = {};
  EXEC_STAGES.forEach(x => {
    out[x.id] = statesOfStage(x.id).reduce((a, s) => ({n:a.n + st[s.id].n, pts:a.pts + st[s.id].pts}), {n:0, pts:0});
  });
  return out;
}
const execBlockedCount = () => {
  const sp = execSprint();
  return (sp ? sp.stories : []).filter(s => BLOCKED.get(s.id)).length;
};

/* Test cases in this sprint, grouped by the story they prove, with the
   task that owns each level. This is the mapping the sprint record was
   missing: a sprint's verification is not a total, it is a list. */
function sprintCaseMap(){
  const sp = execSprint();
  if(!sp) return [];
  return sp.stories.map(s => {
    const ts = tasksFor(s);
    return {
      story: s,
      who: assigneeOf(s),
      state: stageOf(s),
      cases: testCasesFor(s).map((c, i) => ({
        c: c, i: i,
        done: TICKS.get('tcase:' + s.id + ':' + i),
        by: ts.filter(t => casesForTask(t).some(x => x.id === c.id)).map(t => t.id)
      }))
    };
  });
}

/* ================================================================
   WORKING STATE — what is local, and how to hand it over
   ----------------------------------------------------------------
   This file has no server. Every tick, assignee and state change is
   written to this browser's localStorage and is visible to nobody
   else. That is a property of a single offline HTML file, not an
   oversight, so the honest mitigation is to make the state portable:
   export it, send it, import it.
   ================================================================ */
const WORKSTATE = {
  version: 1,
  snapshot(){
    return {
      kind: 'squid-working-state',
      version: this.version,
      savedAt: new Date().toISOString(),
      sprintCfg: {capacity:SPRINT_CFG.capacity, weeks:SPRINT_CFG.weeks, start:SPRINT_CFG.start, members:SPRINT_CFG.members},
      ticks: TICKS.data,
      assignees: ASSIGNEE.data,
      states: STAGE.data,
      blocked: BLOCKED.data
    };
  },
  toJSON(){ return JSON.stringify(this.snapshot(), null, 2); },
  counts(){
    return {
      ticks: Object.keys(TICKS.data).length,
      assignees: Object.keys(ASSIGNEE.data).length,
      states: Object.keys(STAGE.data).length,
      blocked: Object.keys(BLOCKED.data).length
    };
  },
  /* Merge, never replace: two people's progress on different slices
     should add up rather than one overwriting the other. */
  apply(text, mode){
    let d;
    try{ d = JSON.parse(text); }catch(e){ return {ok:false, why:'That is not valid JSON.'}; }
    if(!d || d.kind !== 'squid-working-state') return {ok:false, why:'That file is not a Squid working state.'};
    if(d.version > this.version) return {ok:false, why:'That file was written by a newer version of this page.'};
    if(mode === 'replace'){ TICKS.data = {}; ASSIGNEE.data = {}; STAGE.data = {}; BLOCKED.data = {}; }
    Object.assign(TICKS.data, d.ticks || {});
    Object.assign(ASSIGNEE.data, d.assignees || {});
    Object.assign(STAGE.data, d.states || {});
    Object.assign(BLOCKED.data, d.blocked || {});
    store(TICKS.key, TICKS.data);
    store(ASSIGNEE.key, ASSIGNEE.data);
    store(STAGE.key, STAGE.data);
    store(BLOCKED.key, BLOCKED.data);
    if(d.sprintCfg){
      SPRINT_CFG.capacity = d.sprintCfg.capacity || SPRINT_CFG.capacity;
      SPRINT_CFG.members = d.sprintCfg.members || SPRINT_CFG.members;
      SPRINT_CFG.start = mondayOf(d.sprintCfg.start || SPRINT_CFG.start);
      SPRINTS = null; ASSIGN = null; TEST_ROLL = null;
    }
    /* An import is someone handing over work they did offline. It is a
       contribution, not a private view, so it goes to the team exactly as
       typing it in would. */
    if(typeof SYNC !== 'undefined' && SYNC.origin){
      Object.keys(d.ticks || {}).forEach(k => SYNC.emit('checks', k, 1));
      Object.keys(d.assignees || {}).forEach(k => SYNC.emit('assign', k, d.assignees[k]));
      Object.keys(d.states || {}).forEach(k => SYNC.emit('stage', k, d.states[k]));
      Object.keys(d.blocked || {}).forEach(k => SYNC.emit('blocked', k, 1));
      if(d.sprintCfg) ['capacity', 'members', 'start'].forEach(k => SYNC.emit('cfg', k, SPRINT_CFG[k]));
    }
    return {ok:true, counts:{
      ticks: Object.keys(d.ticks || {}).length,
      assignees: Object.keys(d.assignees || {}).length,
      states: Object.keys(d.states || {}).length
    }};
  },
  /* Local, and only local. The button says “on this device” and has to
     mean it: the plain .clear() methods broadcast, so using them here let
     one person wipe the whole team from their own reset button. When there
     is a server, the sane meaning of “reset my copy” is to take the
     team’s state again — which is what reloadFromServer does. */
  clearLocalOnly(){
    const quiet = o => (o.clearQuiet || o.clear).call(o);
    TICKS.data = {}; store(TICKS.key, TICKS.data);
    quiet(ASSIGNEE); quiet(STAGE); quiet(BLOCKED);
  },
  clear(){ this.clearLocalOnly(); },
  /* Discard what is here and take the server's state as it stands. */
  async reloadFromServer(){
    if(typeof SYNC === 'undefined' || !SYNC.origin) return false;
    this.clearLocalOnly();
    SYNC.queue = []; store('squid:sync:queue', SYNC.queue);
    SYNC.version = 0; store('squid:sync:version', 0);
    await SYNC.connect();
    return true;
  }
};

/* ---------------- exports ---------------- */
function sprintBoardMarkdown(){
  const sp = execSprint();
  if(!sp) return '';
  let out = '# Sprint ' + sp.n + ' — execution\n\n';
  out += '**Goal.** ' + sp.goal + '\n\n';
  out += '**Window.** ' + DATE_DOW(sp.start) + ' to ' + DATE_DOW(sp.end) + ' · ' +
    (sp.committed ? 'committed' : 'forecast') + '\n\n';
  out += '**Carrying.** ' + sp.stories.length + ' stories · ' + sp.pts + ' points · ' + sp.tasks +
    ' tasks · ' + sp.cases + ' test cases\n\n';
  const blocked = execBlockedCount();
  if(blocked) out += '**Blocked.** ' + blocked + ' ' + (blocked === 1 ? 'slice' : 'slices') + '\n\n';

  const sc = execStateCounts();
  out += '## Where the work is\n\n';
  out += '| Stage | State | Set by | Stories | Points |\n|---|---|---|---|---|\n';
  EXEC_STAGES.forEach(st => statesOfStage(st.id).forEach(x => {
    out += '| ' + st.n + ' | ' + x.n + ' | ' + x.how + ' | ' + sc[x.id].n + ' | ' + sc[x.id].pts + ' |\n';
  }));
  out += '\nDiscover, Refine and Design are not on this board: they finish before a story enters a sprint, ' +
    'and the Ready Gate is what says so.\n\n';

  out += '## Who is carrying what\n\n';
  execLoad().forEach(r => {
    out += '### ' + r.m.n + ' — ' + r.stories.length + ' stories, ' + r.pts + ' points\n\n';
    if(!r.stories.length){ out += '_Nothing in this sprint._\n\n'; return; }
    out += '| Story | State | Points | Tasks | Cases | Blocked |\n|---|---|---|---|---|---|\n';
    r.stories.forEach(s => {
      const p = execProgress(s);
      out += '| ' + s.id + ' ' + s.title + ' | ' + stateById(stageOf(s)).n + ' | ' + pointsFor(s) +
        ' | ' + p.tasksDone + '/' + p.tasks + ' | ' + p.casesDone + '/' + p.cases + ' | ' +
        (BLOCKED.get(s.id) ? 'yes' : '') + ' |\n';
    });
    out += '\n';
  });

  out += '## Test cases in this sprint\n\n';
  sprintCaseMap().forEach(row => {
    out += '### ' + row.story.id + ' ' + row.story.title + ' — ' + row.cases.length + ' cases\n\n';
    out += '| Case | Level | Priority | Proved by | Recorded |\n|---|---|---|---|---|\n';
    row.cases.forEach(x => {
      const lvl = (TEST_LEVELS.filter(l => l.id === x.c.level)[0] || {n:x.c.level}).n;
      out += '| ' + x.c.id + ' ' + x.c.title + ' | ' + lvl + ' | ' + x.c.pri + ' | ' +
        (x.by.join(', ') || '—') + ' | ' + (x.done ? 'yes' : '') + ' |\n';
    });
    out += '\n';
  });

  out += '## Definition of Done\n\n' + DOD.map(d => '- ' + d).join('\n') + '\n';
  return out;
}
function sprintBoardCSV(){
  const sp = execSprint();
  const rows = [['Sprint', 'Story', 'Title', 'Feature', 'Release', 'Assignee', 'State', 'Lifecycle stage',
                 'State set by', 'Blocked', 'Points', 'Tasks', 'Tasks done', 'Steps', 'Steps done',
                 'Test cases', 'Cases recorded', 'DoD']];
  (sp ? sp.stories : []).forEach(s => {
    const a = assigneeOf(s), p = execProgress(s), x = stateById(stageOf(s));
    rows.push([String(sp.n), s.id, s.title, s.feature.name, releaseOf(s), a ? a.n : '',
      x.n, stageByIdX(x.stage).n, stageIsManual(s) ? 'asserted by hand' : 'derived from ticks',
      BLOCKED.get(s.id) ? 'yes' : '',
      String(pointsFor(s)), String(p.tasks), String(p.tasksDone), String(p.steps), String(p.stepsDone),
      String(p.cases), String(p.casesDone), p.dodDone + '/' + p.dod]);
  });
  return rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
}
function sprintCasesCSV(){
  const rows = [['Sprint', 'Story', 'Story title', 'Assignee', 'State', 'Case', 'Case title', 'Level',
                 'Priority', 'Proved by task', 'Recorded']];
  const n = EXEC.sprint;
  sprintCaseMap().forEach(row => row.cases.forEach(x => {
    const lvl = (TEST_LEVELS.filter(l => l.id === x.c.level)[0] || {n:x.c.level}).n;
    rows.push([String(n), row.story.id, row.story.title, row.who ? row.who.n : '',
      stateById(row.state).n, x.c.id, x.c.title, lvl, x.c.pri, x.by.join(' '), x.done ? 'yes' : '']);
  }));
  return rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
}

/* ================================================================

   ================================================================ */

const EX_COLS = [
  {id:'who',   label:'Assignee',  w:'200px'},
  {id:'state', label:'State',     w:'176px'},
  {id:'rel',   label:'Release',   w:'84px'},
  {id:'pts',   label:'Points',    w:'62px', num:true},
  {id:'tasks', label:'Tasks',     w:'72px', num:true},
  {id:'steps', label:'Steps',     w:'72px', num:true},
  {id:'tests', label:'Cases',     w:'72px', num:true},
  {id:'dod',   label:'DoD',       w:'88px', num:true}
];
const exTemplate = () => 'minmax(300px,1.5fr) ' + EX_COLS.map(c => c.w).join(' ');
const exMinWidth = () => (320 + EX_COLS.reduce((a, c) => a + parseInt(c.w, 10), 0)) + 'px';
const exCell = (html, cls) => '<div class="cell ' + (cls || '') + '">' + html + '</div>';

function avatar(m, cls){
  if(!m) return '<span class="av none" title="Not allocated">–</span>';
  return '<span class="av ' + (cls || '') + '" data-av="' + esc(m.id) + '" title="' + esc(m.n) + '">' +
    esc(m.i) + '</span>';
}
/* The select carries the ten people by name. Changing it is a real
   reassignment: the load strip, the swimlanes and every export read
   the same override. */
function whoSelect(id, cur, inherit){
  return '<span class="whosel">' + avatar(cur) +
    '<select data-who="' + esc(id) + '" aria-label="Assignee">' +
      '<option value=""' + (ASSIGNEE.raw(id) ? '' : ' selected') + '>' +
        esc(inherit ? 'Same as the story' : (cur ? cur.n + ' — as planned' : 'Unassigned')) + '</option>' +
      TEAM.slice(0, SPRINT_CFG.members).map(m => '<option value="' + m.id + '"' +
        (ASSIGNEE.raw(id) === m.id ? ' selected' : '') + '>' + esc(m.n) + '</option>').join('') +
    '</select></span>';
}
/* Grouped by lifecycle stage, so choosing a state also shows which
   stage of the model the slice is in. */
function stateSelect(s){
  const cur = stageOf(s);
  return '<span class="stgsel tone-' + stateTone(cur) + '">' +
    '<select data-stage="' + esc(s.id) + '" aria-label="State">' +
      EXEC_STAGES.map(st => '<optgroup label="' + esc(st.n) + '">' +
        statesOfStage(st.id).map(x => '<option value="' + x.id + '"' + (x.id === cur ? ' selected' : '') + '>' +
          esc(x.n) + '</option>').join('') + '</optgroup>').join('') +
    '</select>' +
    (stageIsManual(s)
      ? '<i title="Asserted by hand — this story no longer follows its ticks">●</i>'
      : '<i class="auto" title="Derived from the ticks on the record">○</i>') +
    '</span>';
}
const miniBar = (a, b) => '<span class="mbar' + (b && a === b ? ' full' : '') + '">' +
  '<i style="width:' + (b ? Math.round(a / b * 100) : 0) + '%"></i></span>' +
  '<span class="mnum">' + a + '/' + b + '</span>';
const blockBtn = id => '<button class="blk' + (BLOCKED.get(id) ? ' on' : '') + '" data-exblock="' + esc(id) +
  '" aria-pressed="' + BLOCKED.get(id) + '" title="Blocked — a flag, not a state">!</button>';

/* ---------------- list view ---------------- */
function exRowStory(s){
  const p = execProgress(s), who = assigneeOf(s), rel = releaseById(releaseOf(s));
  const stale = staleAssertion(s);
  return '<div class="lrow r-story exrow' + (BLOCKED.get(s.id) ? ' isblocked' : '') +
    (readyGateFor(s).ready ? ' is-ready' : '') +
    '" data-row="x-' + s.id + '" data-exkind="story" data-exid="' + s.id + '" data-lvl="1" tabindex="0" role="button">' +
    '<div class="cell c-name">' +
      '<button class="tw" data-extog="x-' + s.id + '" aria-expanded="false" aria-label="Expand tasks">▶</button>' +
      typeIcon('story') + rid(s.id) + '<span class="nm">' + esc(s.title) + '</span>' +
      blockBtn(s.id) +
      (stale ? '<span class="stale" title="The ticks already prove ' + esc(stateById(stale).n) +
        ' — the asserted state is behind the record">behind</span>' : '') +
      '<span class="open-hint">open ›</span></div>' +
    exCell(whoSelect(s.id, who, false)) +
    exCell(stateSelect(s)) +
    exCell(rel ? '<span class="pill blue sm">' + esc(rel.id) + '</span>' : dash) +
    exCell('<span class="mono">' + pointsFor(s) + '</span>', 'c-num') +
    exCell(miniBar(p.tasksDone, p.tasks), 'c-num') +
    exCell(miniBar(p.stepsDone, p.steps), 'c-num') +
    exCell(miniBar(p.casesDone, p.cases), 'c-num') +
    exCell(miniBar(p.dodDone, p.dod), 'c-num') +
  '</div>';
}
function exRowTask(t){
  const us = subtasksFor(t), uDone = us.filter(u => TICKS.get(u.id)).length;
  const cs = casesForTask(t), csDone = cs.filter((c, i) => TICKS.get('tcase:' + t.id + ':' + i)).length;
  const done = TICKS.get(t.id);
  return '<div class="lrow r-task exrow' + (done ? ' done' : '') + '" data-row="x-' + t.id +
    '" data-exkind="task" data-exid="' + t.id + '" data-parent="x-' + t.story.id + '" data-lvl="2" tabindex="0" role="button">' +
    '<div class="cell c-name">' + indent(20) +
      '<button class="tw' + (us.length ? '' : ' leaf') + '" data-extog="x-' + t.id +
        '" aria-expanded="false" aria-label="Expand steps">▶</button>' +
      '<button class="exbox' + (done ? ' on' : '') + '" data-extick="' + t.id +
        '" aria-pressed="' + !!done + '" aria-label="Mark the task done">✓</button>' +
      typeIcon('task') + rid(t.id) + '<span class="nm">' + esc(t.title) + '</span>' +
      '<span class="open-hint">open ›</span></div>' +
    exCell(whoSelect(t.id, taskAssignee(t), true)) +
    exCell('<span class="st ' + (done ? 'defined' : 'planned') + '">' + (done ? 'Done' : 'Open') +
      '</span><span class="tkind">' + esc(t.kind) + '</span>') +
    exCell(dash) +
    exCell(dash, 'c-num') +
    exCell(dash, 'c-num') +
    exCell(miniBar(uDone, us.length), 'c-num') +
    exCell(miniBar(csDone, cs.length), 'c-num') +
    exCell(dash, 'c-num') +
  '</div>';
}
function exRowSub(u){
  const done = TICKS.get(u.id);
  return '<div class="lrow r-sub exrow' + (done ? ' done' : '') + '" data-row="x-' + u.id +
    '" data-exkind="sub" data-exid="' + u.id + '" data-parent="x-' + u.task.id + '" data-lvl="3">' +
    '<div class="cell c-name">' + indent(40) + '<span class="tw leaf">▶</span>' +
      '<button class="exbox' + (done ? ' on' : '') + '" data-extick="' + u.id +
        '" aria-pressed="' + !!done + '" aria-label="Mark this step done">✓</button>' +
      typeIcon('sub') + rid(u.id) + '<span class="nm">' + esc(u.title) + '</span></div>' +
    exCell(dash) + exCell(dash) + exCell(dash) + exCell(dash, 'c-num') + exCell(dash, 'c-num') +
    exCell(dash, 'c-num') + exCell(dash, 'c-num') + exCell(dash, 'c-num') +
  '</div>';
}
function execListHTML(){
  const rows = execStories();
  if(!rows.length) return '<div class="empty-note">Nothing in this sprint matches the filter.</div>';
  const head = '<div class="lhead"><div class="cell c-name">Story · task · step</div>' +
    EX_COLS.map(c => '<div class="cell' + (c.num ? ' c-num' : '') + '">' + esc(c.label) + '</div>').join('') + '</div>';
  return '<div class="list exlist" id="execRoot" style="--cols:' + exTemplate() + '">' +
    '<div class="list-inner" style="--min-w:' + exMinWidth() + '">' + head +
    rows.map(exRowStory).join('') + '</div>' +
    '<div class="list-foot"><span>' + rows.length + ' of ' + execSprint().stories.length +
      ' stories shown · expand a story for its tasks, a task for its steps</span>' +
      '<span style="margin-left:auto">Select a row for its record, with the test cases and the Definition of Done</span>' +
    '</div></div>';
}

/* ---------------- board view ---------------- */
function execCard(s){
  const p = execProgress(s), who = assigneeOf(s), rel = releaseById(releaseOf(s));
  const cur = stageOf(s), i = stateIndex(cur);
  const blocked = BLOCKED.get(s.id), stale = staleAssertion(s);
  return '<article class="kcard' + (blocked ? ' blocked' : '') + '" draggable="true" data-card="' + s.id + '" tabindex="0">' +
    '<div class="kcard-h">' + rid(s.id) +
      (rel ? '<span class="pill blue sm">' + esc(rel.id) + '</span>' : '') +
      (blocked ? '<span class="pill amber sm">blocked</span>' : '') +
      '<span class="kpts mono">' + pointsFor(s) + ' pts</span></div>' +
    '<div class="kcard-t">' + esc(s.title) + '</div>' +
    '<div class="kcard-f">' + esc(s.feature.name) + '</div>' +
    '<div class="kcard-m">' + avatar(who) + '<span class="kwho">' + esc(who ? who.n : 'Unassigned') + '</span>' +
      '<span class="kprog mono" title="tasks done · cases recorded">' + p.tasksDone + '/' + p.tasks +
      ' t · ' + p.casesDone + '/' + p.cases + ' c</span></div>' +
    (stale ? '<div class="kstale">Ticks already prove ' + esc(stateById(stale).n) + '</div>' : '') +
    '<div class="kcard-b">' +
      '<button class="kmove" data-kmove="' + s.id + '" data-dir="-1"' + (i === 0 ? ' disabled' : '') +
        ' aria-label="Move back a state">◀</button>' +
      '<span class="kstate">' + esc(stateById(cur).n) +
        '<i>' + (stageIsManual(s) ? 'asserted' : 'from ticks') + '</i></span>' +
      '<button class="kmove" data-kmove="' + s.id + '" data-dir="1"' +
        (i === EXEC_STATES.length - 1 ? ' disabled' : '') + ' aria-label="Move forward a state">▶</button>' +
      '<button class="kblk' + (blocked ? ' on' : '') + '" data-exblock="' + s.id +
        '" aria-pressed="' + blocked + '" aria-label="Flag as blocked">!</button>' +
    '</div>' +
  '</article>';
}
/* Columns are the ten states at full grain, or the five lifecycle
   stages when that is too much. Either way the band above names the
   stage, so a state is never read out of context. */
function execColumns(){
  return EXEC.grain === 'stage'
    ? EXEC_STAGES.map(st => ({id:st.id, n:st.n, sub:st.q, stage:st.id, how:'', drop:statesOfStage(st.id)[0].id,
        full:st.q, match:s => lifecycleOf(s) === st.id}))
    : EXEC_STATES.map(x => ({id:x.id, n:x.n, sub:x.s, full:x.d, stage:x.stage, how:x.how, drop:x.id,
        match:s => stageOf(s) === x.id}));
}
/* The band spans its stage's columns, so a state is never read out of
   context. It shares the column template with the board below it. */
function execBandHTML(cols){
  const bands = [];
  cols.forEach((c, i) => {
    const last = bands[bands.length - 1];
    if(last && last.stage === c.stage) last.span++;
    else bands.push({stage:c.stage, span:1, from:i});
  });
  return bands.map(b => {
    const st = stageByIdX(b.stage);
    return '<div class="kb tone-' + (STAGE_TONE[b.stage] || 'none') + '" style="grid-column:span ' + b.span + '">' +
      '<b>' + esc(st.n) + '</b>' + (st.gate ? '<u>' + esc(st.gate) + '</u>' : '') + '</div>';
  }).join('');
}
function execColHTML(c, stories){

function execBoardHTML(){

/* ---------------- the verification mapping ---------------- */
function execCasesHTML(){
  const keep = execStories();
  const shown = sprintCaseMap().filter(r => keep.indexOf(r.story) > -1);
  const total = shown.reduce((a, r) => a + r.cases.length, 0);
  const done = shown.reduce((a, r) => a + r.cases.filter(x => x.done).length, 0);
  if(!shown.length) return '<div class="empty-note">Nothing in this sprint matches the filter.</div>';
  return '<p class="spnote">' + pl(total) + ' cases across ' + shown.length + ' stories, ' + done +
    ' recorded. A case belongs to the <b>story</b>, because the acceptance criterion does; the <b>task</b> named beside ' +
    'it is the one that owns the level which proves it, and that is where its execution is recorded. Tick a case here ' +
    'or in either record — it is the same tick.</p>' +
    '<div class="sccards">' + shown.map(r =>
    '<section class="scc' + (r.cases.length && r.cases.every(x => x.done) ? ' all' : '') + '">' +
      '<header class="scc-h">' + avatar(r.who) + rid(r.story.id) +
        '<button class="scc-t" data-openstory="' + r.story.id + '">' + esc(r.story.title) + '</button>' +
        '<span class="pill sm tone-' + stateTone(r.state) + '">' + esc(stateById(r.state).n) + '</span>' +
        '<span class="mono scc-c">' + r.cases.filter(x => x.done).length + '/' + r.cases.length + '</span></header>' +
      '<div class="scc-b">' + r.cases.map(x => {
        const lvl = (TEST_LEVELS.filter(l => l.id === x.c.level)[0] || {n:x.c.level}).n;
        return '<div class="scr' + (x.done ? ' done' : '') + '">' +
          '<button class="exbox' + (x.done ? ' on' : '') + '" data-extick="tcase:' + r.story.id + ':' + x.i +
            '" aria-pressed="' + !!x.done + '" aria-label="Record this case">✓</button>' +

          '<span class="scr-t">' + esc(x.c.title) + '</span>' +

      }).join('') + '</div></section>').join('') + '</div>' +

  '<h2 class="sec" id="workstate">Hand over working state</h2>' +

      '<div class="wst"><b>' + ws.blocked + '</b><span>slices flagged as blocked</span></div>' +

    'or a new first Monday arrives too. If you need everyone to see the same board at the same time, that needs a server ' +

function execBodyHTML(){

/* ---------------- wiring ---------------- */
/* A full render keeps the load strip, the state counts and the rows in
   agreement — but it must not move the page under the person who just
   used a select. */
function exRender(){
  const y = window.scrollY || 0;
  render();
  if(y) setTimeout(() => window.scrollTo(0, y), 0);
}
function exRepaintBody(){
  const body = $('[data-exbody]');
  if(!body) return;
  body.innerHTML = execBodyHTML();
  wireExecBody(body);
}
function exToggle(rowId, view){
  const row = $('[data-row="' + rowId + '"]', view);
  if(!row) return;
  const tog = $('[data-extog]', row);
  const open = row.dataset.exopen !== '1';
  row.dataset.exopen = open ? '1' : '';
  if(open && !row.dataset.exbuilt){
    const id = rowId.slice(2);
    const html = row.dataset.exkind === 'story'
      ? tasksFor(storyById(id)).map(exRowTask).join('')
      : subtasksFor(taskById(id)).map(exRowSub).join('');
    if(html) row.insertAdjacentHTML('afterend', html);
    row.dataset.exbuilt = '1';
    wireExecBody(view);
  }
  if(tog){ tog.classList.toggle('open', open); tog.setAttribute('aria-expanded', String(open)); }
  exApplyVis(view);
}
function exApplyVis(view){
  const rows = $$('.exrow', view), map = {};
  rows.forEach(r => map[r.dataset.row] = r);
  rows.forEach(r => {
    let p = r.dataset.parent, vis = true;
    while(p && map[p]){
      if(map[p].dataset.exopen !== '1'){ vis = false; break; }
      p = map[p].dataset.parent;
    }
    r.classList.toggle('hidden', !vis);
  });
}
function wireExecBody(view){
  $$('[data-extog]', view).forEach(b => b.onclick = e => { e.stopPropagation(); exToggle(b.dataset.extog, view); });
  $$('[data-extick]', view).forEach(b => b.onclick = e => {
    e.stopPropagation();
    const on = TICKS.toggle(b.dataset.extick);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
    const row = b.closest('.exrow') || b.closest('.scr');
    if(row) row.classList.toggle('done', on);
    exRefreshHead();
  });
  $$('[data-exblock]', view).forEach(b => b.onclick = e => {
    e.stopPropagation();
    BLOCKED.toggle(b.dataset.exblock);
    exRender();
  });
  $$('[data-who]', view).forEach(sel => {
    sel.onclick = e => e.stopPropagation();
    sel.onchange = e => {
      e.stopPropagation();
      ASSIGNEE.set(sel.dataset.who, sel.value);
      exRender();
      toast(sel.value ? 'Reassigned to ' + memberById(sel.value).n : 'Back to the planned assignee');
    };
  });
  $$('[data-stage]', view).forEach(sel => {
    sel.onclick = e => e.stopPropagation();
    sel.onchange = e => {
      e.stopPropagation();
      STAGE.set(sel.dataset.stage, sel.value);
      exRender();
    };
  });
  $$('[data-opentask]', view).forEach(b => b.onclick = e => { e.stopPropagation(); openTask(b.dataset.opentask); });
  $$('[data-openstory]', view).forEach(b => b.onclick = e => { e.stopPropagation(); openStory(b.dataset.openstory); });
  $$('[data-excasescsv]', view).forEach(b => b.onclick = () =>
    download('squid-sprint-' + EXEC.sprint + '-cases.csv', sprintCasesCSV(), 'text/csv;charset=utf-8'));

  /* rows open the record the backlog opens */
  $$('.exrow', view).forEach(r => {
    const go = () => {
      const k = r.dataset.exkind, id = r.dataset.exid;
      if(k === 'story') openStory(id);
      else if(k === 'task') openTask(id);
      else openTask(id.split('-').slice(0, 3).join('-'));
    };
    r.onclick = e => { if(!e.target.closest('select, button, .whosel, .stgsel')) go(); };
    r.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } };
  });

  /* ---- board ---- */
  $$('[data-kmove]', view).forEach(b => b.onclick = e => {
    e.stopPropagation();
    const s = storyById(b.dataset.kmove);
    const next = EXEC_STATES[Math.max(0, Math.min(EXEC_STATES.length - 1,
      stateIndex(stageOf(s)) + (+b.dataset.dir)))];
    STAGE.set(s.id, next.id);
    exRender();
    toast(s.id + ' → ' + next.n + (next.how === 'asserted' ? ' · asserted' : ''));
  });
  $$('.kcard', view).forEach(c => {
    c.ondragstart = e => {
      c.classList.add('dragging');
      try{ e.dataTransfer.setData('text/plain', c.dataset.card); e.dataTransfer.effectAllowed = 'move'; }catch(x){}
    };
    c.ondragend = () => c.classList.remove('dragging');
    c.onclick = e => { if(!e.target.closest('button')) openStory(c.dataset.card); };
    c.onkeydown = e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openStory(c.dataset.card); return; }
      if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      const s = storyById(c.dataset.card);
      const next = EXEC_STATES[Math.max(0, Math.min(EXEC_STATES.length - 1,
        stateIndex(stageOf(s)) + (e.key === 'ArrowRight' ? 1 : -1)))];
      STAGE.set(s.id, next.id);
      exRender();
    };
  });
  $$('[data-kscroll]', view).forEach(b => b.onclick = e => {
    e.stopPropagation();
    const pane = $('.kwrap', view) || $('.kwrap');
    if(!pane) return;
