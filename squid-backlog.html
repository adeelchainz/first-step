<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squid Product Backlog</title>
<meta name="description" content="The Squid product backlog: 26 initiatives decomposed into epics and features, as a nested list with columns.">
<style>
/* ============================================================
   Squid Product Backlog — list view
   Visual system shared with the Architecture & System Design
   Handbook and the Delivery Model field manual.
   ============================================================ */
:root{
  --bg:#fbfaf7; --bg-sunk:#f3f2ed; --panel:#ffffff; --panel-2:#faf9f6;
  --ink:#14171c; --ink-2:#4c535c; --ink-3:#767d87; --ink-4:#a2a8b1;
  --line:#e0dfd6; --line-2:#ecebe4; --line-3:#c9c7ba;
  --blue:#2a53c4; --blue-bg:#eaeffb; --blue-line:#b9c8ee;
  --green:#14704a; --green-bg:#e7f3ec; --green-line:#a8d2be;
  --amber:#8a5b00; --amber-bg:#faf1de; --amber-line:#e2c88f;
  --red:#ad2a20; --red-bg:#fbeceb; --red-line:#eeb9b4;
  --purple:#6337b0; --purple-bg:#f1ecfb; --purple-line:#cdbcee;
  --grid:rgba(20,23,28,.045);
  --focus:#2a53c4;
  --font-sans:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  --font-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --hdr-h:54px; --side-w:272px; --row-h:34px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --bg-sunk:#151a22; --panel:#141820; --panel-2:#171c25;
    --ink:#e9ecf1; --ink-2:#aab3c0; --ink-3:#818b9a; --ink-4:#626b7b;
    --line:#252b36; --line-2:#1c212b; --line-3:#39414f;
    --blue:#8aa8fb; --blue-bg:#141c33; --blue-line:#2d3f70;
    --green:#5fc797; --green-bg:#0f2620; --green-line:#215844;
    --amber:#e0b153; --amber-bg:#2a2010; --amber-line:#5d4820;
    --red:#f08a80; --red-bg:#2c1614; --red-line:#63302b;
    --purple:#b79bf2; --purple-bg:#1e1733; --purple-line:#42346e;
    --grid:rgba(233,236,241,.045); --focus:#8aa8fb;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --bg-sunk:#151a22; --panel:#141820; --panel-2:#171c25;
  --ink:#e9ecf1; --ink-2:#aab3c0; --ink-3:#818b9a; --ink-4:#626b7b;
  --line:#252b36; --line-2:#1c212b; --line-3:#39414f;
  --blue:#8aa8fb; --blue-bg:#141c33; --blue-line:#2d3f70;
  --green:#5fc797; --green-bg:#0f2620; --green-line:#215844;
  --amber:#e0b153; --amber-bg:#2a2010; --amber-line:#5d4820;
  --red:#f08a80; --red-bg:#2c1614; --red-line:#63302b;
  --purple:#b79bf2; --purple-bg:#1e1733; --purple-line:#42346e;
  --grid:rgba(233,236,241,.045); --focus:#8aa8fb;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-sans);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
::selection{background:var(--blue-bg); color:var(--ink)}
a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline; text-underline-offset:2px}
:focus-visible{outline:2px solid var(--focus); outline-offset:-2px; border-radius:3px}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
kbd{font-family:var(--font-mono); font-size:11px; border:1px solid var(--line); border-bottom-width:2px;
  border-radius:4px; padding:1px 5px; color:var(--ink-3); background:var(--panel)}
p{margin:0 0 14px}

/* ---------- header ---------- */
.hdr{position:fixed; inset:0 0 auto 0; height:var(--hdr-h); z-index:60; display:flex; align-items:center;
  gap:14px; padding:0 14px; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.2) blur(10px); border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:baseline; gap:8px; min-width:0}
.brand-mark{width:15px; height:15px; flex:none; align-self:center; border:1.5px solid var(--blue);
  border-radius:3px; position:relative}
.brand-mark::after{content:""; position:absolute; left:3px; right:3px; top:3px; height:1.5px; background:var(--blue);
  box-shadow:0 4px 0 var(--blue)}
.brand-t{font-weight:640; letter-spacing:-.01em; font-size:14px; white-space:nowrap; color:var(--ink)}
.brand-sub{font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.crumb{font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);
  border-left:1px solid var(--line); padding-left:14px; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; flex:1; min-width:0}
.hdr-right{display:flex; align-items:center; gap:6px; margin-left:auto}
.ghost-btn{display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 10px; border:1px solid var(--line);
  border-radius:6px; font-size:12.5px; color:var(--ink-2); background:var(--panel); white-space:nowrap}
.ghost-btn:hover{border-color:var(--line-3); color:var(--ink)}
.icon-btn{width:30px; height:30px; display:inline-grid; place-items:center; border:1px solid var(--line);
  border-radius:6px; color:var(--ink-2); background:var(--panel); font-size:13px}
.icon-btn:hover{border-color:var(--line-3); color:var(--ink)}
#navToggle{display:none}

/* ---------- sidebar ---------- */
.side{position:fixed; top:var(--hdr-h); bottom:0; left:0; width:var(--side-w); z-index:50; overflow-y:auto;
  overscroll-behavior:contain; padding:10px 8px 60px 12px; border-right:1px solid var(--line); background:var(--bg)}
.side::-webkit-scrollbar{width:9px}
.side::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px; border:3px solid var(--bg)}
.side-h{font-family:var(--font-mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-4); padding:12px 8px 6px}
.nav-a{display:flex; gap:8px; align-items:baseline; padding:5px 8px; border-radius:6px; font-size:12.6px;
  color:var(--ink-2); line-height:1.35; width:100%; text-align:left}
.nav-a:hover{background:var(--bg-sunk); color:var(--ink); text-decoration:none}
.nav-a.on{background:var(--blue-bg); color:var(--ink); font-weight:580}
.nav-a .nn{font-family:var(--font-mono); font-size:10px; color:var(--ink-4); flex:none; width:16px}
.nav-a.on .nn{color:var(--blue)}
.nav-a .cnt{margin-left:auto; font-family:var(--font-mono); font-size:9.5px; color:var(--ink-4); flex:none}
.side-sep{margin:10px 8px; border-top:1px solid var(--line-2)}
.nav-a.future .nn{color:var(--purple)}

/* ---------- main ---------- */
.main{margin:var(--hdr-h) 0 0 var(--side-w); min-height:calc(100vh - var(--hdr-h)); position:relative}
.wrap{position:relative; z-index:1; padding:0 26px 90px; max-width:1560px; margin:0 auto}
.wrap.doc{max-width:1100px; margin:0 auto; padding:0 28px 90px}

/* ---------- tabs ---------- */
.tabs{position:sticky; top:var(--hdr-h); z-index:42; background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line-2); padding:7px 20px; display:flex; gap:3px;
  align-items:center; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--font-mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-4);
  padding:5px 9px; border-radius:5px; white-space:nowrap}
.tab:hover{color:var(--ink-2); background:var(--bg-sunk); text-decoration:none}
.tab.on{color:var(--blue); background:var(--blue-bg)}
.count-note{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-4); white-space:nowrap}

/* ---------- list header ---------- */
.list-top{padding:18px 0 12px}
.list-title{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.list-title h1{font-family:var(--font-serif); font-size:26px; letter-spacing:-.02em; margin:0; font-weight:600}
.list-sub{font-size:13px; color:var(--ink-3)}
.toolbar{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:12px}
.tb-search{display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:7px;
  background:var(--panel); padding:0 9px; height:30px; min-width:230px}
.tb-search input{border:none; background:none; outline:none; font:inherit; font-size:13px; color:var(--ink); width:100%}
.tb-btn{display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border:1px solid var(--line);
  border-radius:7px; background:var(--panel); font-size:12.5px; color:var(--ink-2); white-space:nowrap}
.tb-btn:hover{border-color:var(--line-3); color:var(--ink)}
.tb-btn.on{background:var(--blue-bg); border-color:var(--blue-line); color:var(--blue)}
.tb-sel{height:30px; border:1px solid var(--line); border-radius:7px; background:var(--panel); color:var(--ink-2);
  font:inherit; font-size:12.5px; padding:0 8px}
.tb-spacer{flex:1}
.menu-wrap{position:relative}
.menu{position:absolute; right:0; top:34px; z-index:45; background:var(--panel); border:1px solid var(--line);
  border-radius:9px; box-shadow:0 14px 34px rgba(10,12,16,.16); padding:6px; min-width:196px; display:none}
.menu.show{display:block}
.menu-h{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-4); padding:6px 9px 4px}
.menu label{display:flex; align-items:center; gap:9px; padding:6px 9px; border-radius:6px; font-size:13px;
  color:var(--ink-2); cursor:pointer}
.menu label:hover{background:var(--bg-sunk)}
.menu input{accent-color:var(--blue)}

/* ---------- the list ---------- */
.list{border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:auto; margin-top:12px;
  max-height:calc(100vh - var(--hdr-h) - 190px)}
.list-inner{min-width:var(--min-w,980px)}
.lhead{display:grid; grid-template-columns:var(--cols); position:sticky; top:0; z-index:5;
  background:var(--panel-2); border-bottom:1px solid var(--line)}
.lhead .cell{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); padding:9px 12px; white-space:nowrap; border-right:1px solid var(--line-2)}
.lhead .cell:last-child{border-right:none}
.lhead .c-name{position:sticky; left:0; z-index:6; background:var(--panel-2)}
.lrow{display:grid; grid-template-columns:var(--cols); border-bottom:1px solid var(--line-2);
  background:var(--panel); min-height:var(--row-h); align-items:center}
.lrow:hover{background:var(--bg-sunk)}
.lrow .cell{padding:6px 12px; font-size:13.2px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; border-right:1px solid var(--line-2)}
.lrow .cell:last-child{border-right:none}
.lrow .c-name{position:sticky; left:0; z-index:2; background:inherit; display:flex; align-items:center; gap:7px;
  padding-left:8px; border-right:1px solid var(--line-2)}
.lrow.r-ini{background:var(--panel-2); border-bottom-color:var(--line)}
.lrow.r-ini:hover{background:var(--bg-sunk)}
.lrow.r-ini .c-name{font-size:14px; font-weight:640; color:var(--ink); letter-spacing:-.01em}
.lrow.r-epic .c-name{font-weight:560; color:var(--ink)}
.lrow.r-feat .c-name{color:var(--ink-2)}
.lrow.r-feat:hover .c-name{color:var(--ink)}
.lrow.hidden{display:none}
.lrow.sel{background:var(--blue-bg)}
.lrow.sel .c-name{background:var(--blue-bg)}
.lrow.flash{animation:flash 1.1s ease}
@keyframes flash{0%,40%{background:var(--amber-bg)}100%{background:inherit}}

.tw{width:17px; height:17px; flex:none; display:grid; place-items:center; border-radius:4px; color:var(--ink-4);
  font-size:9px; font-family:var(--font-mono); transition:transform .15s ease}
.tw:hover{background:var(--line-2); color:var(--ink)}
.tw.open{transform:rotate(90deg)}
.tw.leaf{visibility:hidden}
.ind{flex:none; display:block}
/* ---------- type icons ---------- */
.ticon{flex:none; width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.35;
  stroke-linecap:round; stroke-linejoin:round; opacity:.92}
.ti-ini{color:var(--blue)}
.lrow.r-ini.future .ti-ini{color:var(--purple)}
.ti-epic{color:var(--blue); opacity:.72}
.ti-feat{color:var(--ink-4)}
.lrow.r-feat.has-flag .ti-feat{color:var(--amber)}
.lrow.r-feat.has-dup .ti-feat{color:var(--purple)}
.ti-story{color:var(--amber); fill:var(--amber-bg)}
.lrow.r-story.is-ready .ti-story{color:var(--green); fill:var(--green-bg)}
.ti-task{color:var(--ink-4)}
.ti-sub{color:var(--ink-4); opacity:.7}
.sr-only{position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0}
/* the id, beside the name it identifies */
.rid{flex:none; font-family:var(--font-mono); font-size:10px; letter-spacing:.02em; color:var(--ink-4);
  background:var(--bg-sunk); border:1px solid var(--line-2); border-radius:4px; padding:1px 5px}
.lrow.r-ini .rid{color:var(--blue); background:var(--blue-bg); border-color:var(--blue-line); font-weight:600}
.lrow.r-story.is-ready .rid{color:var(--green); border-color:var(--green-line); background:var(--green-bg)}
.lrow:hover .rid{border-color:var(--line-3); color:var(--ink-3)}
.lrow.r-sub .rid{font-size:9.5px; opacity:.85}
.nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cnt-badge{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-4); background:var(--line-2);
  border-radius:20px; padding:1px 7px; flex:none}
.open-hint{margin-left:auto; font-size:11px; color:var(--ink-4); opacity:0; flex:none; padding-left:8px}
.lrow:hover .open-hint{opacity:1}
.c-num{text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--ink-3)}
.c-mono{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-3)}
.tag{display:inline-flex; align-items:center; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; padding:2px 7px; border-radius:4px; border:1px solid var(--line)}
.tag.ini{color:var(--blue); background:var(--blue-bg); border-color:var(--blue-line)}
.tag.epic{color:var(--ink-2); background:var(--bg-sunk)}
.tag.feat{color:var(--ink-3); background:transparent}
.tag.story{color:var(--amber); background:var(--amber-bg); border-color:var(--amber-line)}
.tag.task{color:var(--ink-3); background:var(--bg-sunk)}
.tag.sub{color:var(--ink-4); background:transparent; border-style:dashed}
.tag.future{color:var(--purple); background:var(--purple-bg); border-color:var(--purple-line)}
.tag.parity{color:var(--ink-3); background:transparent}
.st{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-3)}
.st::before{content:""; width:7px; height:7px; border-radius:2px; background:var(--line-3)}
.st.named::before{background:var(--blue)}
.st.grouped::before{background:var(--ink-4)}
.st.defined::before{background:var(--green)}
.st.cand::before{background:var(--amber)}
.st.planned::before{background:var(--line-3)}
.pat{font-family:var(--font-mono); font-size:10px; letter-spacing:.05em; color:var(--ink-3);
  background:var(--bg-sunk); border-radius:4px; padding:2px 7px}

/* deeper levels */
.lrow.r-story{background:var(--panel)}
.lrow.r-story .c-name{color:var(--ink-2)}
.lrow.r-story:hover .c-name{color:var(--ink)}
.lrow.r-task .c-name,.lrow.r-sub .c-name{color:var(--ink-3)}
.lrow.r-sub .cell{font-size:12.6px}
/* type icons above carry the story, task and subtask marks */

/* drawer extras */
.slice{border:1px solid var(--line-2); border-radius:7px; padding:7px 9px; margin-bottom:7px; background:var(--panel-2)}
.slice .hit{border:none; background:none; padding:0; font-size:13.4px; color:var(--ink)}
.slice .hit:hover{color:var(--blue)}
.slice-p{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; color:var(--ink-4); margin-top:4px}
.acl{margin:0; padding-left:0; list-style:none; counter-reset:ac}
.acl li{position:relative; padding:6px 0 6px 46px; font-size:13.6px; color:var(--ink-2);
  border-bottom:1px solid var(--line-2)}
.acl li:last-child{border-bottom:none}
.acl li::before{counter-increment:ac; content:"AC-" counter(ac); position:absolute; left:0; top:6px;
  font-family:var(--font-mono); font-size:9.5px; color:var(--amber); background:var(--amber-bg);
  border-radius:4px; padding:2px 5px}
.gatelist{list-style:none; margin:0; padding:0}
.gatelist li{position:relative; padding:5px 0 5px 24px; font-size:13.4px; color:var(--ink-3);
  border-bottom:1px solid var(--line-2)}
.gatelist li:last-child{border-bottom:none}
.gatelist li::before{content:"☐"; position:absolute; left:2px; color:var(--ink-4)}
.gatelist li.can{color:var(--ink-2)}
.gatelist li.can::before{content:"◐"; color:var(--amber)}
.subs{list-style:none; margin:0; padding:0}
.subs li{position:relative; padding:5px 0 5px 22px; font-size:13.4px; color:var(--ink-2);
  border-bottom:1px solid var(--line-2)}
.subs li:last-child{border-bottom:none}
.subs li::before{content:"☐"; position:absolute; left:2px; color:var(--ink-4)}
.list-note{font-size:12.8px; color:var(--ink-3); margin-top:8px; max-width:104ch; line-height:1.5}
.fl{display:inline-flex; gap:5px; overflow:hidden}
.fl b{font-family:var(--font-mono); font-size:9.5px; font-weight:400; letter-spacing:.06em; padding:2px 6px;
  border-radius:4px; white-space:nowrap}
.fl b.dup{color:var(--purple); background:var(--purple-bg)}
.fl b.q{color:var(--amber); background:var(--amber-bg)}
.empty-note{padding:26px; text-align:center; color:var(--ink-4); font-size:13.5px}
.list-foot{display:flex; gap:14px; align-items:center; padding:9px 14px; border-top:1px solid var(--line-2);
  background:var(--panel-2); font-family:var(--font-mono); font-size:10.5px; color:var(--ink-4);
  position:sticky; bottom:0; z-index:4}

/* ---------- document pages ---------- */
.page-open{padding:34px 0 22px; border-bottom:1px solid var(--line); margin-bottom:24px}
.eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.17em; text-transform:uppercase; color:var(--ink-3)}
h1.page-t{font-family:var(--font-serif); font-size:clamp(26px,3.6vw,36px); line-height:1.12; letter-spacing:-.022em;
  margin:12px 0 12px; font-weight:600}
.page-sum{font-size:16.5px; line-height:1.55; color:var(--ink-2); max-width:62ch; margin:0}
h2.sec{font-size:12px; font-family:var(--font-mono); letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  margin:38px 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line-2); font-weight:500}
.meta-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px;
  letter-spacing:.09em; text-transform:uppercase; padding:4px 9px; border-radius:20px; border:1px solid var(--line);
  color:var(--ink-3); background:var(--panel)}
.pill.blue{border-color:var(--blue-line); color:var(--blue); background:var(--blue-bg)}
.pill.green{border-color:var(--green-line); color:var(--green); background:var(--green-bg)}
.pill.amber{border-color:var(--amber-line); color:var(--amber); background:var(--amber-bg)}
.pill.purple{border-color:var(--purple-line); color:var(--purple); background:var(--purple-bg)}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:10px}
.panel-h{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line-2);
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  background:var(--panel-2)}
.panel-b{padding:16px}
.callout{border:1px solid var(--line); border-left-width:3px; border-radius:7px; padding:13px 15px; margin:18px 0;
  background:var(--panel); font-size:14.2px}
.callout-h{font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  margin-bottom:6px; display:flex; gap:8px; align-items:center}
.callout p:last-child{margin-bottom:0}
.callout.model{border-left-color:var(--blue); background:var(--blue-bg)} .callout.model .callout-h{color:var(--blue)}
.callout.note{border-left-color:var(--line-3); background:var(--panel-2)} .callout.note .callout-h{color:var(--ink-3)}
.callout.warn{border-left-color:var(--amber); background:var(--amber-bg)} .callout.warn .callout-h{color:var(--amber)}
.callout.future{border-left-color:var(--purple); background:var(--purple-bg)} .callout.future .callout-h{color:var(--purple)}
.tmpl{font-family:var(--font-mono); font-size:11.6px; line-height:1.55; white-space:pre-wrap; color:var(--ink-2);
  background:var(--panel-2); border:1px solid var(--line-2); border-radius:8px; padding:12px}
ul.bl{list-style:none; margin:0 0 14px; padding-left:2px}
ul.bl>li{position:relative; padding-left:20px; margin-bottom:6px; font-size:14px; color:var(--ink-2)}
ul.bl>li::before{content:""; position:absolute; left:2px; top:.72em; width:7px; height:1px; background:var(--line-3)}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:18px 0}
.tbl-wrap{overflow:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:18px 0}
table{border-collapse:collapse; width:100%; font-size:13.4px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line-2); vertical-align:top}
th{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3);
  background:var(--panel-2); white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
.mono{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-3); white-space:nowrap}
.ladder{list-style:none; margin:0; padding:0; counter-reset:step}
.ladder li{position:relative; padding:7px 0 7px 30px; font-size:13.6px; color:var(--ink-2);
  border-bottom:1px solid var(--line-2)}
.ladder li:last-child{border-bottom:none}
.ladder li::before{counter-increment:step; content:counter(step); position:absolute; left:0; top:8px; width:19px;
  height:19px; border-radius:50%; border:1px solid var(--line-3); font-family:var(--font-mono); font-size:9.5px;
  display:grid; place-items:center; color:var(--ink-4)}
.ladder li.done{color:var(--ink-3)}
.ladder li.done::before{background:var(--green); border-color:var(--green); color:#fff; content:"✓"}
:root[data-theme="dark"] .ladder li.done::before{color:#0e1116}
.field-k{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-4);
  padding-bottom:5px; border-bottom:1px solid var(--line-2); margin-bottom:8px}

/* ---------- hygiene ---------- */
.lint{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:12px 0; overflow:hidden}
.lint-h{display:flex; align-items:flex-start; gap:12px; padding:13px 15px; width:100%; text-align:left}
.lint-h:hover{background:var(--bg-sunk)}
.lint-badge{font-family:var(--font-mono); font-size:10px; padding:3px 8px; border-radius:20px; flex:none; margin-top:2px}
.lint-badge.q{color:var(--amber); background:var(--amber-bg); border:1px solid var(--amber-line)}
.lint-badge.d{color:var(--purple); background:var(--purple-bg); border:1px solid var(--purple-line)}
.lint-badge.ok{color:var(--green); background:var(--green-bg); border:1px solid var(--green-line)}
.lint-t{font-size:14.6px; font-weight:600}
.lint-s{font-size:13px; color:var(--ink-3); margin-top:3px}
.lint-n{margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--ink-4); flex:none}
.lint-b{display:none; border-top:1px solid var(--line-2); padding:14px 15px; background:var(--panel-2)}
.lint.open .lint-b{display:block}
.rule-src{font-size:12.4px; color:var(--ink-3); font-style:italic; margin-bottom:12px}
.hitlist{display:flex; flex-wrap:wrap; gap:6px}
.hit{font-size:12.5px; padding:4px 9px; border:1px solid var(--line); border-radius:6px; background:var(--panel);
  color:var(--ink-2)}
.hit:hover{border-color:var(--blue-line); color:var(--blue)}
.hit .mono{font-size:9.5px; margin-right:5px}

/* ---------- drawer ---------- */
.scrim{position:fixed; inset:0; background:rgba(10,12,16,.4); backdrop-filter:blur(2px); z-index:90; display:none}
.scrim.show{display:block}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(560px,96vw); background:var(--panel);
  border-left:1px solid var(--line); z-index:100; transform:translateX(100%); transition:transform .22s ease;
  display:flex; flex-direction:column; box-shadow:-20px 0 50px rgba(10,12,16,.18)}
.drawer.show{transform:none}
.drawer-h{flex:none; padding:14px 18px; border-bottom:1px solid var(--line-2); display:flex; align-items:flex-start; gap:12px}
.drawer-b{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:18px}
.drawer *{min-width:0}
.drawer-b .mono{white-space:normal; overflow-wrap:anywhere}
.drawer-f{flex:none; padding:12px 18px; border-top:1px solid var(--line-2); background:var(--panel-2); display:flex; gap:8px; flex-wrap:wrap}
.path{font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; color:var(--ink-4); line-height:1.6}
.path b{color:var(--ink-3); font-weight:400}
.drawer h4{margin:0; font-size:19px; font-weight:620; letter-spacing:-.015em; font-family:var(--font-serif)}
.field{margin-bottom:18px}
.field p{margin:0 0 8px; font-size:14px; color:var(--ink-2)}
.field ul{margin:0; padding-left:18px; font-size:13.6px; color:var(--ink-2)}
.field li{margin-bottom:5px}

/* ---------- search modal ---------- */
.modal{position:fixed; z-index:110; display:none; background:var(--panel); border:1px solid var(--line);
  border-radius:12px; box-shadow:0 24px 60px rgba(10,12,16,.24); top:64px; left:50%; transform:translateX(-50%);
  width:min(640px,94vw); max-height:74vh; overflow:hidden; flex-direction:column}
.modal.show{display:flex}
.srch-in{flex:none; display:flex; align-items:center; gap:11px; padding:13px 16px; border-bottom:1px solid var(--line-2)}
.srch-in input{flex:1; border:none; background:none; font:inherit; font-size:16px; color:var(--ink); outline:none}
.srch-res{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:6px}
.sr{display:block; width:100%; text-align:left; padding:9px 12px; border-radius:7px}
.sr:hover,.sr.on{background:var(--bg-sunk)}
.sr-t{font-size:14.2px; color:var(--ink); font-weight:560}
.sr-m{font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; color:var(--ink-4); margin-top:2px}
.srch-f{flex:none; padding:9px 14px; border-top:1px solid var(--line-2); font-size:11.5px; color:var(--ink-4);
  display:flex; gap:14px; flex-wrap:wrap}

/* ---------- misc ---------- */
.btn{display:inline-flex; align-items:center; gap:8px; padding:9px 15px; border-radius:8px; font-size:13.5px;
  font-weight:560; border:1px solid var(--ink); background:var(--ink); color:var(--bg)}
.btn:hover{text-decoration:none; opacity:.88}
.btn.sec{background:var(--panel); color:var(--ink); border-color:var(--line-3)}
.btn.sm{padding:6px 11px; font-size:12.5px}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); z-index:130;
  background:var(--ink); color:var(--bg); font-size:13px; padding:9px 16px; border-radius:20px; opacity:0;
  transition:opacity .25s,transform .25s; pointer-events:none}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.skip{position:fixed; top:8px; left:8px; z-index:200; background:var(--ink); color:var(--bg); padding:8px 14px;
  border-radius:7px; transform:translateY(-200%)}
.skip:focus{transform:none}


/* ---------- refinement columns ---------- */
.st.ready::before{background:var(--green)}
.st.ready{color:var(--green)}
.st.blocked::before{background:var(--amber)}
.st.blocked{color:var(--amber)}
.st.design::before{background:var(--red)}
.st.design{color:var(--red)}
.lrow.r-story.is-ready .c-name .tri{border-left-color:var(--green)}
.rdy{display:inline-flex; align-items:center; gap:7px}
.rdy-bar{width:44px; height:4px; border-radius:2px; background:var(--line-2); overflow:hidden; flex:none}
.rdy-bar i{display:block; height:100%; background:var(--green)}
.rdy-n{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3)}
.mod{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-2); background:var(--bg-sunk);
  border-radius:4px; padding:2px 7px}
.kind{font-family:var(--font-mono); font-size:10px; color:var(--ink-4)}
.wv{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; padding:2px 7px; border-radius:4px;
  border:1px solid var(--line); color:var(--ink-3); white-space:nowrap}
.wv.w1{color:var(--green); border-color:var(--green-line); background:var(--green-bg)}
.wv.w2{color:var(--blue); border-color:var(--blue-line); background:var(--blue-bg)}
.wv.w3{color:var(--ink-2)}
.wv.w4{color:var(--amber); border-color:var(--amber-line); background:var(--amber-bg)}
.wv.w5{color:var(--purple); border-color:var(--purple-line); background:var(--purple-bg)}
.adrl{display:inline-flex; gap:4px; flex-wrap:wrap}
.adrl b{font-family:var(--font-mono); font-size:9.5px; font-weight:400; color:var(--purple);
  background:var(--purple-bg); border:1px solid var(--purple-line); border-radius:4px; padding:1px 5px}

/* ---------- KPI strip ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line-2);
  border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:20px 0}
.kpi{background:var(--panel); padding:14px 16px}
.kpi-n{font-family:var(--font-mono); font-size:27px; letter-spacing:-.03em; color:var(--ink); line-height:1.1}
.kpi-l{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-4); margin-top:5px}
.kpi-s{font-size:11.5px; color:var(--ink-3); margin-top:3px; line-height:1.35}
.kpi.ok .kpi-n{color:var(--green)}
.kpi.warn .kpi-n{color:var(--amber)}

/* ---------- diagrams (handbook grammar) ---------- */
.dgm{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:18px 0; overflow:hidden}
.dgm-h{display:flex; align-items:center; gap:10px; padding:9px 13px; border-bottom:1px solid var(--line-2);
  background:var(--panel-2)}
.dgm-t{font-family:var(--font-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.dgm-stage{position:relative; overflow-x:auto;
  background:radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0) 0 0/20px 20px}
.dgm svg{display:block; width:100%; height:auto; min-width:660px; user-select:none}
.nd{cursor:pointer}
.nd-shape{fill:var(--panel); stroke:var(--line-3); stroke-width:1.5; transition:fill .18s,stroke .18s}
.nd-l{font-family:var(--font-mono); font-size:11px; fill:var(--ink); letter-spacing:.03em; pointer-events:none}
.nd-s{font-family:var(--font-sans); font-size:9.5px; fill:var(--ink-3); pointer-events:none}
.nd:hover .nd-shape{stroke:var(--blue)}
.nd.on .nd-shape{stroke:var(--blue); stroke-width:2.2; fill:var(--blue-bg)}
.nd.k-human .nd-shape{stroke:var(--ink-3)}
.nd.k-ext .nd-shape{stroke-dasharray:5 3; stroke:var(--ink-3)}
.nd.k-store .nd-shape{stroke:var(--green)}
.nd.dim{opacity:.3}
.eg{stroke:var(--line-3); stroke-width:1.4; fill:none}
.eg.async{stroke-dasharray:5 4}
.eg.hot{stroke:var(--blue); stroke-width:2}
.eg.dim{opacity:.18}
.eg-l{font-family:var(--font-mono); font-size:9.5px; fill:var(--ink-3);
  paint-order:stroke; stroke:var(--panel); stroke-width:3.5px; stroke-linejoin:round}
.bnd{fill:none; stroke:var(--line-3); stroke-dasharray:6 4}
.bnd-l{font-family:var(--font-mono); font-size:9px; fill:var(--ink-4); letter-spacing:.1em}
.dgm-info{border-top:1px solid var(--line-2); padding:14px 16px; background:var(--panel-2); font-size:14px; display:none}
.dgm-info.show{display:block}
.dgm-info h4{margin:0 0 3px; font-size:15.5px; font-weight:620}
.dgm-info .k{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-4)}
.dgm-info dl{display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:12px; margin:12px 0 0}
.dgm-info dt{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-4); margin-bottom:3px}
.dgm-info dd{margin:0; font-size:13.4px; color:var(--ink-2)}
.dgm-hint{padding:9px 14px; font-size:12px; color:var(--ink-4); border-top:1px solid var(--line-2); font-style:italic}
.legend{display:flex; flex-wrap:wrap; gap:14px; padding:10px 14px; border-top:1px solid var(--line-2); background:var(--panel-2)}
.lg{display:flex; align-items:center; gap:7px; font-family:var(--font-mono); font-size:9.5px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-4)}
.lg i{width:20px; height:12px; border:1.4px solid var(--line-3); display:block}
.lg i.human{border-radius:20px}
.lg i.sys{border-radius:3px}
.lg i.ext{border-style:dashed}
.lg i.store{border-color:var(--green); border-radius:3px/6px}
.lg i.bnd{border-style:dashed}

/* ---------- ADR list ---------- */
.adr{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:10px 0; overflow:hidden}
.adr-h{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 15px}
.adr-h:hover{background:var(--bg-sunk)}
.adr-id{font-family:var(--font-mono); font-size:11px; color:var(--purple); background:var(--purple-bg);
  border:1px solid var(--purple-line); border-radius:5px; padding:2px 7px; flex:none}
.adr-t{font-size:15px; font-weight:600; letter-spacing:-.01em}
.adr-meta{margin-left:auto; display:flex; gap:6px; align-items:center; flex:none}
.adr-b{display:none; border-top:1px solid var(--line-2); padding:16px; background:var(--panel-2)}
.adr.open .adr-b{display:block}
.opt-row{border:1px solid var(--line-2); border-radius:7px; padding:9px 11px; margin-bottom:7px;
  background:var(--panel); font-size:13.6px; color:var(--ink-2)}
.field.decision{border-left:3px solid var(--purple); padding-left:12px; background:var(--purple-bg);
  border-radius:0 7px 7px 0; padding-top:10px; padding-bottom:2px}

/* ---------- refined story detail ---------- */
.req{border:1px solid var(--line-2); border-radius:7px; padding:9px 11px; margin-bottom:7px; background:var(--panel-2)}
.req-id{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-4); margin-right:8px}
.req-cls{font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase;
  padding:1px 6px; border-radius:4px; border:1px solid var(--line)}
.req-cls.functional{color:var(--blue); background:var(--blue-bg); border-color:var(--blue-line)}
.req-cls.quality{color:var(--amber); background:var(--amber-bg); border-color:var(--amber-line)}
.req-cls.constraint{color:var(--purple); background:var(--purple-bg); border-color:var(--purple-line)}
.req-t{font-size:13.6px; color:var(--ink-2); margin-top:6px}
.req-s{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-4); margin-top:4px}
.acr{border:1px solid var(--line-2); border-radius:7px; margin-bottom:8px; overflow:hidden; background:var(--panel-2)}
.acr-h{display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line-2)}
.acr-id{font-family:var(--font-mono); font-size:9.5px; color:var(--amber); background:var(--amber-bg);
  border-radius:4px; padding:1px 6px}
.acr-v{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-3); margin-left:auto}
.acr-t{padding:8px 10px 4px; font-size:13.6px; color:var(--ink)}
.acr-d{padding:0 10px 9px; font-size:12.2px; color:var(--ink-4)}
.impact{list-style:none; margin:0; padding:0}
.impact li{position:relative; padding:6px 0 6px 20px; font-size:13.4px; color:var(--ink-2); border-bottom:1px solid var(--line-2)}
.impact li:last-child{border-bottom:none}
.impact li::before{content:"▲"; position:absolute; left:2px; font-size:8px; color:var(--amber); top:9px}
.deps{list-style:none; margin:0; padding:0}
.deps li{padding:6px 0; font-size:13.4px; color:var(--ink-2); border-bottom:1px solid var(--line-2)}
.deps li:last-child{border-bottom:none}
.dep-k{font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-4); border:1px solid var(--line); border-radius:4px; padding:1px 5px; margin-right:6px}
.dep-o{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-4)}
.gatelist{list-style:none; margin:0; padding:0}
.gatelist li{position:relative; padding:7px 0 7px 26px; font-size:13.4px; border-bottom:1px solid var(--line-2)}
.gatelist li:last-child{border-bottom:none}
.gatelist li strong{display:block; color:var(--ink)}
.gatelist li span{display:block; font-size:12.4px; color:var(--ink-3); margin-top:2px}
.gatelist li::before{position:absolute; left:2px; top:7px; font-size:12px}
.gatelist li.ok::before{content:"✓"; color:var(--green)}
.gatelist li.no::before{content:"✕"; color:var(--amber)}
.gatelist li.no strong{color:var(--amber)}
.subs{list-style:none; margin:0; padding:0}
.subs li{position:relative; padding:5px 0 5px 22px; font-size:13.4px; color:var(--ink-2); border-bottom:1px solid var(--line-2)}
.subs li:last-child{border-bottom:none}
.subs li::before{content:"☐"; position:absolute; left:2px; color:var(--ink-4)}
.slice{border:1px solid var(--line-2); border-radius:7px; padding:7px 9px; margin-bottom:7px; background:var(--panel-2)}
.slice .hit{border:none; background:none; padding:0; font-size:13.4px; color:var(--ink)}
.slice .hit:hover{color:var(--blue)}
.slice-p{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.04em; color:var(--ink-4); margin-top:4px}
.pat{font-family:var(--font-mono); font-size:10px; letter-spacing:.05em; color:var(--ink-3);
  background:var(--bg-sunk); border-radius:4px; padding:2px 7px}
.ladder{list-style:none; margin:0; padding:0; counter-reset:step}
.ladder li{position:relative; padding:7px 0 7px 30px; font-size:13.6px; color:var(--ink-2); border-bottom:1px solid var(--line-2)}
.ladder li:last-child{border-bottom:none}
.ladder li::before{counter-increment:step; content:counter(step); position:absolute; left:0; top:8px; width:19px;
  height:19px; border-radius:50%; border:1px solid var(--line-3); font-family:var(--font-mono); font-size:9.5px;
  display:grid; place-items:center; color:var(--ink-4)}
.tri{width:0; height:0; flex:none; border-left:7px solid var(--amber); border-top:4.5px solid transparent;
  border-bottom:4.5px solid transparent; opacity:.85}
.chk{width:9px; height:9px; flex:none; border:1.5px solid var(--line-3); border-radius:2px}
.box{width:7px; height:7px; flex:none; border:1px dashed var(--line-3); border-radius:1px}
.list-note{font-size:12.8px; color:var(--ink-3); margin-top:8px; max-width:110ch; line-height:1.5}


/* ---------- architecture sub-tabs ---------- */
.subtabs{position:sticky; top:calc(var(--hdr-h) + 36px); z-index:38; display:flex; gap:4px; flex-wrap:wrap;
  padding:10px 0; margin-bottom:6px; background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line-2)}
.subtab{font-size:12.6px; padding:6px 12px; border:1px solid var(--line); border-radius:20px;
  background:var(--panel); color:var(--ink-2); white-space:nowrap}
.subtab:hover{border-color:var(--line-3); color:var(--ink)}
.subtab.on{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.statelist{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:6px; margin-top:10px}
.stt{font-size:12.4px; color:var(--ink-3); border:1px solid var(--line-2); border-radius:6px; padding:6px 9px;
  background:var(--panel)}
.stt b{color:var(--ink-2); font-family:var(--font-mono); font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; display:block; margin-bottom:2px}

/* ---------- compiled system map ---------- */
.mapbox{border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden; margin-top:10px}
.mapstage{position:relative; height:calc(100vh - var(--hdr-h) - 250px); min-height:460px; overflow:hidden;
  cursor:grab; touch-action:none;
  background:radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0) 0 0/22px 22px}
.mapstage.grabbing{cursor:grabbing}
.mapstage svg{display:block; width:100%; height:100%}
.mband{fill:var(--bg-sunk); stroke:var(--line-2); opacity:.55}
:root[data-theme="dark"] .mband{fill:var(--panel-2); opacity:.5}
.mband-l{font-family:var(--font-mono); font-size:9px; letter-spacing:.12em; fill:var(--ink-4)}
.mnode{cursor:pointer}
.mshape{fill:var(--panel); stroke:var(--line-3); stroke-width:1.5; transition:fill .15s,stroke .15s}
.mnode.k-human .mshape{stroke:var(--ink-3)}
.mnode.k-ext .mshape{stroke:var(--ink-3); stroke-dasharray:5 3}
.mnode.k-store .mshape{stroke:var(--green)}
.mnode.k-mod .mshape{stroke:var(--line-3); fill:var(--panel-2)}
.mnode:hover .mshape{stroke:var(--blue)}
.mnode.on .mshape{stroke:var(--blue); stroke-width:2.4; fill:var(--blue-bg)}
.mnode.focus .mshape{stroke:var(--purple); stroke-width:2.4}
.mnode.dim{opacity:.25}
.mlabel{font-family:var(--font-mono); font-size:10.5px; fill:var(--ink); letter-spacing:.03em; pointer-events:none}
.mlabel.small{font-size:9px}
.msub{font-family:var(--font-sans); font-size:9px; fill:var(--ink-3); pointer-events:none}
.mcount{font-family:var(--font-mono); font-size:8px; fill:var(--ink-4); pointer-events:none}
.medge{fill:none; stroke:var(--line-3); stroke-width:1.3; opacity:.75}
.medge.async{stroke-dasharray:5 4}
.medge.mod{stroke:var(--line-2); stroke-width:1}
.medge.hot{stroke:var(--blue); stroke-width:2; opacity:1}
.medge.dim{opacity:.12}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel)}
.seg-b{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; padding:6px 11px; color:var(--ink-3);
  border-right:1px solid var(--line)}
.seg-b:last-child{border-right:none}
.seg-b:hover{color:var(--ink); background:var(--bg-sunk)}
.seg-b.on{background:var(--blue-bg); color:var(--blue)}
.mcrumb{font-size:12.4px; color:var(--ink-3)}
.mfacts{display:grid; gap:10px; margin:0}
.mfacts dt{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-4); margin-bottom:2px}
.mfacts dd{margin:0; font-size:13.6px; color:var(--ink-2)}
.lg i.mod{border-radius:3px; border-color:var(--line-3); background:var(--bg-sunk)}
.lg i.asy{border:none; height:0; border-top:1.4px dashed var(--line-3)}


/* ---------- big modal ---------- */
.bigmodal{position:fixed; z-index:115; display:none; flex-direction:column; background:var(--panel);
  border:1px solid var(--line); border-radius:14px; box-shadow:0 30px 80px rgba(10,12,16,.3);
  top:3vh; bottom:3vh; left:50%; transform:translateX(-50%); width:min(900px,94vw); overflow:hidden;
  max-width:calc(100vw - 24px)}
.bigmodal.wide{width:min(1160px,96vw)}
/* content wraps rather than being clipped by the box */
.bigmodal *{min-width:0}
.bm-body,.bm-sec,.bm-head,.bm-foot{min-width:0}
.bm-title{overflow-wrap:anywhere}
.bm-body{overscroll-behavior:contain}
.bm-body .mono{white-space:normal; overflow-wrap:anywhere}
.bm-foot{row-gap:8px}
.bm-foot .mono{white-space:normal}
.bigmodal.show{display:flex}
/* the wrapper between .bigmodal and the sections is the flex column:
   without this the body cannot claim the remaining height, and the
   content is clipped rather than scrolled */
#bigModalBody{display:flex; flex-direction:column; flex:1 1 auto; min-height:0; overflow:hidden}
.bm-head{flex:none; padding:18px 22px 14px; border-bottom:1px solid var(--line-2); background:var(--panel-2);
  position:relative}
.bm-path{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.05em; color:var(--ink-4); margin-bottom:8px}
.bm-path .hit{padding:1px 6px; font-size:10.5px}
.bm-title{font-family:var(--font-serif); font-size:23px; letter-spacing:-.02em; margin:0 44px 10px 0;
  font-weight:620; line-height:1.25}
.bm-meta{display:flex; flex-wrap:wrap; gap:6px}
.bm-close{position:absolute; top:16px; right:18px}
.bm-body{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:4px 22px 18px; scrollbar-gutter:stable}
.bm-sec{padding:18px 0; border-bottom:1px solid var(--line-2)}
.bm-sec:last-child{border-bottom:none}
.bm-sec h3{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.bm-n{font-family:var(--font-mono); font-size:10px; color:var(--ink-4); border:1px solid var(--line);
  border-radius:20px; padding:1px 7px}
.bm-sub{margin-left:auto; display:flex; align-items:center; gap:8px; text-transform:none; letter-spacing:0;
  font-size:10.5px; color:var(--ink-4)}
.bm-lede{font-size:15px; color:var(--ink-2); margin:0 0 10px}
.bm-note{font-size:12.6px; color:var(--ink-4); margin:0 0 10px}
.bm-resolve{font-size:13.4px; color:var(--ink-2); margin-top:8px}
.bm-kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:12px 20px; margin-top:10px}
.bm-kv dd{overflow-wrap:anywhere}
.bm-kv dt{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-4)}
.bm-kv dd{margin:2px 0 0; font-size:13.6px; color:var(--ink-2)}
.bm-foot{flex:none; padding:12px 22px; border-top:1px solid var(--line-2); background:var(--panel-2);
  display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.bm-localnote{font-size:11.5px; color:var(--ink-4)}
.bm-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}

/* ---------- checks ---------- */
.ckrow{display:flex; gap:11px; row-gap:6px; flex-wrap:wrap; align-items:flex-start; width:100%; text-align:left; padding:9px 11px;
  border:1px solid var(--line-2); border-radius:8px; background:var(--panel); margin-bottom:6px}
.ckrow:hover{border-color:var(--line-3); background:var(--bg-sunk)}
.ckrow.on{border-color:var(--green-line); background:var(--green-bg)}
.ckbox{width:17px; height:17px; flex:none; border:1.5px solid var(--line-3); border-radius:4px; margin-top:1px;
  display:grid; place-items:center; font-size:11px; color:transparent; background:var(--panel)}
.ckrow.on .ckbox,.tk.done .tk-box{background:var(--green); border-color:var(--green); color:#fff}
:root[data-theme="dark"] .ckrow.on .ckbox,:root[data-theme="dark"] .tk.done .tk-box{color:#0e1116}
.ckbody{min-width:0; flex:1}
.cklabel{display:block; font-size:13.8px; color:var(--ink); line-height:1.45; overflow-wrap:anywhere}
.ckrow.on .cklabel{color:var(--ink-2)}
.cksub{display:block; font-size:12.2px; color:var(--ink-4); margin-top:3px; line-height:1.45; overflow-wrap:anywhere}
.ckextra{flex:none; font-family:var(--font-mono); font-size:10px; color:var(--ink-4)}
.stepn{display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%;
  border:1px solid var(--line); color:var(--ink-4)}
.vmethod{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; color:var(--blue);
  background:var(--blue-bg); border-radius:4px; padding:1px 5px; margin-right:5px}
.gv{font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase;
  border-radius:4px; padding:1px 5px; margin-right:6px}
.gv.yes{color:var(--green); background:var(--green-bg)}
.gv.no{color:var(--amber); background:var(--amber-bg)}
.pbar{display:inline-block; width:56px; height:4px; border-radius:2px; background:var(--line-2);
  overflow:hidden; vertical-align:middle}
.pbar span{display:block; height:100%; background:var(--blue)}
.pbar.green span{background:var(--green)}
.pbar.amber span{background:var(--amber)}
.pnum{font-family:var(--font-mono); font-size:10px; color:var(--ink-4); margin-left:6px}
.steplist{list-style:none; margin:0; padding:0}

/* ---------- tasks inside the story modal ---------- */
.tk{border:1px solid var(--line-2); border-radius:9px; margin-bottom:8px; background:var(--panel); overflow:hidden}
.tk.done{border-color:var(--green-line)}
.tk-h{display:flex; align-items:center; gap:9px; row-gap:7px; padding:9px 11px; flex-wrap:wrap}
.tk-done,.tk-steps{padding-left:16px}
.tk-n{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-4); flex:none}
.tk-t{font-size:13.8px; color:var(--ink); flex:1 1 220px; min-width:0; display:flex; align-items:center; gap:7px;
  flex-wrap:wrap; text-align:left; background:none; border:none; padding:0; overflow-wrap:anywhere; line-height:1.4}
.tk-t:hover{color:var(--blue)}
.tk-t:hover .rid{border-color:var(--blue-line); color:var(--blue)}
.tk-cases{font-family:var(--font-mono); font-size:9px; letter-spacing:.05em; color:var(--blue); flex:none;
  background:var(--blue-bg); border:1px solid var(--blue-line); border-radius:4px; padding:1px 6px}
.tk-open{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-3); border:1px solid var(--line);
  border-radius:5px; padding:3px 8px; flex:none; background:var(--panel)}
.tk-open:hover{color:var(--blue); border-color:var(--blue-line); background:var(--blue-bg)}
.tk.done .tk-t{color:var(--ink-3)}
.tk-kind{font-family:var(--font-mono); font-size:9px; color:var(--ink-4); background:var(--bg-sunk);
  border-radius:4px; padding:1px 6px; flex:none}
.tk-p{flex:none}
.tk-more{font-family:var(--font-mono); font-size:9.5px; color:var(--ink-3); border:1px solid var(--line);
  border-radius:5px; padding:2px 7px; flex:none}
.tk-more:hover{color:var(--ink); border-color:var(--line-3)}
.tk-done{padding:0 11px 9px 37px; font-size:12.4px; color:var(--ink-4)}
.tk-done b{font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; margin-right:6px}
.tk-steps{display:none; list-style:none; margin:0; padding:0 11px 10px 37px}
.tk.open .tk-steps{display:block}

/* ---------- flows ---------- */
.flow{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:14px 0; padding:14px 16px}
.flow-h{display:flex; align-items:center; gap:10px; margin-bottom:6px}
.flow-k{font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
  padding:2px 7px; border-radius:4px}
.flow-k.sync{color:var(--blue); background:var(--blue-bg)}
.flow-k.async{color:var(--amber); background:var(--amber-bg)}
.flow-n{font-size:15.5px; font-weight:620}
.flow-why{font-size:13.4px; color:var(--ink-3); margin:0 0 12px}
.flow-steps{list-style:none; margin:0; padding:0}
.flow-steps li{position:relative; padding:10px 0 10px 14px; border-left:2px solid var(--line-2); margin-left:8px}
.flow-steps li:last-child{border-left-color:transparent}
.fs-hop{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:5px}
.fs-n{position:absolute; left:-11px; width:20px; height:20px; border-radius:50%; background:var(--panel);
  border:1px solid var(--line-3); font-family:var(--font-mono); font-size:9.5px; display:grid;
  place-items:center; color:var(--ink-3)}
.fs-from,.fs-to{font-family:var(--font-mono); font-size:11px; color:var(--ink)}
.fs-arrow{color:var(--ink-4); font-size:11px}
.fs-proto{font-family:var(--font-mono); font-size:9px; letter-spacing:.06em; color:var(--ink-4);
  border:1px solid var(--line); border-radius:4px; padding:1px 6px}
.fs-w{font-size:13.6px; color:var(--ink-2); margin-bottom:3px}
.fs-d{font-size:12.6px; color:var(--ink-4); margin-bottom:3px}
.fs-f{font-size:12.4px; color:var(--amber)}
.fs-f b{font-family:var(--font-mono); font-size:9px; letter-spacing:.09em; text-transform:uppercase; margin-right:5px}

/* ---------- map additions ---------- */
.mproto{font-family:var(--font-mono); font-size:7.5px; fill:var(--ink-4); paint-order:stroke;
  stroke:var(--panel); stroke-width:3px; stroke-linejoin:round}
.mnode.inflow .mshape{stroke:var(--blue); stroke-width:2.4; fill:var(--blue-bg)}
.fseq{font-family:var(--font-mono); font-size:9px; fill:var(--blue); font-weight:700; pointer-events:none}

/* ---------- responsive ---------- */
@media (max-width:1100px){ :root{--side-w:240px} }
@media (max-width:1240px){
  .bigmodal,.bigmodal.wide{width:calc(100vw - 32px)}
  /* the board scrolls sideways rather than being squeezed: see .kwrap */
}
@media (max-width:900px){
  .bigmodal,.bigmodal.wide{top:0; bottom:0; left:0; right:0; transform:none; width:100%; max-width:100%; border-radius:0}
  .bm-title{font-size:19px; margin-right:40px}
  .bm-sec{padding:14px 0}
  .bm-foot{padding:10px 14px}
  .drawer{width:100vw}
  .sphead-t{grid-template-columns:repeat(2,1fr)}
  .bm-body{padding:4px 14px 16px}
  .bm-head{padding:14px 16px 12px}
  .mapstage{height:60vh}
  .subtabs{top:calc(var(--hdr-h) + 34px)}
  #navToggle{display:inline-grid}
  .side{transform:translateX(-100%); transition:transform .24s ease; width:280px; box-shadow:0 0 40px rgba(0,0,0,.18)}
  .side.open{transform:none}
  .main{margin-left:0}
  .crumb{display:none}
  .wrap{padding:0 12px 80px}
  .wrap.doc{padding:0 16px 80px}
  .two{grid-template-columns:1fr}
  .list{max-height:none}
}
@media (max-width:620px){
  .brand-sub,.ghost-btn .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.001ms!important; transition-duration:.001ms!important} }
@media print{ .hdr,.side,.tabs,.drawer,.scrim,.modal,.skip,.toolbar{display:none!important}
  .main{margin:0} .list{max-height:none; overflow:visible} .lrow.hidden{display:none} }

/* ============================================================
   VIEWS, LENSES, PATTERNS, MODULE CONTRACTS
   ============================================================ */
.subgrp{font-family:var(--font-mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-4); padding:0 4px 0 12px; align-self:center; border-left:1px solid var(--line-2);
  margin-left:4px; white-space:nowrap}
.subgrp:first-child{border-left:none; margin-left:0; padding-left:2px}

/* lens chips in the list */
.lchips{display:flex; flex-wrap:wrap; gap:3px}
.lchip{font-family:var(--font-mono); font-size:9px; letter-spacing:.04em; text-transform:uppercase;
  color:var(--ink-3); background:var(--bg-sunk); border:1px solid var(--line-2); border-radius:3px;
  padding:1px 4px; white-space:nowrap}
.lchip.warn{color:var(--amber); border-color:var(--amber-line); background:var(--amber-bg)}
.lchip.lensmade{color:var(--purple); border-color:var(--purple-line); background:var(--purple-bg)}
.tk-lens{font-family:var(--font-mono); font-size:9px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--purple); border:1px solid var(--purple-line); background:var(--purple-bg);
  border-radius:3px; padding:1px 5px; margin-left:6px}

/* lens cards */
/* ---------- the lenses page ---------- */
/* A clickable table row. Deliberately NOT called .lrow: that class is
   the backlog list's grid row, and applying it to a <tr> collapses
   every cell into one column. */
.clickrow{cursor:pointer}
.clickrow:hover{background:var(--bg-sunk)}
.clickrow:focus-visible{outline:2px solid var(--blue); outline-offset:-2px}
.clickrow .go{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; color:var(--ink-4);
  white-space:nowrap; text-align:right}
.clickrow:hover .go{color:var(--blue)}
.lenstbl td,.lenstbl th{vertical-align:top}
.lenstbl td.n,.lenstbl th.n{text-align:right; white-space:nowrap}
.lenstbl td.dim{color:var(--ink-3)}
.lenstbl .lens-focus{display:block; margin-top:3px; font-size:11.8px; color:var(--ink-4); font-weight:400;
  max-width:34ch; white-space:normal; line-height:1.4}
.lens-lede{color:var(--ink-2); max-width:78ch; font-size:14.4px; margin:0 0 4px}
.lensstat{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:20px 0 4px}
.lstat{border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:12px 14px}
.lstat b{display:block; font-family:var(--font-mono); font-size:22px; font-weight:600; color:var(--ink);
  letter-spacing:-.02em; line-height:1.1}
.lstat span{display:block; margin-top:4px; font-size:12px; color:var(--ink-4)}
.lstat.ok b{color:var(--green)}
.lstat.warn b{color:var(--amber)}
.lstat.act{display:flex; align-items:center; justify-content:center; background:var(--panel-2)}
.lbar-n{margin-left:8px; font-size:11px; color:var(--ink-3)}
.lensgrid{display:grid; gap:14px; margin:14px 0 6px}
.lensc{border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden}
.lensc.has-gap{border-left:3px solid var(--amber)}
.lensc-h{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px 16px;
  border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.lensc-n{font-size:16px; font-weight:650}
.lensc-c{margin-left:auto; font-size:11px; color:var(--ink-4)}
.lensc-f{margin:12px 16px 0; font-size:14.4px; color:var(--ink-2)}
.lensc-g{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:0; padding:0; margin:12px 16px 0;
  border:1px solid var(--line-2); border-radius:8px; overflow:hidden}
.lensc-col{padding:12px 14px; min-width:0}
.lensc-col + .lensc-col{border-left:1px solid var(--line-2); background:var(--panel-2)}
.lensc-g h4{margin:0 0 6px; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-4); font-weight:500}
.lensc-g p{margin:0; font-size:13.8px; color:var(--ink-2)}
.lq{list-style:none; margin:0; padding:0}
.lq li{position:relative; padding:4px 0 4px 16px; font-size:13.2px; color:var(--ink-2)}
.lq li::before{content:"?"; position:absolute; left:0; color:var(--ink-4); font-family:var(--font-mono); font-size:11px}
.lensc-e,.lensc-x{margin-top:10px; font-size:12.6px; color:var(--ink-2); border-left:2px solid var(--green);
  padding-left:10px}
.lensc-x{border-left-color:var(--amber-line); color:var(--amber)}
.lensc-e b,.lensc-x b{display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-4); margin-bottom:2px}
.lensc-o{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:12px 16px 0; padding:13px 15px;
  background:var(--bg-sunk); border-radius:8px; font-size:13.2px; color:var(--ink-2)}
.lensc-o b{display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-4); margin-bottom:3px}
.lensc-f2{display:flex; align-items:center; gap:10px; padding:12px 16px 14px; border-top:1px solid var(--line-2);
  margin-top:12px; background:var(--panel-2)}
.lensc-id{margin-left:auto; font-size:10px; color:var(--ink-4); letter-spacing:.08em; text-transform:uppercase}

/* coverage bar */
.lbar{display:inline-block; width:74px; height:6px; border-radius:3px; background:var(--bg-sunk);
  vertical-align:middle; overflow:hidden}
.lbar span{display:block; height:100%; background:var(--blue); border-radius:3px}

/* the three-step explainer */
.how3{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; margin:16px 0}
.how{border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:14px 16px}
.how-n{font-family:var(--font-mono); font-size:10px; color:var(--blue); border:1px solid var(--blue-line);
  background:var(--blue-bg); border-radius:3px; display:inline-block; padding:1px 6px; margin-bottom:8px}
.how h4{margin:0 0 6px; font-size:15px; font-weight:620}
.how p{margin:0; font-size:13.4px; color:var(--ink-2)}

/* module contracts */
.modpick{display:flex; flex-wrap:wrap; gap:5px; margin:14px 0}
.chipx{font-size:12px; border:1px solid var(--line); background:var(--panel); border-radius:5px;
  padding:4px 9px; color:var(--ink-2)}
.chipx:hover{border-color:var(--blue-line); color:var(--ink)}
.chipx.on{background:var(--blue-bg); border-color:var(--blue); color:var(--blue); font-weight:600}
.chipx i{font-style:normal; font-family:var(--font-mono); font-size:8.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--green); margin-left:4px}
.cxwrap{border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden; margin:6px 0 20px}
.cx-h{padding:12px 16px; background:var(--panel-2); border-bottom:1px solid var(--line-2);
  font-size:13.4px; color:var(--ink-2)}
.cx{display:grid; grid-template-columns:230px 1fr; gap:14px; padding:11px 16px; border-bottom:1px solid var(--line-2)}
.cx:last-child{border-bottom:none}
.cx-k{display:flex; align-items:baseline; gap:8px; font-size:13.6px; font-weight:620; color:var(--ink)}
.cx-i{font-family:var(--font-mono); font-size:10px; color:var(--ink-4)}
.cx-v{font-size:13.6px; color:var(--ink-2); line-height:1.55}
.cx-none{color:var(--amber); font-style:italic}

/* modal additions */
.bm-subh{margin:18px 0 4px; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-4); display:flex; align-items:center; gap:10px}
.gate-no{display:block; margin-top:6px; color:var(--amber); font-size:12.4px}
tr.lrow{cursor:pointer}
tr.lrow:hover{background:var(--bg-sunk)}

@media (max-width:900px){
  .lensc-g,.lensc-o{grid-template-columns:1fr}
  .lensc-col + .lensc-col{border-left:none; border-top:1px solid var(--line-2)}
  .cx{grid-template-columns:1fr; gap:4px}
}

/* ============================================================
   ROADMAP · RELEASES · SPRINTS · TESTS
   ============================================================ */
.sumrow{display:flex; flex-wrap:wrap; gap:10px; margin:16px 0}
.sum{border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:10px 14px;
  font-size:11.5px; color:var(--ink-3); min-width:120px}
.sum b{display:block; font-size:21px; color:var(--ink); font-weight:650; line-height:1.1; margin-bottom:2px}

/* roadmap */
.rmap{display:grid; gap:12px; margin:18px 0}
.rw{border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden}
.rw.scheduled{border-color:var(--green-line); box-shadow:inset 3px 0 0 var(--green)}
.rw-h{display:flex; flex-wrap:wrap; align-items:center; gap:9px; padding:11px 16px;
  border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.rw-n{font-family:var(--font-mono); font-size:11px; color:var(--blue); border:1px solid var(--blue-line);
  background:var(--blue-bg); border-radius:4px; padding:2px 7px}
.rw-t{font-size:16px; font-weight:650}
.rw-a{margin-left:auto; font-size:10.5px; color:var(--ink-4)}
.rw-th{margin:12px 16px 0; font-size:14.6px; color:var(--ink-2)}
.rw-g{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; padding:12px 16px}
.rw-g h4,.relc-g h4,.lvl-g h4{margin:0 0 4px; font-family:var(--font-mono); font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-4); font-weight:500}
.rw-g p,.relc-g p,.lvl-g p{margin:0; font-size:13.4px; color:var(--ink-2)}
.rw-r,.relc-r,.lvl-d{margin:0 16px 14px; padding:10px 13px; background:var(--amber-bg);
  border:1px solid var(--amber-line); border-radius:7px; font-size:13px; color:var(--ink-2)}
.rw-r b,.relc-r b,.relc-v b,.lvl-d b,.tdata-r b{display:block; font-family:var(--font-mono); font-size:9px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--amber); margin-bottom:3px}
.relc-v{margin:0 16px 14px; padding:10px 13px; background:var(--green-bg); border:1px solid var(--green-line);
  border-radius:7px; font-size:13px; color:var(--ink-2)}
.relc-v b{color:var(--green)}

/* release timeline */
.tl{display:flex; flex-wrap:wrap; align-items:stretch; gap:6px; margin:16px 0}
.tl-i{display:flex; flex-direction:column; align-items:flex-start; gap:3px; text-align:left;
  border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:11px 14px; min-width:190px}
.tl-i:hover{border-color:var(--blue); background:var(--blue-bg)}
.tl-n{font-family:var(--font-mono); font-size:10.5px; color:var(--blue)}
.tl-t{font-size:14.4px; font-weight:620; color:var(--ink)}
.tl-m{font-size:10.5px; color:var(--ink-4)}
.tl-a{align-self:center; color:var(--line-3); font-family:var(--font-mono)}

/* release cards */
.relc{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:16px 0; overflow:hidden}
.relc-h{display:flex; flex-wrap:wrap; align-items:center; gap:9px; padding:12px 16px;
  border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.relc-id{font-family:var(--font-mono); font-size:12px; color:var(--blue); border:1px solid var(--blue-line);
  background:var(--blue-bg); border-radius:4px; padding:2px 8px}
.relc-t{font-size:16.5px; font-weight:650}
.relc-m{margin-left:auto; font-size:10.5px; color:var(--ink-4)}
.relc-goal{margin:13px 16px 0; font-size:15px; color:var(--ink)}
.relc-e{display:flex; flex-wrap:wrap; gap:5px; margin:9px 16px 0}
.relc-g{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; padding:13px 16px}
.relc-g .warnbox{border-left:2px solid var(--red-line); padding-left:11px}
.relc-g .warnbox h4{color:var(--red)}
.relc-f{display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 14px}

/* sprint capacity controls */
.cfg{border:1px solid var(--line); border-radius:10px; background:var(--panel-2); padding:13px 16px; margin:16px 0}
.cfg-h{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-4); margin-bottom:10px}
.cfg-row{display:flex; flex-wrap:wrap; gap:18px; align-items:center}
.cfg-row label{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2)}
.cfg-row select,.cfg-row input[type=date]{border:1px solid var(--line); border-radius:6px; background:var(--panel);
  padding:5px 8px; font:inherit; font-size:12.5px; color:var(--ink)}
.cfg-row input[type=range]{width:150px}
.cfg-n{margin:11px 0 0; font-size:12.4px; color:var(--ink-3)}

/* sprints */
.sprint{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:12px 0; overflow:hidden}
.sprint.committed{border-color:var(--green-line)}
.sp-h{display:flex; flex-wrap:wrap; align-items:center; gap:9px; padding:10px 16px;
  border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.sp-n{font-size:15px; font-weight:650}
.sp-d{font-size:11px; color:var(--ink-3)}
.sp-m{margin-left:auto; font-size:10.5px; color:var(--ink-4)}
.sp-goal{padding:11px 16px 0; font-size:14.2px; color:var(--ink-2)}
.sp-goal b{display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-4); margin-bottom:3px}
.sp-rel{display:flex; gap:5px; padding:9px 16px 0}
.sp-lanes{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px 16px}
.lane{border:1px solid var(--line-2); border-radius:8px; background:var(--panel-2); overflow:hidden}
.lane-h{display:flex; justify-content:space-between; align-items:center; padding:8px 12px;
  border-bottom:1px solid var(--line-2); font-size:12.6px; font-weight:620; color:var(--ink-2)}
.lane-h span{font-size:10.5px; color:var(--ink-4)}
.lane-l{margin:0; padding:8px 12px 10px 28px}
.lane-l li{font-size:13px; color:var(--ink-2); padding:3px 0}
.lane-x{display:block; font-size:10.5px; color:var(--ink-4)}
.lane-e{margin:0; padding:12px; font-size:12.5px; color:var(--ink-4)}
.gatelist{margin:14px 0}

/* test levels, packs, data */
.lvl,.pack{border:1px solid var(--line); border-radius:10px; background:var(--panel); margin:12px 0; overflow:hidden}
.lvl-h,.pack-h{display:flex; flex-wrap:wrap; align-items:center; gap:9px; padding:11px 16px;
  border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.lvl-n,.pack-t{font-size:15px; font-weight:650}
.lvl-c,.pack-w{margin-left:auto; font-size:10.5px; color:var(--ink-4)}
.lvl-p{margin:12px 16px 0; font-size:14.4px; color:var(--ink)}
.lvl-g{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; padding:12px 16px}
.lvl-d{background:var(--bg-sunk); border-color:var(--line-2)}
.lvl-d b{color:var(--ink-4)}
.pack-l{margin:10px 0 14px; padding-left:34px}
.pack-l li{font-size:13.4px; color:var(--ink-2); padding:2px 0}
.tdata{border-left:2px solid var(--line-3); padding:2px 0 2px 13px; margin:12px 0}
.tdata b{font-size:13.6px; font-weight:620}
.tdata p{margin:3px 0 0; font-size:13.4px; color:var(--ink-2)}
.tdata-r{margin-top:5px; font-size:12.4px; color:var(--amber)}

/* test cases */
.tcbar{display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin:14px 0}
.tclist{border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden}
.tc{border-bottom:1px solid var(--line-2)}
.tc:last-child{border-bottom:none}
.tc-h{display:flex; flex-wrap:wrap; align-items:center; gap:9px; width:100%; text-align:left; padding:9px 14px}
.tc-h:hover{background:var(--bg-sunk)}
.tc.open{background:var(--panel-2); box-shadow:inset 3px 0 0 var(--blue)}
.tc-id{font-size:10.5px; color:var(--ink-4); flex:none; min-width:148px}
.tc-t{font-size:13.4px; color:var(--ink); flex:1 1 320px}
.tc-l{font-family:var(--font-mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); background:var(--bg-sunk); border-radius:3px; padding:2px 6px; white-space:nowrap}
.tc-b{display:none; padding:4px 16px 16px 60px}
.tc.open .tc-b{display:block}
.tc-kv{display:grid; grid-template-columns:132px 1fr; gap:12px; padding:6px 0;
  border-top:1px solid var(--line-2); font-size:13.2px; color:var(--ink-2)}
.tc-kv b{font-family:var(--font-mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-4); font-weight:500; padding-top:2px}
.tc-kv.ok{background:var(--green-bg); border-radius:6px; padding:8px 10px; border-top-color:transparent}
.tc-kv.ok b{color:var(--green)}
.tc-s{margin:0; padding-left:18px}
.tc-s li{padding:2px 0}
.tcmini{display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:6px 0;
  border-bottom:1px solid var(--line-2); font-size:13px; color:var(--ink-2)}
.tcmini:last-child{border-bottom:none}
.tcmini .mono{font-size:10.5px; color:var(--ink-4); min-width:0; flex:0 0 auto; white-space:normal}
.tcmini-l{font-family:var(--font-mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); background:var(--bg-sunk); border-radius:3px; padding:2px 6px}
.tcmini-t{flex:1 1 220px; overflow-wrap:anywhere}
.tchain{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:14px 0}
.tchain span{font-family:var(--font-mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--ink-3); background:var(--bg-sunk); border:1px solid var(--line-2); border-radius:4px; padding:4px 8px}
.tchain i{color:var(--line-3); font-style:normal}

@media (max-width:900px){
  .sp-lanes{grid-template-columns:1fr}
  .tc-kv{grid-template-columns:1fr; gap:2px}
  .tc-b{padding-left:16px}
}

/* ============================================================
   ROADMAP TIMELINE · PLAN LISTS · SPRINT PANEL
   ============================================================ */
.rm-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:1px;
  background:var(--line-2); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:16px 0}
.rm-s{background:var(--panel); padding:12px 15px; font-size:13.6px; color:var(--ink)}
.rm-s b{display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-4); font-weight:500; margin-bottom:5px}
.rm-s span{display:block; margin-top:4px; font-size:12.2px; color:var(--ink-3)}

/* now / next / later */
.nnl{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; margin:18px 0}
.nnl-c{border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden}
.nnl-c.now{border-color:var(--green-line); box-shadow:inset 3px 0 0 var(--green)}
.nnl-c.next{border-color:var(--amber-line); box-shadow:inset 3px 0 0 var(--amber)}
.nnl-c.later{box-shadow:inset 3px 0 0 var(--line-3)}
.nnl-h{padding:11px 15px; border-bottom:1px solid var(--line-2); background:var(--panel-2);
  font-size:15px; font-weight:650}
.nnl-h span{display:block; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-4); font-weight:500; margin-top:3px}
.nnl-c ul{margin:0; padding:10px 15px 12px 15px; list-style:none}
.nnl-c li{font-size:13.4px; color:var(--ink-2); padding:3px 0}
.nnl-c li b{color:var(--blue); font-family:var(--font-mono); font-size:11px; margin-right:5px}
.nnl-m{margin-top:6px; padding-top:8px; border-top:1px solid var(--line-2);
  font-family:var(--font-mono); font-size:10.5px; color:var(--ink-4)}

/* timeline */
.tlwrap{border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:14px 16px 16px; margin:16px 0}
.tl-legend{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:14px; font-size:11.5px; color:var(--ink-3)}
.tl-legend span{display:inline-flex; align-items:center; gap:6px}
.tl-legend .k{width:14px; height:9px; border-radius:2px; display:inline-block}
.tl-legend .k.int{background:var(--blue-bg); border:1px solid var(--blue)}
.tl-legend .k.ext{background:var(--amber-bg); border:1px solid var(--amber)}
.tl-legend .k.ms{width:9px; height:9px; transform:rotate(45deg); background:var(--purple)}
.tl-legend .k.sp{background:var(--green-bg); border:1px solid var(--green-line)}
.tl-legend .k.nd{background:repeating-linear-gradient(45deg,var(--bg-sunk),var(--bg-sunk) 3px,var(--panel) 3px,var(--panel) 6px);
  border:1px solid var(--line-3)}
.tlgrid{display:grid; grid-template-columns:152px 1fr; gap:6px 12px; align-items:center}
.tl-rowlab{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-4); text-align:right}
.tl-track{position:relative; height:26px; border-radius:6px; background:var(--bg-sunk)}
.tl-track.months{background:none; height:18px}
.tlt{position:absolute; top:2px; transform:translateX(-50%); font-family:var(--font-mono); font-size:10px;
  color:var(--ink-3); white-space:nowrap}
.tlt::before{content:""; position:absolute; left:50%; top:16px; width:1px; height:6px; background:var(--line-2)}
.tl-track.sprints{height:22px; background:none}
.tls{position:absolute; top:2px; height:18px; line-height:18px; text-align:center; font-family:var(--font-mono);
  font-size:9.5px; color:var(--ink-4); background:var(--panel-2); border:1px solid var(--line-2);
  border-radius:4px; overflow:hidden}
.tls.c{background:var(--green-bg); border-color:var(--green-line); color:var(--green)}
.tl-track.bars{height:34px}
.tlwave{position:absolute; inset:0; border-radius:6px;
  background:linear-gradient(90deg,var(--blue-bg),var(--panel-2)); border:1px solid var(--line-2)}
.tlb{position:absolute; top:5px; height:24px; border-radius:5px; font-family:var(--font-mono); font-size:10px;
  display:flex; align-items:center; justify-content:center; overflow:hidden; white-space:nowrap}
.tlb.int{background:var(--blue-bg); border:1px solid var(--blue); color:var(--blue)}
.tlb.ext{background:var(--amber-bg); border:1px solid var(--amber); color:var(--amber)}
.tlb:hover{filter:brightness(.97); box-shadow:0 0 0 2px var(--panel), 0 0 0 3px currentColor}
.tl-track.marks{height:30px; background:none}
.tlm{position:absolute; top:0; transform:translateX(-50%); text-align:center}
.tlm i{display:block; width:10px; height:10px; margin:2px auto 0; transform:rotate(45deg);
  background:var(--purple); border:1px solid var(--panel)}
.tlm.medium i{background:var(--amber)}
.tlm.low i{background:var(--red)}
.tlm em{display:block; font-family:var(--font-mono); font-size:9px; font-style:normal; color:var(--ink-3);
  margin-top:3px; white-space:nowrap}
.tl-after{margin-top:20px; padding-top:14px; border-top:1px solid var(--line-2)}
.tl-afterh{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-4); margin-bottom:9px}
.tl-seq{display:flex; flex-wrap:wrap; align-items:stretch; gap:6px}
.tl-sq{flex:1 1 170px; border:1px dashed var(--line-3); border-radius:8px; padding:9px 12px;
  background:repeating-linear-gradient(45deg,var(--bg-sunk),var(--bg-sunk) 4px,var(--panel) 4px,var(--panel) 8px)}
.tl-sq b{display:block; font-size:13.4px; margin-bottom:3px}
.tl-sq span{font-size:11.6px; color:var(--ink-3); line-height:1.4}
.tl-sa{align-self:center; color:var(--line-3); font-family:var(--font-mono)}
.tl-note{margin:11px 0 0; font-size:12.4px; color:var(--ink-3); max-width:80ch}

/* plan lists — the same grammar as the backlog list */
.pltable{border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:auto; margin:14px 0}
.pltable.rel{--plc:minmax(260px,1.5fr) 92px 130px 96px 110px 72px 66px 62px 62px 118px}
.pltable.spr{--plc:minmax(300px,1.6fr) 118px 104px 92px 68px 62px 60px 70px 60px 92px}
.plhead,.plrow{display:grid; grid-template-columns:var(--plc); min-width:1160px; align-items:center}
.plhead{background:var(--panel-2); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2}
.plhead .cell{font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-4); padding:9px 10px}
.plrow{border-bottom:1px solid var(--line-2); cursor:pointer}
.plrow:last-of-type{border-bottom:none}
.plrow:hover{background:var(--bg-sunk)}
.plrow.sel{background:var(--blue-bg); box-shadow:inset 3px 0 0 var(--blue)}
.plrow .cell{padding:10px; font-size:13px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.plrow .cell.c-num{text-align:right; font-family:var(--font-mono); font-size:11.5px}
.plrow .c-name{display:flex; align-items:center; gap:8px; white-space:nowrap}
.plid{font-family:var(--font-mono); font-size:10.5px; color:var(--blue); border:1px solid var(--blue-line);
  background:var(--blue-bg); border-radius:4px; padding:2px 6px; flex:none}
.plrow .nm{color:var(--ink); font-size:13.4px; overflow:hidden; text-overflow:ellipsis}
.plrow .open-hint{margin-left:auto; font-size:10.5px; color:var(--ink-4); opacity:0; flex:none}
.plrow:hover .open-hint{opacity:1}
.gbar{display:inline-block; width:56px; height:6px; border-radius:3px; background:var(--bg-sunk); overflow:hidden;
  vertical-align:middle}
.gbar span{display:block; height:100%; background:var(--green)}

/* the sprint's own backlog, in the list format */
.spkids{display:none; border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.spkids.open{display:block}
.spkids-h{padding:10px 14px; font-size:12.4px; color:var(--ink-3); border-bottom:1px solid var(--line-2)}
.list.plist{border:none; border-radius:0; margin:0; max-height:62vh; overflow:auto}

/* sprint side panel */
.spgrid{display:flex; flex-wrap:wrap; gap:8px}
.spg{border:1px solid var(--line); border-radius:8px; background:var(--panel); padding:8px 11px;
  font-size:10.5px; color:var(--ink-3); min-width:74px}
.spg b{display:block; font-size:17px; color:var(--ink); font-weight:650; line-height:1.15}
.spm{border:1px solid var(--line-2); border-radius:8px; background:var(--panel); margin-bottom:9px; overflow:hidden}
.spm-h{display:flex; align-items:center; gap:9px; padding:8px 11px; background:var(--panel-2);
  border-bottom:1px solid var(--line-2); font-size:13px}
.spm-h b{font-weight:620}
.spm-h .mono{font-size:10.5px; color:var(--ink-4)}
.spm-bar{flex:1; height:5px; border-radius:3px; background:var(--bg-sunk); overflow:hidden; min-width:40px}
.spm-bar span{display:block; height:100%; background:var(--blue)}
.spm-l{margin:0; padding:8px 12px 10px 28px}
.spm-l li{font-size:12.8px; color:var(--ink-2); padding:3px 0}
.spm-l .mono{font-size:10.5px; color:var(--ink-4)}

/* release record extras */
.relmods{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px}
.relfeat{display:flex; flex-wrap:wrap; gap:4px; margin-top:8px}
.relfeat span{font-size:11.5px; color:var(--ink-3); background:var(--bg-sunk); border-radius:4px; padding:3px 7px}
.relroll{margin-top:12px; padding:11px 13px; border-radius:8px; background:var(--bg-sunk);
  border:1px solid var(--line); font-size:13.4px; color:var(--ink-2)}
.relroll.oneway{background:var(--red-bg); border-color:var(--red-line)}
.relroll b{display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-4); margin-bottom:4px}
.relroll.oneway b{color:var(--red)}
.relrisk{padding:11px 13px; border-radius:8px; background:var(--amber-bg); border:1px solid var(--amber-line);
  font-size:13.4px; color:var(--ink-2)}
.relcov{display:flex; flex-wrap:wrap; gap:7px; margin:10px 0}
.rc{border:1px solid var(--line); border-radius:7px; background:var(--panel); padding:7px 11px;
  font-size:10.5px; color:var(--ink-3)}
