/* ================================================================
   SHARED STATE
   ----------------------------------------------------------------
   Everything you tick, assign or move used to live in this
   browser's localStorage and nowhere else. This is the other half:
   an optional server that holds the same state for the whole team.

   Three rules shaped it.

   1. OFFLINE STILL WORKS, UNCHANGED.
      A single file you can email is a real property. Open this page
      from disk and nothing below runs; every tick goes to
      localStorage exactly as before. Open it from the server and the
      same page starts sharing. Nothing is taken away to add this.

   2. CHANGES TRAVEL AS OPERATIONS, NOT SNAPSHOTS.
      "Set this one tick" rather than "here is my whole state". Two
      people ticking different things can never overwrite each other,
      which a snapshot guarantees they eventually will. Two people
      ticking the SAME thing is last-write-wins, which is right: a
      tick is a claim about the world and the later claim is the
      current one.

   3. SHARED IS NOT THE SAME AS PERSONAL.
      Ticks, assignments, states, blocked flags and the sprint
      configuration are the project, so they are shared. Your theme,
      your columns, your filter and which sprint you are looking at
      are yours, so they stay local. Sharing a filter would mean one
      person rearranging everyone else's screen.

   Queued changes survive a dropped connection: they go to
   localStorage and flush when the server comes back.
   ================================================================ */

const SYNC = {
  /* Where the server is. If this page was served by it — the normal
     case — that is simply where it came from. A file:// copy has no
     origin to infer, so it asks. */
  /* An address someone typed always wins. Otherwise, where the page came
     from is a GUESS — plenty of things serve a file over http without
     running this server — so it is confirmed before it is trusted. */
  origin: store('squid:sync:origin') || (function(){
    try{
      if(location.protocol === 'http:' || location.protocol === 'https:') return location.origin;
    }catch(e){}
    return '';
  })(),
  autoOrigin: !store('squid:sync:origin'),
  token: store('squid:sync:token') || '',
  who: store('squid:sync:who') || '',
  /* 'off' · 'connecting' · 'live' · 'offline' · 'error' */
  status: 'off',
  detail: '',
  version: +(store('squid:sync:version') || 0) || 0,
  queue: store('squid:sync:queue') || [],
  /* continues where the last session left off, so a restored queue and a
     fresh one cannot hand out the same sequence number */
  seq: (store('squid:sync:queue') || []).reduce((m, o) => Math.max(m, o.n || 0), 0),
  es: null,
  flushing: false,
  retryAt: 0,
  listeners: [],

  /* ---- the stores that are shared, and how a key maps to one ---- */
  stores(){
    return {
      'checks':  {obj: TICKS,    key: TICKS.key},
      'assign':  {obj: ASSIGNEE, key: ASSIGNEE.key},
      'stage':   {obj: STAGE,    key: STAGE.key},
      'blocked': {obj: BLOCKED,  key: BLOCKED.key}
    };
  },

  on(fn){ this.listeners.push(fn); },
  fire(){ this.listeners.forEach(fn => { try{ fn(); }catch(e){} }); },

  /* ---------------- outbound ---------------- */
  /* Called by every shared setter. Silent and free when there is no
     server, so the stores do not need to know whether one exists. */
  emit(ns, id, value){
    if(!this.origin) return;
    this.queue.push({k: ns + '/' + id, v: value === false ? null : value, n: ++this.seq});
    /* Cap the queue rather than let a long offline spell grow without
       bound. The oldest operation on a key is also the least useful:
       a later one on the same key supersedes it. */
    if(this.queue.length > 4000){
      /* Collapse in place, keeping each key's latest operation and its
         number, so the drain still works after a long offline spell. */
      const seen = {}, kept = [];
      for(let i = this.queue.length - 1; i >= 0; i--){
        if(seen[this.queue[i].k]) continue;
        seen[this.queue[i].k] = 1;
        kept.unshift(this.queue[i]);
      }
      this.queue = kept.slice(-4000);
    }
    store('squid:sync:queue', this.queue);
    this.scheduleFlush();
  },
  /* Keep only the last operation per key: ticking something on and off
     four times while offline is one net change, not eight. */
  dedupe(ops){
    const seen = {}, out = [];
    for(let i = ops.length - 1; i >= 0; i--){
      if(seen[ops[i].k]) continue;
      seen[ops[i].k] = 1;
      /* the sequence number is ours; the server neither needs nor wants it */
      out.unshift({k: ops[i].k, v: ops[i].v});
    }
    return out;
  },
  scheduleFlush(){
    if(this._t) return;
    this._t = setTimeout(() => { this._t = null; this.flush(); }, 250);
  },
  async flush(){
    if(!this.origin || this.flushing || !this.queue.length) return;
    if(!this.who){ this.setStatus('error', 'Say who you are before changes can be shared'); return; }
    this.flushing = true;
    /* everything up to here is what this request answers for; anything
       queued while it is in flight has a higher number and stays */
    const upTo = this.queue[this.queue.length - 1].n;
    const batch = this.dedupe(this.queue);
    try{
      const res = await fetch(this.origin + '/api/ops', {
        method: 'POST',
        headers: Object.assign({'content-type': 'application/json'}, this.token ? {'x-squid-token': this.token} : {}),
        body: JSON.stringify({by: this.who, ops: batch})
      });
      if(res.status === 401){
        this.setStatus('error', 'The server refused the token');
        this.flushing = false;
        return;
      }
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      /* Drop by sequence, not by count: dedupe collapses several changes
         to one key into a single operation, so the batch is shorter than
         what it accounts for. */
      this.queue = this.queue.filter(o => o.n > upTo);
      store('squid:sync:queue', this.queue);
      this.version = data.version;
      store('squid:sync:version', this.version);
      if(this.status !== 'live') this.setStatus('live', '');
    }catch(e){
      this.setStatus('offline', 'Cannot reach the server — ' + this.queue.length + ' changes waiting');
      this.retryAt = Date.now() + 4000;
      setTimeout(() => this.flush(), 4000);
    }finally{
      this.flushing = false;
      if(this.queue.length && this.status === 'live') this.scheduleFlush();
    }
  },

  /* ---------------- inbound ---------------- */
  /* Writing straight into each store's data object rather than through
     its setter, because the setter is what emits — routing an incoming
     change back out would echo it around the team forever. */
  applyRemote(ops){
    const map = this.stores();
    let touched = false;
    ops.forEach(op => {
      const cut = op.k.indexOf('/');
      const ns = op.k.slice(0, cut), id = op.k.slice(cut + 1);
      if(ns === 'cfg'){
        if(SPRINT_CFG[id] !== undefined && SPRINT_CFG[id] !== op.v){
          SPRINT_CFG[id] = op.v;
          SPRINTS = null; ASSIGN = null; TEST_ROLL = null;
          touched = true;
        }
        return;
      }
      const s = map[ns];
      if(!s) return;
      if(op.v === null || op.v === undefined) delete s.obj.data[id];
      else s.obj.data[id] = op.v;
      touched = true;
    });
    if(touched){
      Object.keys(map).forEach(ns => store(map[ns].key, map[ns].obj.data));
      this.fire();
    }
  },
  applySnapshot(items){
    const map = this.stores();
    Object.keys(map).forEach(ns => { map[ns].obj.data = {}; });
    Object.keys(items).forEach(k => {
      const cut = k.indexOf('/');
      const ns = k.slice(0, cut), id = k.slice(cut + 1);
      if(ns === 'cfg'){
        if(SPRINT_CFG[id] !== undefined) SPRINT_CFG[id] = items[k].v;
        return;
      }
      const s = map[ns];
      if(s) s.obj.data[id] = items[k].v;
    });
    Object.keys(map).forEach(ns => store(map[ns].key, map[ns].obj.data));
    SPRINTS = null; ASSIGN = null; TEST_ROLL = null;
    this.fire();
  },

  /* ---------------- connection ---------------- */
  setStatus(s, detail){
    this.status = s;
    this.detail = detail || '';
    paintSyncPill();
  },

  /* Is there actually a Squid server at this address? Four answers, and
     they want four different responses — retrying forever against static
     hosting is the one thing that helps nobody. */
  async probe(origin){
    let res;
    try{
      res = await fetch(origin + '/api/hello', {
        headers: this.token ? {'x-squid-token': this.token} : {}
      });
    }catch(e){
      return {kind: 'unreachable'};
    }
    if(res.status === 401) return {kind: 'token'};
    if(!res.ok) return {kind: 'notserver'};
    try{
      const d = await res.json();
      return d && d.ok ? {kind: 'ok', hello: d} : {kind: 'notserver'};
    }catch(e){
      /* something answered, but not with our JSON — a proxy, a login page,
         a static host's 200-for-everything rule */
      return {kind: 'notserver'};
    }
  },

  async connect(){
    if(!this.origin){ this.setStatus('off', ''); return; }
    this.setStatus('connecting', '');
    const probe = await this.probe(this.origin);

    if(probe.kind === 'token'){
      this.setStatus('error', 'This server needs a token');
      return;
    }
    if(probe.kind === 'notserver'){
      /* Static hosting. Guessing again next time would be the same dead
         end, so the guess is dropped and the page says what to do. */
      const guessed = this.autoOrigin;
      if(guessed){ this.origin = ''; this.autoOrigin = false; }
      this.setStatus(guessed ? 'off' : 'error', guessed
        ? 'This page is hosted somewhere that serves files but does not run the sync server, so changes stay in ' +
          'this browser. Point it at a server to share them.'
        : 'Nothing at that address answers as a Squid server.');
      return;
    }
    if(probe.kind === 'unreachable'){
      this.setStatus('offline', 'Cannot reach ' + this.origin);
      setTimeout(() => { if(this.status === 'offline') this.connect(); }, 6000);
      return;
    }

    try{
      const hello = probe.hello;

      /* A first connection takes the server's state wholesale. Local
         ticks made before joining are not silently merged in: whoever
         is already sharing is the source of truth, and a queued change
         is the explicit way to push yours. */
      const first = !this.version;
      const url = this.origin + '/api/state' + (first ? '' : '?since=' + this.version);
      const sres = await fetch(url, { headers: this.token ? {'x-squid-token': this.token} : {} });
      const data = await sres.json();
      if(data.full) this.applySnapshot(data.items || {});
      else this.applyRemote(data.ops || []);
      this.version = data.version;
      store('squid:sync:version', this.version);

      this.stream();
      this.remember();
      this.setStatus('live', hello.clients + (hello.clients === 1 ? ' person here' : ' people here'));
      if(this.queue.length) this.flush();
    }catch(e){
      this.setStatus('offline', 'Cannot reach ' + this.origin);
      setTimeout(() => { if(this.status === 'offline') this.connect(); }, 6000);
    }
  },

  stream(){
    if(this.es){ try{ this.es.close(); }catch(e){} }
    let url = this.origin + '/api/stream?since=' + this.version;
    /* EventSource cannot set a header, so a token has to ride in the
       query string here. It is the one place it does. */
    if(this.token) url += '&token=' + encodeURIComponent(this.token);
    try{
      this.es = new EventSource(url);
    }catch(e){
      /* No EventSource — fall back to polling rather than losing sharing. */
      this.poll();
      return;
    }
    this.es.addEventListener('sync', e => {
      const d = JSON.parse(e.data);
      if(d.full) this.applySnapshot(d.items || {});
      else this.applyRemote(d.ops || []);
      this.version = d.version;
      store('squid:sync:version', this.version);
      this.setStatus('live', this.detail);
    });
    this.es.addEventListener('ops', e => {
      const d = JSON.parse(e.data);
      /* Skip what this browser just sent: it is already applied here,
         and re-applying would be harmless but would repaint for nothing. */
      const mine = d.ops.filter(o => o.by !== this.who);
      if(mine.length) this.applyRemote(mine);
      this.version = d.version;
      store('squid:sync:version', this.version);
    });
    this.es.onerror = () => {
      /* EventSource reconnects on its own; say so rather than looking
         broken while it does. */
      if(this.status === 'live') this.setStatus('offline', 'Reconnecting…');
    };
    this.es.onopen = () => { if(this.status !== 'live') this.setStatus('live', this.detail); };
  },

  poll(){
    setInterval(async () => {
      if(!this.origin) return;
      try{
        const r = await fetch(this.origin + '/api/state?since=' + this.version, {
          headers: this.token ? {'x-squid-token': this.token} : {}
        });
        const d = await r.json();
        if(d.full) this.applySnapshot(d.items || {});
        else if(d.ops && d.ops.length) this.applyRemote(d.ops.filter(o => o.by !== this.who));
        this.version = d.version;
        store('squid:sync:version', this.version);
        this.setStatus('live', this.detail);
      }catch(e){ this.setStatus('offline', 'Cannot reach the server'); }
    }, 5000);
  },

  /* Remember an address the moment it works, so a confirmed server is not
     re-guessed on the next visit. */
  remember(){
    store('squid:sync:origin', this.origin);
    this.autoOrigin = false;
  },

  disconnect(){
    if(this.es){ try{ this.es.close(); }catch(e){} this.es = null; }
    this.origin = '';
    this.autoOrigin = false;
    store('squid:sync:origin', '');
    this.setStatus('off', '');
  },

  /* Pushes whatever is in this browser to the server — the deliberate
     way to contribute work done offline, rather than doing it silently
     on connect. */
  pushEverything(){
    const map = this.stores();
    const ops = [];
    Object.keys(map).forEach(ns => {
      const d = map[ns].obj.data;
      Object.keys(d).forEach(id => ops.push({k: ns + '/' + id, v: d[id], n: ++this.seq}));
    });
    ['capacity', 'members', 'start'].forEach(k => ops.push({k: 'cfg/' + k, v: SPRINT_CFG[k], n: ++this.seq}));
    this.queue = this.queue.concat(ops);
    store('squid:sync:queue', this.queue);
    this.flush();
    return ops.length;
  }
};

/* Accepts 192.168.1.20:8787, localhost:8787 or a full address, because the
   first is what someone reads off a colleague's screen. */
function normaliseOrigin(v){
  let t = String(v || '').trim().replace(/\/+$/, '');
  if(!t) return '';
  if(!/^[a-z]+:\/\//i.test(t)) t = 'http://' + t;
  try{ return new URL(t).origin; }catch(e){ return t; }
}

/* The sprint configuration is shared, because changing capacity or the
   first Monday re-plans everyone's sprints. */
function emitConfig(){
  ['capacity', 'members', 'start'].forEach(k => SYNC.emit('cfg', k, SPRINT_CFG[k]));
}

/* ---------------- the pill in the header ---------------- */
function syncPillHTML(){
  return '<button class="syncpill" id="syncPill" aria-live="polite"><i></i><span></span></button>';
}
function paintSyncPill(){
  /* A dropped EventSource can fire after the page has gone — closing a tab,
     or a test tearing a window down. Painting into a document that no
     longer exists should be a no-op, not an exception. */
  if(typeof document === 'undefined' || !document) return;
  const el = document.getElementById('syncPill');
  if(!el) return;
  const label = {
    off: 'Local only',
    connecting: 'Connecting…',
    live: SYNC.who ? 'Shared · ' + SYNC.who : 'Shared',
    offline: 'Offline',
    error: 'Not sharing'
  }[SYNC.status] || 'Local only';
  el.className = 'syncpill s-' + SYNC.status;
  el.title = SYNC.detail || (SYNC.status === 'off'
    ? 'Changes are stored in this browser only. Select to share them with the team.'
    : label);
  const span = el.querySelector('span');
  if(span) span.textContent = label;
}

    '<p>Changes are queued in this browser and sent when the server comes back, so a flaky connection costs you ' +

    'times offline arrives as whatever it ended up as.</p>' +
    '<p class="bm-note">Joining a server for the first time takes the team’s state as it stands rather than ' +
    'merging yours into it quietly. If you have done work offline that should count, use ' +
    '<em>Send everything in this browser</em> and it goes up as ordinary changes.</p>' +
  '</section>' +

  '<section class="bm-sec"><h3>Running the server</h3>' +
    '<p class="bm-note">One file, no dependencies, next to this page:</p>' +
    '<pre class="tmpl">node squid-server.mjs\n\n' +
    '# on the network, for the team\n' +
    'node squid-server.mjs --host 0.0.0.0 --token pick-something</pre>' +
    '<p class="bm-note">It keeps everything in <span class="mono">squid-state.json</span> beside itself — a file ' +
    'you can read, copy and back up. Bound to <span class="mono">127.0.0.1</span> unless you say otherwise, and it ' +
    'says so loudly if you put it on the network without a token.</p>' +
  '</section>' +

  '</div>' +
  '<div class="bm-foot">' +
    '<span class="bm-localnote">' +
      (SYNC.status === 'live'
        ? 'Changes are going to the server as you make them.'
        : 'Changes are stored in this browser only.') +
    '</span>' +
    '<span style="margin-left:auto" class="mono">v' + SYNC.version + '</span>' +
  '</div>';
}

function openSyncPanel(){
  openModal(syncPanelHTML(), false);
  const root = $('#bigModal');
  $$('[data-closebig]', root).forEach(b => b.onclick = closeBigModal);

  $$('[data-syncwho]', root).forEach(b => b.onclick = () => {
    SYNC.who = b.dataset.syncwho;
    store('squid:sync:who', SYNC.who);
    paintSyncPill();
    openSyncPanel();
    if(SYNC.origin && SYNC.queue.length) SYNC.flush();
  });

  const origin = $('[data-syncorigin]', root), token = $('[data-synctoken]', root);
  $$('[data-syncconnect]', root).forEach(b => b.onclick = () => {
    if(!SYNC.who){ toast('Choose your name first — every change records one'); return; }
    if(origin){
      /* host:port is what people read off a colleague's screen, so accept
         it and add the scheme rather than rejecting it */
      SYNC.origin = normaliseOrigin(origin.value);
      store('squid:sync:origin', SYNC.origin);
    }
    if(token){
      SYNC.token = token.value;
      store('squid:sync:token', SYNC.token);
    }
    closeBigModal();
    SYNC.connect();
  });
  $$('[data-syncoff]', root).forEach(b => b.onclick = () => { SYNC.disconnect(); closeBigModal(); toast('Working locally'); });
  $$('[data-syncpush]', root).forEach(b => b.onclick = () => {
    if(!SYNC.origin){ toast('Connect to a server first'); return; }
    if(!SYNC.who){ toast('Choose your name first'); return; }
    const n = SYNC.pushEverything();
    closeBigModal();
    toast('Sending ' + pl(n) + ' changes');
  });
}

/* ---------------- wiring the shared stores to the wire ----------------
   Each setter is wrapped rather than rewritten, so the stores keep
   working untouched when there is no server and there is exactly one
   place where a change becomes an operation. */
(function wireSharedStores(){
  const origSet = TICKS.set;
  TICKS.set = function(id, v){
    origSet.call(this, id, v);
    SYNC.emit('checks', id, v ? 1 : null);
  };

  const aSet = ASSIGNEE.set;
  ASSIGNEE.set = function(id, v){
    aSet.call(this, id, v);
    SYNC.emit('assign', id, v || null);
  };
  /* Each wrapped store keeps a quiet clear, for the one case that must not
     broadcast: a person resetting their own copy. */
  const aClear = ASSIGNEE.clear;
  ASSIGNEE.clearQuiet = function(){ aClear.call(this); };
  ASSIGNEE.clear = function(){
    Object.keys(this.data).forEach(id => SYNC.emit('assign', id, null));
    aClear.call(this);
  };

  const sSet = STAGE.set;
  STAGE.set = function(id, v){
    sSet.call(this, id, v);
    SYNC.emit('stage', id, v || null);
  };
  const sClear = STAGE.clear;
  STAGE.clearQuiet = function(){ sClear.call(this); };
  STAGE.clear = function(){
    Object.keys(this.data).forEach(id => SYNC.emit('stage', id, null));
    sClear.call(this);
  };

  const bToggle = BLOCKED.toggle;
  BLOCKED.toggle = function(id){
    const on = bToggle.call(this, id);
    SYNC.emit('blocked', id, on ? 1 : null);
    return on;
  };
  const bClear = BLOCKED.clear;
  BLOCKED.clearQuiet = function(){ bClear.call(this); };
  BLOCKED.clear = function(){
    Object.keys(this.data).forEach(id => SYNC.emit('blocked', id, null));
    bClear.call(this);
  };

  /* Clearing everything locally is a local act. Pushing that to the team
     would wipe their work from one person's Reset button, so it stays
     here and the panel says so. */
})();

/* An incoming change has to repaint whatever is on screen, or the page

});

function download(name, text, mime){
  try{
    const blob = new Blob([text], {type: mime || 'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
    toast('Downloaded ' + name);
  }catch(e){ toast('Download blocked — use Copy instead'); }
}

/* ---------------- search ---------------- */
let INDEX = null;
function searchIndex(){
  const idx = [];
  BACKLOG.forEach(i => idx.push({t:i.n + ' — ' + i.t, m:'Initiative · ' + i.epics.length + ' epics · ' +
    iniFeatureCount(i) + ' features', ini:i.n}));
  EPICS.forEach(e => idx.push({t:e.n + ' — ' + e.t, m:'Epic · Initiative ' + e.ini.n + ' · ' + e.f.length + ' features', eid:e.n}));
  FEATURES.forEach(f => idx.push({t:f.name, m:'Feature · ' + f.epic.n + ' ' + f.epic.t + ' · Initiative ' + f.ini.n, fid:f.id}));
  FEATURES.forEach(f => storiesFor(f).forEach(s => idx.push({
    t:s.title, m:(readyGateFor(s).ready ? 'Ready story · ' : 'Blocked story · ') + s.id + ' · ' +
      patternName(s.pattern), sid:s.id})));
  ADRS.forEach(a => idx.push({t:a.id + ' — ' + a.t, m:'Decision · ' + a.status +
    (a.origin === 'refine' ? ' · from refinement' : ''), adr:a.id}));
  ARCH.modules.forEach(m => idx.push({t:m.n + ' module', m:'Architecture · owns ' + m.owns, arch:'modules'}));
  SYSTEM_DESIGNS.forEach(d => idx.push({t:d.id + ' — ' + d.t, m:'System design · produced ' + d.adr.join(', '), sd:d.id}));
  RELEASES.forEach(r => idx.push({t:r.id + ' — ' + r.n, m:'Release · ' + r.audience + ' · epics ' + r.epics.join(', '), plan:'releases'}));
  ROADMAP.forEach(r => idx.push({t:'Wave ' + r.w + ' — ' + r.n, m:'Roadmap · ' + r.status, plan:'roadmap'}));
  TEST_LEVELS.forEach(l => idx.push({t:l.n + ' tests', m:'Test level · ' + l.tool, tests:'levels'}));
  sprintsCached().forEach(sp => idx.push({t:'Sprint ' + sp.n + ' — ' + sp.goal,
    m:(sp.committed ? 'Committed sprint · ' : 'Forecast sprint · ') + DATE_SHORT(sp.start) + ' to ' +
      DATE_SHORT(sp.end) + ' · ' + sp.stories.length + ' stories', sprint:sp.n}));
  TEAM.slice(0, SPRINT_CFG.members).forEach(m => {
    const car = sprintsCached().reduce((a, sp) => a + sp.lanes.filter(l => l.member.id === m.id)
      .reduce((b, l) => b + l.stories.length, 0), 0);
    idx.push({t:m.n, m:'Engineer · ' + m.f + ' affinity · ' + car + ' stories across the plan', who:m.id});
  });
  TEST_PACKS.forEach(p => idx.push({t:p.n, m:'Release pack · ' + p.when, tests:'packs'}));
  SQ_LENSES.forEach(l => idx.push({t:l.n + ' lens', m:'Lens · ' + LENS_STATE[l.status][1] + ' · owner ' + l.owner, lens:l.id}));
  SQ_VIEWS.forEach(v => idx.push({t:v.n + ' view', m:'Architecture view · depth ' + v.depth, arch:'views'}));
  SQ_PATTERNS.forEach(p => idx.push({t:p.n, m:'Pattern · ' + (p.use === 'no' ? 'rejected — ' + p.drop : p.why), arch:'patterns'}));
  ARCH.modules.forEach(x => idx.push({t:x.n + ' module contract', m:'21 clauses · owns ' + x.owns, contract:x.id}));
  return idx;
}
function renderSearch(term){
  INDEX = INDEX || searchIndex();
  const box = $('#srchRes'), q = term.trim().toLowerCase();
  if(!q){
    box.innerHTML = '<div style="padding:14px 12px;font-size:13px;color:var(--ink-4)">Search ' +
      COUNT.initiatives + ' initiatives, ' + COUNT.epics + ' epics and ' + COUNT.features + ' features.</div>';
    return;
  }
  const res = INDEX.map(e => {
    const t = e.t.toLowerCase();
    let s = 0;
    if(t === q) s = 100; else if(t.indexOf(q) === 0) s = 60; else if(t.indexOf(q) > -1) s = 34;
    else if(e.m.toLowerCase().indexOf(q) > -1) s = 8;
    return {e:e, s:s};
  }).filter(r => r.s > 0).sort((a, b) => b.s - a.s || a.e.t.length - b.e.t.length).slice(0, 18);
  if(!res.length){
    box.innerHTML = '<div style="padding:14px 12px;font-size:13px;color:var(--ink-4)">No matches for “' + esc(term) + '”.</div>';
    return;
  }
  box.innerHTML = res.map((r, i) => '<button class="sr' + (i === 0 ? ' on' : '') + '" data-fid="' + (r.e.fid || '') +
    '" data-eid="' + (r.e.eid || '') + '" data-sid="' + (r.e.sid || '') + '" data-ini="' + (r.e.ini || '') +
    '" data-adr="' + (r.e.adr || '') + '" data-arch="' + (r.e.arch || '') + '" data-sd="' + (r.e.sd || '') +
      '" data-lens="' + (r.e.lens || '') + '" data-contract="' + (r.e.contract || '') +
      '" data-sprint="' + (r.e.sprint || '') + '" data-who="' + (r.e.who || '') +
      '" data-plan="' + (r.e.plan || '') + '" data-tests="' + (r.e.tests || '') + '">' +
    '<div class="sr-t">' + esc(r.e.t) + '</div><div class="sr-m">' + esc(r.e.m) + '</div></button>').join('');
  $$('.sr', box).forEach(b => b.onclick = () => activate(b));
}

      goList(() => { revealRow('f-' + b.dataset.gotoF); openFeature(b.dataset.gotoF); }));
    $$('[data-goto-e]', view).forEach(b => b.onclick = () =>
      goList(() => { revealRow('e-' + b.dataset.gotoE); openEpic(b.dataset.gotoE); }));
    $$('[data-goto-s]', view).forEach(b => b.onclick = () =>
      goList(() => { revealRow('s-' + b.dataset.gotoS); openStory(b.dataset.gotoS); }));
  } else if(tabId === 'export'){
    view.innerHTML = exportHTML(); renderTabs('export');
    $('#crumb').textContent = 'Export'; document.title = 'Export · Squid Backlog';
    wireExport();
  } else {
    view.innerHTML = listHTML(); renderTabs('');
    $('#crumb').textContent = 'Initiative → Epic → Feature';
    document.title = 'Squid Product Backlog';
    wireList();
  }
  renderSide(null);
  $('#side').classList.remove('open');
  window.scrollTo(0, 0);
  /* Run a queued jump after this render settles, so a second render
     arriving in the same turn cannot wipe the opened item. */
  if(pendingList && $('#listRoot')){
    const fn = pendingList; pendingList = null;
    setTimeout(() => { if($('#listRoot')) fn(); }, 0);
  }
}

/* ---------------- architecture sections ---------------- */
/* the Lenses tab, and the controls the lens sections add to the architecture tab */
function wireLensPage(view){
  $$('[data-lensjump]', view).forEach(b => b.onclick = () => {
    LIST.lens = b.dataset.lensjump;
    store('squid:lens', LIST.lens);
    if(LIST.depth === 'feature'){ LIST.depth = 'story'; store('squid:depth', 'story'); }
    location.hash = '#/';
    toast('List filtered to the ' + LENS_BY_ID[LIST.lens].n + ' lens');
  });
  $$('[data-copy="lenses"]', view).forEach(b => b.onclick = () => copyText(lensesMarkdown(), 'Lens record copied'));
}
function wireLensSections(body){
  $$('[data-gosec]', body).forEach(b => b.onclick = () => { ARCH_SEC = b.dataset.gosec; render(); });
  $$('[data-mod]', body).forEach(b => b.onclick = () => { CONTRACT_MOD = b.dataset.mod; render(); });
  wireLensPage(body);
}
function wireArchSections(view){
  const body = $('[data-secbody]', view);
  const paint = () => {
    body.innerHTML = archSection(ARCH_SEC);
    wireDiagrams(body);
    wireLensSections(body);
    $$('.adr', body).forEach(box => {
      const btn = $('.adr-h', box);
      btn.onclick = () => {
        const open = box.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      };
    });
    $$('[data-adr]', body).forEach(b => b.onclick = e => { e.stopPropagation(); openADR(b.dataset.adr); });
    if(typeof body.scrollIntoView === 'function' && window.scrollY > 320) window.scrollTo(0, 220);
  };
  $$('[data-sec]', view).forEach(b => b.onclick = () => {
    ARCH_SEC = b.dataset.sec;
    $$('[data-sec]', view).forEach(x => x.classList.toggle('on', x === b));
    paint();
  });
  wireLensSections(view);
  $$('[data-copy]', view).forEach(b => b.onclick = () => copyText(architectureMarkdown(), 'Architecture baseline copied'));
  wireDiagrams(view);
  $$('[data-adr]', $('[data-secbody]', view)).forEach(b => b.onclick = () => openADR(b.dataset.adr));
  $$('.adr', body).forEach(box => {
    const btn = $('.adr-h', box);
    btn.onclick = () => {
      const open = box.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
  });
}

/* ---------------- theme ---------------- */
function initTheme(){
  const saved = store('squid:theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  $('#themeBtn').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const dark = cur === 'dark' || (cur !== 'light' && prefersDark);
    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    store('squid:theme', next);
    toast(next === 'dark' ? 'Dark theme' : 'Light theme');
  };
}

/* ---------------- boot ---------------- */
function boot(){
  initTheme();
  window.addEventListener('hashchange', render);
  $('#searchBtn').onclick = openSearch;
  $('#exportBtn').onclick = () => { location.hash = '#/export'; };
  $('#syncPill').onclick = openSyncPanel;
  $('#drawerClose').onclick = closeDrawer;
  $('#scrim').onclick = () => { closeDrawer(); closeSearch(); closeBigModal(); };
  $('#navToggle').onclick = function(){
    const open = $('#side').classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  $('#srchInput').addEventListener('input', e => renderSearch(e.target.value));
  $('#srchInput').addEventListener('keydown', e => {
    const items = $$('.sr');
    const cur = items.map(x => x.classList.contains('on')).indexOf(true);
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); if(!items.length) return;
      const nx = e.key === 'ArrowDown' ? Math.min(items.length - 1, cur + 1) : Math.max(0, cur - 1);
      items.forEach(x => x.classList.remove('on'));
      items[nx].classList.add('on');
      if(typeof items[nx].scrollIntoView === 'function') items[nx].scrollIntoView({block:'nearest'});
    } else if(e.key === 'Enter'){
      const t = items[cur > -1 ? cur : 0]; if(t) activate(t);
    }
  });
  document.addEventListener('keydown', e => {
    const typing = /input|textarea|select/i.test(e.target.tagName || '');
    if(e.key === 'Escape'){ closeSearch(); closeDrawer(); closeBigModal(); return; }
    if(typing) return;
    if(e.key === '/'){ e.preventDefault(); openSearch(); }
    else if(e.key === 'e' && $('#listRoot')){ const b = $('[data-expand]'); if(b) b.click(); }
    else if(e.key === 'c' && $('#listRoot')){ const b = $('[data-collapse]'); if(b) b.click(); }
  });
  render();

  /* Sharing is opt-in by where the page came from: served over http it
     connects to wherever it was served from, opened from disk it stays
     local until someone points it at a server. */
  paintSyncPill();
  if(SYNC.origin){
    if(SYNC.who) SYNC.connect();
    else SYNC.setStatus('error', 'Choose your name to start sharing');
  }
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
