/* ================================================================
   LENSES IN THE BACKLOG
   A lens that only appears in a review is a ritual. These rules put
   each lens's standing obligation on the Stories it actually applies
   to, and turn three of them into real Tasks.
   ================================================================ */

const LENS_BY_ID = {};
SQ_LENSES.forEach(l => { LENS_BY_ID[l.id] = l; });

const ASYNC_KINDS = ['outbox', 'worker', 'realtime', 'upload', 'recur', 'rollup'];
const has = (arr, list) => list.some(k => arr.indexOf(k) > -1);

/* Which lenses apply to this Story, and what each requires of it. */
const LENS_APPLIES = [
 {id:'engineering', when: () => true,
  note: (s, m) => 'The change stays inside ' + m.n + '. Any crossing is named in the Story and allowed by architecture/deps.json.'},
 {id:'product', when: () => true,
  note: s => 'States the outcome for ' + lc(s.feature.ini.t) + ', not only the change.'},
 {id:'security', when: () => true,
  note: (s, m) => 'Every entry point added here obtains a policy decision before acting, and reads are scoped by the ' + m.n + ' gateway.'},
 {id:'data', when: k => has(k, ['schema', 'gateway']),
  note: (s, m) => 'New or changed state names its owning module (' + m.n + '), its index and its retention rule.'},
 {id:'ux', when: k => has(k, ['island', 'rsc']),
  note: () => 'The surface handles the canonical states that can occur on it — at minimum empty, loading, ready and failed.'},
 {id:'accessibility', when: k => has(k, ['island', 'rsc']),
  note: () => 'Keyboard operable end to end, focus visible, and asynchronous change announced.'},
 {id:'dx', when: k => k.indexOf('schema') > -1,
  note: () => 'A new collection ships with seed data and a fixture, or local development degrades for everyone.'},
 {id:'reliability', when: (k, s) => has(k, ASYNC_KINDS) || s.kind === 'fail',
  note: () => 'Anything asynchronous is idempotent, and has a stated behaviour when its dependency is unavailable.'},
 {id:'performance', when: (k, s) => has(k, ['rsc', 'search', 'gateway']) && ['read', 'scope', 'scale'].indexOf(s.kind) > -1,
  note: s => 'Names the budget for this surface and the index that meets it at target volume.'},
 {id:'scalability', when: (k, s) => has(k, ['search', 'rollup', 'worker', 'outbox']) || s.kind === 'scale',
  note: () => 'Anything unbounded this Story creates states its growth assumption and its bound.'},
 {id:'operations', when: k => has(k, ASYNC_KINDS),
  note: () => 'Every queue, consumer or scheduled job added here ships with a signal, a threshold and a first action.'},
 {id:'cost', when: k => has(k, ['quota', 'search', 'upload']),
  note: () => 'Metered calls are checked against the workspace entitlement before the call, not after.'},
 {id:'compliance', when: (k, s, m) => ['identity', 'workspace', 'access'].indexOf(m.id) > -1 ||
    /guest|profile|email|contact|member|invit/i.test(s.feature.name),
  note: () => 'Personal data introduced here is classified and appears in the deletion trace.'}
];

const _lenses = {};
function lensesFor(s){
  if(_lenses[s.id]) return _lenses[s.id];
  const k = taskKinds(s), m = moduleOf(s.feature);
  const out = LENS_APPLIES.filter(r => r.when(k, s, m)).map(r => {
    const l = LENS_BY_ID[r.id];
    return {id:l.id, n:l.n, status:l.status, focus:l.focus, owner:l.owner,
            oblig:r.note(s, m), verify:l.verify, gaps:l.gaps};
  });
  return (_lenses[s.id] = out);
}

/* Acceptance criteria the lenses add. These are not decoration: each one
   is testable and each names the lens that demanded it. */
const LENS_AC = {
  accessibility:'Every control added here is reachable and operable by keyboard, and the change is announced to assistive technology',
  reliability:'The asynchronous effect happens exactly once from the consumer’s point of view, even when the event is delivered twice',
  operations:'The new asynchronous path emits a signal with a threshold, and the runbook names the first action',
  performance:'The surface meets its stated budget at target volume, measured rather than estimated',
  data:'The new state has one owning module, a covering index and a retention rule',
  cost:'The metered call is refused once the workspace entitlement is reached, with the limit and reset time stated'
};
function lensCriteriaFor(s){
  return lensesFor(s).filter(l => LENS_AC[l.id]).map(l => ({lens:l.n, lensId:l.id, ac:LENS_AC[l.id]}));
}

/* ---------------- lens-derived Tasks ----------------
   Three lenses ask for work that the functional tasks do not already
   contain. They are appended after the functional tasks and carry the
   lens that produced them, so nobody has to guess why they exist.     */
const LENS_TASK_DEF = {
  a11y: {lens:'accessibility',
    t:'Walk the keyboard path and announcements for the {noun} surface',
    c:'Every control reachable in a sensible tab order with a visible focus ring; the asynchronous result announced through a live region; no meaning carried by colour alone.'},
  ops:  {lens:'operations',
    t:'Register the signal, threshold and runbook line for the {noun} job',
    c:'Signal emitted with module and workspace labels; alert threshold set; one runbook line naming the first action and the escalation.'},
  budget: {lens:'performance',
    t:'Measure the {noun} view against its budget at target volume',
    c:'Seeded workspace at target volume, p95 recorded against the stated budget, and the index that served it named in the result.'}
};
function lensTaskKinds(s){
  const k = taskKinds(s), out = [];
  if(k.indexOf('island') > -1) out.push('a11y');
  if(has(k, ASYNC_KINDS) && k.indexOf('telemetry') < 0) out.push('ops');
  if(k.indexOf('rsc') > -1 && ['read', 'scope', 'scale'].indexOf(s.kind) > -1 && k.indexOf('perf') < 0) out.push('budget');
  return out;
}

/* Implementation steps for the lens-derived tasks — the same
   step-by-step level as every other Task in the backlog. */
const LENS_STEPS = {

const LENS_STEP_COUNT = {a11y:6, ops:5, budget:5};

/* ---------------- backlog-wide lens coverage ---------------- */
let LENS_ROLL = null;
function lensRoll(){
  if(LENS_ROLL) return LENS_ROLL;
  const by = {};
  SQ_LENSES.forEach(l => { by[l.id] = {id:l.id, n:l.n, status:l.status, owner:l.owner, stories:0, tasks:0, ac:0, inis:{}}; });
  FEATURES.forEach(f => storiesFor(f).forEach(s => {
    lensesFor(s).forEach(l => {
      const r = by[l.id];
      r.stories++;
      r.inis[f.ini.n] = 1;
      if(LENS_AC[l.id]) r.ac++;
    });
    lensTaskKinds(s).forEach(k => { by[LENS_TASK_DEF[k].lens].tasks++; });
  }));
  LENS_ROLL = SQ_LENSES.map(l => {
    const r = by[l.id];
    return {lens:l, stories:r.stories, tasks:r.tasks, ac:r.ac, inis:Object.keys(r.inis).length};
  });
  return LENS_ROLL;
}

function addDays(iso, n){
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const dowOf = iso => new Date(iso + 'T00:00:00Z').getUTCDay();
/* Snap forward to the next Monday, or stay if it already is one. A sprint
   that starts mid-week spends its first day finishing the previous one,
   and its review lands on a day half the team has already left. */
function mondayOf(iso){
  const dow = dowOf(iso);
  return dow === 1 ? iso : addDays(iso, (8 - dow) % 7);
}
const DATE_DOW = iso => DAYS[dowOf(iso)] + ' ' + DATE_FMT(iso);
const DATE_FMT = iso => {
  const d = new Date(iso + 'T00:00:00Z');
  return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
};
const DATE_SHORT = iso => {

let SPRINTS = null;
let ASSIGN = null;

function sprintPlan(cfg){
  cfg = cfg || SPRINT_CFG;
  const base = mondayOf(cfg.start);
  const members = TEAM.slice(0, Math.max(1, Math.min(TEAM.length, cfg.members)));
  const order = {};
  RELEASES.forEach((r, i) => { order[r.id] = i; });

  /* Release order first, then epic, feature and slice order inside it —
     so a person’s slices arrive in the sequence the architecture implies. */
  const all = readyStories().slice().sort((a, b) => {
    const ra = order[releaseOf(a)], rb = order[releaseOf(b)];
    if(ra !== rb) return ra - rb;
    if(a.feature.epic.n !== b.feature.epic.n) return a.feature.epic.n < b.feature.epic.n ? -1 : 1;
    if(a.feature.id !== b.feature.id) return a.feature.id < b.feature.id ? -1 : 1;
    return a.n - b.n;
  });

  const assign = {};
  const sprints = [];
  let i = 0;
  while(i < all.length){
    const load = {}, bag = {}, feat = {};
    members.forEach(m => { load[m.id] = 0; bag[m.id] = []; });
    let progressed = true;
    while(i < all.length && progressed){
      const st = all[i], p = pointsFor(st), aff = affinityFor(st);
      /* prefer someone already inside this feature, then matching affinity,
         then whoever has the most room — a person finishes a feature before
         starting another so the slice stays vertical and the review stays cheap */
      const can = members.filter(m => load[m.id] + p <= cfg.capacity);
      if(!can.length){ progressed = false; break; }
      const sameFeat = can.filter(m => feat[m.id] === st.feature.id);
      const sameAff = can.filter(m => m.focus === aff);
      const pick = (sameFeat.length ? sameFeat : (sameAff.length ? sameAff : can))
        .sort((a, b) => load[a.id] - load[b.id] || (a.id < b.id ? -1 : 1))[0];
      bag[pick.id].push(st);
      load[pick.id] += p;
      feat[pick.id] = st.feature.id;
      assign[st.id] = pick.id;
      i++;
    }
    const n = sprints.length + 1;
    const start = addDays(base, (n - 1) * cfg.weeks * 7);
    /* the last working day of the final week: Friday for a two-week sprint */
    const end = addDays(start, cfg.weeks * 7 - 3);
    const stories = members.reduce((a, m) => a.concat(bag[m.id]), []);
    sprints.push({
      n: n, start: start, end: end,
      lanes: members.map(m => ({member:m, stories:bag[m.id], pts:load[m.id]})),
      stories: stories,
      pts: members.reduce((a, m) => a + load[m.id], 0),
      tasks: stories.reduce((a, x) => a + tasksFor(x).length, 0),
      steps: stories.reduce((a, x) => a + stepCountOf(x), 0),
      cases: stories.reduce((a, x) => a + testCasesFor(x).length, 0),
      releases: [...new Set(stories.map(releaseOf))],
      goal: goalFor(stories),
      committed: n <= 3
    });
  }
  ASSIGN = assign;
  return sprints;
}
function sprintsCached(){ if(!SPRINTS) SPRINTS = sprintPlan(SPRINT_CFG); return SPRINTS; }
const sprintByN = n => sprintsCached().filter(s => s.n === n)[0];
function sprintOf(s){
  const sp = sprintsCached().filter(x => x.stories.indexOf(s) > -1)[0];
  return sp ? sp.n : 0;
}
function memberOf(s){
  sprintsCached();

}

/* ---------------- release windows and milestones ----------------
   A release is finished when the last sprint carrying its stories ends.
   Those are the only dates on the roadmap that came from the plan rather
   than from a wish.                                                    */
function releaseWindow(r){
  const st = readyStories().filter(x => releaseOf(x) === r.id);
  const ns = st.map(sprintOf).filter(Boolean);
  if(!ns.length) return null;
  const first = sprintByN(Math.min.apply(null, ns)), last = sprintByN(Math.max.apply(null, ns));
  return {from:first.start, to:last.end, sprints:[...new Set(ns)].sort((a, b) => a - b)};
}
function milestones(){
  const out = [];
  RELEASES.forEach(r => {
    const w = releaseWindow(r);
    if(!w) return;
    out.push({d:w.to, k:r.id, n:r.n,
      what:'Release Gate for ' + r.id + ' — ' + (r.audience === 'internal' ? 'to staging' : 'first external tenant'),
      conf:r.audience === 'internal' ? 'high' : 'medium', rel:r.id});
  });
  const sp = sprintsCached();
  out.push({d:sp[Math.min(1, sp.length - 1)].end, k:'CAL', n:'Velocity re-baseline',
    what:'Two sprints of real throughput replace the estimate. Every date after this one moves.',
    conf:'high', rel:''});
  out.push({d:sp[sp.length - 1].end, k:'W1', n:'Wave 1 exit',
    what:'Foundation complete: principal, tenancy and the policy decision. Wave 2 refinement can start.',
    conf:'medium', rel:''});
  return out.sort((a, b) => a.d < b.d ? -1 : 1);
}

/* ---------------- test case generation ----------------
   One case per acceptance criterion, functional and cross-cutting.
   The verification approach already recorded during refinement decides
   the level, so the plan and the backlog cannot drift apart.         */
const TYPE_LEVEL = {
  'Security contract test':'contract', 'Load test':'load', 'Fault-injection test':'fault',
  'Playwright journey':'journey', 'Integration test':'integration'
};
const LENS_LEVEL = {accessibility:'a11y', reliability:'fault', operations:'integration',
  performance:'load', data:'integration', cost:'contract'};

function stepsForLevel(level, ctx){
  const M = {
    contract: [
      'Seed the workspace fixture and resolve the five principal types: owner, member, guest, non-member and API key',
      'Call ' + ctx.entry + ' as each principal in turn',
      'Assert the outcome is allowed only for the principals the policy rule names',
      'Assert a refusal returns a typed reason, changes no state, and writes an audit entry with actor and resource'],
    integration: [
      'Seed a workspace with the ' + ctx.noun + ' precondition the criterion assumes',
      'Invoke the ' + ctx.mod + ' application service with a valid command',
      'Assert the persisted document matches the data design — fields, workspaceId, version and deletedAt',
      'Assert the outbox row was written in the same transaction where the story emits an event'],
    journey: [
      'Sign in to a seeded workspace as a member in a preview deployment',
      'Navigate to the ' + ctx.noun + ' surface',
      'Perform the action the criterion describes',
      'Assert the observable result in the browser without reloading the page',
      'Assert the empty, loading and failed states of the same surface are reachable and correct'],
    fault: [
      'Seed the workspace and start the operation the criterion describes',
      'Inject the failure — sever the dependency, duplicate the event, or apply a stale version predicate',
      'Assert the designed behaviour happens: a typed conflict, a retry, or a degraded surface with a banner',
      'Assert no duplicate side effect and no partial state after recovery'],
    load: [
      'Generate the volume fixture the budget assumes for this surface',
      'Run 200 requests against the ' + ctx.noun + ' surface and record p95, p99 and payload size',
      'Compare against the budget in the architecture quality-attribute table',
      'Name the index that served the query, and commit the measurement with a date'],
    a11y: [
      'Open the ' + ctx.noun + ' surface in a preview deployment with the mouse unplugged',
      'Tab from the first control to the last and record the order actually obtained',
      'Confirm a visible focus ring on every interactive element in both themes',
      'Trigger the asynchronous action and confirm the result is announced through a live region',
      'Confirm no state is signalled by colour alone']
  };
  return M[level] || M.integration;
}

const _cases = {};
function testCasesFor(s){
  if(_cases[s.id]) return _cases[s.id];
  const f = s.feature, mod = moduleOf(f);
  const noun = lc(singular(f.name));
  const ctx = {mod:mod.n, modId:mod.id, noun:noun,
    entry:'the ' + mod.n + ' entry point for “' + f.name + '”'};
  const reqs = requirementsFor(f).map(r => r.id);
  const rel = releaseOf(s);
  const out = [];

  s.ac.forEach((ac, i) => {
    const v = verificationFor(ac);
    const level = TYPE_LEVEL[v.k] || 'integration';
    out.push({
      id: 'TC-' + s.id + '-' + (i + 1), story: s, ac: ac, acN: 'AC-' + (i + 1),
      title: ac.charAt(0).toUpperCase() + ac.slice(1),
      level: level, method: v.k, approach: v.d,
      pri: level === 'contract' || level === 'fault' ? 'P1' : level === 'journey' ? 'P2' : 'P2',
      pre: 'Seeded workspace, ' + mod.n + ' module deployed, actor resolved as a member unless the criterion names another principal.',
      steps: stepsForLevel(level, ctx),
      expect: ac,
      auto: level === 'a11y' ? 'Manual walk, axe in CI for the automatable part' : 'Automated',
      lens: '', reqs: reqs, release: rel, module: mod.n, feature: f.name
    });
  });

  lensCriteriaFor(s).forEach((x, i) => {
    const level = LENS_LEVEL[x.lensId] || 'integration';
    out.push({
      id: 'TC-' + s.id + '-X' + (i + 1), story: s, ac: x.ac, acN: 'X-' + (i + 1),
      title: x.ac.charAt(0).toUpperCase() + x.ac.slice(1),
      level: level, method: TEST_LEVELS.filter(l => l.id === level)[0].n,
      approach: 'Cross-cutting criterion demanded by the ' + x.lens + ' lens.',
      pri: x.lensId === 'accessibility' || x.lensId === 'reliability' ? 'P1' : 'P2',
      pre: 'As above, plus whatever the lens obligation names — a volume fixture, an injected failure, or a keyboard-only session.',
      steps: stepsForLevel(level, ctx),
      expect: x.ac,
      auto: level === 'a11y' ? 'Manual walk, recorded' : 'Automated',
      lens: x.lens, reqs: reqs, release: rel, module: mod.n, feature: f.name
    });
  });

  return (_cases[s.id] = out);
}

/* Which levels a Task is responsible for proving. A task does not own a
   criterion — the Story does — but it does own the level that proves it. */
const TASK_LEVELS = {
  schema:['integration'], gateway:['integration', 'contract'], domain:['unit', 'integration'],
  policy:['contract'], action:['contract', 'integration'], rsc:['journey', 'load'],
  island:['journey', 'a11y'], outbox:['fault', 'integration'], worker:['fault'],
  realtime:['fault', 'journey'], search:['load', 'integration'], rollup:['integration'],
  quota:['contract'], upload:['contract', 'integration'], recur:['fault'],
  tests:['unit', 'contract', 'integration', 'journey', 'fault', 'load', 'a11y'],
  telemetry:['integration'], perf:['load'],
  a11y:['a11y'], ops:['integration'], budget:['load']
};
function casesForTask(t){
  const want = TASK_LEVELS[t.kind] || [];
  const all = testCasesFor(t.story);
  const hit = all.filter(c => want.indexOf(c.level) > -1);
  /* the tests task carries whatever no other task claimed */
  if(t.kind === 'tests'){
    const claimed = {};
    tasksFor(t.story).forEach(x => {
      if(x.kind === 'tests') return;
      (TASK_LEVELS[x.kind] || []).forEach(l => { claimed[l] = 1; });
    });
    return all.filter(c => !claimed[c.level]);
  }
  return hit;
}

/* ================================================================

   person = oval · system = rounded rect · external = dashed
   data store = cylinder · boundary = dashed container

const DG = {CW:206, RH:116, NW:156, NH:54, PX:26, PY:30};
let _did = 0;
function nodeXY(n){ return {x: DG.PX + n.col * DG.CW + DG.CW / 2, y: DG.PY + n.row * DG.RH + DG.NH / 2}; }
function nodeShape(n, p){
  const w = DG.NW, h = DG.NH, x = p.x - w / 2, y = p.y - h / 2;
  if(n.kind === 'human') return '<ellipse class="nd-shape" cx="' + p.x + '" cy="' + p.y + '" rx="' + (w / 2) + '" ry="' + (h / 2) + '"/>';
  if(n.kind === 'store'){
    const ry = 9;
    return '<path class="nd-shape" d="M' + x + ',' + (y + ry) + ' A' + (w / 2) + ',' + ry + ' 0 0 1 ' + (x + w) + ',' + (y + ry) +
      ' L' + (x + w) + ',' + (y + h - ry) + ' A' + (w / 2) + ',' + ry + ' 0 0 1 ' + x + ',' + (y + h - ry) + ' Z"/>' +
      '<path class="nd-shape" style="fill:none" d="M' + x + ',' + (y + ry) + ' A' + (w / 2) + ',' + ry + ' 0 0 0 ' + (x + w) + ',' + (y + ry) + '"/>';
  }
  return '<rect class="nd-shape" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="8"/>';
}
function edgePath(a, b){
  const half = DG.NH / 2;
  if(a.row === b.row){
    const dir = b.col > a.col ? 1 : -1;
    const sx = a.p.x + dir * (DG.NW / 2 + 3), ex = b.p.x - dir * (DG.NW / 2 + 9);
    return {d:'M' + sx + ',' + a.p.y + ' L' + ex + ',' + b.p.y, mx:(sx + ex) / 2, my:a.p.y - 9};
  }
  const down = b.row > a.row;
  const sy = a.p.y + (down ? half : -half), ey = b.p.y + (down ? -half - 8 : half + 8);
  const my = (sy + ey) / 2;
  return {d:'M' + a.p.x + ',' + sy + ' L' + a.p.x + ',' + my + ' L' + b.p.x + ',' + my + ' L' + b.p.x + ',' + ey,
          mx:(a.p.x + b.p.x) / 2, my:my - 6};
}
function diagramSVG(spec, id){
  const nodes = spec.nodes, edges = spec.edges || [], groups = spec.groups || [];
  const cols = Math.max.apply(null, nodes.map(n => n.col)) + 1;
  const rows = Math.max.apply(null, nodes.map(n => n.row)) + 1;
  const W = DG.PX * 2 + cols * DG.CW, H = DG.PY * 2 + rows * DG.RH;
  const map = {}; nodes.forEach(n => { map[n.id] = Object.assign({}, n, {p: nodeXY(n)}); });
  let g = '';
  groups.forEach(gr => {
    const x = DG.PX + gr.c0 * DG.CW + 8, y = DG.PY + gr.r0 * DG.RH - 18;
    const w = (gr.c1 - gr.c0 + 1) * DG.CW - 16, h = (gr.r1 - gr.r0 + 1) * DG.RH - 4;
    g += '<rect class="bnd" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="10"/>' +
         '<text class="bnd-l" x="' + (x + 10) + '" y="' + (y - 5) + '">' + esc(gr.label) + '</text>';
  });
  edges.forEach(e => {
    const a = map[e.f], b = map[e.t]; if(!a || !b) return;
    const pp = edgePath(a, b);
    g += '<path class="eg' + (e.async ? ' async' : '') + '" data-f="' + e.f + '" data-t="' + e.t +
         '" d="' + pp.d + '" marker-end="url(#ah-' + id + ')"/>';
    if(e.l) g += '<text class="eg-l" x="' + pp.mx + '" y="' + pp.my + '" text-anchor="middle">' + esc(e.l) + '</text>';
  });
  nodes.forEach(n => {
    const p = map[n.id].p;
    g += '<g class="nd k-' + n.kind + '" data-n="' + esc(n.id) + '" tabindex="0" role="button" aria-label="' + esc(n.label) + '">' +
      nodeShape(n, p) +
      '<text class="nd-l" x="' + p.x + '" y="' + (p.y + (n.sub ? -2 : 4)) + '" text-anchor="middle">' + esc(n.label) + '</text>' +
      (n.sub ? '<text class="nd-s" x="' + p.x + '" y="' + (p.y + 13) + '" text-anchor="middle">' + esc(n.sub) + '</text>' : '') +
      '</g>';
  });
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(spec.title || 'Architecture diagram') + '">' +
    '<defs><marker id="ah-' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
    '<path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--line-3)"/></marker></defs>' +
    g + '</svg>';
}

function wireDiagrams(root){
  $$('[data-dgm]', root).forEach(box => {
    const spec = ARCH.diagrams[box.dataset.dgm]; if(!spec) return;
    const info = $('.dgm-info', box);
    let sel = null;
    const linked = (a, b) => (spec.edges || []).some(e => (e.f === a && e.t === b) || (e.f === b && e.t === a));
    $$('.nd', box).forEach(gEl => {
      const act = () => {
        sel = (sel === gEl.dataset.n) ? null : gEl.dataset.n;
        $$('.nd', box).forEach(x => {
          const on = x.dataset.n === sel;
          x.classList.toggle('on', on);
          x.classList.toggle('dim', !!sel && !on && !linked(x.dataset.n, sel));
        });
        $$('.eg', box).forEach(p => {
          const hot = sel && (p.dataset.f === sel || p.dataset.t === sel);
          p.classList.toggle('hot', !!hot); p.classList.toggle('dim', !!sel && !hot);
        });
        if(!sel){ info.classList.remove('show'); info.innerHTML = ''; return; }
        const n = spec.nodes.filter(x => x.id === sel)[0];
        const deps = (spec.edges || []).filter(e => e.f === sel)
          .map(e => (spec.nodes.filter(x => x.id === e.t)[0] || {}).label).filter(Boolean);
        info.innerHTML =
          '<div class="k">' + esc({human:'Person', ext:'External system', store:'Data store'}[n.kind] || 'System') + '</div>' +
          '<h4>' + esc(n.label) + '</h4>' +
          (n.resp ? '<p style="margin:6px 0 0;color:var(--ink-2)">' + esc(n.resp) + '</p>' : '') +
          '<dl>' + (n.owner ? '<div><dt>Owner</dt><dd>' + esc(n.owner) + '</dd></div>' : '') +
            (deps.length ? '<div><dt>Depends on</dt><dd>' + deps.map(esc).join(' · ') + '</dd></div>' : '') +
            (n.lenses ? '<div><dt>Relevant lenses</dt><dd>' + esc(n.lenses) + '</dd></div>' : '') + '</dl>' +
          (n.why ? '<div class="callout model" style="margin:14px 0 0"><div class="callout-h">Why this exists</div><p>' +
            esc(n.why) + '</p></div>' : '');
        info.classList.add('show');
      };
      gEl.addEventListener('click', act);
      gEl.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); act(); } });
    });
  });
}

   carrying a gap, so the obligation is real but the proof is not. */
function lensChips(s){
  const ls = lensesFor(s);
  if(!ls.length) return dash;
  return '<span class="lchips">' + ls.map(l =>
    '<span class="lchip' + (l.status === 'ok' || l.status === 'na' ? '' : ' warn') + '" title="' +
    esc(l.oblig) + '">' + esc(l.n.split(' ')[0]) + '</span>').join('') + '</span>';
}
function flagHTML(list, dup){
  let out = '';
  if(dup) out += '<b class="dup">duplicate name</b>';
  (list || []).forEach(c => { out += '<b class="q">' + esc(c.short) + '</b>'; });
  return out ? '<span class="fl">' + out + '</span>' : dash;
}
const layerCell = ini => ini.future ? '<span class="tag future">Future</span>' : '<span class="tag parity">Parity</span>';
function readyRollup(r){
  if(!r.s) return dash;
  const pct = Math.round(r.r / r.s * 100);
  return '<span class="rdy"><span class="rdy-bar"><i style="width:' + pct + '%"></i></span>' +
    '<span class="rdy-n">' + r.r + '/' + r.s + '</span></span>';
}
function tw(id, open, has){
  if(!has) return '<span class="tw leaf">▶</span>';
  return '<button class="tw' + (open ? ' open' : '') + '" data-tog="' + id + '" aria-expanded="' + !!open +
    '" aria-label="Expand or collapse">▶</button>';
}
const indent = px => px ? '<span class="ind" style="width:' + px + 'px"></span>' : '';

    cell('wave', '<span class="wv w' + waveOf(storiesFor(f)[0]) + '">' + esc(WAVE_LABEL[waveOf(storiesFor(f)[0])]) + '</span>') +
    cell('impact', '<span class="c-mono">' + r.i + ' of ' + r.s + '</span>') +
    cell('pattern', dash) + cell('lenses', dash) + cell('flags', flagHTML(flags, dup)) + cell('layer', layerCell(f.ini)) + '</div>';

function rowStory(s){
  const g = readyGateFor(s), im = impactFor(s), w = waveOf(s);
  const ready = g.ready
    ? '<span class="st ready">Ready</span>'
    : '<span class="st blocked" title="' + esc(g.blockers.join(' · ')) + '">Blocked · ' + g.failed + '</span>';
  const impact = im.impacted
    ? (im.adrs.length ? '<span class="adrl">' + im.adrs.map(a => '<b>' + esc(a) + '</b>').join('') + '</span>'
                      : '<span class="st design">Design needed</span>')
    : '<span class="c-mono" style="color:var(--ink-4)">none</span>';
  return '<div class="lrow r-story' + (g.ready ? ' is-ready' : '') + '" data-row="s-' + s.id + '" data-kind="story" data-n="' + s.id +
    '" data-parent="f-' + s.feature.id + '" data-lvl="4" data-text="' +
    esc((s.id + ' ' + s.title + ' ' + (g.ready ? 'ready' : 'blocked')).toLowerCase()) + '" tabindex="0" role="button">' +
    '<div class="cell c-name">' + indent(48) + tw('s-' + s.id, LIST.open['s-' + s.id], true) +
      typeIcon('story') + rid(s.id) + '<span class="nm">' + esc(s.title) + '</span>' +
      '<span class="open-hint">open ›</span></div>' +
    cell('id', '<span class="c-mono">' + s.id + '</span>') +
    cell('type', '<span class="tag story">Story</span>') +
    cell('module', '<span class="mod">' + esc(moduleOf(s.feature).n) + '</span>') +
    cell('epics', dash) + cell('features', dash) + cell('stories', dash) +
    cell('tasks', String(nTasks(s))) + cell('subs', String(nSubs(s))) +
    cell('ready', ready) +
    cell('wave', '<span class="wv w' + w + '">' + esc(WAVE_LABEL[w]) + '</span>') +
    cell('impact', impact) +
    cell('pattern', '<span class="pat">' + esc(patternName(s.pattern)) + '</span>') +
    cell('lenses', colOn('lenses') ? lensChips(s) : dash) +
    cell('flags', dash) + cell('layer', layerCell(s.feature.ini)) + '</div>';
}

function storiesShown(f){
  const all = storiesFor(f);
  if(!LIST.lens) return all;
  return all.filter(s => lensesFor(s).some(l => l.id === LIST.lens));
}
const ROW_BUDGET = 9000;
function featurePasses(f){
  if(LIST.layer === 'parity' && f.ini.future) return false;
  if(LIST.layer === 'future' && !f.ini.future) return false;
  const flag = LIST.flag;
  if(flag === 'any' && !FEATURE_FLAGS[f.id] && !DUP_NAMES[f.id]) return false;
  if(flag === 'dup' && !DUP_NAMES[f.id]) return false;
  if(flag === 'clean' && (FEATURE_FLAGS[f.id] || DUP_NAMES[f.id])) return false;
  if(['story','tech','echo'].indexOf(flag) > -1 && !(FEATURE_FLAGS[f.id] || []).some(c => c.id === flag)) return false;
  if(flag === 'ready' && ROLL[f.id].r === 0) return false;
  if(flag === 'blocked' && ROLL[f.id].r === ROLL[f.id].s) return false;
  if(flag === 'design' && !storiesFor(f).some(s => impactFor(s).needsDesign)) return false;
  if(LIST.lens && !storiesShown(f).length) return false;
  if(/^w[1-5]$/.test(flag) && String(waveOf(storiesFor(f)[0])) !== flag.slice(1)) return false;
  return true;
}
function passingFeatures(){ return FEATURES.filter(featurePasses); }
function rowCountAt(maxLvl){
  const fs = passingFeatures();
  let n = BACKLOG.length + EPICS.length + fs.length;
  if(maxLvl >= 4) fs.forEach(f => n += ROLL[f.id].s);
  if(maxLvl >= 5) fs.forEach(f => n += ROLL[f.id].t);
  if(maxLvl >= 6) fs.forEach(f => n += ROLL[f.id].u);
  return n;
}
function childrenHTML(rowId){
  const kind = rowId.charAt(0), id = rowId.slice(2);
  if(kind === 'i') return iniByN(id).epics.map(e => rowEpic(epicByN(e.n))).join('');
  if(kind === 'e'){
    const e = epicByN(id);
    return e.f.map((x, i) => rowFeat(featureById(e.n + '.' + String(i + 1).padStart(2, '0')))).join('');
  }
  if(kind === 'f') return storiesShown(featureById(id)).map(rowStory).join('');
  if(kind === 's') return tasksFor(storyById(id)).map(rowTask).join('');
  if(kind === 't') return subtasksFor(taskById(id)).map(rowSub).join('');
  return '';
}
function ensureChildren(rowId, rowEl){
  if(LIST.built[rowId]) return;
  const row = rowEl || $('[data-row="' + rowId + '"]');
  if(!row) return;
  const html = childrenHTML(rowId);
  LIST.built[rowId] = true;
  if(html) row.insertAdjacentHTML('afterend', html);
}
function rowsHTML(maxLvl){
  const out = [];
  BACKLOG.forEach(ini => {
    out.push(rowIni(ini));
    LIST.built['i-' + ini.n] = maxLvl >= 2;
    if(maxLvl < 2) return;
    ini.epics.forEach(ep => {
      const e = epicByN(ep.n);
      out.push(rowEpic(e));
      LIST.built['e-' + e.n] = maxLvl >= 3;
      if(maxLvl < 3) return;
      e.f.forEach((x, k) => {
        const f = featureById(e.n + '.' + String(k + 1).padStart(2, '0'));
        out.push(rowFeat(f));
        const deep = maxLvl >= 4 && featurePasses(f);
        LIST.built['f-' + f.id] = deep;
        if(!deep) return;
        storiesShown(f).forEach(s => {
          SMAP[s.id] = s;
          out.push(rowStory(s));
          LIST.built['s-' + s.id] = maxLvl >= 5;
          if(maxLvl < 5) return;
          tasksFor(s).forEach(t => {
            TMAP[t.id] = t;
            out.push(rowTask(t));
            LIST.built['t-' + t.id] = maxLvl >= 6;
            if(maxLvl < 6) return;
            subtasksFor(t).forEach(u => out.push(rowSub(u)));
          });
        });
      });
    });
  });
  return out.join('');
}
function rebuildRows(){
  const root = $('#listRoot'); if(!root) return;
  const maxLvl = DEPTH_LEVEL[LIST.depth];
  LIST.built = {};
  const inner = $('.list-inner', root);
  const head = $('.lhead', root).outerHTML;
  inner.innerHTML = head + rowsHTML(maxLvl) +
    '<div class="empty-note" data-empty style="display:none">Nothing matches this filter.</div>';
  Object.keys(LIST.open).forEach(k => delete LIST.open[k]);
  $$('.lrow', inner).forEach(r => { if(+r.dataset.lvl < maxLvl) LIST.open[r.dataset.row] = true; });
  applyList();
}
function applyList(){
  const root = $('#listRoot'); if(!root) return;
  const term = LIST.filter.trim().toLowerCase();
  const rows = $$('.lrow', root);
  const idx = {}; rows.forEach((r, i) => idx[r.dataset.row] = i);
  const hit = new Array(rows.length);
  for(let i = 0; i < rows.length; i++){
    const r = rows[i], kind = r.dataset.kind, n = r.dataset.n;
    let ok;
    if(kind === 'ini'){
      const ini = iniByN(n);
      ok = !(LIST.layer === 'parity' && ini.future) && !(LIST.layer === 'future' && !ini.future) && !LIST.flag && !LIST.lens;
    } else if(kind === 'epic'){
      const e = epicByN(n);
      ok = !(LIST.layer === 'parity' && e.ini.future) && !(LIST.layer === 'future' && !e.ini.future) && !LIST.flag && !LIST.lens;
    } else {
      ok = featurePasses(featureById(kind === 'feat' ? n : n.split('-')[0]));
    }
    if(ok && term) ok = r.dataset.text.indexOf(term) > -1;
    hit[i] = ok;
  }
  const keep = new Array(rows.length);
  for(let i = rows.length - 1; i >= 0; i--){
    if(!(hit[i] || keep[i])) continue;
    const p = rows[i].dataset.parent;
    if(p !== undefined && idx[p] !== undefined) keep[idx[p]] = true;
  }
  const filtering = !!(term || LIST.layer || LIST.flag || LIST.lens);
  const vis = new Array(rows.length);
  let shown = 0;
  for(let i = 0; i < rows.length; i++){
    const r = rows[i], p = r.dataset.parent;
    const pi = p === undefined ? -1 : idx[p];
    let v = (pi < 0) ? true : (vis[pi] && !!LIST.open[p]);
    if(v && filtering) v = hit[i] || keep[i];
    vis[i] = v;
    r.classList.toggle('hidden', !v);
    if(v) shown++;
  }
  const empty = $('[data-empty]', root);
  if(empty) empty.style.display = shown ? 'none' : 'block';
  $('[data-foot]').textContent = shown + ' rows shown · ' + COUNT.stories + ' stories · ' +
    COUNT.ready + ' Ready · ' + COUNT.blocked + ' blocked · ' + COUNT.tasks + ' tasks';
  const b = $('[data-budget]');
  if(b){
    const blocked = DEPTHS.filter(d => rowCountAt(DEPTH_LEVEL[d.id]) > ROW_BUDGET)[0];
    b.textContent = blocked ? (blocked.label.toLowerCase() + ' need a narrower filter') : '';
  }
}
function toggleRow(id, force, rowEl){
  const now = (force === undefined) ? !LIST.open[id] : force;
  LIST.open[id] = now;
  if(now) ensureChildren(id, rowEl);
  const t = $('[data-tog="' + id + '"]');
  if(t){ t.classList.toggle('open', now); t.setAttribute('aria-expanded', String(now)); }
  applyList();
}
function openRow(row){
  const kind = row.dataset.kind, n = row.dataset.n;
  if(kind === 'feat') openFeature(n);
  else if(kind === 'epic') openEpic(n);
  else if(kind === 'story') openStory(n);
  else if(kind === 'task') openTask(n);
  else if(kind === 'sub') openTask(n.split('-').slice(0, 3).join('-'));
  else toggleRow('i-' + n, undefined, row);
}

function wireList(){
  const root = $('#listRoot'); if(!root) return;
  root.addEventListener('click', e => {
    const tog = e.target.closest('[data-tog]');
    if(tog){ e.stopPropagation(); toggleRow(tog.dataset.tog, undefined, tog.closest('.lrow')); return; }
    const row = e.target.closest('.lrow');
    if(row) openRow(row);
  });
  root.addEventListener('keydown', e => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const row = e.target.closest('.lrow');
    if(row && row.getAttribute('tabindex') === '0'){ e.preventDefault(); openRow(row); }
  });
  const q = $('[data-q]');
  q.addEventListener('input', () => { LIST.filter = q.value; applyList(); });
  const dsel = $('[data-depth]');
  dsel.onchange = () => {
    const want = dsel.value, lvl = DEPTH_LEVEL[want], n = rowCountAt(lvl);
    if(n > ROW_BUDGET){
      dsel.value = LIST.depth;
      toast(n.toLocaleString() + ' rows is too many to render — narrow with a filter first');
      return;
    }
    LIST.depth = want; store('squid:depth', want);
    if(lvl >= 5) toast('Loading ' + n.toLocaleString() + ' rows…');
    rebuildRows();
  };
  $('[data-expand]').onclick = () => {
    $$('.lrow', root).forEach(r => { if($('[data-tog]', r)) LIST.open[r.dataset.row] = true; });
    $$('.tw:not(.leaf)', root).forEach(t => { t.classList.add('open'); t.setAttribute('aria-expanded', 'true'); });
    applyList();
  };
  $('[data-collapse]').onclick = () => {
    Object.keys(LIST.open).forEach(k => LIST.open[k] = false);
    $$('.tw:not(.leaf)', root).forEach(t => { t.classList.remove('open'); t.setAttribute('aria-expanded', 'false'); });
    applyList();
  };
  const refilter = () => {
    if(DEPTH_LEVEL[LIST.depth] >= 4 && rowCountAt(DEPTH_LEVEL[LIST.depth]) > ROW_BUDGET){
      LIST.depth = 'story'; $('[data-depth]').value = 'story';
      toast('Reduced to stories — the wider selection is too large to render in full');
    }
    if(DEPTH_LEVEL[LIST.depth] >= 4) rebuildRows(); else applyList();
  };
  const selL = $('[data-layer]'), selF = $('[data-flag]');
  selL.onchange = () => { LIST.layer = selL.value; store('squid:layer', selL.value); refilter(); };
  selF.onchange = () => { LIST.flag = selF.value; store('squid:flag', selF.value); refilter(); };
  const selX = $('[data-lens]');
  if(selX) selX.onchange = () => { LIST.lens = selX.value; store('squid:lens', selX.value); refilter(); };
  const cm = $('[data-colmenu]'), menu = $('[data-menu]');
  cm.onclick = e => {
    e.stopPropagation();
    const open = menu.classList.toggle('show');
    cm.setAttribute('aria-expanded', open ? 'true' : 'false');
  };
  document.addEventListener('click', () => menu.classList.remove('show'));
  menu.onclick = e => e.stopPropagation();
  $$('[data-col]', menu).forEach(cb => cb.onchange = () => {
    COLS.filter(x => x.id === cb.dataset.col)[0].on = cb.checked;
    const map = {}; COLS.forEach(x => map[x.id] = x.on);
    store('squid:cols4', map);
    render();
  });
  $('[data-copy-list]').onclick = () => copyText(backlogMarkdown(), 'Backlog copied as Markdown');
  /* everything above the loaded depth starts expanded */
  const maxLvl = DEPTH_LEVEL[LIST.depth];
  $$('.lrow', root).forEach(r => { if(+r.dataset.lvl < maxLvl) LIST.open[r.dataset.row] = true; });
  $$('.tw:not(.leaf)', root).forEach(t => {
    const on = !!LIST.open[t.dataset.tog];
    t.classList.toggle('open', on); t.setAttribute('aria-expanded', String(on));
  });
  applyList();
}
function revealRow(rowId){
  const kind = rowId.charAt(0), id = rowId.slice(2), chain = [];
  if(kind === 'e') chain.push('i-' + epicByN(id).ini.n);
  else if(kind === 'f'){ const f = featureById(id); chain.push('i-' + f.ini.n, 'e-' + f.epic.n); }
  else if(kind === 's'){ const s = storyById(id);
    chain.push('i-' + s.feature.ini.n, 'e-' + s.feature.epic.n, 'f-' + s.feature.id); }
  else if(kind === 't'){ const t = taskById(id);
    chain.push('i-' + t.story.feature.ini.n, 'e-' + t.story.feature.epic.n, 'f-' + t.story.feature.id, 's-' + t.story.id); }
  chain.forEach(c => toggleRow(c, true));
  applyList();
  const row = $('[data-row="' + rowId + '"]');
  if(!row) return;
  if(typeof row.scrollIntoView === 'function') row.scrollIntoView({block:'center'});
  $$('.lrow.flash').forEach(r => r.classList.remove('flash'));
  row.classList.add('flash');
}

    '<p style="color:var(--ink-2);max-width:74ch">The handbook treats a named gap as stronger than a silent one. Each of these is a deliberate omission with the moment it stops being acceptable.</p>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Missing</th><th>What exists instead</th><th>Needed by</th></tr></thead><tbody>' +

    ARCH.principles.map(p => '<tr><td><strong>' + esc(p.n) + '</strong></td><td>' + esc(p.why) + '</td><td class="mono">' + esc(p.guard) + '</td></tr>').join('') +
    '</tbody></table></div>' +
    '<h2 class="sec">Standards</h2>' +
    '<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Statement</th><th>Verified by</th><th>From</th></tr></thead><tbody>' +

      '<td><button class="hit" data-adr="' + esc(st.adr) + '">' + esc(st.adr) + '</button></td></tr>').join('') +
    '</tbody></table></div>';

  if(id === 'questions') return '<h2 class="sec">Open questions</h2>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Question</th><th>Blocks</th><th>Owner</th></tr></thead><tbody>' +
    ARCH.openQuestions.map(q => '<tr><td><strong>' + esc(q.q) + '</strong></td><td>' + esc(q.blocks) + '</td><td>' + esc(q.owner) + '</td></tr>').join('') +
    '</tbody></table></div>' +
    ((ARCH.resolvedQuestions || []).length ? '<h2 class="sec">Answered since v1.0</h2>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Question</th><th>Answer</th><th>By</th></tr></thead><tbody>' +
      ARCH.resolvedQuestions.map(q => '<tr><td><strong>' + esc(q.q) + '</strong></td><td>' + esc(q.a) + '</td>' +
        '<td><button class="hit" data-adr="' + esc(q.by) + '">' + esc(q.by) + '</button></td></tr>').join('') +
      '</tbody></table></div>' : '') +
    '<div class="callout note"><div class="callout-h">A baseline with open questions is stronger than one without</div>' +
    '<p>Each question names the decision it blocks. One was answered by ADR-026 during this pass; two new ones arrived with the system designs, which is what happens when you design something properly.</p></div>';
  return '';
}

/* ---------------- refinement ---------------- */
function refinementHTML(){
  const blockers = Object.keys(REFINE.byBlocker).sort((a, b) => REFINE.byBlocker[b] - REFINE.byBlocker[a]);
  const waves = Object.keys(REFINE.waves).sort();
  const cls = {};
  FEATURES.forEach(f => requirementsFor(f).forEach(r => cls[r.cls] = (cls[r.cls] || 0) + 1));
  const readyByWave = {};
  FEATURES.forEach(f => storiesFor(f).forEach(s => {
    const w = waveOf(s);
    readyByWave[w] = readyByWave[w] || {r:0, n:0};
    readyByWave[w].n++; if(readyGateFor(s).ready) readyByWave[w].r++;
  }));
  const lensExtra = lensRoll().reduce((a, x) => [a[0] + x.tasks, a[1] + x.ac], [0, 0]);
  return '<div class="wrap doc">' +
  '<header class="page-open">' +
    '<div class="eyebrow">Delivery model · Refine</div>' +
    '<h1 class="page-t">Refinement result</h1>' +
    '<p class="page-sum">What the Refine stage produced over the whole backlog: requirements, acceptance criteria with a verification approach, dependencies, an architecture impact position per story, and a Ready Gate result.</p>' +
  '</header>' +

  '<div class="kpis">' +
    '<div class="kpi"><div class="kpi-n">' + COUNT.reqs + '</div><div class="kpi-l">Requirements</div>' +
      '<div class="kpi-s">' + Object.keys(cls).map(k => cls[k] + ' ' + k.toLowerCase()).join(' · ') + '</div></div>' +
    '<div class="kpi"><div class="kpi-n">' + COUNT.stories + '</div><div class="kpi-l">Stories</div>' +
      '<div class="kpi-s">each with criteria and a verification approach</div></div>' +
    '<div class="kpi ok"><div class="kpi-n">' + COUNT.ready + '</div><div class="kpi-l">Ready</div>' +
      '<div class="kpi-s">passed all eight gate conditions</div></div>' +
    '<div class="kpi warn"><div class="kpi-n">' + COUNT.blocked + '</div><div class="kpi-l">Blocked</div>' +
      '<div class="kpi-s">each naming the condition that failed</div></div>' +
    '<div class="kpi"><div class="kpi-n">' + REFINE.impacted + '</div><div class="kpi-l">Architecture impact</div>' +
      '<div class="kpi-s">' + REFINE.needsDesign + ' need a system design first</div></div>' +
  '</div>' +

  '<div class="callout warn"><div class="callout-h">Read the blocked count before anything else</div>' +
  '<p>A first Refine pass is supposed to leave most of the backlog blocked. The gate is not a formality: it asks for linked requirements, dated dependencies, a resolved architecture position and available design. What is genuinely known is recorded; what is not is a named failure rather than an assumption. Only Wave 1 work is Ready, which is exactly where delivery should start.</p></div>' +

  '<h2 class="sec">Why stories are blocked</h2>' +
  '<div class="tbl-wrap"><table><thead><tr><th>Ready Gate condition that failed</th><th>Stories</th><th>What clears it</th></tr></thead><tbody>' +
  blockers.map(b => {
    const clear = {
      'Are dependencies understood?':'Schedule a wave. Dependencies are identified with owners; the model also asks for dates, and dates come from sequencing.',
      'Is design available where needed?':'Design the new surface — empty, error and stale states — for whiteboard, mind map, gantt, map, workload and presentation surfaces.',
      'Is architecture impact resolved?':'Write the system design or ADR for the area the impact check flagged.',
      'Is the Story small enough?':'Re-slice: the story carries more than six tasks or more than four criteria.',
      'Are Acceptance Criteria defined?':'Write at least two observable criteria covering failure as well as success.'
    }[b] || 'Address the condition and re-run the gate.';
    return '<tr><td><strong>' + esc(b) + '</strong></td><td class="mono">' + REFINE.byBlocker[b] + '</td><td>' + esc(clear) + '</td></tr>';
  }).join('') + '</tbody></table></div>' +

  '<h2 class="sec">Sequencing waves</h2>' +
  '<p style="color:var(--ink-2);max-width:74ch">Waves are an <em>ordering</em> derived from the module dependencies in the architecture baseline — not dates. The Ready Gate asks for dependency dates, which is why everything after Wave 1 is blocked on that condition until a wave is scheduled.</p>' +
  '<div class="tbl-wrap"><table><thead><tr><th>Wave</th><th>Modules</th><th>Stories</th><th>Ready</th></tr></thead><tbody>' +
  waves.map(w => {
    const mods = ARCH.modules.filter(m => FEATURES.some(f => moduleOf(f).id === m.id && String(waveOf(storiesFor(f)[0])) === w))
      .map(m => m.n).join(' · ');
    const rb = readyByWave[w] || {r:0, n:0};
    return '<tr><td><span class="wv w' + w + '">' + esc(WAVE_LABEL[w]) + '</span></td><td>' + esc(mods || '—') + '</td>' +
      '<td class="mono">' + rb.n + '</td><td class="mono">' + rb.r + '</td></tr>';
  }).join('') + '</tbody></table></div>' +

  '<h2 class="sec">What Refine produced per story</h2>' +
  '<div class="two">' +
    '<div class="panel"><div class="panel-h">Supplied by refinement</div><div class="panel-b"><ul class="bl">' +
      '<li><strong>Requirements</strong> — functional, quality attribute and constraint, linked per feature and traced to the driver or ADR that produced them</li>' +
      '<li><strong>Acceptance criteria</strong> — observable, covering failure, each with a verification approach</li>' +
      '<li><strong>Dependencies</strong> — module and platform prerequisites with a named owner</li>' +
      '<li><strong>Architecture impact</strong> — the handbook’s eight triage questions, answered per story, resolved to an ADR</li>' +
      '<li><strong>Tasks</strong> — MongoDB, Node, React and Next.js work with unambiguous completion</li>' +
    '</ul></div></div>' +
    '<div class="panel"><div class="panel-h">Still required from people</div><div class="panel-b"><ul class="bl">' +
      '<li><strong>Dependency dates</strong> — a scheduled wave, which is a planning decision</li>' +
      '<li><strong>Design</strong> for ' + REFINE.needsDesign + ' stories on surfaces with no existing pattern</li>' +
      '<li><strong>Product judgement</strong> on the duplicate names and the story-shaped features in Backlog hygiene</li>' +
      '<li><strong>The four open questions</strong> in the architecture baseline</li>' +
    '</ul></div></div>' +
  '</div>' +

  '<h2 class="sec">Cross-cutting concerns became work</h2>' +
  '<p style="color:var(--ink-2);max-width:78ch">Thirteen lenses were applied to the architecture, and each one that ' +
  'applies to a Story now carries a standing obligation on it. Six of them add a testable acceptance criterion; three ' +
  'add a Task with its own implementation steps. That is ' + lensExtra[1].toLocaleString() + ' criteria and ' +
  lensExtra[0].toLocaleString() + ' tasks that would otherwise have been discovered after release.</p>' +
  '<div class="tbl-wrap"><table><thead><tr><th>Lens</th><th>Verdict</th><th>Stories</th><th>Adds a criterion</th>' +
  '<th>Adds a task</th></tr></thead><tbody>' +
  lensRoll().map(x => '<tr><td><strong>' + esc(x.lens.n) + '</strong></td>' +
    '<td><span class="pill ' + LENS_STATE[x.lens.status][0] + '">' + esc(LENS_STATE[x.lens.status][1]) + '</span></td>' +
    '<td class="mono">' + x.stories.toLocaleString() + '</td>' +
    '<td class="mono">' + (x.ac ? x.ac.toLocaleString() : '—') + '</td>' +
    '<td class="mono">' + (x.tasks ? x.tasks.toLocaleString() : '—') + '</td></tr>').join('') +
  '</tbody></table></div>' +
  '<p style="color:var(--ink-2);max-width:78ch">Five lenses are carrying a gap, and every one of them is a gap of ' +
  'evidence rather than design — see <button class="hit" data-lensjump="accessibility">Lenses</button>.</p>' +

  '<h2 class="sec">Architecture changed during refinement</h2>' +
  '<p style="color:var(--ink-2);max-width:74ch">The handbook’s loop says a change is assessed for architectural impact, and the baseline is updated when it has one. Refining the backlog raised six decisions that the baseline did not contain — each one discovered because a story’s acceptance criteria had no home in the architecture as it stood.</p>' +
  '<div class="tbl-wrap"><table><thead><tr><th>Decision</th><th>Raised by</th></tr></thead><tbody>' +
  ADRS.filter(a => a.origin === 'refine').map(a => '<tr><td><button class="hit" data-adr="' + a.id + '">' +
    esc(a.id) + ' — ' + esc(a.t) + '</button></td><td>' + esc(a.raisedBy) + '</td></tr>').join('') +
  '</tbody></table></div>' +
  '<div class="callout model"><div class="callout-h">Baseline v1.0 → v' + ARCH.version + '</div>' +
  '<p>Six decisions added, the ownership table extended with derived stores, and two standards introduced (ARC-008 optimistic concurrency, ARC-009 soft-delete exclusion). The container diagram did not change — refinement found no new runtime component, which is itself a useful result for a small team.</p></div>' +
  '</div>';
}

    '<span class="pill green">' + clean.length + ' checks clean</span></div>' +
  '</header>' +
  raised.map(c => '<div class="lint" data-lint="' + c.id + '">' +
    '<button class="lint-h" aria-expanded="false"><span class="lint-badge ' + c.kind + '">' + (c.kind === 'd' ? '⧉' : '?') + '</span>' +

/* ---- layout: bands stacked top to bottom, nodes centred per band ---- */
function mapLayout(level){
  mapNodes();
  const NW = 168, NH = 50, MW = 128, MH = 34, GAP = 18, BAND_PAD = 34;
  const visible = MAP_NODES.filter(n => n.lvl <= level && (n.lvlMax === undefined || level <= n.lvlMax));
  const bands = [];
  MAP_BAND_ORDER.forEach(b => {
    const ns = visible.filter(n => n.band === b);
    if(ns.length) bands.push({id:b, nodes:ns});
  });
  /* wrap wide bands */
  const perRow = b => b.id === 'domain' ? 7 : b.id === 'people' ? 5 : 4;
  let maxW = 0;
  bands.forEach(b => {
    const w = b.id === 'domain' ? MW : NW;
    const rows = [];
    for(let i = 0; i < b.nodes.length; i += perRow(b)) rows.push(b.nodes.slice(i, i + perRow(b)));
    b.rows = rows;
    maxW = Math.max(maxW, Math.max.apply(null, rows.map(r => r.length * (w + GAP) - GAP)));
  });
  const W = Math.max(maxW + 120, 900);
  let y = BAND_PAD;
  bands.forEach(b => {
    const w = b.id === 'domain' ? MW : NW, h = b.id === 'domain' ? MH : NH;
    b.y0 = y - 20;
    b.rows.forEach(row => {
      const rowW = row.length * (w + GAP) - GAP;
      let x = (W - rowW) / 2;
      row.forEach(n => { n._x = x; n._y = y; n._w = w; n._h = h; x += w + GAP; });
      y += h + 14;
    });
    y += BAND_PAD;
    b.y1 = y - BAND_PAD + 4;
    b.x0 = 24; b.x1 = W - 24;
  });
  return {W:W, H:y, bands:bands, visible:visible};
}
/* an edge endpoint that is not visible resolves to its nearest visible ancestor */
function mapResolve(id, level){
  let n = MAP_BY_ID[id];
  while(n && (n.lvl > level || (n.lvlMax !== undefined && level > n.lvlMax))){
    n = n.parent ? MAP_BY_ID[n.parent] : null;
  }
  return n;
}
function systemMapSVG(){

      '<text class="mband-l" x="' + (b.x0 + 12) + '" y="' + (b.y0 + 15) + '">' + esc(MAP_BAND_LABEL[b.id]) + '</text>';
  });
  const seen = {};
  MAP_EDGES.forEach(e => {
    if(e[2] === 'mod' && level < 3) return;
    const a = mapResolve(e[0], level), b = mapResolve(e[1], level);
    if(!a || !b || a === b) return;
    const key = a.id + '>' + b.id + (e[2] === 'async' ? 'a' : '');
    if(seen[key]) return; seen[key] = 1;
    const ax = a._x + a._w / 2, ay = a._y + a._h, bx = b._x + b._w / 2, by = b._y;
    const d = (by > ay)
      ? 'M' + ax + ',' + ay + ' C' + ax + ',' + (ay + 26) + ' ' + bx + ',' + (by - 26) + ' ' + bx + ',' + (by - 6)
      : 'M' + (a._x + a._w / 2) + ',' + a._y + ' C' + ax + ',' + (a._y - 26) + ' ' + bx + ',' + (b._y + b._h + 26) +
        ' ' + bx + ',' + (b._y + b._h + 6);
    g += '<path class="medge' + (e[2] === 'async' ? ' async' : '') + (e[2] === 'mod' ? ' mod' : '') +
      '" data-a="' + a.id + '" data-b="' + b.id + '" d="' + d + '"/>';
    const proto = MAP_PROTO[a.id + '>' + b.id];
    if(proto && level >= 1 && e[2] !== 'mod'){
      g += '<text class="mproto" x="' + ((ax + bx) / 2) + '" y="' + ((ay + by) / 2 + 3) + '" text-anchor="middle">' +
        esc(proto) + '</text>';

  L.visible.forEach(n => {

        (n._x + n._w) + ',' + (n._y + ry) + ' L' + (n._x + n._w) + ',' + (n._y + n._h - ry) + ' A' + (n._w / 2) + ',' +
        ry + ' 0 0 1 ' + n._x + ',' + (n._y + n._h - ry) + ' Z"/>';
    } else shape = '<rect class="mshape" x="' + n._x + '" y="' + n._y + '" width="' + n._w +
      '" height="' + n._h + '" rx="' + (n.kind === 'mod' ? 6 : 9) + '"/>';
    g += '<g class="' + cls + '" data-m="' + n.id + '" tabindex="0" role="button" aria-label="' + esc(n.label) + '">' +
      shape +
      '<text class="mlabel' + (n.kind === 'mod' ? ' small' : '') + '" x="' + cx + '" y="' +
        (n._y + n._h / 2 + (n.sub ? -2 : 4)) + '" text-anchor="middle">' + esc(n.label) + '</text>' +
      (n.sub ? '<text class="msub" x="' + cx + '" y="' + (n._y + n._h / 2 + 12) + '" text-anchor="middle">' +
        esc(n.sub) + '</text>' : '') +
      (n.kind === 'mod' && n.stories ? '<text class="mcount" x="' + (n._x + n._w - 7) + '" y="' + (n._y + 12) +

function wireSystemMap(root){
  const stage = $('[data-stage]', root);
  if(!stage) return;
  const apply = () => {
    const g = $('[data-zoom]', stage);
    if(g) g.setAttribute('transform', 'translate(' + MAP_STATE.tx + ',' + MAP_STATE.ty + ') scale(' + MAP_STATE.scale + ')');
  };
  const redraw = () => {
    stage.innerHTML = systemMapSVG();
    bind();
    apply();
    const cr = $('[data-crumb]', root);
    if(cr) cr.innerHTML = MAP_STATE.focus
      ? 'Focused: <b>' + esc((MAP_BY_ID[MAP_STATE.focus] || {}).label || '') + '</b> <button class="hit" data-clear>clear</button>'
      : '';
    const clear = $('[data-clear]', root);
    if(clear) clear.onclick = () => { MAP_STATE.focus = null; MAP_STATE.scale = 1; MAP_STATE.tx = MAP_STATE.ty = 0; redraw(); };
  };
  function focusNode(id){
    const n = MAP_BY_ID[id];
    if(!n || n._x === undefined) return;
    const svg = $('svg', stage);
    const W = +svg.dataset.w, H = +svg.dataset.h;
    const pad = 220;
    const s = Math.min(3, Math.max(1, Math.min(W / (n._w + pad), H / (n._h + pad * 0.6))));
    MAP_STATE.scale = s;
    MAP_STATE.tx = W / 2 - (n._x + n._w / 2) * s;
    MAP_STATE.ty = H / 2 - (n._y + n._h / 2) * s;
    MAP_STATE.focus = id;
    apply();
  }
  function bind(){
    $$('.mnode', stage).forEach(el => {
      const id = el.dataset.m;
      el.addEventListener('click', e => {
        e.stopPropagation();
        highlight(id);
        openMapNode(id);
      });
      el.addEventListener('dblclick', e => {
        e.stopPropagation();
        const n = MAP_BY_ID[id];
        const hasChildren = MAP_NODES.some(x => x.parent === id);
        if(hasChildren && MAP_STATE.level < 3){ MAP_STATE.level = Math.min(3, MAP_STATE.level + 1); redraw(); }
        focusNode(id);
        $$('[data-lvl]', root).forEach(b => b.classList.toggle('on', +b.dataset.lvl === MAP_STATE.level));
      });
      el.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); highlight(id); openMapNode(id); }
      });
    });
  }
  function highlight(id){
    const rel = {};
    MAP_EDGES.forEach(e => {
      const a = mapResolve(e[0], MAP_STATE.level), b = mapResolve(e[1], MAP_STATE.level);
      if(!a || !b) return;
      if(a.id === id) rel[b.id] = 1;
      if(b.id === id) rel[a.id] = 1;
    });
    $$('.mnode', stage).forEach(x => {
      const on = x.dataset.m === id;
      x.classList.toggle('on', on);
      x.classList.toggle('dim', !on && !rel[x.dataset.m]);
    });
    $$('.medge', stage).forEach(p => {
      const hot = p.dataset.a === id || p.dataset.b === id;
      p.classList.toggle('hot', hot); p.classList.toggle('dim', !hot);
    });
  }

    if(e.target.closest('.mnode')) return;
    drag = {x:e.clientX - MAP_STATE.tx, y:e.clientY - MAP_STATE.ty};
    stage.classList.add('grabbing');
    if(stage.setPointerCapture) stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if(!drag) return;
    MAP_STATE.tx = e.clientX - drag.x; MAP_STATE.ty = e.clientY - drag.y; apply();
  });
  const endDrag = () => { drag = null; stage.classList.remove('grabbing'); };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('click', e => {
    if(e.target.closest('.mnode')) return;
    $$('.mnode', stage).forEach(x => x.classList.remove('on', 'dim'));
    $$('.medge', stage).forEach(x => x.classList.remove('hot', 'dim'));
  });
  /* flow overlay: light up the path this flow takes, in order */
  function applyFlow(){
    const path = MAP_STATE.flow ? (MAP_FLOWS[MAP_STATE.flow] || []) : null;
    $$('.fseq', stage).forEach(x => x.remove());
    if(!path){
      $$('.mnode', stage).forEach(x => x.classList.remove('dim', 'inflow'));
      $$('.medge', stage).forEach(x => x.classList.remove('dim', 'hot'));
      return;
    }
    const resolved = path.map(id => (mapResolve(id, MAP_STATE.level) || {}).id).filter(Boolean);
    const set = {}; resolved.forEach((id, i) => { if(set[id] === undefined) set[id] = i + 1; });
    $$('.mnode', stage).forEach(x => {
      const n = set[x.dataset.m];
      x.classList.toggle('inflow', n !== undefined);
      x.classList.toggle('dim', n === undefined);
      if(n !== undefined){
        const node = MAP_BY_ID[x.dataset.m];
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('class', 'fseq');
        t.setAttribute('x', node._x + 10); t.setAttribute('y', node._y + 14);
        t.textContent = n;
        x.appendChild(t);
      }
    });
    $$('.medge', stage).forEach(p => {
      let on = false;
      for(let i = 0; i < resolved.length - 1; i++){
        if((p.dataset.a === resolved[i] && p.dataset.b === resolved[i + 1]) ||
           (p.dataset.b === resolved[i] && p.dataset.a === resolved[i + 1])) on = true;
      }
      p.classList.toggle('hot', on); p.classList.toggle('dim', !on);
    });
  }
  $$('[data-flow]', root).forEach(b => b.onclick = () => {
    MAP_STATE.flow = b.dataset.flow || null;
    $$('[data-flow]', root).forEach(x => x.classList.toggle('on', x === b));
    applyFlow();
    const fl = ARCH.flows.filter(f => f.id === MAP_STATE.flow)[0];
    const lg = $('.legend .lg:last-child', root);
    if(lg) lg.textContent = fl ? fl.n : MAP_LEVELS[MAP_STATE.level].hint;
  });

  /* controls */
  $$('[data-lvl]', root).forEach(b => b.onclick = () => {
    MAP_STATE.level = +b.dataset.lvl; MAP_STATE.focus = null;
    MAP_STATE.scale = 1; MAP_STATE.tx = MAP_STATE.ty = 0;
    $$('[data-lvl]', root).forEach(x => x.classList.toggle('on', x === b));
    redraw();
    applyFlow();
    const lg = $('.legend .lg:last-child', root);
    if(lg) lg.textContent = MAP_LEVELS[MAP_STATE.level].hint;
  });
  $('[data-zoom-in]', root).onclick = () => { MAP_STATE.scale = Math.min(4, MAP_STATE.scale * 1.3); apply(); };
  $('[data-zoom-out]', root).onclick = () => { MAP_STATE.scale = Math.max(0.5, MAP_STATE.scale / 1.3); apply(); };
  $('[data-zoom-fit]', root).onclick = () => {
    MAP_STATE.scale = 1; MAP_STATE.tx = MAP_STATE.ty = 0; MAP_STATE.focus = null; apply();
  };
  bind(); apply();
}

  const done = us.filter(u => TICKS.get(u.id)).length;
  const L = LEVELS.filter(l => l.id === 'task')[0];
  markSelected('t-' + id);
  const adrs = impactFor(s).adrs;
  const stds = STANDARDS.filter(x => adrs.indexOf(x.adr) > -1).slice(0, 4);

  openModal(
  '<div class="bm-head">' +
    '<div class="bm-path">' + esc(f.id) + ' ' + esc(f.name) + ' › ' +
      '<button class="hit" data-jump="s-' + s.id + '">' + esc(s.id) + '</button> › <b>' + esc(t.id) + '</b></div>' +
    '<h2 class="bm-title">' + esc(t.title) + '</h2>' +
    '<div class="bm-meta">' +
      '<span class="pill' + (TICKS.get(t.id) ? ' green' : '') + '">' + (TICKS.get(t.id) ? 'Done' : 'Planned') + '</span>' +
      '<span class="pill blue">' + esc(t.module.n) + '</span>' +
      '<span class="pill">' + esc(teamOf(t.module)) + '</span>' +
      '<span class="pill">' + esc(t.kind) + '</span>' +
      (t.lens ? '<span class="pill amber">asked for by the ' + esc(LENS_BY_ID[t.lens].n) + ' lens</span>' : '') +
      '<span class="pill">' + us.length + ' steps</span>' +
      '<span class="pill blue">' + casesForTask(t).length + ' test cases</span>' +
    '</div>' +
    '<button class="icon-btn bm-close" data-closebig aria-label="Close">✕</button>' +
  '</div>' +
  '<div class="bm-body">' +

  '<section class="bm-sec"><h3>Done when</h3><p class="bm-lede">' + esc(t.done) + '</p>' +
    '<div class="bm-kv"><div><dt>Level</dt><dd>' + esc(L.purpose) + '</dd></div>' +
    '<div><dt>Rule</dt><dd>A task has no acceptance criteria of its own — those belong to the story.</dd></div></div>' +
  '</section>' +

  '<section class="bm-sec"><h3>Implementation steps ' + progressBar(done, us.length) + '</h3>' +

    '<ol class="steplist">' + us.map((u, i) => '<li>' +
      checkRow(u.id, esc(u.title), '', '<span class="stepn">' + (i + 1) + '</span>') + '</li>').join('') + '</ol>' +
    '<div class="bm-actions"><button class="btn sm" data-check="' + t.id + '">' +
      (TICKS.get(t.id) ? '✓ Task marked done' : 'Mark the task done') + '</button>' +
      '<button class="btn sm sec" data-allsteps="' + t.id + '">Tick every step</button></div>' +
  '</section>' +

  '<section class="bm-sec"><h3>The story it serves</h3>' +
    '<div class="slice"><button class="hit" data-openstory="' + s.id + '" style="width:100%;text-align:left">' +
      '<span class="mono">' + esc(s.id) + '</span> ' + esc(s.title) + '</button>' +
      '<div class="slice-p">' + esc(patternName(s.pattern)) + ' · ' +
      (readyGateFor(s).ready ? 'Ready' : 'blocked: ' + esc(readyGateFor(s).blockers[0])) + '</div></div>' +
    '<p class="bm-note">The acceptance criteria this work has to satisfy live on the story:</p>' +
    '<ol class="acl">' + s.ac.map(a => '<li>' + esc(a) + '</li>').join('') + '</ol>' +

  '<section class="bm-sec"><h3>Test cases this task must satisfy <span class="bm-n">' + tcs.length + '</span></h3>' +
    (tcs.length

        'Tick one when its execution is recorded against the story.</p>' +
        tcs.map((c, i) => checkRow('tcase:' + t.id + ':' + i,
          '<span class="mono">' + esc(c.id) + '</span> ' + esc(c.title),
          '<span class="vmethod">' + esc((TEST_LEVELS.filter(x => x.id === c.level)[0] || {n:c.level}).n) + '</span> ' +

  (adrs.length || stds.length ? '<section class="bm-sec"><h3>Constraints on how this is built</h3>' +
    (adrs.length ? '<p>' + adrs.map(a => '<button class="hit" data-adr="' + esc(a) + '">' + esc(a) + '</button>').join(' ') + '</p>' : '') +

    '<button class="btn sm sec" data-resetchecks="' + id + '">Reset ticks</button>' +
    '<span class="bm-localnote">Ticks are stored in this browser only</span>' +
    '<span style="margin-left:auto" class="mono">' + esc(t.id) + '</span>' +
  '</div>', false);
  wireBigModal(() => openTask(id));
}

function wireBigModal(repaint){
  $$('[data-golens]').forEach(b => b.onclick = () => { closeBigModal(); location.hash = '#/lenses'; });
  $$('[data-goplan]').forEach(b => b.onclick = () => { closeBigModal(); PLAN_SEC = 'sprints'; location.hash = '#/plan'; });
  $$('[data-gotests]').forEach(b => b.onclick = () => {
    const sid = $('#bigModal .bm-foot .mono');
    TC_FILTER.q = sid ? sid.textContent.trim() : '';
    TC_FILTER.release = ''; TC_FILTER.level = '';
    TEST_SEC = 'cases';
    closeBigModal();
    location.hash = '#/tests';
  });
  const root = $('#bigModal');
  $$('[data-closebig]', root).forEach(b => b.onclick = closeBigModal);
  $$('[data-opentask]', root).forEach(b => b.onclick = e => { e.stopPropagation(); openTask(b.dataset.opentask); });
  $$('[data-openstory]', root).forEach(b => b.onclick = e => { e.stopPropagation(); openStory(b.dataset.openstory); });
  $$('[data-check]', root).forEach(b => b.onclick = e => {
    e.stopPropagation();
    TICKS.toggle(b.dataset.check);
    repaint();
  });
  $$('[data-tkmore]', root).forEach(b => b.onclick = () => {
    const box = b.closest('.tk');
    const open = box.classList.toggle('open');
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
    b.textContent = open ? 'steps ▴' : 'steps ▾';
  });
  $$('[data-allsteps]', root).forEach(b => b.onclick = () => {
    const t = taskById(b.dataset.allsteps);
    const us = subtasksFor(t);
    const all = us.every(u => TICKS.get(u.id));
    us.forEach(u => TICKS.set(u.id, !all));
    repaint();
  });
  $$('[data-resetchecks]', root).forEach(b => b.onclick = () => {
    const pfx = b.dataset.resetchecks;
    /* Through the setter, one key at a time, so each removal is an
       operation the rest of the team receives. Deleting straight out of
       the data object leaves everyone else holding ticks this person has
       already cleared, and nothing ever puts that right. */
    Object.keys(TICKS.data).filter(k => k.indexOf(pfx) === 0).forEach(k => TICKS.set(k, false));
    repaint();
    toast('Ticks cleared for ' + pfx);
  });
  $$('[data-adr]', root).forEach(b => b.onclick = () => { closeBigModal(); openADR(b.dataset.adr); });
  $$('[data-sd]', root).forEach(b => b.onclick = () => {
    closeBigModal(); ARCH_SEC = 'designs'; location.hash = '#/architecture';
  });
  $$('[data-copy]', root).forEach(b => b.onclick = () => {
    const parts = b.dataset.copy.split(':');
    if(parts[0] === 'story') copyText(storyMarkdown(storyById(parts[1])), 'Story copied');
  });
  $$('[data-jump]', root).forEach(b => b.onclick = () => {
    const id = b.dataset.jump;
    closeBigModal();
    goList(() => {
      revealRow(id);
      const k = id.charAt(0), n = id.slice(2);
      if(k === 'f') openFeature(n); else if(k === 'e') openEpic(n);
      else if(k === 's') openStory(n); else if(k === 't') openTask(n);
    });
  });
}

/* markdown export for the lens record */
function lensesMarkdown(){
  const roll = lensRoll();
  let out = '# Squid — architecture lenses\n\n';
  out += 'A view is a dimension of the architecture. A lens is the perspective used to interrogate it.\n\n';
  out += '| Lens | Verdict | Owner | Stories | Extra AC | Tasks | Gap |\n|---|---|---|---|---|---|---|\n';
  roll.forEach(r => {
    out += '| ' + r.lens.n + ' | ' + LENS_STATE[r.lens.status][1] + ' | ' + r.lens.owner + ' | ' + r.stories +
      ' | ' + (r.ac || '—') + ' | ' + (r.tasks || '—') + ' | ' + (r.lens.gaps || '—') + ' |\n';
  });
  out += '\n';
  SQ_LENSES.forEach(l => {
    out += '## ' + l.n + '\n\n' + l.focus + '\n\n';
    out += '**Asks.**\n' + l.asks.map(q => '- ' + q).join('\n') + '\n\n';
    out += '**Found.** ' + l.found + '\n\n';
    out += '**Evidence.** ' + l.evidence + '\n\n';
    if(l.gaps) out += '**Gap.** ' + l.gaps + '\n\n';
    out += '**Standing obligation on delivery work.** ' + l.oblig + '\n\n';
    out += '**Verified by.** ' + l.verify + '\n\n';
  });
  out += '## Architecture views\n\n| View | Question | Depth | Has | Missing |\n|---|---|---|---|---|\n';
  SQ_VIEWS.forEach(v => { out += '| ' + v.n + ' | ' + v.q + ' | ' + v.depth + ' | ' + v.has + ' | ' + (v.missing || '—') + ' |\n'; });
  out += '\n## Patterns\n\n| Pattern | Status | Why here | Cost | Risk | Abandon when |\n|---|---|---|---|---|---|\n';
  SQ_PATTERNS.forEach(p => {
    out += '| ' + p.n + ' | ' + p.use + ' | ' + p.why + ' | ' + p.cost + ' | ' + p.risk + ' | ' + p.drop + ' |\n';
  });
  return out;
}

  '</div>';

function timelineHTML(){
  const sp = sprintsCached();
  const start = sp[0].start, w1end = sp[sp.length - 1].end;
  const span = Math.max(1, daysBetween(start, w1end));
  const pct = d => Math.max(0, Math.min(100, daysBetween(start, d) / span * 100));

  const ticks = [];
  let cur = start.slice(0, 8) + '01';
  while(daysBetween(cur, w1end) > 0){
    if(daysBetween(start, cur) >= 0) ticks.push(cur);
    const d = new Date(cur + 'T00:00:00Z');
    d.setUTCMonth(d.getUTCMonth() + 1);
    cur = d.toISOString().slice(0, 10);
  }

  const relBars = RELEASES.map(r => {
    const w = releaseWindow(r);
    if(!w) return '';
    return '<button class="tlb ' + (r.audience === 'internal' ? 'int' : 'ext') + '" data-gorel="' + r.id + '" ' +
      'style="left:' + pct(w.from).toFixed(2) + '%;width:' + Math.max(4, pct(w.to) - pct(w.from)).toFixed(2) + '%" ' +
      'title="' + esc(r.id + ' ' + r.n + ' · ' + DATE_FMT(w.from) + ' → ' + DATE_FMT(w.to)) + '">' +
      '<span>' + esc(r.id) + '</span></button>';
  }).join('');

  const sprintTicks = sp.map(s =>
    '<span class="tls' + (s.committed ? ' c' : '') + '" style="left:' + pct(s.start).toFixed(2) + '%;width:' +
    Math.max(3, pct(s.end) - pct(s.start)).toFixed(2) + '%" title="' +
    esc('Sprint ' + s.n + ' · ' + DATE_FMT(s.start) + ' → ' + DATE_FMT(s.end)) + '">S' + s.n + '</span>').join('');

  const ms = milestones().filter(m => daysBetween(start, m.d) >= 0 && daysBetween(m.d, w1end) >= 0);
  const msMarks = ms.map(m => '<span class="tlm ' + m.conf + '" style="left:' + pct(m.d).toFixed(2) + '%" ' +
    'title="' + esc(m.n + ' · ' + DATE_FMT(m.d)) + '"><i></i><em>' + esc(m.k) + '</em></span>').join('');

  const later = ROADMAP.filter(r => !r.ready);

  return '<div class="tlwrap">' +
    '<div class="tl-legend">' +
      '<span><i class="k int"></i>internal release</span>' +
      '<span><i class="k ext"></i>external release</span>' +
      '<span><i class="k ms"></i>milestone</span>' +
      '<span><i class="k sp"></i>committed sprint</span>' +
      '<span><i class="k nd"></i>ordered, no dates</span>' +
    '</div>' +
    '<div class="tlgrid">' +
      '<div class="tl-rowlab">Months</div>' +
      '<div class="tl-track months">' + ticks.map(t =>
        '<span class="tlt" style="left:' + pct(t).toFixed(2) + '%">' + MONTHS[+t.slice(5, 7) - 1] + ' ’' + t.slice(2, 4) + '</span>').join('') + '</div>' +
      '<div class="tl-rowlab">Sprints</div>' +
      '<div class="tl-track sprints">' + sprintTicks + '</div>' +
      '<div class="tl-rowlab">Wave 1 — Foundation</div>' +
      '<div class="tl-track bars"><span class="tlwave"></span>' + relBars + '</div>' +
      '<div class="tl-rowlab">Milestones</div>' +
      '<div class="tl-track marks">' + msMarks + '</div>' +
    '</div>' +
    '<div class="tl-after"><div class="tl-afterh">After Wave 1 — ordered, not dated</div>' +
      '<div class="tl-seq">' + later.map((r, i) =>
        '<div class="tl-sq"><b>W' + r.w + ' ' + esc(r.n) + '</b><span>' + esc(r.entry) + '</span></div>' +
        (i < later.length - 1 ? '<span class="tl-sa">→</span>' : '')).join('') + '</div>' +
      '<p class="tl-note">These blocks have no width in time. A wave gets dates when its stories pass the Ready Gate — ' +
      'the same rule that produced the dated part above, not a lower standard for the part that is further away.</p>' +
    '</div>' +
  '</div>';
}

function nowNextLater(){
  const sp = sprintsCached();
  const now = sp.filter(s => s.committed);
  const nowRel = [...new Set(now.reduce((a, s) => a.concat(s.releases), []))];
  const next = sp.filter(s => !s.committed);
  const nextRel = [...new Set(next.reduce((a, s) => a.concat(s.releases), []))].filter(r => nowRel.indexOf(r) < 0);
  const card = (cls, h, sub, items, foot) =>
    '<div class="nnl-c ' + cls + '"><div class="nnl-h">' + h + '<span>' + sub + '</span></div>' +
    '<ul>' + items + '<li class="nnl-m">' + foot + '</li></ul></div>';
  return '<div class="nnl">' +
    card('now', 'Now', 'sprints 1–3, committed',
      nowRel.map(r => { const x = releaseById(r); return '<li><b>' + esc(x.id) + '</b> ' + esc(x.n) + '</li>'; }).join(''),
      now.reduce((a, s) => a + s.stories.length, 0) + ' stories · ' + now.reduce((a, s) => a + s.pts, 0) + ' points') +
    card('next', 'Next', 'rest of Wave 1, forecast',
      nextRel.map(r => { const x = releaseById(r); return '<li><b>' + esc(x.id) + '</b> ' + esc(x.n) + '</li>'; }).join(''),
      next.reduce((a, s) => a + s.stories.length, 0) + ' stories · ' + next.reduce((a, s) => a + s.pts, 0) + ' points') +
    card('later', 'Later', 'ordered, not dated',
      ROADMAP.filter(r => !r.ready).map(r => '<li><b>W' + r.w + '</b> ' + esc(r.n) + '</li>').join(''),
      'refinement not yet run') +
  '</div>';
}

   '<div class="tbl-wrap"><table><thead><tr><th>Not planned</th><th>Why, and what would change it</th></tr></thead><tbody>' +
   NOT_ON_ROADMAP.map(x => '<tr><td><strong>' + esc(x[0]) + '</strong></td><td>' + esc(x[1]) + '</td></tr>').join('') +

 }

 /* ---------------- releases: a list with columns ---------------- */
 if(id === 'releases'){
   const rows = RELEASES.map(r => {
     const st = readyStories().filter(x => releaseOf(x) === r.id);
     const w = releaseWindow(r);
     const cs = st.reduce((a, x) => a + testCasesFor(x).length, 0);

       '<div class="cell mono">' + esc(r.epics.join(' · ')) + '</div>' +
       '<div class="cell c-num">' + st.length + '</div>' +
       '<div class="cell c-num">' + st.reduce((a, x) => a + pointsFor(x), 0) + '</div>' +
       '<div class="cell c-num">' + st.reduce((a, x) => a + tasksFor(x).length, 0) + '</div>' +
       '<div class="cell c-num">' + cs + '</div>' +
       '<div class="cell"><span class="gbar"><span style="width:' + (ticked / RELEASE_GATE.length * 100) + '%"></span></span>' +
         '<span class="mono"> ' + ticked + '/' + RELEASE_GATE.length + '</span></div>' +
