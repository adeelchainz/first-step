.rc b{display:block; font-size:16px; color:var(--ink); font-weight:650; line-height:1.15}
.relst{border:1px solid var(--line-2); border-radius:8px; overflow:hidden}
.relst-r{display:flex; align-items:center; gap:10px; padding:7px 12px; border-bottom:1px solid var(--line-2);
  font-size:13px}
.relst-r:last-child{border-bottom:none}
.relst-r .mono{margin-left:auto; font-size:10.5px; color:var(--ink-4); white-space:nowrap}

/* vertical slice strip */
.vslice{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:14px 0}
.vs{font-size:12.4px; color:var(--ink-2); background:var(--panel); border:1px solid var(--line);
  border-radius:6px; padding:6px 10px}
.vslice i{color:var(--line-3); font-style:normal; font-family:var(--font-mono)}

@media (max-width:900px){
  .tlgrid{grid-template-columns:1fr; gap:4px}
  .tl-rowlab{text-align:left}
}

/* ================= sprints tab ================= */
/* --- avatars --- */
.av{flex:none; display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%;
  font-family:var(--font-mono); font-size:8.5px; font-weight:600; letter-spacing:0; color:var(--blue);
  background:var(--blue-bg); border:1px solid var(--blue-line)}
.av.none{color:var(--ink-4); background:var(--bg-sunk); border-color:var(--line-2); font-size:11px}

/* --- sprint picker --- */
.sppick{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin:12px 0 22px}
.spchip{display:block; text-align:left; border:1px solid var(--line); border-radius:9px; background:var(--panel);
  padding:10px 12px; color:var(--ink-3)}
.spchip:hover{border-color:var(--line-3); background:var(--bg-sunk)}
.spchip b{display:block; font-size:13.6px; font-weight:620; color:var(--ink)}
.spchip span{display:block; margin-top:2px; font-family:var(--font-mono); font-size:10px; color:var(--ink-4)}
.spchip i{display:block; margin-top:5px; font-style:normal; font-family:var(--font-mono); font-size:10px; color:var(--ink-3)}
.spchip u{display:inline-block; margin-top:6px; text-decoration:none; font-family:var(--font-mono); font-size:8.5px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--green); background:var(--green-bg);
  border:1px solid var(--green-line); border-radius:4px; padding:1px 6px}
.spchip.fc u{color:var(--ink-4); background:var(--bg-sunk); border-color:var(--line-2)}
.spchip.on{border-color:var(--blue); background:var(--blue-bg); box-shadow:0 0 0 1px var(--blue-line) inset}
.spchip.on b{color:var(--blue)}

/* --- the sprint header --- */
.sphead{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:18px; border:1px solid var(--line);
  border-radius:11px; background:var(--panel); padding:18px 20px; margin:0 0 16px}
.sphead-n{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--blue)}
.sphead-g{font-family:var(--font-serif); font-size:22px; font-weight:600; letter-spacing:-.015em; margin:6px 0 4px; color:var(--ink)}
.sphead-d{margin:0 0 12px; font-size:13.4px; color:var(--ink-3)}
.sphead-r{display:flex; flex-wrap:wrap; gap:7px; align-items:center}
.sphead-t{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; align-content:start}
.sptile{border:1px solid var(--line-2); border-radius:8px; background:var(--panel-2); padding:9px 11px}
.sptile b{display:block; font-family:var(--font-mono); font-size:18px; font-weight:600; color:var(--ink); line-height:1.1}
.sptile span{display:block; margin-top:2px; font-size:11px; color:var(--ink-4)}

/* --- the five stages as a strip --- */
.spflow{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:8px; margin:0 0 10px}
.spf{position:relative; text-align:left; border:1px solid var(--line); border-left-width:3px; border-radius:9px;
  background:var(--panel); padding:11px 13px; color:var(--ink-3)}
.spf:hover{background:var(--bg-sunk)}
.spf.on{background:var(--blue-bg); border-color:var(--blue); border-left-color:var(--blue)}
.spf-n{display:block; font-size:14px; font-weight:620; color:var(--ink)}
.spf-c{display:block; margin-top:2px; font-size:11px; color:var(--ink-3)}
.spf-q{display:block; margin-top:7px; font-size:12px; color:var(--ink-4); line-height:1.4}
.spf-g{display:inline-block; margin-top:8px; font-family:var(--font-mono); font-size:8.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--amber); background:var(--amber-bg); border:1px solid var(--amber-line);
  border-radius:4px; padding:1px 6px}
.spf-g.none{color:var(--ink-4); background:var(--bg-sunk); border-color:var(--line-2)}
.spf.tone-blue{border-left-color:var(--blue)}
.spf.tone-amber{border-left-color:var(--amber)}
.spf.tone-purple{border-left-color:var(--purple)}
.spf.tone-green{border-left-color:var(--green)}
.spf.tone-none{border-left-color:var(--line-3)}
.spnote{font-size:13px; color:var(--ink-3); max-width:86ch; margin:0 0 18px; line-height:1.55}

/* --- load per person --- */
.exload{display:grid; grid-template-columns:repeat(auto-fit,minmax(232px,1fr)); gap:8px; margin:12px 0 8px}
.exl{display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:9px;
  background:var(--panel); padding:8px 11px; text-align:left}
.exl:hover{border-color:var(--line-3); background:var(--bg-sunk)}
.exl.on{border-color:var(--blue); background:var(--blue-bg)}
.exl.over{border-color:var(--amber)}
.exl-n{flex:1; min-width:0; font-size:13px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.exl-b{position:relative; flex:none; width:64px; height:7px; border-radius:4px; background:var(--bg-sunk);
  border:1px solid var(--line-2); overflow:hidden}
.exl-b i{position:absolute; inset:0 auto 0 0; background:var(--blue); opacity:.35}
.exl-b u{position:absolute; inset:0 auto 0 0; background:var(--green); text-decoration:none}
.exl.over .exl-b i{background:var(--amber); opacity:.55}
.exl-c{flex:none; font-size:10.5px; color:var(--ink-4)}

/* --- toolbar --- */
.extools{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:18px 0 0}

/* --- the execution list --- */
.exlist{max-height:none; margin-top:12px}
.exlist .lrow .cell{overflow:visible}
.exrow .c-name{gap:6px}
.exrow.done .nm{color:var(--ink-4); text-decoration:line-through}
.exbox{flex:none; width:16px; height:16px; border-radius:4px; border:1.4px solid var(--line-3); background:var(--panel);
  color:transparent; font-size:10px; line-height:1; display:grid; place-items:center}
.exbox:hover{border-color:var(--blue)}
.exbox.on{background:var(--green); border-color:var(--green); color:#fff}
.whosel{display:flex; align-items:center; gap:6px; min-width:0}
.whosel select{flex:1; min-width:0; height:24px; border:1px solid var(--line); border-radius:6px; background:var(--panel);
  color:var(--ink-2); font:inherit; font-size:12px; padding:0 4px}
.whosel select:hover{border-color:var(--blue-line)}
.stgsel{display:flex; align-items:center; gap:5px}
.stgsel select{flex:1; min-width:0; height:24px; border:1px solid var(--line); border-radius:6px; background:var(--panel);
  color:var(--ink-2); font:inherit; font-size:12px; padding:0 4px}
.stgsel i{flex:none; font-style:normal; font-size:9px; color:var(--ink-3)}
.stgsel i.auto{color:var(--ink-4)}
.stgsel.tone-blue select{color:var(--blue); border-color:var(--blue-line); background:var(--blue-bg)}
.stgsel.tone-amber select{color:var(--amber); border-color:var(--amber-line); background:var(--amber-bg)}
.stgsel.tone-purple select{color:var(--purple); border-color:var(--purple-line); background:var(--purple-bg)}
.stgsel.tone-green select{color:var(--green); border-color:var(--green-line); background:var(--green-bg)}
.tkind{margin-left:7px; font-family:var(--font-mono); font-size:9px; color:var(--ink-4)}
.mbar{display:inline-block; width:40px; height:5px; border-radius:3px; background:var(--bg-sunk);
  border:1px solid var(--line-2); overflow:hidden; vertical-align:middle}
.mbar i{display:block; height:100%; background:var(--blue); opacity:.6}
.mbar.full i{background:var(--green); opacity:1}
.mnum{margin-left:6px; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3)}
.pill.sm{font-size:8.5px; padding:2px 7px}

/* --- the board --- */
/* The board is a pane, not a page: bounded height, its own horizontal
   scroll, and columns that scroll inside themselves. Before this the
   horizontal scrollbar sat under the tallest column, which meant
   scrolling the whole page down to reach it. */
.kshell{margin:12px 0 6px}
.kctl{display:flex; align-items:center; gap:10px; margin-bottom:7px}
.kctl-h{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-4)}
.kctl-b{margin-left:auto; display:flex; gap:5px}
.kscroll{width:27px; height:25px; border:1px solid var(--line); border-radius:6px; background:var(--panel);
  color:var(--ink-3); font-size:8px; display:grid; place-items:center}
.kscroll:hover{color:var(--blue); border-color:var(--blue-line); background:var(--blue-bg)}
.kwrap{overflow-x:auto; overflow-y:hidden; overscroll-behavior-x:contain; padding-bottom:4px;
  scroll-snap-type:x proximity; border-radius:10px}
.kwrap:focus-visible{outline:2px solid var(--blue); outline-offset:2px}
.kwrap::-webkit-scrollbar{height:11px}
.kwrap::-webkit-scrollbar-thumb{background:var(--line-3); border-radius:8px; border:3px solid var(--bg)}
.kwrap::-webkit-scrollbar-thumb:hover{background:var(--ink-4)}
.kboard{display:grid; gap:8px; align-items:start; min-width:max-content}
.kband{display:grid; gap:8px; min-width:max-content; margin-bottom:6px}
.kcol{display:flex; flex-direction:column; border:1px solid var(--line); border-top-width:3px;
  border-radius:10px; background:var(--panel-2); min-width:0; scroll-snap-align:start}
.kcol.tone-blue{border-top-color:var(--blue)}
.kcol.tone-amber{border-top-color:var(--amber)}
.kcol.tone-purple{border-top-color:var(--purple)}
.kcol.tone-green{border-top-color:var(--green)}
.kcol.tone-none{border-top-color:var(--line-3)}
.kcol-h{flex:none; display:flex; align-items:baseline; gap:7px; padding:9px 10px 3px}
.kcol-n{font-size:13px; font-weight:640; color:var(--ink); letter-spacing:-.01em}
.kcol-c{margin-left:auto; font-size:10.5px; color:var(--ink-4)}
.kcol-q{flex:none; margin:0 10px 2px; font-size:11px; color:var(--ink-4); line-height:1.35;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.kcol-g{margin:6px 12px 0; font-size:10.5px; color:var(--amber)}
.kcol-g b{font-weight:600}
/* cards scroll inside the column; the header above them does not move */
.kcol-b{flex:1 1 auto; display:grid; gap:7px; align-content:start; padding:8px; min-height:80px;
  max-height:min(52vh,520px); overflow-y:auto; overscroll-behavior:contain}
.kcol-b::-webkit-scrollbar{width:9px}
.kcol-b::-webkit-scrollbar-thumb{background:var(--line-3); border-radius:8px; border:2.5px solid var(--panel-2)}
.kcol-b.over,.kmini.over{background:var(--blue-bg); border-radius:8px; outline:1px dashed var(--blue-line)}
.kempty{font-size:11.5px; color:var(--ink-4); text-align:center; padding:12px 0}
.kcard{border:1px solid var(--line); border-radius:9px; background:var(--panel); padding:9px 10px; cursor:grab}
.kcard:hover{border-color:var(--line-3); box-shadow:0 2px 10px rgba(10,12,16,.06)}
.kcard:focus-visible{outline:2px solid var(--blue); outline-offset:1px}
.kcard.dragging{opacity:.4}
.kcard.blocked{border-left:3px solid var(--amber)}
.kcard-h{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.kpts{margin-left:auto; font-size:10px; color:var(--ink-4)}
.kcard-t{margin-top:7px; font-size:13px; line-height:1.4; color:var(--ink)}
.kcard-f{margin-top:3px; font-size:11px; color:var(--ink-4); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.kcard-m{display:flex; align-items:center; gap:6px; margin-top:9px}
.kwho{flex:1; min-width:0; font-size:11.5px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.kprog{flex:none; font-size:9.5px; color:var(--ink-4)}
.kcard-b{display:flex; align-items:center; gap:6px; margin-top:9px; padding-top:8px; border-top:1px solid var(--line-2)}
.kstage{flex:1; text-align:center; font-family:var(--font-mono); font-size:8.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-4)}
.kmove{flex:none; width:22px; height:22px; border:1px solid var(--line); border-radius:5px; background:var(--panel);
  color:var(--ink-3); font-size:8px; display:grid; place-items:center}
.kmove:hover:not(:disabled){color:var(--blue); border-color:var(--blue-line); background:var(--blue-bg)}
.kmove:disabled{opacity:.3}

/* --- swimlanes --- */
.kboard.lanes{display:block}
.klane{border:1px solid var(--line); border-radius:10px; background:var(--panel-2); margin-bottom:10px; overflow:hidden}
.klane-h{display:flex; align-items:center; gap:9px; padding:9px 12px; background:var(--panel);
  border-bottom:1px solid var(--line-2)}
.klane-h b{font-size:13.6px; color:var(--ink)}
.klane-h .mono{font-size:10.5px; color:var(--ink-4)}
.klane-f{margin-left:auto; font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-4)}
.kmini{border:1px solid var(--line-2); border-top-width:2px; border-radius:8px; background:var(--panel-2);
  padding:8px; display:grid; gap:7px; align-content:start; min-height:56px}
.kmini.tone-blue{border-top-color:var(--blue)}
.kmini.tone-amber{border-top-color:var(--amber)}
.kmini.tone-purple{border-top-color:var(--purple)}
.kmini.tone-green{border-top-color:var(--green)}
.kmini.tone-none{border-top-color:var(--line-3)}
.kmini-h{font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-4)}
.numlist{margin:10px 0 0; padding-left:20px}
.numlist li{font-size:13.2px; color:var(--ink-2); padding:3px 0}

@media (max-width:1100px){
  .sphead{grid-template-columns:1fr}
  .kboard{grid-template-columns:repeat(5,minmax(190px,1fr))}
}
.cfg-note{font-size:11.8px; color:var(--ink-4); max-width:42ch; line-height:1.45}
/* ---------- ten states, blocked flag, bands ---------- */
.localwarn{border:1px solid var(--amber-line); border-left:3px solid var(--amber); background:var(--amber-bg);
  border-radius:8px; padding:11px 14px; margin:0 0 22px; font-size:13.2px; color:var(--ink-2); line-height:1.55}
.localwarn b{color:var(--ink)}
.localwarn.live{border-color:var(--green-line); border-left-color:var(--green); background:var(--green-bg)}
.sphead-d{margin:0 0 3px; font-size:13.8px; color:var(--ink); font-weight:560}
.sphead-d2{margin:0 0 12px; font-size:12.6px; color:var(--ink-4)}
.bl-n{color:var(--amber); font-weight:700}
.spf-s{display:flex; flex-wrap:wrap; gap:4px; margin-top:8px}
.spf-s em{font-style:normal; font-family:var(--font-mono); font-size:9px; letter-spacing:.04em; color:var(--ink-3);
  background:var(--bg-sunk); border:1px solid var(--line-2); border-radius:4px; padding:1px 5px}
.spf-s em.asserted{font-style:italic; border-style:dashed; color:var(--ink-4)}
.spf-s em b{color:var(--ink); font-weight:700}
.blk{flex:none; width:16px; height:16px; border-radius:50%; border:1px solid var(--line-2); background:var(--panel);
  color:var(--ink-4); font-family:var(--font-mono); font-size:9px; font-weight:700; display:grid; place-items:center;
  opacity:0; transition:opacity .12s ease}
.lrow:hover .blk,.blk.on{opacity:1}
.blk:hover{border-color:var(--amber); color:var(--amber)}
.blk.on{background:var(--amber); border-color:var(--amber); color:#fff}
:root[data-theme="dark"] .blk.on{color:#0e1116}
.exrow.isblocked{background:var(--amber-bg)}
.exrow.isblocked .c-name{background:var(--amber-bg)}
.stale{flex:none; font-family:var(--font-mono); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--purple); background:var(--purple-bg); border:1px solid var(--purple-line); border-radius:4px; padding:1px 5px}
.stgsel select optgroup{font-style:normal; font-weight:600}
.kb{border-top:2px solid var(--line-3); padding:7px 10px 0; min-width:0; display:flex; align-items:center;
  gap:8px; flex-wrap:wrap}
.kb b{font-size:12px; font-weight:640; color:var(--ink); letter-spacing:.01em}
.kb span{font-size:10.5px; color:var(--ink-4); line-height:1.35}
.kb u{text-decoration:none; font-family:var(--font-mono); font-size:8px;
  letter-spacing:.11em; text-transform:uppercase; color:var(--amber); background:var(--amber-bg);
  border:1px solid var(--amber-line); border-radius:4px; padding:1px 5px}
.kb.tone-blue{border-top-color:var(--blue)} .kb.tone-amber{border-top-color:var(--amber)}
.kb.tone-purple{border-top-color:var(--purple)} .kb.tone-green{border-top-color:var(--green)}
.khow{flex:none; display:block; margin:0 10px 4px; font-family:var(--font-mono); font-size:8px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-4)}
.khow.asserted{color:var(--purple); font-style:italic}
.kstate{flex:1; text-align:center; font-family:var(--font-mono); font-size:8.5px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink-3); line-height:1.3}
.kstate i{display:block; font-style:normal; font-size:7.5px; color:var(--ink-4); letter-spacing:.06em}
.kstale{margin-top:7px; font-size:10.5px; color:var(--purple); background:var(--purple-bg);
  border:1px solid var(--purple-line); border-radius:5px; padding:3px 6px}
.kblk{flex:none; width:22px; height:22px; border:1px solid var(--line); border-radius:5px; background:var(--panel);
  color:var(--ink-4); font-family:var(--font-mono); font-size:10px; font-weight:700; display:grid; place-items:center}
.kblk:hover{color:var(--amber); border-color:var(--amber-line); background:var(--amber-bg)}
.kblk.on{background:var(--amber); border-color:var(--amber); color:#fff}
:root[data-theme="dark"] .kblk.on{color:#0e1116}
/* ---------- test cases by story ---------- */
.sccards{display:grid; gap:10px; margin:12px 0 6px}
.scc{border:1px solid var(--line); border-radius:9px; background:var(--panel); overflow:hidden}
.scc.all{border-left:3px solid var(--green)}
.scc-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:9px 12px; background:var(--panel-2);
  border-bottom:1px solid var(--line-2)}
.scc-t{flex:1 1 240px; min-width:0; text-align:left; background:none; border:none; padding:0; font-size:13.6px;
  color:var(--ink); overflow-wrap:anywhere}
.scc-t:hover{color:var(--blue)}
.scc-c{flex:none; font-size:10.5px; color:var(--ink-4)}
.scc-b{padding:4px 12px 8px}

@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

.field-l input:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-bg)}
.field-l input[readonly]{background:var(--bg-sunk); color:var(--ink-3)}

/* ---------------- word helpers ---------------- */
const PROPER = ['Slack','Microsoft Teams','Email','Google Calendar','Outlook Calendar','Google Drive',
  'Dropbox','OneDrive','GitHub','GitLab','Jira','OKR','OKRs','CRM','HR','AI','KPIs','API','OAuth'];
function lc(s){
  if(PROPER.some(p => s.indexOf(p) === 0)) return s;
  if(/^[A-Z]{2,}/.test(s)) return s;
  return s.charAt(0).toLowerCase() + s.slice(1);
}
function singular(s){
  if(/ies$/.test(s)) return s.replace(/ies$/, 'y');
  if(/(ses|xes|ches|shes)$/.test(s)) return s.replace(/es$/, '');
  if(/(ss|us|ics|status|analytics)$/i.test(s)) return s;
  if(/s$/.test(s)) return s.slice(0, -1);
  return s;
}
const a_an = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ');
const A_an = w => (/^[aeiou]/i.test(w) ? 'An ' : 'A ');

/* ---------------- archetypes ---------------- */
/* Order matters: the first matching rule wins. */
const ARCHETYPES = [
 {id:'action',      test:n => /^(create|edit|delete|archive|restore|duplicate|move|copy|enable\/disable)\b/i.test(n)},
 {id:'integration', test:(n, e) => /integration/i.test(e.t) || /^(slack|microsoft teams|email|google|outlook|dropbox|onedrive|github|gitlab|jira)/i.test(n) || /\b(oauth|webhook|webhooks|api keys|api access|api permissions|api usage|incoming|outgoing|marketplace)\b/i.test(n)},
 {id:'ai',          test:n => /^(ai |natural-language|contextual answers|cross-workspace knowledge)/i.test(n)},
 {id:'automation',  test:(n, e) => /^(triggers|conditions|actions|multi-step|delays|scheduled actions|branching|automatic |automation|execution|failed automation)/i.test(n) || /automation/i.test(e.t)},
 {id:'notify',      test:n => /notification/i.test(n)},
 {id:'report',      test:(n, e) => /\b(report|reports|reporting|analytics|metrics|kpis|trends|aggregations|dashboard|widgets|utilization)\b/i.test(n) || /reporting|analytics|intelligence/i.test(e.t)},
 {id:'search',      test:(n, e) => /\bsearch\b/i.test(n) || /search/i.test(e.t)},
 {id:'perm',        test:(n, e) => /\b(permission|permissions|roles|access|private|public|sharing|policies|entitlements)\b/i.test(n) || /permission/i.test(e.t)},
 {id:'template',    test:(n, e) => /template/i.test(n) || /template/i.test(e.t)},
 {id:'field',       test:(n, e) => /\bfields?\b/i.test(n) || /custom fields/i.test(e.t)},
 {id:'view',        test:(n, e) => /^(list|board|calendar|timeline|gantt|table|workload|mind map|activity|map|form|dashboard)$/i.test(n) || /^(core|advanced) views$/i.test(e.t)},
 {id:'viewcfg',     test:(n, e) => /^(filters|sorting|grouping|columns|field visibility|view layout|view configuration|personal views|team views|shared views|saved filters|view permissions|view sharing)$/i.test(n)},
 {id:'file',        test:(n, e) => /\b(file|files|attachment|attachments|upload|uploads|download|downloads)\b/i.test(n) || /^file /i.test(e.t)},
 {id:'collab',      test:(n, e) => /\b(comment|comments|mention|mentions|reaction|reactions|thread|threads|replies|presence|typing|read status|collaboration)\b/i.test(n) || /(comments|mentions|collaboration|messaging|message interaction|presence)/i.test(e.t)},
 {id:'time',        test:(n, e) => /\b(timer|time|timesheet|timesheets|billable|utilization)\b/i.test(n) || /time/i.test(e.t)},
 {id:'billing',     test:(n, e) => /\b(plan|plans|billing|invoice|invoices|payment|payments|subscription|trials|upgrades|downgrades|cancellation|renewal|seat|usage)\b/i.test(n) || /billing|plans|subscriptions/i.test(e.t)},

];
function archetypeOf(f){
  for(let i = 0; i < ARCHETYPES.length; i++){
    if(ARCHETYPES[i].test(f.name, f.epic, f.ini)) return ARCHETYPES[i].id;
  }
  return 'default';
}

/* Actor by context — the Ready Gate asks the intent to name an actor. */
function actorFor(f){
  const i = f.ini.n;
  if(i === '24' || i === '25') return 'An admin';
  if(i === '02' && /guest/i.test(f.name)) return 'A guest';
  if(/farm|admin|administration/i.test(f.name)) return 'An admin';
  if(i === '26') return 'A business user';
  return 'A member';
}

/* ---------------- materialisation + counts ---------------- */
const _stories = {};
function storiesFor(f){
  if(_stories[f.id]) return _stories[f.id];
  const out = storyPlans(f).map((p, i) => ({
    id: f.id + '-S' + (i + 1), n: i + 1, feature: f, kind: p.kind, pattern: p.pattern,
    title: p.t, value: p.v, ac: p.ac
  }));
  return (_stories[f.id] = out);
}

const ADRS = [
{id:'ADR-001', t:'Modular monolith in Next.js, with enforced module boundaries', status:'Accepted', origin:'baseline',
 area:'structure',
 context:'26 capability areas, a small team with one on-call rotation, and a stack fixed to MERN with Next.js.',
 problem:'How should 26 capability areas be divided across runtime components?',
 drivers:['Small team, 26 capability areas','Rapid product evolution','Tenant isolation'],
 options:[
  {t:'A — one application, no internal boundaries', d:'Fastest start. Within two quarters any code writes any collection and the ownership rules have no home.'},
  {t:'B — modular monolith with enforced boundaries', d:'One deployable; modules own collections; dependency and collection rules enforced in CI.'},
  {t:'C — service per capability area', d:'Independent deploy and scaling, at the cost of 26 pipelines, distributed data and an on-call surface the team cannot carry.'}],
 criteria:['Operability with one rotation','Enforceability of ownership invariants','Independent change within a module','Exit cost if a module must be extracted'],
 evidence:'A one-week spike implemented the dependency-boundary check and the per-module collection allow-list in CI, proving the guardrails are cheap enough to be real rather than aspirational.',
 decision:'Option B. One Next.js deployment containing all domain modules. Module boundaries enforced by a CI dependency check and a collection allow-list. The realtime service and worker are separate only because their runtime shape differs (ADR-002, ADR-007).',
 consequences:'Easy: one pipeline, transactional invariants inside a module, low-friction boundary refactoring while it is still cheap. Hard: independent scaling per capability. Exit: moderate — a module with its own collections and no inbound imports can be extracted as a scoped project.',
 risks:['Boundaries erode if the CI check is bypassed — the check fails the build rather than warning'],
 rejected:'C was rejected on the operations driver, not on merit: the team cannot carry the surface. A revisit trigger is recorded — a second team forming around one capability area.',
 related:['ADR-002','ADR-005','ARC-001']},

{id:'ADR-002', t:'A separate realtime service for websocket sessions', status:'Accepted', origin:'baseline', area:'runtime',
 context:'Documents, whiteboards, chat, presence and live list updates all need long-lived connections. Next.js route handlers are request/response and are deployed on a rolling basis.',
 problem:'Where do websocket connections and collaborative document sessions live?',
 drivers:['Live collaboration','Small team, 26 capability areas'],
 options:[
  {t:'A — websockets inside the Next.js app', d:'No new component, but every deploy drops every connection and the instance lifecycle fights long-lived state.'},
  {t:'B — a separate Node realtime service', d:'One more component, with connection draining, sticky routing and its own scaling signal.'},
  {t:'C — a managed realtime vendor', d:'Least code, but document state and presence leave our boundary and per-connection cost scales with usage.'}],
 criteria:['Deploy without dropping sessions','Document state stays inside our boundary','Operational surface added','Cost shape'],
 evidence:'Measured reconnect storms during rolling deploys in the spike: with option A a deploy disconnected all editors and produced a visible 3–6 s stall; with option B draining kept edits flowing.',
 decision:'A separate Node service holding websocket sessions, applying CRDT updates and fanning out through Redis pub/sub. Sticky routing by document id.',
 consequences:'Easy: deploys of the app no longer interrupt collaboration; realtime scales on its own signal. Hard: one more deployable, sticky routing, and a second place that reads document state. New obligation: connection draining and a resync path on reconnect.',
 risks:['Sticky routing makes the service harder to rebalance — mitigated by short session affinity and CRDT resync'],
 rejected:'C revisit trigger: if concurrent editing exceeds the assumed ceiling and server-side compaction becomes a project of its own.',
 related:['ADR-008','ADR-013']},

{id:'ADR-003', t:'Work items are documents shaped for the read paths', status:'Accepted', origin:'baseline', area:'data',
 context:'Five view types read the same work items in different shapes, and customers define part of the schema through custom fields.',
 problem:'How is a task modelled in MongoDB so that list, board, calendar, gantt and workload views stay within their latency budget?',
 drivers:['View performance at scale','User-defined data shape'],
 options:[
  {t:'A — normalised collections joined per view', d:'Familiar, but $lookup per view at 100k tasks misses the budget and every view becomes a join problem.'},
  {t:'B — one task document carrying the fields every view needs', d:'Denormalised assignee names, status, dates and field values on the task; one indexed query per view.'},
  {t:'C — per-view materialised projections', d:'Fastest reads, but five projections to keep consistent for every write.'}],
 criteria:['p95 view render at 100k tasks','Write amplification','Consistency risk','Cost of adding a view type'],
 evidence:'Benchmark at 100k tasks per workspace, 5k per list: option A p95 1.9 s with $lookup; option B p95 240 ms on a compound index over workspace, list, status and due date. Option C was not measured — its write cost was already disqualifying for a small team.',
 decision:'Option B. One task document per work item, carrying the display fields each view needs, with custom field values embedded as a map keyed by field id. Compound indexes per view access pattern. Reporting aggregates are built asynchronously (ADR-012).',
 consequences:'Easy: every view is one query; adding a view type means adding an index, not a pipeline. Hard: renaming a user or a status requires a background backfill of denormalised copies. New obligation: a backfill job pattern, owned by the Work module.',
 risks:['Denormalised copies drift if a backfill fails silently — the job reports its lag as a signal'],
 rejected:'A remains correct for low-volume admin screens and is used there.',
 related:['ADR-004','ADR-014','ADR-012']},

{id:'ADR-004', t:'Hierarchy as a materialised ancestor path on every item', status:'Accepted', origin:'baseline', area:'data',
 context:'Space → folder → list → task → subtask, with moves between parents, permission inheritance and subtree queries ("everything in this space").',
 problem:'How is the hierarchy stored so that subtree reads and permission inheritance stay cheap?',
 drivers:['View performance at scale','Permission enforcement everywhere'],
 options:[
  {t:'A — parent reference only', d:'Trivial writes; a subtree read becomes N round trips or a $graphLookup.'},
  {t:'B — materialised ancestors array', d:'One indexed query for any subtree; a move rewrites the paths of the moved subtree.'},
  {t:'C — closure table collection', d:'Powerful, but a second collection to keep consistent with every move.'}],
 criteria:['Subtree read cost','Move cost','Permission inheritance evaluation','Consistency surface'],
 evidence:'Move cost measured on the largest realistic subtree (a space with 20k tasks): a path rewrite completed in 1.4 s as a background job with the subtree briefly read-consistent but write-locked.',
 decision:'Every hierarchy item and task stores an ordered ancestors array. Subtree queries filter on it; permission inheritance walks it in memory from a cached permission set. Moves rewrite descendants in a background job with an explicit moving state.',
 consequences:'Easy: subtree reads, breadcrumb rendering and inherited permission checks. Hard: large moves are asynchronous and visible as such. New obligation: a moving state in the UI and an invariant test that no item has a stale ancestor.',
 risks:['A failed path rewrite leaves a subtree orphaned — the job is idempotent and re-runnable from the item id'],
 rejected:'C revisit trigger: if arbitrary cross-hierarchy relationships appear beyond dependencies.',
 related:['ADR-003','ADR-006']},

{id:'ADR-005', t:'Tenant isolation enforced in a data gateway, not by query discipline', status:'Accepted', origin:'baseline', area:'security',
 context:'Multi-tenant from day one, with guests, public shares and an API. 26 modules, many hands.',
 problem:'How do we guarantee that no query can read across workspaces?',
 drivers:['Tenant isolation','Permission enforcement everywhere','Small team'],
 options:[
  {t:'A — every query includes workspaceId by convention', d:'Costs nothing today; one forgotten filter is a cross-tenant leak, and code review is the only control.'},
  {t:'B — a data gateway that injects the scope', d:'All reads and writes go through a gateway that applies the workspace filter last and refuses unscoped access.'},
  {t:'C — a database per tenant', d:'Strongest isolation; unworkable operationally at the expected tenant count.'}],
 criteria:['Can a leak be expressed at all?','Operational cost','Effect on query flexibility','Migration cost later'],
 evidence:'A mutation test suite removed the workspace filter from 40 randomly chosen queries: under option A, 37 leaked; under option B, none compiled or ran without an explicit unscoped-admin escape hatch that is itself audited.',
 decision:'Option B. All persistence flows through a per-module gateway that takes the principal, applies the workspace filter last, and enforces the collection allow-list. An audited escape hatch exists for platform jobs and is refused outside them.',
 consequences:'Easy: isolation becomes structural rather than behavioural; new engineers cannot leak by omission. Hard: ad-hoc aggregations must be expressed through the gateway. New obligation: the escape hatch is logged and reviewed.',
 risks:['The escape hatch becomes routine — its use is alerted on, not merely logged'],
 rejected:'C revisit trigger: a regulated customer requiring physical separation.',
 related:['ADR-006','ARC-004','ADR-009']},

{id:'ADR-006', t:'Authorisation decided in the application layer and carried on the command', status:'Accepted', origin:'baseline', area:'security',
 context:'Roles, resource permissions, shares and guests, reached through server components, route handlers, server actions, the public API, the worker and the realtime service.',
 problem:'Where is authorisation decided, and how do we stop background work from acting with more authority than the request that caused it?',
 drivers:['Permission enforcement everywhere','Tenant isolation'],
 options:[
  {t:'A — check in each route handler', d:'Obvious and local; six entry points mean six places to forget, and the worker has none.'},
  {t:'B — a policy module returning a decision the command bus requires', d:'One implementation, enforced by construction; background work carries the actor plus a service identity.'},
  {t:'C — database-level row rules', d:'Not available in MongoDB in the form required.'}],
 criteria:['Same answer at every entry point','Behaviour in asynchronous work','Auditability','Cost of adding a sharing mode'],
 evidence:'A contract test calls every command unauthenticated and every command as a guest; with option B a missing policy binding fails the build because the bus rejects the command shape.',
 decision:'A policy module produces an allow or deny decision with a reason. The command bus refuses any command without one. Worker jobs run under a service identity and record the originating actor; they re-evaluate policy at the point of effect rather than trusting the decision made when the event was queued.',
 consequences:'Easy: one place to add a sharing mode; audit entries are uniform. Hard: every command needs a policy binding, which is deliberate friction. New obligation: re-authorisation in jobs, which is slower than trusting the queued decision.',
 risks:['A permissive default binding would be invisible — bindings are explicit and a missing one fails closed'],
 rejected:'A remains in place only as the authentication step at the edge.',
 related:['ADR-005','ADR-007']},

{id:'ADR-007', t:'Outbox collection plus worker relay for all cross-module events', status:'Accepted', origin:'baseline', area:'reliability',
 context:'Automations, notifications, search indexing, integrations and reporting all react to changes in Work, Docs and Chat.',
 problem:'How does a state change reliably become an event without losing it or publishing one that never happened?',
 drivers:['Automation and integration','Live collaboration','Search across everything'],
 options:[
  {t:'A — publish after the write', d:'A crash between write and publish loses the event; a failed write after publishing creates a phantom.'},
  {t:'B — outbox document written in the same transaction, relayed by the worker', d:'Atomic with the state change; at-least-once delivery, so consumers must be idempotent.'},
  {t:'C — MongoDB change streams', d:'No outbox to maintain, but the event carries storage shape rather than domain meaning, and resume tokens become an operational concern.'}],
 criteria:['Can an event be lost or phantom?','Meaning of the event','Replay','Operational surface'],
 evidence:'Crash injection between write and publish: option A lost 0.3% of events under induced failure; option B lost none and produced duplicates that consumers deduplicated by key.',
 decision:'Application services write an outbox document inside the same transaction as the state change. A relay in the worker publishes to Redis queues and marks the outbox row. Consumers deduplicate by event id and are idempotent by construction.',
 consequences:'Easy: no lost or phantom events; replay is a query over the outbox. Hard: every consumer must handle duplicates. New obligation: outbox age is a monitored signal, and a stuck relay pages.',
 risks:['Outbox growth — a TTL index removes relayed rows after the replay window'],
 rejected:'C revisit trigger: if outbox maintenance outweighs its benefit once event volume is known.',
 related:['ADR-013','ADR-017','ARC-002']},

{id:'ADR-008', t:'CRDT documents and boards, persisted as updates with periodic snapshots', status:'Accepted', origin:'baseline', area:'data',
 context:'Documents, wikis and whiteboards are edited by several people at once, sometimes on poor connections.',
 problem:'How is concurrent editing made convergent without a lock and without losing work?',
 drivers:['Live collaboration','User-defined data shape'],
 options:[
  {t:'A — last write wins on the whole document', d:'Trivial and unacceptable: concurrent edits silently destroy each other.'},
  {t:'B — operational transformation', d:'Proven, but a server-side transform implementation is a substantial project of its own.'},
  {t:'C — CRDT (Yjs) with update log and snapshots', d:'Convergence without a central transform; storage grows with edits, so snapshots and compaction are required.'}],
 criteria:['Lost update risk','Offline and reconnect behaviour','Implementation cost','Storage growth'],
 evidence:'A two-day spike with 20 simulated concurrent editors, including disconnects, produced convergent documents with no lost edits; update log growth measured at 40 KB per hour of active editing, compacted to a 12 KB snapshot.',
 decision:'Yjs CRDT held by the realtime service. Updates appended to an updates collection; snapshots written every N updates or T seconds; older updates compacted. Clients resync from the latest snapshot plus subsequent updates.',
 consequences:'Easy: convergence, offline tolerance within a session, and no document locking. Hard: document history is a CRDT log rather than a simple version list; storage needs compaction. New obligation: a compaction job and a snapshot-age signal.',
 risks:['Compaction bugs can corrupt a document — snapshots are immutable and retained for 90 days so a rollback is possible'],
 rejected:'B revisit trigger: none foreseen; the implementation cost is the deciding factor.',
 related:['ADR-002']},

{id:'ADR-009', t:'Atlas Search for global search, with workspace scope in the index', status:'Accepted', origin:'baseline', area:'data',
 context:'One search box over tasks, documents, messages, files and people, with permissions applied.',
 problem:'How is search implemented without a second datastore to operate, and without leaking across tenants?',
 drivers:['Search across everything','Tenant isolation','Small team'],
 options:[
  {t:'A — regex and text indexes in MongoDB', d:'No new dependency; ranking and partial matching are poor and it degrades sharply with volume.'},
  {t:'B — Atlas Search', d:'Managed alongside the database we already run, with index definitions per collection.'},
  {t:'C — a separate search cluster', d:'Most control; a second datastore to secure, scale and keep in sync.'}],
 criteria:['Operational surface','Tenant scoping','Relevance quality','Index lag'],
 evidence:'Relevance comparison on 50 real queries against a seeded 1M-document workspace: option A returned an acceptable first result for 21, option B for 43. Index lag measured under 8 s at that volume.',
 decision:'Atlas Search over projection collections maintained by the Search module from outbox events. Every projection carries workspaceId and a permission key set; queries filter on both before ranking.',
 consequences:'Easy: no new datastore, good relevance, permission filtering in the index. Hard: projections are another thing to keep in sync, and a permission change must reindex affected documents. New obligation: index lag is a monitored signal.',
 risks:['A stale permission key in the index could reveal a title — reindexing on permission change is a first-class job, and results are re-checked against policy before display'],
 rejected:'C revisit trigger: multi-region search or relevance needs beyond Atlas Search.',
 related:['ADR-007','ADR-005']},

{id:'ADR-010', t:'Server Components for views; client islands for interaction', status:'Accepted', origin:'baseline', area:'delivery',
 context:'Next.js App Router. Views are read-heavy and permission-scoped; a few of them — board drag, gantt drag, whiteboard — are highly interactive.',
 problem:'What renders on the server and what ships to the browser?',
 drivers:['View performance at scale','Rapid product evolution'],
 options:[
  {t:'A — client-side rendering throughout', d:'One mental model; large bundles and a data waterfall on every view.'},
  {t:'B — server components by default, client islands where interaction demands it', d:'Small bundles and no waterfall for reads; two mental models to hold.'},
  {t:'C — server rendering only', d:'Fastest first paint; unusable for drag-and-drop views.'}],
 criteria:['First view render','Bundle size','Interaction fidelity','Developer clarity'],
 evidence:'A board view prototype measured 310 KB of JavaScript as a client island against 1.1 MB for the equivalent fully client-rendered page, with first render 2.4× faster on the server-rendered list view.',
 decision:'Server components render views and fetch through queries. Interactive views are client islands receiving serialised, already-authorised data. Mutations go through server actions or route handlers, never direct database access from a component.',
 consequences:'Easy: fast reads, less client state, authorisation resolved before data reaches the browser. Hard: the server/client split must be explicit and is easy to get wrong. New obligation: a lint rule preventing a domain import from a client component.',
 risks:['Accidental client-side data fetching reintroduces waterfalls — caught by the module boundary check'],
 rejected:'A remains in use only inside islands.',
 related:['ADR-001','ADR-015']},

{id:'ADR-011', t:'Direct-to-storage uploads with presigned URLs', status:'Accepted', origin:'baseline', area:'data',
 context:'Attachments on tasks, documents, messages and forms, some of them large.',
 problem:'How do files reach storage without passing through the application?',
 drivers:['Small team','Cost of AI features','Tenant isolation'],
 options:[
  {t:'A — upload through the Next.js app', d:'Simple, and it puts large bodies through request handlers that are sized for JSON.'},
  {t:'B — presigned direct upload', d:'The browser uploads to storage; the app issues a scoped, expiring URL and records metadata on completion.'}],
 criteria:['Application memory and time','Progress and resumability','Access control on the object'],
 evidence:'A 200 MB upload through the app held a worker for 38 s and pushed memory to a level that would have required larger instances; the presigned path removed both.',
 decision:'The app issues a presigned upload URL scoped to a workspace-prefixed key with a short expiry. The browser uploads directly. A completion callback records metadata. Reads are served through short-lived presigned download URLs issued only after a policy check.',
 consequences:'Easy: large files cost the application nothing; progress and retry are the browser’s. Hard: object lifecycle and orphan cleanup become our job. New obligation: a sweeper for objects whose metadata never arrived.',
 risks:['A leaked download URL is valid until expiry — expiries are short and every issue is audited'],
 rejected:'A retained only for small generated exports produced server-side.',
 related:['ADR-005']},

{id:'ADR-012', t:'Reporting reads a secondary and pre-aggregated rollups', status:'Accepted', origin:'baseline', area:'performance',
 context:'Dashboards, workload, time reports and portfolio health aggregate across lists, spaces and workspaces.',
 problem:'How does reporting run without competing with the interactive path?',
 drivers:['View performance at scale','Small team'],
 options:[
  {t:'A — aggregate on demand against the primary', d:'Always current; heavy aggregations contend with interactive reads.'},
  {t:'B — read preference secondary', d:'Removes contention; adds replication lag to the answer.'},
  {t:'C — pre-aggregated rollups maintained from events', d:'Fast and cheap to read; rollups must be maintained and can drift.'}],
 criteria:['Contention with interactive reads','Freshness the user can see','Maintenance cost'],
 evidence:'A portfolio dashboard over 12 projects measured 3.1 s against the primary under load, 2.9 s against a secondary, and 180 ms against rollups.',
 decision:'Dashboard and report queries read a secondary. Widgets whose queries exceed the budget are backed by rollup documents maintained by the worker from outbox events. Every reported figure displays its as-of time.',
 consequences:'Easy: reporting never slows the interactive path. Hard: two freshness models to explain. New obligation: the as-of timestamp is part of every report contract.',
 risks:['A rollup that silently stops updating shows a plausible wrong number — rollup age is alerted on, and the as-of time makes staleness visible'],
 rejected:'A retained for small single-list reports where it is within budget.',
 related:['ADR-003','ADR-007']},

{id:'ADR-013', t:'Redis-backed queues for all background work', status:'Accepted', origin:'baseline', area:'reliability',
 context:'Outbox relay, automations, notifications, indexing, recurrences, exports and AI jobs.',
 problem:'What runs background work, given one on-call rotation?',
 drivers:['Automation and integration','Small team'],
 options:[
  {t:'A — a managed cloud queue', d:'Least to operate; another vendor boundary and a second delivery semantics to learn.'},
  {t:'B — BullMQ on the Redis we already run', d:'One component we already operate, with retries, delays, repeatable jobs and a dead-letter queue.'},
  {t:'C — cron plus database polling', d:'Fewest moving parts; poor latency and no retry semantics worth the name.'}],
 criteria:['Components to operate','Retry, delay and scheduling support','Visibility of failures'],
 evidence:'Redis is already required for realtime fan-out and rate limiting, so option B adds a library rather than a component.',
 decision:'BullMQ on Redis, one queue per work class, with bounded retry, exponential backoff, a dead-letter queue per class and repeatable jobs for recurrences.',
 consequences:'Easy: no new runtime dependency; failures are inspectable. Hard: Redis durability now matters — queue loss is recoverable from the outbox, but in-flight jobs are not. New obligation: dead-letter depth is a paging signal.',
 risks:['Redis loss drops queued jobs — the outbox allows the relay to rebuild them; non-outbox jobs are re-derivable or idempotent'],
 rejected:'A revisit trigger: multi-region or a volume Redis cannot hold.',
 related:['ADR-007','ADR-002']},

{id:'ADR-014', t:'Custom field values embedded on the item, definitions held per list', status:'Accepted', origin:'baseline', area:'data',
 context:'Customers define fields per list, and views filter, sort and group by them.',
 problem:'Where do custom field values live so that a new field costs nothing and filtering stays indexable?',
 drivers:['User-defined data shape','View performance at scale'],
 options:[
  {t:'A — a values collection joined per view', d:'Clean model; a join per view, which ADR-003 already rejected on measurement.'},
  {t:'B — values embedded as a map keyed by field id', d:'One document read; indexes must be created per field that needs sorting or filtering at scale.'},
  {t:'C — a column per field', d:'Not expressible: the fields are defined by the customer.'}],
 criteria:['Cost of adding a field','Filter and sort performance','Document growth','Index count'],
 evidence:'Wildcard indexing over the embedded map met the filter budget at 5k tasks per list; beyond that, selective indexes on individual field paths were required and were created on demand.',
 decision:'Values are embedded on the task as a map keyed by field id, with typed sub-values. Definitions live in the Fields module per list. Indexes are created for fields used in saved views above a usage threshold.',
 consequences:'Easy: a new field is a definition, not a migration. Hard: field deletion requires a background purge of embedded values, and index count must be watched. New obligation: an index budget per collection.',
 risks:['Unbounded field creation grows documents — a per-list field limit is an entitlement'],
 rejected:'A retained for historical field values used only in reporting.',
 related:['ADR-003','ADR-012']},

/* ---- raised by the refinement pass ---- */
{id:'ADR-015', t:'Optimistic concurrency on work item updates', status:'Accepted', origin:'refine', area:'data',
 raisedBy:'Stories whose acceptance criteria require that two simultaneous editors are told rather than silently overwritten (04.x, 05.x, 07.x).',
 context:'Refinement found the same acceptance criterion on 180+ stories: a concurrent change must be reported, not silently lost. Nothing in the baseline provided it.',
 problem:'How does a work item update detect that the item changed since the client read it?',
 drivers:['User-defined data shape','Live collaboration'],
 options:[
  {t:'A — last write wins', d:'What the baseline implied. Directly contradicts an acceptance criterion repeated across the backlog.'},
  {t:'B — version field with a conditional update', d:'The update matches on the version it read; a mismatch returns a conflict the client can resolve.'},
  {t:'C — CRDT for work items too', d:'Convergent, but field-level merge semantics for statuses, assignees and dates are not obviously correct.'}],
 criteria:['Detects concurrent change','Cost per write','Client complexity','Fits the existing realtime path'],
 evidence:'Conditional update on a version field measured no meaningful cost against the unconditional write; the conflict path is a single extra round trip.',
 decision:'Every mutable work item carries a version. Updates are conditional on the version read, and a mismatch returns a typed Conflict outcome carrying the current state so the client can merge or prompt. Realtime updates carry the new version so open clients stay current.',
 consequences:'Easy: the repeated acceptance criterion is satisfied once, in the gateway. Hard: every client mutation path must handle Conflict. New obligation: a conflict rate signal, which is also a usability measure.',
 risks:['Clients that ignore Conflict would silently drop a user’s edit — the typed outcome makes ignoring it a compile-time omission'],
 rejected:'C revisit trigger: if field-level concurrent editing of task descriptions becomes a product requirement.',
 related:['ADR-003','ADR-008']},

{id:'ADR-016', t:'Recurrence materialised ahead by a bounded window', status:'Accepted', origin:'refine', area:'data',
 raisedBy:'Recurring tasks and recurring events stories (05.3, 15.2) — refinement could not answer "what exists before the next occurrence?"',
 context:'Recurring work must appear in calendars, gantt, workload and reports before it occurs, but an unbounded series cannot be stored.',
 problem:'Do recurrences exist as rules, as materialised items, or both?',
 drivers:['View performance at scale','User-defined data shape'],
 options:[
  {t:'A — rule only, expanded at read time', d:'No storage growth; every view must understand recurrence, and a moved occurrence has nowhere to live.'},
  {t:'B — materialise the whole series', d:'Views need no special knowledge; the series can be unbounded.'},
  {t:'C — rule plus a materialised window', d:'Occurrences exist for a bounded horizon; a scheduled job extends the window.'}],
 criteria:['View simplicity','Storage growth','Editing a single occurrence','Reporting correctness'],
 evidence:'Calendar and workload queries already filter on date ranges; a 90-day horizon covers every view’s default range without special handling.',
 decision:'A recurrence rule on the series plus materialised occurrences for a rolling 90-day window, extended daily by a repeatable job. Editing one occurrence detaches it from the series and is preserved when the window advances.',
 consequences:'Easy: every view treats occurrences as ordinary items. Hard: changing a rule must reconcile already-materialised future occurrences, including detached ones. New obligation: a reconciliation job with an explicit policy for detached occurrences.',
 risks:['A stalled window job silently empties future calendars — window depth is a monitored signal'],
 rejected:'A revisit trigger: if horizons beyond a year become a product need.',
 related:['ADR-003','ADR-013']},

{id:'ADR-017', t:'Notification fan-out with per-recipient preference evaluation in the worker', status:'Accepted', origin:'refine', area:'reliability',
 raisedBy:'Initiative 13 stories: every notification story carried "reaches the right people and nobody else" plus a preference story and a delivery-failure story.',
 context:'One change can notify assignees, watchers, mentioned people and channel subscribers, each with their own preferences, digest settings and channel choices.',
 problem:'Where is the recipient set computed, and how is a delivery failure handled without duplicating notifications?',
 drivers:['Automation and integration','Permission enforcement everywhere'],
 options:[
  {t:'A — compute recipients in the request', d:'Immediate, and it puts an unbounded fan-out inside a user-facing mutation.'},
  {t:'B — worker computes recipients from the event', d:'Keeps the request fast and lets delivery retry independently per recipient.'}],
 criteria:['Request latency','Retry granularity','Permission re-evaluation at send time','Duplicate risk'],
 evidence:'A mention in a busy channel produced a 4,200-recipient fan-out in a seeded workspace — enough to blow the command latency budget on its own.',
 decision:'The worker consumes the outbox event, resolves the recipient set, re-evaluates access per recipient at send time, applies preferences and digest rules, and writes one notification record per recipient with an idempotency key. Delivery to email or push retries per recipient.',
 consequences:'Easy: request latency is unaffected by audience size; a permission revoked between event and send is honoured. Hard: notification delivery is eventually consistent, which the interface must state. New obligation: per-recipient delivery failure surfacing (Initiative 13 story).',
 risks:['A recipient set computed from stale data could notify someone who lost access — re-evaluation at send time is the control'],
 rejected:'A retained only for a self-notification echo used for optimistic UI.',
 related:['ADR-007','ADR-006']},

{id:'ADR-018', t:'Quotas and cost guardrails for AI features', status:'Accepted', origin:'refine', area:'cost',
 raisedBy:'Initiative 23 stories — every AI story produced a limit or failure slice that the baseline had no answer for.',
 context:'Generative calls cost money per invocation and can be triggered in loops through automation.',
 problem:'What stops AI spend from scaling faster than revenue, and what does a user see when a limit is reached?',
 drivers:['Cost of AI features','Automation and integration'],
 options:[
  {t:'A — trust the provider’s rate limits', d:'Costs are discovered on the invoice; users see opaque provider errors.'},
  {t:'B — per-workspace quota held as an entitlement, enforced before the call', d:'Predictable cost; quota state to maintain and communicate.'}],
 criteria:['Cost predictability','User-visible behaviour at the limit','Interaction with automation'],
 evidence:'An automation that summarises every created task was modelled at 40k calls per month for a mid-sized workspace — an order of magnitude above the assumed plan allowance.',
 decision:'AI calls pass through a quota check bound to the workspace entitlement, with per-minute and per-month limits and a hard stop for automation-originated calls. Reaching a limit returns a typed outcome that the interface renders with what to do next; drafts are preserved.',
 consequences:'Easy: cost is bounded and attributable per workspace. Hard: quota state is one more thing that must be correct, and automation authors must understand the limit. New obligation: cost per workspace is a reported figure.',
 risks:['A quota that is too tight looks like a broken feature — the message names the limit and the reset time'],
 rejected:'A rejected on the cost driver.',
 related:['ADR-013','ADR-012']},

{id:'ADR-019', t:'Soft delete with a retention window and TTL-driven purge', status:'Accepted', origin:'refine', area:'data',
 raisedBy:'Lifecycle stories across initiatives 01, 03, 04, 20 and 24 — archive, restore, retention and "what happens to children" appeared repeatedly.',
 context:'Archive and restore are user-facing behaviours; deletion has legal and contractual consequences; derived copies exist in search projections, rollups and exports.',
 problem:'What does deletion mean, and how far does it propagate?',
 drivers:['Tenant isolation','Search across everything'],
 options:[
  {t:'A — hard delete', d:'Simple and unrecoverable; restore stories become impossible and accidental loss is permanent.'},
  {t:'B — soft delete plus scheduled purge', d:'Restore works; deleted data lingers for the retention window and must be excluded everywhere.'}],
 criteria:['Restore capability','Exclusion from every read path','Legal deletion obligations','Derived copy cleanup'],
 evidence:'The data gateway already applies filters centrally, so excluding soft-deleted documents is one gateway rule rather than 26 module changes.',
 decision:'Deletion sets a deletedAt stamp. The gateway excludes soft-deleted documents from every read except an explicit restore path. A TTL-driven purge removes them after the retention window and emits an event so search projections, rollups and exports drop their copies. Children follow a per-entity policy — cascade, detach or block — recorded in the ownership table.',
 consequences:'Easy: restore is real; deletion is auditable. Hard: every derived store must honour the purge event. New obligation: a deletion trace test that follows one record through search, rollups and exports.',
 risks:['A purge event lost by a consumer leaves orphaned derived data — the trace test runs on a schedule, not only in CI'],
 rejected:'A retained only for genuinely ephemeral records such as presence.',
 related:['ADR-005','ADR-009','ADR-012']},

{id:'ADR-020', t:'Saved views compile to a validated query specification', status:'Accepted', origin:'refine', area:'structure',
 raisedBy:'Initiative 06 configuration and saved-view stories, plus the reporting stories that reuse the same filters.',
 context:'Filters, sorts and groupings are user-defined, saved, shared, and reused by reports, automations and forms.',
 problem:'How is a user-defined filter represented so that it can be stored, shared, validated and executed safely?',
 drivers:['View performance at scale','User-defined data shape','Tenant isolation'],
 options:[
  {t:'A — store the database query', d:'Direct; user input becomes a query, which is both a security problem and an unversionable contract.'},
  {t:'B — a declarative specification compiled at execution', d:'Storable, diffable, validatable against field definitions, and compiled to an indexed query.'}],
 criteria:['Safety of user input','Validation against changing fields','Reuse across views, reports and automations','Index alignment'],
 evidence:'Expressing the twelve most common saved views as specifications compiled to queries that used an existing index in ten cases; the two exceptions defined the index budget rule in ADR-014.',
 decision:'Saved views hold a declarative specification of filters, sort and grouping referencing field ids. A compiler validates against current field definitions and produces an indexed query. A specification referencing a removed field degrades with a clear message instead of failing.',
 consequences:'Easy: one representation serves views, reports, automations and forms. Hard: a compiler is a real component with its own tests. New obligation: compiled queries are checked against the index budget.',
 risks:['An unindexed specification could run a collection scan — the compiler refuses specifications whose cost estimate exceeds the budget'],
 rejected:'A rejected on security grounds alone.',
 related:['ADR-003','ADR-014','ADR-012']}
];

  {k:'Partial',   d:'Some data arrived, some is still coming — the surface says which.'},
  {k:'Stale',     d:'Data older than its freshness budget is labelled with its as-of time rather than shown as current.'},

/* ---------------- verification approach per acceptance criterion ---- */
function verificationFor(ac){
  const t = ac.toLowerCase();
  if(/refused|cannot|may not|without rights|permission|never sees|prevented/.test(t))
    return {k:'Security contract test', d:'Call the entry point as an unauthorised principal and assert refusal with a reason.'};
  if(/budget|volume|scale|responsive|within the stated|p95|paging/.test(t))
    return {k:'Load test', d:'Seeded workspace at target volume; measured against the stated budget and recorded.'};
  if(/retried|duplicate|conflict|concurrent|partial|failure|interrupt|expired/.test(t))
    return {k:'Fault-injection test', d:'Inject the failure in an integration test and assert the designed behaviour and absence of duplicate effect.'};
  if(/without a reload|visible to others|immediately|appears for everyone|empty state|opens/.test(t))
    return {k:'Playwright journey', d:'End-to-end in a seeded workspace, asserting the observable state in the browser.'};
  if(/recorded|activity|audit|history|stated order|as-of/.test(t))
    return {k:'Integration test', d:'Assert the persisted record and its fields after the command.'};
  return {k:'Integration test', d:'Exercise the application service against a real MongoDB and assert the outcome.'};
}

  realtime:{n:'Realtime service session handling', adr:'ADR-002', owner:'Platform'},
  outbox:  {n:'Outbox relay and queue consumers', adr:'ADR-007', owner:'Platform'},
  search:  {n:'Atlas Search projections', adr:'ADR-009', owner:'Platform'},
  quota:   {n:'AI quota and entitlement checks', adr:'ADR-018', owner:'Platform'},
  upload:  {n:'Presigned upload path', adr:'ADR-011', owner:'Platform'},
  rollup:  {n:'Reporting rollups from events', adr:'ADR-012', owner:'Platform'},
  version: {n:'Optimistic concurrency in the gateway', adr:'ADR-015', owner:'Platform'},
  recur:   {n:'Recurrence window job', adr:'ADR-016', owner:'Platform'}
};
const FOUNDATION_MODULES = ['kernel','identity','workspace','access'];
const DEP_CACHE = {};
function dependenciesFor(s){
  if(DEP_CACHE[s.id]) return DEP_CACHE[s.id];
  const mod = moduleOf(s.feature), out = [];
  /* module dependencies, from the architecture baseline */
  if(mod.dep && mod.dep !== '—'){
    mod.dep.split(',').map(x => x.trim()).forEach(dep => {
      const m = ARCH.modules.filter(x => x.id === dep)[0];
      if(m) out.push({kind:'module', n:m.n + ' module must own its collections first', owner:teamOf(m), ref:m.id});
    });
  }
  /* platform dependencies implied by the task plan */
  const kinds = taskKinds(s);
  kinds.forEach(k => {
    const p = PLATFORM_DEPS[k === 'realtime' ? 'realtime' : k === 'worker' ? 'outbox' : k];
    if(p && !out.some(o => o.n === p.n)) out.push({kind:'platform', n:p.n, owner:p.owner, ref:p.adr});
  });
  if(['write','lifecycle'].indexOf(s.kind) > -1 && !out.some(o => o.ref === 'ADR-015'))
    out.push({kind:'platform', n:PLATFORM_DEPS.version.n, owner:'Platform', ref:'ADR-015'});
  /* a story on a non-foundation module depends on the foundation being in place */
  if(FOUNDATION_MODULES.indexOf(mod.id) < 0)
    out.push({kind:'module', n:'Workspace scoping and policy layer in place', owner:'Platform', ref:'kernel'});
  return (DEP_CACHE[s.id] = out);
}

/* ---------------- architecture impact check (handbook Ch. 50) ------- */
const IMPACT_QUESTIONS = [
  {id:'boundary', q:'Adds, removes or moves a boundary?'},
  {id:'owner',    q:'Changes who owns data or a capability?'},
  {id:'external', q:'Introduces or changes an external dependency?'},
  {id:'quality',  q:'Changes a quality attribute in the drivers?'},
  {id:'trust',    q:'Changes a trust boundary or identity flow?'},
  {id:'runtime',  q:'Adds a runtime component?'},
  {id:'decision', q:'Contradicts a recorded decision or standard?'},
  {id:'reverse',  q:'Expensive to reverse once shipped?'}
];
/* surfaces with no existing design pattern to reuse */
const NEW_SURFACES = /whiteboard|infinite canvas|sticky note|mind map|gantt|map$|presentation mode|workload/i;
/* the system design covering a story, if one exists (SYSTEM_DESIGNS) */
function designFor(s){
  const f = s.feature;
  return SYSTEM_DESIGNS.filter(d =>
    (d.initiatives && d.initiatives.indexOf(f.ini.n) > -1) ||
    d.covers.test(f.name) || d.covers.test(f.epic.t))[0] || null;
}
const IMPACT_CACHE = {};
function impactFor(s){
  if(IMPACT_CACHE[s.id]) return IMPACT_CACHE[s.id];
  const kinds = taskKinds(s), arch = archetypeOf(s.feature), mod = moduleOf(s.feature);
  const yes = {}, adrs = [];
  const mark = (id, why, adr) => { if(!yes[id]) yes[id] = why; if(adr && adrs.indexOf(adr) < 0) adrs.push(adr); };

  if(kinds.indexOf('schema') > -1) mark('owner', 'Adds or changes collections owned by ' + mod.n + '.', 'ADR-003');
  if(kinds.indexOf('outbox') > -1 || kinds.indexOf('worker') > -1)
    mark('boundary', 'Crosses the synchronous to asynchronous boundary through the outbox.', 'ADR-007');
  if(kinds.indexOf('realtime') > -1) mark('runtime', 'Uses the realtime service and its fan-out path.', 'ADR-002');
  if(kinds.indexOf('search') > -1) mark('owner', 'Maintains a derived search projection.', 'ADR-009');
  if(kinds.indexOf('rollup') > -1) mark('quality', 'Reporting freshness becomes user-visible.', 'ADR-012');
  if(kinds.indexOf('quota') > -1) mark('external', 'Calls a metered external provider.', 'ADR-018');
  if(kinds.indexOf('upload') > -1) mark('external', 'Moves bytes to object storage directly from the browser.', 'ADR-011');
  if(kinds.indexOf('recur') > -1) mark('owner', 'Materialises future occurrences.', 'ADR-016');
  if(kinds.indexOf('perf') > -1) mark('quality', 'Targets a stated latency budget.', 'ADR-003');
  if(arch === 'perm' || s.kind === 'rule' && /permission|access|policy/i.test(s.title))
    mark('trust', 'Changes how a policy decision is reached or enforced.', 'ADR-006');
  if(arch === 'integration') mark('external', 'Adds or changes a third-party connection.', 'ARC-007');
  if(arch === 'ai') mark('external', 'Adds generative calls with per-call cost.', 'ADR-018');
  if(['write','lifecycle'].indexOf(s.kind) > -1) mark('reverse', 'Writes data whose shape becomes a contract.', 'ADR-015');
  if(arch === 'lifecycle') mark('owner', 'Deletion must propagate to derived copies.', 'ADR-019');
  if(arch === 'viewcfg' || arch === 'view') mark('quality', 'Reads through the saved-view compiler within a latency budget.', 'ADR-020');
  if(arch === 'docs' || arch === 'boards' || /document|whiteboard|canvas/i.test(s.feature.name))
    mark('runtime', 'Collaborative document state lives in the realtime service.', 'ADR-008');

  const hit = Object.keys(yes);
  /* A surface with no existing pattern needs a system design. One now
     exists for each of them (handbook Part VIII) — find the covering
     design and take its decisions, which is what resolves the impact. */
  const novel = NEW_SURFACES.test(s.feature.name) || (s.feature.ini.n === '26' && s.kind === 'write');
  const design = novel ? designFor(s) : null;
  if(design) design.adr.forEach(a => { if(adrs.indexOf(a) < 0) adrs.push(a); });
  const needsDesign = novel && !design;
  const res = {
    impacted: hit.length > 0,
    answers: IMPACT_QUESTIONS.map(q => ({q:q.q, yes: !!yes[q.id], why: yes[q.id] || ''})),
    adrs: adrs,
    design: design,
    resolved: hit.length === 0 || (adrs.length > 0 && !needsDesign),
    needsDesign: needsDesign,
    designReason: needsDesign
      ? 'This surface has no existing pattern and no system design covers it yet.'
      : design
        ? design.id + ' — ' + design.t + ' defines its components, contracts, failure branches and interface states.'
        : ''
  };
  return (IMPACT_CACHE[s.id] = res);
}

/* ---------------- Ready Gate (chapters-b.js conditions) ------------- */
const GATE_CACHE = {};
function readyGateFor(s){
  if(GATE_CACHE[s.id]) return GATE_CACHE[s.id];
  const reqs = requirementsFor(s.feature), deps = dependenciesFor(s), imp = impactFor(s);
  const tasks = tasksFor(s);
  const newSurface = NEW_SURFACES.test(s.feature.name);
  const c = [];

  c.push({q:READY_GATE[0].q, ok:true,
    why:'The intent names an actor, a behaviour and an outcome: “' + s.title + '”.'});

  c.push({q:READY_GATE[1].q, ok:reqs.length > 0,
    why:reqs.length + ' requirements linked (' + reqs.map(r => r.id).join(', ') + '), each at least partly satisfied by this Story.'});

  const acOK = s.ac.length >= 2;
  c.push({q:READY_GATE[2].q, ok:acOK,
    why:s.ac.length + ' observable criteria, covering failure as well as success, with no Definition of Done items.'});

  /* The model asks for an owner AND a date. Owners come from the architecture
     baseline; dates exist only inside a scheduled wave. Wave 1 is scheduled —
     later waves are ordered, not dated, so their stories fail here. */
  const w = waveOf(s);
  const scheduled = SCHEDULED_WAVES.indexOf(w) > -1;
  const depsOK = deps.length === 0 || scheduled;
  c.push({q:READY_GATE[3].q, ok:depsOK,
    why:deps.length === 0 ? 'No dependencies to start or to finish.'
      : scheduled
        ? deps.length + ' dependencies, each with a named owner, all inside the scheduled wave (' +
          WAVE_LABEL[w] + ') and therefore dated by the wave plan.'
        : deps.length + ' dependencies identified with owners, but no dates: ' + WAVE_LABEL[w] +
          ' is ordered, not yet scheduled. Scheduling the wave clears this condition.'});

  c.push({q:READY_GATE[4].q, ok:imp.resolved,
    why:imp.resolved
      ? (imp.impacted ? 'Impact check run; resolved by ' + imp.adrs.join(', ') + ' (accepted).' : 'Impact check run; no architectural impact.')
      : imp.designReason});

  const design = imp.design;
  c.push({q:READY_GATE[5].q, ok:!newSurface || !!design,
    why:!newSurface ? 'Empty, error and stale states are covered by the existing list, detail and form patterns.'
      : design ? design.id + ' defines all eight canonical surface states for this surface' +
        (design.states.indexOf('plus') > -1 ? ', ' + design.states.slice(design.states.indexOf('plus')) : '') + '.'
      : 'A new interface surface with no existing pattern — empty, error and stale states are not designed yet.'});

  c.push({q:READY_GATE[6].q, ok:true,
    why:'Every criterion has a verification approach: ' +
      [...new Set(s.ac.map(a => verificationFor(a).k))].join(', ') + '.'});

  const fn = tasks.filter(t => !t.lens).length, xc = tasks.length - fn;
  const sizeOK = fn <= 6 && xc <= 3 && s.ac.length <= 4;
  c.push({q:READY_GATE[7].q, ok:sizeOK,
    why:sizeOK
      ? fn + ' functional tasks' + (xc ? ' plus ' + xc + ' cross-cutting' : '') + ' and ' + s.ac.length +
        ' criteria — completable inside one iteration. The functional slice is capped at six tasks; ' +
        'cross-cutting work is capped separately at three, because each of those is a bounded five- or six-step check.'
      : 'Too large as sliced: ' + fn + ' functional tasks, ' + xc + ' cross-cutting and ' + s.ac.length +
        ' criteria. The limits are six, three and four.'});

  const failed = c.filter(x => !x.ok);
  const res = {ready: failed.length === 0, conditions: c, failed: failed.length,
    blockers: failed.map(x => x.q)};
  return (GATE_CACHE[s.id] = res);
}

/* ---------------- refinement rollups ---------------- */
const REFINE = {ready:0, blocked:0, byBlocker:{}, impacted:0, needsDesign:0, requirements:0, waves:{}};
function computeRefine(){
  const blockerCounts = {};
  FEATURES.forEach(f => {
    REFINE.requirements += requirementsFor(f).length;
    storiesFor(f).forEach(s => {
      const g = readyGateFor(s), imp = impactFor(s);
      if(g.ready) REFINE.ready++; else {
        REFINE.blocked++;
        g.blockers.forEach(b => blockerCounts[b] = (blockerCounts[b] || 0) + 1);
      }
      if(imp.impacted) REFINE.impacted++;
      if(imp.needsDesign) REFINE.needsDesign++;
      const w = waveOf(s);
      REFINE.waves[w] = (REFINE.waves[w] || 0) + 1;
    });
  });
  REFINE.byBlocker = blockerCounts;
}
/* sequencing waves: ordering, not dates. Dates arrive when a wave is scheduled. */
function waveOf(s){
  const mod = moduleOf(s.feature);
  if(FOUNDATION_MODULES.indexOf(mod.id) > -1) return 1;
  if(['hierarchy','work','fields','views'].indexOf(mod.id) > -1) return 2;
  if(['docs','boards','chat','collab','plan','time','sched','files','tmpl'].indexOf(mod.id) > -1) return 3;
  if(['notify','auto','forms','report','search','integr'].indexOf(mod.id) > -1) return 4;
  return 5;   /* ai, admin, billing and the deferred business layer */
}
const WAVE_LABEL = {1:'W1 · Foundation', 2:'W2 · Core work', 3:'W3 · Collaboration', 4:'W4 · Automation & insight', 5:'W5 · Platform & business'};
/* Only a scheduled wave has dates. Wave 1 is scheduled; the rest are ordered.
   Schedule the next wave by adding it here — the Ready Gate result moves with it. */
const SCHEDULED_WAVES = [1];
